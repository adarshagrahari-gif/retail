<!DOCTYPE html>
<!--
================================================================================
  NEXT-GEN E-LEARNING ENGINE
  ────────────────────────────────────────────────────────────────────────────
  A single-file, glassmorphic interactive learning module.
  
  HOW TO CUSTOMIZE (for non-developers):
  1. Scroll down to the `COURSE_CONFIG` constant (search for "COURSE_CONFIG").
  2. Edit the `settings` block: title, accent color, passing score.
  3. Edit/add/remove items in the `slides` array. Each slide has a `type`.
  4. Save the file and open it in any browser. Done.
  
  SLIDE TYPES SUPPORTED:
    intro, video, text, image-callouts, tabs, accordion, flip-cards,
    timeline, hotspot, drag-drop, scenario, quiz, summary, results
  
  See the comments inside COURSE_CONFIG for the shape of each slide type.
================================================================================
-->
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>E-Learning Module</title>

<!-- Tailwind CSS (CDN) -->
<script src="https://cdn.tailwindcss.com"></script>

<!-- Animate.css for slide transitions -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css">

<!-- Canvas-Confetti for success states -->
<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.2/dist/confetti.browser.min.js"></script>

<!-- Poppins font (brand) -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

<!-- Icons are inlined as SVG (see ICON registry in <script>). No external icon CDN. -->

<!-- TinCan.js for xAPI (loaded only if xAPI is enabled in config) -->
<!-- XAPI_LIB_PLACEHOLDER -->

<style>
  /* ============================================================
     FLAT THEME — Light surfaces, brand purple as primary action.
     Material 3-inspired: clean cards, single-layer shadows, sharp
     borders, tonal accent for selected/active states.
     ============================================================ */

  /* ---------- BRAND PALETTE ---------- */
  /* #473391 (primary)  #6E55B8 (mid)  #9578E0 (light)  #E6C4FF (tonal/highlight) */
  :root {
    --accent: #473391;            /* primary action */
    --accent-mid: #6E55B8;        /* hover / secondary */
    --accent-light: #9578E0;      /* light tint */
    --accent-highlight: #E6C4FF;  /* tonal container (selected backgrounds) */
    --accent-soft: #f1eaff;       /* subtle tonal wash for hovers */
    --accent-strong: #3a2978;     /* deeper primary for hover */

    /* Surfaces */
    --surface: #ffffff;           /* cards, app bars */
    --surface-2: #faf8ff;         /* subtly tinted secondary surface */
    --page-bg: #f5f2fb;           /* page background — a touch of lilac */
    --border: #e7e2f0;            /* hairline border */
    --border-strong: #d6cfe6;     /* stronger border for inputs / selected */

    /* Text */
    --text: #1a1530;              /* near-black with brand undertone */
    --text-muted: #6b6480;        /* secondary text */
    --text-faint: #9690a8;        /* tertiary / hints */
    --text-on-accent: #ffffff;

    /* States */
    --success: #2e7d4f;           /* deep green for correct */
    --success-bg: #e6f4ec;
    --error: #c2384a;             /* deep red for incorrect */
    --error-bg: #fbe9ec;
  }

  /* ---------- BASE ---------- */
  body {
    margin: 0;
    font-family: 'Poppins', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: var(--page-bg);
    color: var(--text);
    -webkit-font-smoothing: antialiased;
  }

  /* No decorative orbs in flat theme — keep it clean. */

  /* ---------- CARDS (replaces .glass / .glass-strong) ---------- */
  /* Class names preserved so renderers don't need to change. */
  .glass, .glass-strong {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 16px;
    box-shadow: 0 1px 2px rgba(26, 21, 48, 0.04);
  }
  .glass-strong {
    /* Used for the main slide canvas — slightly more presence. */
    box-shadow: 0 2px 8px rgba(26, 21, 48, 0.06);
  }

  /* ---------- BUTTONS ---------- */
  .btn-primary {
    background: var(--accent);
    color: var(--text-on-accent);
    padding: 0.75rem 1.75rem;
    border-radius: 10px;
    font-weight: 600;
    font-family: 'Poppins', sans-serif;
    font-size: 0.95rem;
    transition: background 0.15s ease, box-shadow 0.15s ease;
    box-shadow: 0 1px 2px rgba(71, 51, 145, 0.15);
    border: none;
    cursor: pointer;
    letter-spacing: 0.01em;
  }
  .btn-primary:hover:not(:disabled) {
    background: var(--accent-strong);
    box-shadow: 0 2px 6px rgba(71, 51, 145, 0.25);
  }
  .btn-primary:disabled {
    opacity: 0.4;
    cursor: not-allowed;
  }
  .btn-secondary {
    background: var(--surface);
    color: var(--accent);
    padding: 0.75rem 1.75rem;
    border-radius: 10px;
    font-weight: 600;
    font-family: 'Poppins', sans-serif;
    font-size: 0.95rem;
    border: 1.5px solid var(--accent);
    cursor: pointer;
    transition: background 0.15s ease;
  }
  .btn-secondary:hover { background: var(--accent-soft); }

  /* ---------- APP BAR / FOOTER (override glass on header & footer) ---------- */
  header.glass, footer.glass {
    background: var(--surface);
    border: none;
    border-radius: 0;
    box-shadow: none;
    /* Player chrome — same DOM-isolation reasoning as the sidebar.
       Header (hamburger, title) and footer (Prev/Next, audio bar)
       must sit above any full-screen overlay any slide may create.
       canvas-confetti hardcodes z-index:100; we sit at 110. */
    position: relative;
    z-index: 110;
  }
  header.glass { border-bottom: 1px solid var(--border); }
  footer.glass { border-top: 1px solid var(--border); }
  header.glass h1, header.glass button, header.glass div { color: var(--text); }
  footer.glass #slide-status { color: var(--text-muted); }
  #slide-counter { color: var(--text-muted); }

  /* ---------- SIDEBAR ---------- */
  aside#sidebar.glass-strong {
    background: var(--surface);
    border: none;
    border-right: 1px solid var(--border);
    border-radius: 0;
    box-shadow: none;
  }
  #sidebar h2 { color: var(--text); }
  #sidebar p { color: var(--text-muted); }
  /* NOTE: position / transform / .closed behaviour is defined later in the
     "SIDEBAR LAYOUT" block — those rules are responsive-aware. */

  .nav-item {
    display: flex;
    align-items: flex-start;     /* icon hugs the first line, not the middle of a wrapped block */
    gap: 0.65rem;
    padding: 0.6rem 0.8rem;
    border-radius: 10px;
    cursor: pointer;
    transition: background 0.15s ease, color 0.15s ease;
    color: var(--text-muted);
    font-size: 0.875rem;
    font-weight: 500;
    position: relative;          /* anchor for the tooltip */
    /* Mobile-touch hardening: */
    -webkit-tap-highlight-color: rgba(110, 85, 184, 0.25);
    touch-action: manipulation;  /* skip the 300ms tap delay; ignore double-tap zoom */
    pointer-events: auto;        /* defensive — nothing should be blocking, but make it explicit */
    user-select: none;
    -webkit-user-select: none;
  }
  .nav-item-icon {
    margin-top: 0.15rem;         /* nudge icon to align with first text line */
    /* Children of .nav-item must NOT capture taps independently — the
       click target is the .nav-item div itself. This avoids odd
       webkit-line-clamp / SVG / iframe interactions that can swallow
       taps on the inner text. */
    pointer-events: none;
  }
  .nav-item-icon * { pointer-events: none; }    /* covers the inline SVG paint */
  .nav-item-text {
    flex: 1;
    min-width: 0;
    line-height: 1.35;
    /* Allow up to 2 lines before truncating; modern browsers support line-clamp. */
    display: -webkit-box;
    -webkit-box-orient: vertical;
    -webkit-line-clamp: 2;
    line-clamp: 2;
    overflow: hidden;
    overflow-wrap: anywhere;
    word-break: break-word;
    pointer-events: none;
  }
  .nav-item-num {
    opacity: 0.55;
    margin-right: 0.3rem;
    font-variant-numeric: tabular-nums;
    pointer-events: none;
  }
  .nav-item:hover:not(.locked) { background: var(--accent-soft); color: var(--accent); }
  /* Active state: gives mobile users a visible press confirmation
     even when the tap doesn't trigger a navigation (e.g. tapping
     a locked slide). Combined with -webkit-tap-highlight-color,
     this makes it obvious whether the tap was received. */
  .nav-item:active:not(.locked) {
    background: var(--accent-highlight) !important;
    color: var(--accent-strong) !important;
  }
  .nav-item.active {
    background: var(--accent-highlight);
    color: var(--accent-strong);
    font-weight: 600;
  }
  .nav-item.locked {
    opacity: 0.55;            /* slightly more visible than before so the lock icon reads */
    cursor: not-allowed;
  }
  /* Lock indicator on locked slides — sits in the same position as the
     completed checkmark. The two states are mutually exclusive (a slide
     is either locked OR completed, never both), so the single ::after
     pseudo-element is safe to share. We use mask-image with an inline
     Lucide lock SVG so it inherits color via background-color. */
  .nav-item.locked::after {
    content: '';
    margin-left: auto;
    margin-top: 0.25rem;
    width: 0.95rem;
    height: 0.95rem;
    flex-shrink: 0;
    background-color: var(--text-muted);
    -webkit-mask: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='currentColor' stroke-width='2.4' stroke-linecap='round' stroke-linejoin='round'><rect x='3' y='11' width='18' height='11' rx='2' ry='2'/><path d='M7 11V7a5 5 0 0 1 10 0v4'/></svg>") center / contain no-repeat;
            mask: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='currentColor' stroke-width='2.4' stroke-linecap='round' stroke-linejoin='round'><rect x='3' y='11' width='18' height='11' rx='2' ry='2'/><path d='M7 11V7a5 5 0 0 1 10 0v4'/></svg>") center / contain no-repeat;
    pointer-events: none;
  }
  .nav-item.completed::after {
    content: '✓';
    margin-left: auto;
    margin-top: 0.15rem;         /* match the icon offset for clean visual alignment */
    color: var(--success);
    font-weight: 700;
    flex-shrink: 0;
  }

  /* ---------- SIDEBAR HOVER TOOLTIP ----------
     The sidebar uses overflow-y:auto, which clips horizontal overflow,
     so a tooltip rendered as a child of .nav-item would be cut off.
     Instead the tooltip is rendered into document.body by JS and
     positioned next to the hovered item. See attachNavTooltips() below. */
  .nav-tooltip {
    position: fixed;
    background: var(--text);
    color: var(--surface);
    padding: 0.5rem 0.75rem;
    border-radius: 8px;
    font-size: 0.8rem;
    font-weight: 500;
    white-space: normal;
    max-width: 18rem;
    width: max-content;
    line-height: 1.4;
    box-shadow: 0 4px 12px rgba(26, 21, 48, 0.18);
    z-index: 60;
    pointer-events: none;
    opacity: 0;
    transition: opacity 0.12s ease-out;
  }
  .nav-tooltip.visible { opacity: 1; }
  /* Hide on mobile — drawer menu would clip the tooltip awkwardly,
     and touch devices don't have hover anyway. */
  @media (max-width: 768px) {
    .nav-tooltip { display: none !important; }
  }

  /* ---------- PROGRESS BAR ---------- */
  #progress-bar {
    height: 6px;
    background: var(--accent-soft);
    border-radius: 3px;
    overflow: hidden;
  }
  #progress-fill {
    height: 100%;
    background: var(--accent);
    transition: width 0.4s ease;
    width: 0%;
    border-radius: 3px;
  }

  /* ---------- QUIZ OPTIONS ---------- */
  .quiz-option {
    padding: 1rem 1.25rem;
    border-radius: 12px;
    background: var(--surface);
    border: 1.5px solid var(--border);
    cursor: pointer;
    transition: background 0.15s ease, border-color 0.15s ease;
    margin-bottom: 0.75rem;
    color: var(--text);
    font-weight: 500;
  }
  .quiz-option:hover { background: var(--accent-soft); border-color: var(--accent-light); }
  .quiz-option.selected { background: var(--accent-highlight); border-color: var(--accent); }
  .quiz-option.correct {
    background: var(--success-bg);
    border-color: var(--success);
    color: var(--success);
    font-weight: 600;
  }
  .quiz-option.incorrect {
    background: var(--error-bg);
    border-color: var(--error);
    color: var(--error);
    font-weight: 600;
  }
  .quiz-option.disabled { pointer-events: none; }

  /* ---------- HOTSPOT ---------- */
  .hotspot-marker {
    position: absolute;
    width: 32px; height: 32px;
    border-radius: 50%;
    background: var(--accent);
    border: 3px solid var(--surface);
    cursor: pointer;
    animation: pulse 2s infinite;
    display: flex; align-items: center; justify-content: center;
    color: white; font-weight: 700;
    transform: translate(-50%, -50%);
    box-shadow: 0 2px 8px rgba(71, 51, 145, 0.3);
  }
  @keyframes pulse {
    0%, 100% { box-shadow: 0 0 0 0 rgba(71, 51, 145, 0.4); }
    50% { box-shadow: 0 0 0 14px rgba(71, 51, 145, 0); }
  }
  .hotspot-marker.found { background: var(--success); animation: none; }

  /* ---------- DRAG-DROP ---------- */
  .draggable {
    padding: 0.8rem 1rem;
    background: var(--surface);
    border-radius: 10px;
    cursor: grab;
    border: 1.5px solid var(--border);
    user-select: none;
    color: var(--text);
    font-weight: 500;
    transition: background 0.15s ease, border-color 0.15s ease;
  }
  .draggable:hover { background: var(--accent-soft); border-color: var(--accent-light); }
  .draggable.dragging { opacity: 0.5; }
  .drop-zone {
    min-height: 70px;
    padding: 0.85rem;
    border: 2px dashed var(--border-strong);
    border-radius: 12px;
    background: var(--surface-2);
    transition: background 0.15s ease, border-color 0.15s ease;
  }
  .drop-zone.drag-over { background: var(--accent-soft); border-color: var(--accent); }
  .drop-zone.correct {
    background: var(--success-bg);
    border-color: var(--success);
    border-style: solid;
  }
  .drop-zone.incorrect {
    background: var(--error-bg);
    border-color: var(--error);
    border-style: solid;
  }

  /* ---------- VIDEO: custom controls volume + CC (added 2026-05-19) ---------- */
  .vcc-volume-btn:hover, .vcc-cc-btn:hover, .vcc-playpause:hover {
    background: rgba(255,255,255,0.30) !important;
  }
  .vcc-volume-slider {
    -webkit-appearance: none;
    appearance: none;
    background: rgba(255,255,255,0.25);
    border-radius: 999px;
    outline: none;
  }
  .vcc-volume-slider::-webkit-slider-thumb {
    -webkit-appearance: none;
    appearance: none;
    width: 12px; height: 12px;
    border-radius: 50%;
    background: #fff;
    cursor: pointer;
  }
  .vcc-volume-slider::-moz-range-thumb {
    width: 12px; height: 12px;
    border-radius: 50%;
    background: #fff;
    cursor: pointer;
    border: 0;
  }
  /* On very small screens the slider becomes cramped — collapse it. The
     mute button still works as the primary volume control. */
  @media (max-width: 480px) {
    .vcc-volume-slider { display: none; }
    .vcc-time { min-width: 64px !important; }
  }

  /* ---------- DRAG-DROP: CHIPS + DROPDOWN LAYOUTS (added 2026-05-19) ---------- */
  .dd-chip-list, .dd-dropdown-list {
    display: flex;
    flex-direction: column;
    gap: 0.85rem;
  }
  .dd-chip-row, .dd-dropdown-row {
    background: var(--surface-2);
    border: 1.5px solid var(--border);
    border-radius: 12px;
    padding: 0.9rem 1rem;
    transition: border-color 0.15s ease, background 0.15s ease;
  }
  .dd-row-correct {
    background: var(--success-bg);
    border-color: var(--success);
  }
  .dd-row-incorrect {
    background: var(--error-bg);
    border-color: var(--error);
  }
  .dd-chip-item-text, .dd-dropdown-item-text {
    color: var(--text);
    font-weight: 500;
    line-height: 1.5;
    margin-bottom: 0.7rem;
  }
  .dd-chip-options {
    display: flex;
    flex-wrap: wrap;
    gap: 0.45rem;
  }
  .dd-chip {
    font-family: inherit;
    font-size: 0.85rem;
    font-weight: 500;
    padding: 0.55rem 1rem;
    min-height: 40px;   /* ≥40px for comfortable mobile tap target */
    border-radius: 999px;
    border: 1.5px solid var(--border);
    background: var(--surface);
    color: var(--text-muted);
    cursor: pointer;
    transition: background 0.15s ease, border-color 0.15s ease, color 0.15s ease;
  }
  .dd-chip:hover {
    background: var(--accent-soft);
    border-color: var(--accent-light);
    color: var(--text);
  }
  .dd-chip.dd-chip-active {
    background: var(--accent);
    border-color: var(--accent);
    color: #fff;
  }
  .dd-chip.dd-chip-correct {
    background: var(--success);
    border-color: var(--success);
    color: #fff;
  }
  .dd-chip.dd-chip-incorrect {
    background: var(--error);
    border-color: var(--error);
    color: #fff;
  }
  .dd-chip:disabled { cursor: default; opacity: 0.95; }
  .dd-dropdown-select {
    width: 100%;
    font-family: inherit;
    font-size: 0.95rem;
    padding: 0.65rem 0.85rem;
    min-height: 44px;   /* ≥44px iOS recommended tap target */
    border-radius: 10px;
    border: 1.5px solid var(--border);
    background: var(--surface);
    color: var(--text);
    cursor: pointer;
  }
  .dd-dropdown-select:focus {
    outline: none;
    border-color: var(--accent);
    box-shadow: 0 0 0 3px var(--accent-soft);
  }
  .dd-dropdown-select:disabled { cursor: default; background: var(--surface-2); }

  /* ---------- TABS ---------- */
  .tab-btn {
    padding: 0.55rem 1.1rem;
    border-radius: 8px;
    cursor: pointer;
    transition: background 0.15s ease, color 0.15s ease;
    font-weight: 500;
    font-family: 'Poppins', sans-serif;
    border: 1px solid transparent;
  }
  .tab-btn.active {
    background: var(--accent);
    color: var(--text-on-accent);
    border-color: var(--accent);
  }
  .tab-btn:not(.active) {
    background: var(--surface);
    color: var(--text);
    border-color: var(--border);
  }
  .tab-btn:not(.active):hover { background: var(--accent-soft); border-color: var(--accent-light); }

  /* ---------- ACCORDION ---------- */
  .accordion-item {
    margin-bottom: 0.6rem;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    overflow: hidden;
  }
  .accordion-header {
    padding: 1rem 1.25rem; cursor: pointer; display: flex;
    justify-content: space-between; align-items: center;
    transition: background 0.15s ease;
    color: var(--text);
    font-weight: 600;
  }
  .accordion-header:hover { background: var(--accent-soft); }
  .accordion-item.open .accordion-header { background: var(--accent-soft); color: var(--accent-strong); }
  .accordion-content {
    max-height: 0; overflow: hidden;
    transition: max-height 0.3s ease, padding 0.3s ease;
    padding: 0 1.25rem;
    color: var(--text-muted);
    font-size: 0.95rem;
    line-height: 1.6;
  }
  .accordion-item.open .accordion-content {
    max-height: 600px;
    padding: 0.5rem 1.25rem 1.1rem 1.25rem;
    border-top: 1px solid var(--border);
  }
  .accordion-icon { transition: transform 0.3s; color: var(--accent); }
  .accordion-item.open .accordion-icon { transform: rotate(180deg); }

  /* ---------- FLIP CARDS ---------- */
  .flip-card { perspective: 1000px; height: 220px; cursor: pointer; }
  .flip-card-inner {
    position: relative; width: 100%; height: 100%;
    transition: transform 0.6s; transform-style: preserve-3d;
  }
  .flip-card.flipped .flip-card-inner { transform: rotateY(180deg); }
  .flip-card-front, .flip-card-back {
    position: absolute; inset: 0; backface-visibility: hidden;
    border-radius: 14px; padding: 1.5rem;
    display: flex; align-items: center; justify-content: center;
    text-align: center;
    border: 1px solid var(--border);
  }
  .flip-card-front {
    background: var(--surface);
    color: var(--text);
  }
  .flip-card-back {
    transform: rotateY(180deg);
    background: var(--accent-highlight);
    color: var(--accent-strong);
    border-color: var(--accent-light);
  }

  /* Override the .glass/.glass-strong on flip-card root so the card faces show through */
  .flip-card.glass-strong {
    background: transparent;
    border: none;
    box-shadow: none;
  }

  /* ---------- TIMELINE ---------- */
  .timeline { position: relative; padding-left: 2rem; }
  .timeline::before {
    content: ''; position: absolute; left: 0.5rem; top: 0; bottom: 0;
    width: 2px; background: var(--accent-light);
  }
  .timeline-item { position: relative; margin-bottom: 1.5rem; }
  .timeline-item::before {
    content: ''; position: absolute; left: -1.85rem; top: 0.5rem;
    width: 14px; height: 14px; border-radius: 50%;
    background: var(--accent);
    border: 3px solid var(--surface);
    box-shadow: 0 0 0 1px var(--accent-light);
  }

  /* ---------- IMAGE WITH CALLOUTS ---------- */
  .callout-marker {
    position: absolute; width: 28px; height: 28px; border-radius: 50%;
    background: var(--accent); color: white;
    display: flex; align-items: center; justify-content: center;
    font-weight: 700; cursor: pointer; transform: translate(-50%, -50%);
    border: 2px solid var(--surface);
    box-shadow: 0 2px 6px rgba(71, 51, 145, 0.35);
  }

  /* ---------- TYPOGRAPHY (slide content) ---------- */
  /* Renderers use Tailwind utility classes that originally assumed a dark bg.
     Override the most common ones so text reads properly on light surfaces. */
  .text-white\/85,
  .text-white\/80,
  .text-white\/75,
  .text-white\/90 { color: var(--text-muted) !important; }
  .text-white\/70 { color: var(--text-muted) !important; }
  .text-white\/60,
  .text-white\/50 { color: var(--text-faint) !important; }

  /* Strong/title text on slides */
  h1, h2, h3, h4 { color: var(--text); }

  /* Inline status text (bottom bar) */
  #slide-status { color: var(--text-muted); }

  /* "Reading..." placeholder & similar small captions stay subtle */
  .text-xs.text-white\/50 { color: var(--text-faint) !important; }

  /* ---------- FEEDBACK STATES (text colors, used inside renderers) ---------- */
  .feedback-correct { color: var(--success); font-weight: 600; }
  .feedback-incorrect { color: var(--error); font-weight: 600; }

  /* Review banner — shown on completed interactive slides so the user
     knows their answer is locked. Tonal, calm — not alarming. */
  .review-banner {
    display: flex;
    gap: 0.85rem;
    align-items: flex-start;
    margin-top: 1.25rem;
    padding: 0.95rem 1.1rem;
    background: var(--accent-soft);
    border: 1px solid var(--border-strong);
    border-radius: 12px;
  }
  .review-banner svg, .review-banner i { font-size: 1rem; }

  /* ============================================================
     RT-RENDERED: defaults for sanitized rich-text output rendered
     by the engine. These ensure ul/ol/p/strong from the editor's
     WYSIWYG component look reasonable inside slide bodies, modals,
     and review banners. Authors who want different styling can
     override with an outer wrapper class.
     ============================================================ */
  .rt-rendered { line-height: inherit; }
  .rt-rendered p { margin: 0 0 0.7em 0; }
  .rt-rendered p:last-child { margin-bottom: 0; }
  .rt-rendered ul, .rt-rendered ol { margin: 0.4em 0 0.7em 0; padding-left: 1.5em; }
  .rt-rendered ul:last-child, .rt-rendered ol:last-child { margin-bottom: 0; }
  .rt-rendered li { margin: 0.2em 0; }
  .rt-rendered strong, .rt-rendered b { font-weight: 700; }
  .rt-rendered em, .rt-rendered i { font-style: italic; }
  .rt-rendered u { text-decoration: underline; }
  .rt-rendered s, .rt-rendered strike { text-decoration: line-through; }
  .rt-rendered a { color: var(--accent); text-decoration: underline; }
  .rt-rendered mark { background: rgba(255, 230, 110, 0.55); padding: 0 0.15em; border-radius: 2px; }
  .rt-rendered h1, .rt-rendered h2, .rt-rendered h3,
  .rt-rendered h4, .rt-rendered h5, .rt-rendered h6 {
    font-weight: 700; margin: 0.6em 0 0.3em 0; line-height: 1.3;
  }
  .rt-rendered blockquote {
    margin: 0.5em 0; padding: 0.4em 0.9em;
    border-left: 3px solid var(--accent);
    color: var(--text-muted, inherit);
    font-style: italic;
  }

  /* ============================================================
     ACTIVITY WIDGETS (Phase 2 catalog)
     Shared visual primitives used by the new activity renderers.
     ============================================================ */

  /* ---- Multi-response checkboxes ---- */
  .mr-option {
    padding: 1rem 1.25rem;
    border-radius: 12px;
    background: var(--surface);
    border: 1.5px solid var(--border);
    cursor: pointer;
    transition: background 0.15s, border-color 0.15s;
    margin-bottom: 0.75rem;
    display: flex;
    align-items: center;
    gap: 0.85rem;
    font-weight: 500;
  }
  .mr-option:hover { background: var(--accent-soft); border-color: var(--accent-light); }
  .mr-option .mr-check {
    width: 22px; height: 22px;
    border-radius: 6px;
    border: 1.5px solid var(--border-strong);
    flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    color: transparent;
    transition: all 0.15s;
  }
  .mr-option.selected { background: var(--accent-highlight); border-color: var(--accent); }
  .mr-option.selected .mr-check {
    background: var(--accent);
    border-color: var(--accent);
    color: white;
  }
  .mr-option.correct { background: var(--success-bg); border-color: var(--success); color: var(--success); font-weight: 600; }
  .mr-option.incorrect { background: var(--error-bg); border-color: var(--error); color: var(--error); font-weight: 600; }
  .mr-option.disabled { pointer-events: none; }

  /* ---- Fill-in-the-blanks ---- */
  .fb-paragraph {
    font-size: 1.05rem;
    line-height: 2.1;
    color: var(--text);
    overflow-wrap: anywhere;     /* allow long blanks to wrap inside the paragraph */
    word-break: normal;
  }
  .fb-input {
    display: inline-block;
    min-width: 7rem;
    max-width: 100%;             /* never overflow the paragraph container */
    width: auto;                  /* size to content + padding by default */
    box-sizing: border-box;       /* padding + border included in max-width */
    padding: 0.3rem 0.7rem;
    border: 1.5px solid var(--border-strong);
    border-radius: 8px;
    font-family: inherit;
    font-size: 0.95rem;
    font-weight: 500;
    background: var(--surface);
    color: var(--text);
    transition: border-color 0.15s, background 0.15s;
    margin: 0 0.15rem;
    vertical-align: baseline;
  }
  /* The paragraph hosts the inputs; line-height 2.1 + overflow-wrap on
     .fb-paragraph (above) lets a wide input wrap to its own line instead
     of pushing past the slide card edge. */
  .fb-input:focus { outline: none; border-color: var(--accent); background: var(--accent-soft); }
  .fb-input.correct { background: var(--success-bg); border-color: var(--success); color: var(--success); font-weight: 600; }
  .fb-input.incorrect { background: var(--error-bg); border-color: var(--error); color: var(--error); font-weight: 600; }
  .fb-input.disabled { pointer-events: none; opacity: 1; }

  /* ---- Matching pairs (two columns with click-pair UX) ---- */
  .match-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 1rem 1.5rem;
  }
  @media (max-width: 600px) {
    .match-grid { grid-template-columns: 1fr; gap: 1.25rem; }
  }
  .match-column { display: flex; flex-direction: column; gap: 0.75rem; min-width: 0; }
  .match-column-header {
    font-size: 0.78rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    color: var(--accent-strong);
    padding: 0.4rem 0.6rem;
    border-bottom: 2px solid var(--accent-light, #c4b5fd);
    margin-bottom: 0.25rem;
  }
  .match-column-items { display: flex; flex-direction: column; gap: 0.6rem; }
  .match-item {
    padding: 0.85rem 1rem;
    border-radius: 10px;
    background: var(--surface);
    border: 1.5px solid var(--border);
    cursor: pointer;
    transition: all 0.15s;
    font-weight: 500;
    position: relative;
  }
  .match-item:hover:not(.disabled) { border-color: var(--accent-light); background: var(--accent-soft); }
  .match-item.selected { border-color: var(--accent); background: var(--accent-highlight); }
  .match-item.matched-correct { background: var(--success-bg); border-color: var(--success); color: var(--success); font-weight: 600; }
  .match-item.matched-incorrect { background: var(--error-bg); border-color: var(--error); color: var(--error); font-weight: 600; }
  .match-item.disabled { cursor: default; }
  .match-item .match-pair-num {
    position: absolute;
    top: 50%; transform: translateY(-50%);
    font-size: 0.75rem;
    font-weight: 700;
    color: var(--accent-strong);
  }
  .match-item.left .match-pair-num { right: 0.6rem; }
  .match-item.right .match-pair-num { left: 0.6rem; }
  .match-item.left { padding-right: 2.2rem; }
  .match-item.right { padding-left: 2.2rem; }

  /* ---- Drag & match (drag items from left into target slots on right) ---- */
  /* The activity uses inline styles for theming, but layout (and especially
     responsive collapse) lives here so mobile viewports don't overflow. */
  .dm-grid { min-width: 0; }
  .dm-grid > .dm-source,
  .dm-grid > .dm-targets { min-width: 0; }   /* allow children to shrink */
  .dm-item { max-width: 100%; word-break: break-word; overflow-wrap: anywhere; }
  .dm-target { min-width: 0; }
  .dm-target > div { min-width: 0; }          /* the target's text label */
  .dm-slot { flex: 1; min-width: 0; max-width: 100%; word-break: break-word; }

  @media (max-width: 700px) {
    /* On phones, show TARGETS first (above) and source items below.
       Reasoning: a learner picks up an item, then needs to drop it
       somewhere — if the targets are below the items list, they're
       off-screen and the learner can't see them while dragging. The
       natural touch motion is "scroll up to see targets, scroll down
       to grab an item, swipe up to drop." Reversing the visual order
       makes that motion match the layout: targets stay in view while
       the learner drags an item up from below. */
    .dm-grid { grid-template-columns: 1fr !important; gap: 1.25rem !important; }
    .dm-grid > .dm-targets { order: 1; }    /* shows first */
    .dm-grid > .dm-source  { order: 2; }    /* shows second */
    .dm-grid > .dm-source { flex-direction: row !important; flex-wrap: wrap; }
    .dm-grid > .dm-source .dm-item { flex: 0 1 auto; }
    /* On mobile, the drop slot sits below its label rather than alongside it,
       so long target text and long item text both have room. */
    .dm-target { flex-direction: column !important; align-items: stretch !important; }
    .dm-target > div:first-child { margin-bottom: 0.4rem; }
    .dm-slot { min-width: 0 !important; width: 100%; }
  }

  /* ---- Process sequencing ---- */
  .seq-list {
    display: flex; flex-direction: column;
    gap: 0.6rem;
  }
  .seq-item {
    display: flex; align-items: center; gap: 0.85rem;
    padding: 0.9rem 1rem;
    background: var(--surface);
    border: 1.5px solid var(--border);
    border-radius: 10px;
    cursor: grab;
    user-select: none;
    transition: border-color 0.15s, background 0.15s;
  }
  .seq-item:hover:not(.disabled) { border-color: var(--accent-light); background: var(--accent-soft); }
  .seq-item.dragging { opacity: 0.4; }
  .seq-item.drop-above { border-top: 3px solid var(--accent); }
  .seq-item.drop-below { border-bottom: 3px solid var(--accent); }
  .seq-item.correct { background: var(--success-bg); border-color: var(--success); }
  .seq-item.incorrect { background: var(--error-bg); border-color: var(--error); }
  .seq-item.disabled { cursor: default; }
  .seq-num {
    font-weight: 700;
    color: var(--accent);
    width: 1.5rem;
    flex-shrink: 0;
  }
  .seq-handle { color: var(--text-faint); flex-shrink: 0; }
  .seq-text { flex: 1; min-width: 0; font-weight: 500; overflow-wrap: anywhere; }
  .seq-controls {
    display: flex; gap: 0.25rem; flex-shrink: 0;
  }
  .seq-btn {
    background: none; border: 1px solid var(--border-strong);
    border-radius: 6px;
    width: 28px; height: 28px;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer;
    color: var(--text-muted);
    transition: all 0.15s;
  }
  .seq-btn:hover:not(:disabled) { background: var(--accent-soft); color: var(--accent); border-color: var(--accent); }
  .seq-btn:disabled { opacity: 0.3; cursor: not-allowed; }

  /* On narrow phone screens the previous layout (number + grip + arrows
     all on one row alongside the text) crushed the text into a column
     so narrow that words wrapped every 1-2 syllables. The mobile layout
     stacks: number/grip on top-left as a small header strip, then the
     full-width text below, with the up/down arrows on the right of the
     header strip. This gives the text full card width to breathe. */
  @media (max-width: 600px) {
    .seq-item {
      display: grid;
      grid-template-columns: auto auto 1fr auto;
      grid-template-areas: "num handle text controls";
      gap: 0.5rem;
      align-items: center;
      padding: 0.85rem 0.85rem;
    }
    .seq-num     { grid-area: num;     width: auto; min-width: 1.2rem; font-size: 1rem; }
    .seq-handle  { grid-area: handle; }
    .seq-text    { grid-area: text;    line-height: 1.4; }
    .seq-controls{ grid-area: controls; }
    .seq-btn     { width: 32px; height: 32px; }   /* slightly larger touch target */
    .seq-btn svg { width: 14px; height: 14px; }
  }
  @media (max-width: 380px) {
    /* On the narrowest phones, give the text its OWN row so it can use
       the full card width. Header row above for number/grip/arrows. */
    .seq-item {
      grid-template-columns: auto auto 1fr;
      grid-template-areas:
        "num handle controls"
        "text text text";
      gap: 0.5rem 0.6rem;
    }
    .seq-text { padding-top: 0.15rem; font-size: 0.95rem; }
  }

  /* ---- Image identification (find-the-X) ---- */
  .imgid-stage {
    position: relative;
    display: inline-block;
    width: 100%;
    cursor: crosshair;
  }
  .imgid-stage img {
    width: 100%;
    border-radius: 12px;
    display: block;
    user-select: none;
    -webkit-user-drag: none;
  }
  .imgid-marker {
    position: absolute;
    width: 36px; height: 36px;
    border-radius: 50%;
    border: 3px solid var(--surface);
    transform: translate(-50%, -50%);
    pointer-events: none;
    display: flex; align-items: center; justify-content: center;
    font-weight: bold;
    color: white;
    box-shadow: 0 2px 6px rgba(0,0,0,0.25);
  }
  .imgid-marker.found  { background: var(--success); }
  .imgid-marker.miss   { background: var(--error); animation: imgid-fade 1s forwards; }
  @keyframes imgid-fade {
    0% { opacity: 1; }
    70% { opacity: 1; }
    100% { opacity: 0; transform: translate(-50%, -50%) scale(1.5); }
  }
  .imgid-progress {
    margin-top: 0.85rem;
    display: flex;
    gap: 0.4rem;
    flex-wrap: wrap;
    align-items: center;
  }
  .imgid-pip {
    width: 12px; height: 12px;
    border-radius: 50%;
    background: var(--border-strong);
  }
  .imgid-pip.found { background: var(--success); }

  /* ---- Slider ---- */
  .slider-stage {
    margin-top: 1.5rem;
  }
  .slider-readout {
    display: flex;
    align-items: baseline;
    justify-content: center;
    gap: 0.5rem;
    margin-bottom: 0.4rem;
  }
  .slider-value {
    font-size: 2.2rem;
    font-weight: 700;
    color: var(--accent);
    font-variant-numeric: tabular-nums;
  }
  .slider-suffix {
    color: var(--text-muted);
    font-weight: 500;
  }
  .slider-output {
    margin-top: 1.25rem;
    padding: 1.1rem 1.25rem;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    text-align: center;
  }
  .slider-output strong { color: var(--accent-strong); }
  .activity-slider {
    width: 100%;
    -webkit-appearance: none;
    appearance: none;
    height: 8px;
    border-radius: 4px;
    background: var(--accent-soft);
    outline: none;
    margin: 0.5rem 0 0.4rem;
  }
  .activity-slider::-webkit-slider-thumb {
    -webkit-appearance: none;
    appearance: none;
    width: 24px; height: 24px;
    border-radius: 50%;
    background: var(--accent);
    border: 3px solid var(--surface);
    box-shadow: 0 2px 6px rgba(71, 51, 145, 0.35);
    cursor: pointer;
  }
  .activity-slider::-moz-range-thumb {
    width: 24px; height: 24px;
    border-radius: 50%;
    background: var(--accent);
    border: 3px solid var(--surface);
    box-shadow: 0 2px 6px rgba(71, 51, 145, 0.35);
    cursor: pointer;
  }
  .slider-ends {
    display: flex; justify-content: space-between;
    font-size: 0.75rem; color: var(--text-muted);
  }

  /* ---- Dial ---- */
  .dial-wrap {
    display: flex; flex-direction: column; align-items: center;
    gap: 1.25rem;
    margin-top: 1.25rem;
  }
  .dial {
    position: relative;
    width: 200px; height: 200px;
    border-radius: 50%;
    background: var(--accent-soft);
    border: 3px solid var(--surface);
    box-shadow: 0 4px 16px rgba(71, 51, 145, 0.15), inset 0 0 0 8px var(--surface);
    cursor: grab;
    user-select: none;
    touch-action: none;
  }
  .dial.grabbing { cursor: grabbing; }
  .dial-pointer {
    position: absolute;
    top: 14px; left: 50%;
    width: 6px; height: 30px;
    background: var(--accent);
    border-radius: 3px;
    transform-origin: 3px 86px;
    transform: translateX(-50%);
  }
  .dial-center {
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    width: 40%;
    text-align: center;
  }
  .dial-center .dial-value {
    font-size: 2rem;
    font-weight: 700;
    color: var(--accent);
    font-variant-numeric: tabular-nums;
  }
  .dial-center .dial-label {
    font-size: 0.75rem;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: 0.05em;
  }

  /* ---- Dialogue simulation ---- */
  .dialogue-stage {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 14px;
    overflow: hidden;
  }
  .dialogue-character {
    display: flex; gap: 0.85rem;
    padding: 1rem 1.1rem;
    background: var(--accent-soft);
    border-bottom: 1px solid var(--border);
    align-items: center;
  }
  .dialogue-avatar {
    width: 48px; height: 48px;
    border-radius: 50%;
    background: var(--accent);
    color: white;
    display: flex; align-items: center; justify-content: center;
    font-weight: 700;
    font-size: 1.1rem;
    flex-shrink: 0;
  }
  .dialogue-character-info { flex: 1; min-width: 0; }
  .dialogue-name { font-weight: 700; color: var(--text); }
  .dialogue-role { font-size: 0.8rem; color: var(--text-muted); }
  .dialogue-mood {
    display: flex; align-items: center; gap: 0.5rem;
    flex-shrink: 0;
  }
  .dialogue-mood-bar {
    width: 80px; height: 8px;
    background: var(--border);
    border-radius: 4px;
    overflow: hidden;
  }
  .dialogue-mood-fill {
    height: 100%;
    transition: width 0.35s ease, background 0.35s ease;
  }
  .dialogue-transcript {
    padding: 1.1rem;
    max-height: 280px;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 0.7rem;
  }
  .dialogue-bubble {
    padding: 0.75rem 1rem;
    border-radius: 12px;
    max-width: 85%;
    line-height: 1.5;
  }
  .dialogue-bubble.them {
    background: var(--surface-2);
    align-self: flex-start;
    border: 1px solid var(--border);
  }
  .dialogue-bubble.you {
    background: var(--accent);
    color: white;
    align-self: flex-end;
  }
  .dialogue-choices {
    padding: 1.1rem;
    border-top: 1px solid var(--border);
    background: var(--surface-2);
    display: flex; flex-direction: column;
    gap: 0.55rem;
  }
  .dialogue-choice {
    padding: 0.75rem 1rem;
    background: var(--surface);
    border: 1.5px solid var(--border);
    border-radius: 10px;
    cursor: pointer;
    text-align: left;
    transition: all 0.15s;
    font-family: inherit;
    font-size: 0.95rem;
    color: var(--text);
  }
  .dialogue-choice:hover { border-color: var(--accent); background: var(--accent-soft); }

  /* ---- Interactive timeline (chronological journey) ---- */
  .itimeline-wrap {
    position: relative;
    padding: 0;
  }
  .itimeline-track {
    position: relative;
    display: flex;
    align-items: stretch;
    gap: 0;
    overflow-x: auto;
    padding: 1rem 0.5rem 0.5rem;
    scroll-snap-type: x mandatory;
  }
  .itimeline-stop {
    flex: 0 0 auto;
    width: 200px;
    scroll-snap-align: start;
    text-align: center;
    position: relative;
  }
  .itimeline-stop:not(:last-child)::after {
    content: '';
    position: absolute;
    top: 26px;
    right: -50%;
    width: 100%;
    height: 3px;
    background: var(--border-strong);
    z-index: 0;
  }
  .itimeline-stop.completed:not(:last-child)::after { background: var(--success); }
  .itimeline-dot {
    position: relative;
    z-index: 1;
    width: 52px; height: 52px;
    border-radius: 50%;
    background: var(--surface);
    border: 3px solid var(--border-strong);
    margin: 0 auto;
    display: flex; align-items: center; justify-content: center;
    color: var(--text-muted);
    font-weight: 700;
    cursor: pointer;
    transition: all 0.2s;
  }
  .itimeline-dot:hover { border-color: var(--accent); color: var(--accent); }
  .itimeline-stop.active .itimeline-dot {
    background: var(--accent);
    border-color: var(--accent);
    color: white;
    transform: scale(1.08);
  }
  .itimeline-stop.completed .itimeline-dot {
    background: var(--success);
    border-color: var(--success);
    color: white;
  }
  .itimeline-label {
    margin-top: 0.6rem;
    font-size: 0.85rem;
    font-weight: 600;
    color: var(--text);
  }
  .itimeline-date {
    font-size: 0.75rem;
    color: var(--text-muted);
  }
  .itimeline-detail {
    margin-top: 1.25rem;
    padding: 1.1rem 1.25rem;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    min-height: 110px;
  }

  /* ---- Confidence-based scoring ---- */
  .conf-stage {
    margin-top: 1.25rem;
    padding: 1.1rem 1.25rem;
    background: var(--accent-soft);
    border: 1px solid var(--border-strong);
    border-radius: 12px;
  }
  .conf-stage-title {
    font-weight: 600;
    color: var(--text);
    margin-bottom: 0.85rem;
    display: flex; align-items: center; gap: 0.5rem;
  }
  .conf-buttons {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 0.5rem;
  }
  /* On narrower viewports, drop to 3 columns (with 2 wrapping to a second
     row) so each button has enough width to fit "Probably 60%" without
     overflowing the slide card. Single column would feel awkwardly tall;
     3-up keeps them visually grouped. */
  @media (max-width: 600px) {
    .conf-buttons { grid-template-columns: repeat(3, 1fr); gap: 0.4rem; }
  }
  @media (max-width: 380px) {
    .conf-buttons { grid-template-columns: repeat(2, 1fr); gap: 0.4rem; }
  }
  .conf-btn {
    padding: 0.7rem 0.4rem;
    background: var(--surface);
    border: 1.5px solid var(--border);
    border-radius: 10px;
    cursor: pointer;
    font-family: inherit;
    font-weight: 600;
    font-size: 0.85rem;
    color: var(--text);
    transition: all 0.15s;
    text-align: center;
    line-height: 1.25;
    min-width: 0;            /* allow grid item to shrink below content size */
    overflow-wrap: anywhere; /* break long words if user customizes labels */
  }
  .conf-btn:hover { border-color: var(--accent); background: var(--accent-soft); }
  .conf-btn.selected {
    background: var(--accent);
    color: white;
    border-color: var(--accent);
  }

  /* ============================================================
     ENHANCED RESULTS PAGE
     Topic breakdown, slides-to-review list, badge tier card,
     name input, badge preview, and download button.
     ============================================================ */
  .results-section {
    margin-top: 2rem;
    text-align: left;

  /* ============================================================
     RESPONSIVE — comprehensive overhaul
     ============================================================ */

  /* ============================================================
     APP SHELL — lock to viewport height so only the slide
     container scrolls, never the whole page.
     ============================================================ */
  html, body { height: 100%; }
  html, body { max-width: 100%; overflow: hidden; }
  body { overscroll-behavior: none; }

  .app-shell {
    /* Use dynamic viewport height so iOS Safari's browser chrome
       doesn't push the footer off-screen. Falls back to vh. */
    height: 100vh;
    height: 100dvh;
    display: flex;
    overflow: hidden;
  }
  .app-main {
    flex: 1;
    min-width: 0;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  /* ---------- SIDEBAR LAYOUT ---------- */
  /* Plain CSS, NOT Tailwind, so it works the moment the page paints —
     no race with the Tailwind CDN compiler. */
  aside#sidebar {
    width: 18rem;
    flex-shrink: 0;
    position: relative;
    transform: none;
    height: 100%;
    /* Player chrome z-index: 110.
       Articulate's "Strict DOM Isolation" strategy (chrome above slide canvas
       by an unreachable margin). canvas-confetti hardcodes z-index:100 on its
       full-screen canvas; we sit at 110 so the menu can never be visually
       occluded — even when mobile WebKit ignores pointer-events:none.
       Defense-in-depth: the bounding-box hit-test in buildSidebar() also
       defends against this, but layered defenses are how real players ship. */
    z-index: 110;
    overflow-y: auto;
    padding: 1.25rem;
  }
  /* On mobile, the sidebar becomes a real drawer (off-canvas + backdrop). */
  @media (max-width: 768px) {
    aside#sidebar {
      position: fixed;
      top: 0; left: 0; bottom: 0;
      width: min(85vw, 320px);
      transform: translateX(-100%);
      transition: transform 0.3s ease;
      box-shadow: 4px 0 24px rgba(26, 21, 48, 0.18);
    }
    aside#sidebar:not(.closed) {
      transform: translateX(0);
    }
  }
  /* On desktop, ignore the .closed class entirely (drawer concept doesn't apply). */
  @media (min-width: 769px) {
    aside#sidebar.closed { transform: none; }
  }

  /* Hamburger and sidebar-close buttons: visible only on mobile (plain CSS, no Tailwind race). */
  @media (max-width: 768px) {
    #sidebar-open-btn  { display: inline-flex !important; }
    #sidebar-close-btn { display: inline-flex !important; }
  }

  /* Header & footer become fixed-height "chrome" — no longer sticky. */
  header.glass {
    flex-shrink: 0;
    padding-top: env(safe-area-inset-top, 0);
  }
  footer.glass {
    flex-shrink: 0;
    padding-bottom: env(safe-area-inset-bottom, 0);
  }
  /* The slide container is the ONLY scrollable region.
     Content sits at the TOP (not vertically centered) so short cards
     don't float in a void of empty space. */
  #slide-container {
    flex: 1;
    min-height: 0;
    overflow-y: auto;
    overflow-x: hidden;
    -webkit-overflow-scrolling: touch;
    display: flex;
    justify-content: center;
    align-items: flex-start;
    padding: 2rem 1.5rem;
  }
  @media (max-width: 768px) {
    #slide-container { padding: 1rem; }
  }
  @media (min-width: 769px) and (max-width: 1024px) {
    #slide-container { padding: 1.5rem; }
  }

  /* Layout fundamentals: prevent any horizontal overflow */
  /* Long words / long category labels in drag-drop should wrap */
  .draggable, .drop-zone, .quiz-option, .accordion-header,
  .accordion-content, .modal-body {
    overflow-wrap: anywhere;
    word-break: break-word;
  }

  /* Slide cards should never push past viewport on mobile */
  #slide-container > div {
    max-width: 100%;
  }

  /* AUDIO BAR SLOT — between slide-container and footer.
     Reserves its height in the flex column when shown, so the slide
     content lays out above it (no overlap). When hidden (display:none),
     it contributes zero height. */
  #audio-bar-slot {
    display: none;
    flex-shrink: 0;
    padding: 0.6rem 1rem;
    background: linear-gradient(to top,
      rgba(20, 18, 38, 0.04) 0%,
      rgba(20, 18, 38, 0) 100%);
    border-top: 1px solid var(--border, rgba(0, 0, 0, 0.08));
    justify-content: center;
    align-items: center;
  }
  #audio-bar-slot.is-visible { display: flex; }

  /* The audio bar itself, when rendered inline inside the slot. */
  #audio-bar-slot > #slide-audio-bar {
    position: static !important;        /* override any old fixed positioning */
    bottom: auto !important;
    left: auto !important;
    right: auto !important;
    transform: none !important;
    margin: 0 !important;
    width: auto;
    max-width: min(100%, 540px);
  }

  /* MOBILE (≤768px) — slide content tightens, drag-drop stacks, modal goes near full-bleed */
  @media (max-width: 768px) {
    /* Backdrop behind the open mobile sidebar */
    .sidebar-backdrop {
      position: fixed; inset: 0;
      background: rgba(26, 21, 48, 0.4);
      /* Sits one layer below the sidebar (110) but still above the
         confetti canvas (100). Same DOM-isolation principle. */
      z-index: 105;
      opacity: 0; pointer-events: none;
      transition: opacity 0.2s ease;
    }
    .sidebar-backdrop.open { opacity: 1; pointer-events: auto; }

    /* Header & footer */
    header.glass { padding: 0.65rem 0.85rem !important; }
    footer.glass { padding: 0.65rem 0.85rem !important; gap: 0.5rem; }
    #course-title { font-size: 0.95rem; }
    #slide-counter { font-size: 0.75rem; }

    /* Buttons shrink slightly on mobile */
    .btn-primary, .btn-secondary {
      padding: 0.65rem 1.1rem;
      font-size: 0.9rem;
    }

    /* Slide titles */
    h2 { font-size: 1.4rem !important; line-height: 1.25; }

    /* Drag-drop: stack vertically on mobile, with CATEGORIES above items.
       Reasoning: a learner picks up an item and needs somewhere to drop
       it — if the categories are below the (potentially long) items list,
       they're off-screen and the learner can't see them while dragging.
       Showing categories first means they stay in view; the natural touch
       motion is "scroll up to see drop zones, scroll down to grab item,
       drag up to drop." */
    .dd-grid { grid-template-columns: 1fr !important; }
    .dd-grid .dd-zones-col { order: 1; }
    .dd-grid .dd-pool-col  { order: 2; }

    /* Results dashboard: the 3-up grid becomes vertical */
    .results-grid { grid-template-columns: 1fr !important; }

    /* Audio narration bar — collapse to essentials on mobile so it
       fits without overflowing past the viewport edges. We hide the
       scrubber and time display; learner still has play/pause + volume. */
    #slide-audio-bar #sa-time,
    #slide-audio-bar #sa-scrub { display: none !important; }
    #slide-audio-bar { gap: 0.45rem !important; padding: 0.5rem 0.7rem !important; }
    #slide-audio-bar #sa-label { max-width: 90px !important; }
    #slide-audio-bar #sa-volume { width: 60px !important; }
    .results-grid > div { padding: 1rem !important; }

    /* Flip cards single column */
    .flip-grid { grid-template-columns: 1fr !important; }

    /* Modal full-bleed-ish on small screens */
    .modal-card {
      padding: 1.5rem 1.1rem 1.25rem;
      border-radius: 14px;
    }
    .modal-title { font-size: 1.2rem; }
    .modal-actions .btn-primary,
    .modal-actions .btn-secondary { width: 100%; }
  }

  /* TABLET (769–1024px) — sidebar narrows so slides get breathing room */
  @media (min-width: 769px) and (max-width: 1024px) {
    aside#sidebar { width: 16rem; }
  }

  /* Very small phones (≤380px) — extra tightening */
  @media (max-width: 380px) {
    h2 { font-size: 1.2rem !important; }
    .btn-primary, .btn-secondary { padding: 0.55rem 0.9rem; font-size: 0.85rem; }
    .nav-item { font-size: 0.85rem; padding: 0.6rem 0.75rem; }
    #slide-counter { display: none; } /* save space */
  }

  /* ============================================================
     ICONS — small utility classes used by renderers
     ============================================================ */
  .slide-eyebrow {
    display: inline-flex;
    align-items: center;
    gap: 0.5rem;
    font-size: 0.75rem;
    font-weight: 600;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--accent);
    background: var(--accent-soft);
    padding: 0.35rem 0.7rem;
    border-radius: 999px;
    margin-bottom: 0.85rem;
  }
  .slide-eyebrow i { font-size: 0.7rem; }

  .nav-item-icon {
    width: 22px;
    flex-shrink: 0;
    text-align: center;
    color: var(--accent);
    font-size: 0.85rem;
  }
  .nav-item.active .nav-item-icon { color: var(--accent-strong); }
  .nav-item.completed .nav-item-icon { color: var(--success); }
  .nav-item.locked .nav-item-icon { color: var(--text-muted); }

  .stat-icon {
    font-size: 1.25rem;
    color: var(--accent);
    margin-bottom: 0.4rem;
  }

</style>
</head>

<!-- ============================================================ -->
<!--                        APP SHELL                              -->
<!-- ============================================================ -->
<!-- IMPORTANT — DO NOT add `relative` or `z-10` (or any z-index) back
     to this div. Both `position: relative` plus a z-index would create
     a new STACKING CONTEXT here, and every child's z-index would be
     scoped INSIDE that context. The sidebar declares `z-index: 110`
     specifically to sit above the canvas-confetti library's canvas
     (which hardcodes z-index: 100); but if app-shell is its own
     stacking context, "110 inside app-shell" loses to "100 in body" —
     the confetti canvas paints over the menu. We rely on app-shell
     being a normal-flow div with no stacking context of its own so
     descendant z-indexes compete against the canvas at the body level.
     This was the root cause of the long-standing mobile sidebar bug. -->
<div class="app-shell">

  <!-- SIDEBAR -->
  <aside id="sidebar" class="closed glass-strong">
    <div class="flex items-center justify-between mb-6">
      <h2 class="text-lg font-bold" style="display:inline-flex; align-items:center; gap:0.5rem; min-width:0; flex:1;">

      </h2>
      <button id="sidebar-close-btn" onclick="toggleSidebar()" style="background:none; border:none; color:var(--text-muted); font-size:1.2rem; cursor:pointer; flex-shrink:0; display:none;" aria-label="Close menu">
        <i class="fa-solid fa-xmark"></i>
      </button>
    </div>
    <div id="progress-bar" class="mb-2"><div id="progress-fill"></div></div>
    <p id="progress-text" class="text-xs text-white/60 mb-6">0% complete</p>
    <nav id="nav-list" class="flex flex-col gap-1"></nav>
  </aside>

  <!-- MAIN AREA -->
  <main class="app-main">

    <!-- TOP BAR -->
    <header class="glass" style="display:flex; align-items:center; justify-content:space-between; padding:0.75rem 1.25rem; gap:0.75rem;">
      <button id="sidebar-open-btn" onclick="toggleSidebar()" style="background:none; border:none; color:var(--text); font-size:1.4rem; cursor:pointer; display:none; flex-shrink:0;" aria-label="Open menu">
        <i class="fa-solid fa-bars"></i>
      </button>
      <h1 id="course-title" style="font-size:1rem; font-weight:600; flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; margin:0;">Course</h1>
      <div id="slide-counter" style="display:inline-flex; align-items:center; gap:0.4rem; flex-shrink:0; font-size:0.85rem; color:var(--text-muted);">
        <i class="fa-regular fa-circle-dot" style="font-size:0.8rem;"></i>
        <span>1 / 1</span>
      </div>
    </header>

    <!-- SLIDE CONTAINER (the only scrollable region) -->
    <section id="slide-container"></section>

    <!-- AUDIO NARRATION SLOT — reserved layout space for the per-slide
         audio bar. Hidden by default via CSS (display:none); gains
         is-visible class when the current slide has audio. The bar
         renders inline here (not as a floating overlay) so it never
         overlaps slide content or footer buttons. -->
    <div id="audio-bar-slot"></div>

    <!-- BOTTOM NAV -->
    <footer class="glass" style="display:flex; justify-content:space-between; align-items:center; padding:0.85rem 1.25rem; gap:0.5rem;">
      <button id="prev-btn" class="btn-secondary" onclick="prevSlide()">
        <i class="fa-solid fa-arrow-left" style="margin-right:0.4rem;"></i>Previous
      </button>
      <div id="slide-status" style="font-size:0.8rem; flex:1; text-align:center; min-width:0; color:var(--text-muted);"></div>
      <button id="next-btn" class="btn-primary" onclick="nextSlide()">
        Next<i class="fa-solid fa-arrow-right" style="margin-left:0.4rem;"></i>
      </button>
    </footer>
  </main>
</div>

function svgIcon(name, opts = {}) {
  const path = ICONS[name] || '<circle cx="12" cy="12" r="3" fill="currentColor"/>';
  const size = opts.size || 16;
  const stroke = opts.stroke || 1.8;
  return `<svg xmlns="http://www.w3.org/2000/svg" width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="${stroke}" stroke-linecap="round" stroke-linejoin="round" style="display:inline-block; vertical-align:-0.18em; flex-shrink:0;">${path}</svg>`;
}

/* paintIcons walks a DOM root and replaces every legacy
   <i class="fa-solid fa-xxx"> placeholder with an inline SVG.
   Lets the rest of the engine keep using the FA-style markup
   without ever loading an icon font. */
function paintIcons(root) {
  root = root || document;
  const tags = root.querySelectorAll('i[class*="fa-"]');
  tags.forEach(el => {
    // Pull "fa-xxx" classes (skip fa-solid / fa-regular family qualifiers)
    const classes = Array.from(el.classList);
    let name = null;
    for (const cls of classes) {
      if (cls === 'fa-solid' || cls === 'fa-regular' || cls === 'fa-brands') continue;
      if (cls.startsWith('fa-')) { name = cls.slice(3); break; }
    }
    if (!name) return;
    // Honor the existing inline color/font-size from the parent (currentColor takes care of it)
    const tmp = document.createElement('span');
    tmp.innerHTML = svgIcon(name, { size: parseFloat(getComputedStyle(el).fontSize) || 16 });
    const svg = tmp.firstChild;
    // Preserve any inline style on the original <i> (margin, color override)
    if (el.style.cssText) svg.style.cssText += ';' + el.style.cssText;
    el.replaceWith(svg);
  });
}
