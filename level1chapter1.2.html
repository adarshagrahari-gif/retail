        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
      </div>
      <p style="font-weight:600; font-size:1rem; margin:0 0 0.4rem;">${msg.title}</p>
      <p style="font-size:0.85rem; opacity:0.75; max-width:380px; margin:0 0 1rem;">${msg.body}</p>
      ${ytId ? `<a href="https://www.youtube.com/watch?v=${ytId}" target="_blank" rel="noopener" style="background:#cc0000; color:white; padding:0.5rem 1rem; border-radius:6px; text-decoration:none; font-size:0.85rem; font-weight:600;">Open on YouTube ↗</a>` : ''}
    </div>`;
  if (hint) hint.innerHTML = '<i class="fa-regular fa-circle-play" style="color:var(--accent);"></i>Continue when ready.';
  STATE.completed.add(slide.id);
  setNextEnabled(true);
  refreshSidebarState();
}

function markVideoDone(slide) {
  // PATCH 2026-05-19 round 8: capture prior watch state BEFORE we flip the
  // flag. Only the FIRST completion should trigger the scrub-unlock re-
  // render — subsequent completions (the learner watching a replay through
  // to the end again) would otherwise tear down and rebuild the iframe in
  // a loop, producing the flickering 'video never plays' symptom.
  var wasAlreadyWatched = !!(STATE.videoWatched && STATE.videoWatched[slide.id]);
  STATE.videoWatched[slide.id] = true;
  STATE.completed.add(slide.id);
  trackResponse(slide, {
    response: { watchedToEnd: true },
    correct: null,
    attempts: 1,
    score: null,
    completed: true
  });
  const hintEl = document.getElementById('video-hint');
  if (hintEl) {
    hintEl.innerHTML = '<i class="fa-solid fa-circle-check" style="color:var(--success);"></i>Video complete — you may continue.';
  }
  setNextEnabled(true);
  refreshSidebarState();
  // Re-render only on the FIRST completion. If the learner has already
  // unlocked scrubbing in a prior session (or earlier in this session),
  // the slide is already rendered with native controls — don't touch it.
  if (slide.allowScrubAfterWatched && !wasAlreadyWatched && typeof renderSlide === 'function') {
    var cur = COURSE_CONFIG.slides[STATE.current];
    if (cur && cur.id === slide.id) {
      setTimeout(function() { renderSlide(); }, 700);
    }
  }
}

function isYouTube(url) { return /youtu\.?be/.test(url || ''); }
function extractYouTubeId(url) {
  if (!url) return null;
  if (!/[\/=]/.test(url) && /^[\w-]{11}$/.test(url)) return url;
  const m = url.match(/(?:v=|\/embed\/|\/shorts\/|\/live\/|\/v\/|youtu\.be\/)([\w-]{11})/);
  return m ? m[1] : null;
}

function isVimeo(url) { return /vimeo\.com|player\.vimeo\.com/.test(url || ''); }
function extractVimeoId(url) {
  if (!url) return null;
  // Bare numeric ID
  if (/^\d{6,12}$/.test(url)) return url;
  // Match Vimeo URL shapes:
  //   vimeo.com/123456789                    (standard)
  //   vimeo.com/channels/staffpicks/123456   (channel)
  //   vimeo.com/groups/name/videos/123456    (group)
  //   player.vimeo.com/video/123456789       (embed)
  //   vimeo.com/123456789/abc123hash         (private with unlisted hash)
  const m = url.match(/(?:vimeo\.com\/(?:channels\/[^\/]+\/|groups\/[^\/]+\/videos\/|video\/)?|player\.vimeo\.com\/video\/)(\d+)/);
  return m ? m[1] : null;
}

let ytAPILoaded = false, ytAPICallbacks = [];
function loadYouTubeAPI(cb) {
  if (window.YT && window.YT.Player) return cb();
  ytAPICallbacks.push(cb);
  if (ytAPILoaded) return;
  ytAPILoaded = true;
  const t = document.createElement('script');
  t.src = 'https://www.youtube.com/iframe_api';
  document.head.appendChild(t);
  window.onYouTubeIframeAPIReady = () => ytAPICallbacks.forEach(f => f());
}

let vimeoAPILoaded = false, vimeoAPICallbacks = [];
function loadVimeoAPI(cb) {
  if (window.Vimeo && window.Vimeo.Player) return cb();
  vimeoAPICallbacks.push(cb);
  if (vimeoAPILoaded) return;
  vimeoAPILoaded = true;
  const t = document.createElement('script');
  t.src = 'https://player.vimeo.com/api/player.js';
  t.onload = () => vimeoAPICallbacks.forEach(f => f());
  document.head.appendChild(t);
}


/* ---- FILE VIEWER ---- */
/* Embeds a PDF, image (PNG/JPEG), or HTML file inline with an optional
   download button. The file is stored as a base64 string in the config.
   The viewer auto-switches based on MIME type:
     - application/pdf      → <iframe> with the PDF data URL
     - image/png, image/jpeg→ <img> with click-to-zoom
     - text/html            → sandboxed-but-scripts-allowed iframe via srcdoc
     - anything else        → friendly fallback + download-only
   The "completed" gate is optional:
     - slide.requireView=false (default) → marks complete on render
     - slide.requireView=true            → marks complete after slide.viewSeconds (default 5)
*/
function renderFileViewer(slide, c) {
  const fileName = slide.fileName || 'file';
  const mime = slide.fileType || 'application/octet-stream';
  const dataUri = slide.fileData ? `data:${mime};base64,${slide.fileData}` : '';
  const safeId = `fv-${slide.id}`;

  // ----- Blob URL caching -----
  // Some mobile browsers (especially Android Chrome) refuse to render PDFs
  // from a data: URI inside an iframe — they show the raw base64 bytes
  // as text instead. Blob URLs (object URLs) trigger the OS-level PDF
  // viewer reliably across mobile and desktop. We build the blob lazily
  // and cache it per slide.id so we don't allocate a new one on every
  // re-render. Falls back to the data URI if Blob construction fails.
  if (!window.__fvBlobCache) window.__fvBlobCache = {};
  let viewerUrl = dataUri;            // safe default
  if (slide.fileData && typeof Blob !== 'undefined' && typeof URL !== 'undefined' && URL.createObjectURL) {
    if (window.__fvBlobCache[slide.id]) {
      viewerUrl = window.__fvBlobCache[slide.id];
    } else {
      try {
        const bin = atob(slide.fileData);
        const bytes = new Uint8Array(bin.length);
        for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
        const blob = new Blob([bytes], { type: mime });
        viewerUrl = URL.createObjectURL(blob);
        window.__fvBlobCache[slide.id] = viewerUrl;
      } catch (e) {
        // Fallback to dataUri
      }
    }
  }

  // Build the viewer body based on MIME type
  let viewerHtml;
  if (!dataUri) {
    viewerHtml = `<div class="glass rounded-xl" style="padding:1.5rem; text-align:center; color:var(--text-muted);">
      <i class="fa-solid fa-file-circle-question" style="font-size:2rem; margin-bottom:0.5rem;"></i>
      <div>No file uploaded yet. The author needs to attach a file in the editor.</div>
    </div>`;
  } else if (mime === 'application/pdf') {
    // PDFs split by viewport. Desktop browsers ship a PDF viewer that
    // handles iframes well — show inline. Mobile browsers can't render
    // PDFs inline reliably; instead we show a clean PDF card with an
    // "Open PDF" button that hands the file to the OS-level viewer.
    const isMobile = window.matchMedia && window.matchMedia('(max-width: 768px)').matches;
    if (isMobile) {
      viewerHtml = `
        <div style="background:var(--surface-soft); border-radius:0.75rem; padding:2rem 1.5rem; text-align:center; border:1px solid var(--border);">
          <i class="fa-solid fa-file-pdf" style="font-size:3.5rem; color:#c0392b; margin-bottom:1rem;"></i>
          <div style="font-weight:600; font-size:1.05rem; margin-bottom:0.3rem; color:var(--text);">${escapeHtmlAttr(fileName)}</div>
          <div style="color:var(--text-muted); font-size:0.82rem; margin-bottom:1.3rem;">PDF document</div>
          <a href="${viewerUrl}" target="_blank" rel="noopener"
             style="display:inline-flex; align-items:center; gap:0.5rem; padding:0.85rem 1.6rem; background:var(--accent); color:white; border-radius:0.5rem; text-decoration:none; font-weight:600; font-size:0.95rem;">
            <i class="fa-solid fa-up-right-from-square"></i> Open PDF
          </a>
          <p style="margin-top:1rem; font-size:0.78rem; color:var(--text-muted); line-height:1.4;">
            Opens in your device's PDF viewer. Inline preview isn't supported on mobile browsers — this is the most reliable way to view PDFs on phones and tablets.
          </p>
        </div>`;
    } else {
      // Desktop: inline iframe with Blob URL (works in Chrome, Firefox,
      // Edge, Safari). Fallback link still shown beneath in case the
      // browser doesn't have a PDF plugin.
      viewerHtml = `
        <div style="position:relative; width:100%; height:65vh; min-height:400px; background:var(--surface-soft); border-radius:0.75rem; overflow:hidden;">
          <iframe id="${safeId}-frame" src="${viewerUrl}" style="width:100%; height:100%; border:0; background:white;" title="${escapeHtmlAttr(fileName)}"></iframe>
        </div>
        <p class="text-white/60 text-sm" style="margin-top:0.6rem; display:flex; align-items:center; gap:0.5rem; justify-content:center;">
          <i class="fa-solid fa-circle-info" style="color:var(--accent);"></i>
          PDF not loading? <a href="${viewerUrl}" target="_blank" rel="noopener" style="color:var(--accent); text-decoration:underline;">Open in new tab</a>
        </p>`;
    }
  } else if (mime === 'image/png' || mime === 'image/jpeg' || mime === 'image/jpg' || mime === 'image/gif' || mime === 'image/webp') {
    // Image: clickable for fullscreen viewing.
    // The container has the height cap with overflow:auto so tall PNGs
    // (e.g., a multi-page document exported as a single tall image) can
    // be scrolled through at readable width rather than scaled down to
    // fit the viewport. Short images render normally without a scrollbar.
    viewerHtml = `
      <div style="background:var(--surface-soft); border-radius:0.75rem; padding:1rem;">
        <div style="max-height:65vh; overflow-y:auto; overflow-x:hidden; border-radius:0.5rem; text-align:center;">
          <img id="${safeId}-img" src="${viewerUrl}" alt="${escapeHtmlAttr(fileName)}"
               style="max-width:100%; height:auto; display:block; margin:0 auto; border-radius:0.5rem; cursor:zoom-in;"
               onclick="window.__fvZoom('${safeId}-img', '${escapeHtmlAttr(fileName)}')" />
        </div>
        <p class="text-white/60 text-sm" style="margin-top:0.5rem; text-align:center;">
          <i class="fa-solid fa-magnifying-glass-plus" style="color:var(--accent); margin-right:0.3rem;"></i>Click image to zoom — scroll within the frame to read long images
        </p>
      </div>`;
  } else if (mime === 'text/html' || mime === 'application/xhtml+xml') {
    // HTML: render via srcdoc so relative paths inside the HTML resolve
    // correctly against an empty base. Scripts are allowed (per author intent).
    // We decode base64 to UTF-8 to get the actual HTML source for srcdoc.
    let htmlSource = '';
    try {
      const bin = atob(slide.fileData);
      const bytes = new Uint8Array(bin.length);
      for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
      htmlSource = new TextDecoder('utf-8').decode(bytes);
    } catch (e) {
      htmlSource = '<!doctype html><body style="font-family:sans-serif; padding:2rem;"><p>Failed to decode HTML file.</p></body>';
    }
    // srcdoc requires the HTML to be HTML-escaped (just &, <, >, ").
    // We escape the attribute boundaries so the surrounding iframe parses.
    const srcDocAttr = htmlSource
      .replace(/&/g, '&amp;')
      .replace(/"/g, '&quot;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;');
    viewerHtml = `
      <div style="position:relative; width:100%; height:65vh; min-height:400px; background:white; border-radius:0.75rem; overflow:hidden;">
        <iframe id="${safeId}-frame" srcdoc="${srcDocAttr}" style="width:100%; height:100%; border:0;" title="${escapeHtmlAttr(fileName)}"></iframe>
      </div>`;
  } else {
    // Unknown type: skip the viewer, offer download only
    viewerHtml = `
      <div class="glass rounded-xl" style="padding:1.5rem; text-align:center;">
        <i class="fa-solid fa-file" style="font-size:2.5rem; color:var(--accent); margin-bottom:0.5rem;"></i>
        <div style="font-weight:600; margin-bottom:0.3rem;">${escapeHtmlAttr(fileName)}</div>
        <div class="text-white/60 text-sm">${escapeHtmlAttr(mime)}</div>
        <p class="text-white/70" style="margin-top:0.8rem;">This file type can't be previewed inline. Use the download button below to view it.</p>
      </div>`;
  }

  // Download button (optional, defaults on). Use the Blob URL when
  // available — it makes the download Save-As dialog use the correct
  // filename on more mobile browsers than a data URI does.
  const showDownload = slide.showDownload !== false;
  const downloadName = slide.downloadFilename || fileName;
  const downloadHref = viewerUrl || dataUri;
  const downloadHtml = (showDownload && downloadHref) ? `
    <div style="margin-top:1rem; text-align:center;">
      <a href="${downloadHref}" download="${escapeHtmlAttr(downloadName)}" class="btn btn-primary" style="display:inline-flex; align-items:center; gap:0.5rem; padding:0.7rem 1.3rem; background:var(--accent); color:white; border-radius:0.5rem; text-decoration:none; font-weight:600;">
        <i class="fa-solid fa-download"></i>
        Download ${escapeHtmlAttr(downloadName)}
      </a>
    </div>` : '';

  c.innerHTML = `
    <div class="glass-strong w-full max-w-4xl rounded-3xl p-6 md:p-8">
      <div class="slide-eyebrow">
        <i class="fa-solid fa-file-arrow-down"></i>
        Resource
      </div>
      <h2 class="text-2xl md:text-3xl font-bold mb-3">${escapeHtmlAttr(slide.title || 'Resource')}</h2>
      ${slide.description ? `<div class="text-white/80 mb-4 leading-relaxed rt-rendered">${renderRichTextOrPlain(slide.description)}</div>` : ''}
      ${viewerHtml}
      ${downloadHtml}
    </div>`;

  // Install the zoom helper once (used by image click handler)
  if (!window.__fvZoom) {
    window.__fvZoom = function(imgId, name) {
      const img = document.getElementById(imgId);
      if (!img) return;
      const overlay = document.createElement('div');
      overlay.style.cssText = 'position:fixed; inset:0; background:rgba(0,0,0,0.92); z-index:9999; display:flex; align-items:center; justify-content:center; cursor:zoom-out; padding:2rem;';
      overlay.innerHTML = `<img src="${img.src}" alt="${name}" style="max-width:96vw; max-height:92vh; object-fit:contain; border-radius:0.5rem;"/>`;
      overlay.onclick = () => overlay.remove();
      document.body.appendChild(overlay);
    };
  }

  // Completion gating
  if (STATE.completed.has(slide.id)) {
    setNextEnabled(true);
    return;
  }
  if (slide.requireView) {
    // Match the renderText pattern — wait N seconds before unlocking Next
    const wait = (slide.viewSeconds || 5) * 1000;
    setNextEnabled(false);
    document.getElementById('slide-status').innerHTML =
      '<i class="fa-solid fa-hourglass-half" style="margin-right:0.4rem;"></i>Reviewing the file...';
    setTimeout(() => {
      STATE.completed.add(slide.id);
      setNextEnabled(true);
      document.getElementById('slide-status').innerHTML = '';
      refreshSidebarState();
    }, wait);
  } else {
    // No gate — complete immediately
    STATE.completed.add(slide.id);
    setNextEnabled(true);
  }
}

/* Tiny attribute-safe HTML escaper used by file-viewer. */
function escapeHtmlAttr(s) {
  return String(s == null ? '' : s)
    .replace(/&/g, '&amp;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#39;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;');
}

/* ---- DRAG-DROP ---- */
// =============================================================================
// SORT & MATCH (drag-drop) — three layouts, identical data model.
//   slide.layout === 'drag'      (default) — classic drag from pool into zones.
//   slide.layout === 'chips'              — each item card has chip buttons,
//                                            one tap per item to assign.
//   slide.layout === 'dropdown'           — each item has a native <select>
//                                            for picking its category.
// All three feed the same placements shape: { itemIdx: categoryName },
// so trackResponse / buildInteractionData / scormReportInteraction see
// identical input regardless of layout — LMS interactions are unchanged.
// (Added 2026-05-19 round 6.)
// =============================================================================

/* Shared evaluation + tracking for chips and dropdown layouts. The drag
   layout keeps its own DOM-driven check below for back-compat. */
function __ddHandleAttempt(slide, c, placements, layout) {
  var items = slide.items || [];
  var total = items.length;
  var placed = 0, correctCount = 0;
  items.forEach(function(it, i) {
    var v = placements[i];
    if (v != null && v !== '') {
      placed++;
      if (v === it.category) correctCount++;
    }
  });
  if (placed < total) {
    showFeedbackModal({
      type: 'info',
      title: 'Not finished yet',
      body: 'Pick a category for all ' + total + ' items before checking.',
      primary: 'OK'
    });
    return;
  }
  var prev = STATE.responses[slide.id] || { attempts: 0 };
  var attemptCount = (prev.attempts || 0) + 1;
  var allCorrect = (correctCount === total);

  if (allCorrect) {
    STATE.completed.add(slide.id);
    trackResponse(slide, {
      response: { placements: placements },
      correct: true,
      attempts: attemptCount,
      score: attemptCount === 1 ? 1 : 0.5,
      completed: true
    });
    setNextEnabled(true);
    try { confetti({ particleCount: 80, spread: 80, origin: { y: 0.7 } }); } catch(e) {}
    refreshSidebarState();
    showFeedbackModal({
      type: 'success',
      title: 'All correct!',
      body: 'Every item is in the right category. Great work.',
      primary: 'Continue'
    });
    if (layout === 'chips')         renderDragDropChips(slide, c);
    else if (layout === 'dropdown') renderDragDropDropdown(slide, c);
    return;
  }
  if (attemptCount >= 2) {
    STATE.completed.add(slide.id);
    trackResponse(slide, {
      response: { placements: placements },
      correct: false,
      attempts: attemptCount,
      score: correctCount / total,
      completed: true
    });
    setNextEnabled(true);
    refreshSidebarState();
    showFeedbackModal({
      type: 'info',
      title: correctCount + ' of ' + total + ' placed correctly',
      body: 'You used both your attempts. The slide is locked. Items shown in red are in the wrong category.',
      primary: 'Continue'
    });
    if (layout === 'chips')         renderDragDropChips(slide, c);
    else if (layout === 'dropdown') renderDragDropDropdown(slide, c);
    return;
  }
  // First wrong attempt — save partial, prompt to retry.
  trackResponse(slide, {
    response: { placements: placements },
    correct: false,
    attempts: attemptCount,
    completed: false
  });
  showFeedbackModal({
    type: 'error',
    title: 'Some are off — try once more',
    body: 'Adjust the items that look wrong and check again. You have one more attempt.',
    primary: 'Try Again'
  });
}

/* CHIPS layout — one tap per item, no drag. Mobile-first. */
function renderDragDropChips(slide, c) {
  var reviewMode = STATE.completed.has(slide.id);
  var placements = {};
  if (reviewMode) {
    slide.items.forEach(function(it, i) { placements[i] = it.category; });
  } else {
    var prev = STATE.responses[slide.id];
    if (prev && prev.response && prev.response.placements) {
      placements = Object.assign({}, prev.response.placements);
    }
  }

  function chipClass(itemIdx, cat) {
    var it = slide.items[itemIdx];
    var isActive = (placements[itemIdx] === cat);
    if (reviewMode) {
      if (!isActive) return 'dd-chip';
      return cat === it.category ? 'dd-chip dd-chip-correct' : 'dd-chip dd-chip-incorrect';
    }
    return isActive ? 'dd-chip dd-chip-active' : 'dd-chip';
  }

  var itemsHTML = slide.items.map(function(it, i) {
    var rowExtra = '';
    if (reviewMode) {
      rowExtra = (placements[i] === it.category) ? ' dd-row-correct' : ' dd-row-incorrect';
    }
    var chips = slide.categories.map(function(cat) {
      return '<button type="button" class="' + chipClass(i, cat) + '" data-item="' + i + '" data-cat="' + escapeHtmlAttr(cat) + '"' + (reviewMode ? ' disabled' : '') + '>' + escapeHtmlAttr(cat) + '</button>';
    }).join('');
    return '<div class="dd-chip-row' + rowExtra + '" data-item="' + i + '">' +
             '<div class="dd-chip-item-text">' + escapeHtmlAttr(it.text) + '</div>' +
             '<div class="dd-chip-options">' + chips + '</div>' +
           '</div>';
  }).join('');

  c.innerHTML =
    '<div class="glass-strong w-full max-w-5xl rounded-3xl p-6 md:p-8">' +
      '<div class="slide-eyebrow">' +
        '<i class="fa-solid fa-arrows-up-down-left-right"></i>' +
        'Sort &amp; Match' + (reviewMode ? ' · Review' : '') +
      '</div>' +
      '<h2 class="text-2xl md:text-3xl font-bold mb-2">' + escapeHtmlAttr(slide.title || '') + '</h2>' +
      '<p class="text-white/70 mb-5 text-sm" style="display:flex; align-items:center; gap:0.5rem;">' +
        '<i class="fa-solid fa-hand-pointer" style="color:var(--accent);"></i>' +
        escapeHtmlAttr(slide.instruction || 'For each item, tap the category that fits best.') +
      '</p>' +
      '<div class="dd-chip-list">' + itemsHTML + '</div>' +
      (reviewMode ? reviewBanner('You sorted these correctly. Good recall.') :
        '<div class="mt-5" style="display:flex; gap:0.75rem; flex-wrap:wrap;">' +
          '<button class="btn-primary" id="dd-check">' +
            '<i class="fa-solid fa-circle-check" style="margin-right:0.4rem;"></i>Check answers' +
          '</button>' +
        '</div>') +
    '</div>';

  if (reviewMode) { setNextEnabled(true); return; }

  // Tap a chip → set the assignment for that item.
  c.querySelectorAll('.dd-chip').forEach(function(btn) {
    btn.addEventListener('click', function() {
      var itemIdx = btn.dataset.item;
      var cat = btn.dataset.cat;
      placements[itemIdx] = cat;
      btn.parentElement.querySelectorAll('.dd-chip').forEach(function(b) {
        b.classList.remove('dd-chip-active');
      });
      btn.classList.add('dd-chip-active');
    });
  });

  var checkBtn = document.getElementById('dd-check');
  if (checkBtn) checkBtn.onclick = function() { __ddHandleAttempt(slide, c, placements, 'chips'); };
  setNextEnabled(false);
}

/* DROPDOWN layout — native <select> per item. Most compact, works on every device. */
function renderDragDropDropdown(slide, c) {
  var reviewMode = STATE.completed.has(slide.id);
  var placements = {};
  if (reviewMode) {
    slide.items.forEach(function(it, i) { placements[i] = it.category; });
  } else {
    var prev = STATE.responses[slide.id];
    if (prev && prev.response && prev.response.placements) {
      placements = Object.assign({}, prev.response.placements);
    }
  }

  var itemsHTML = slide.items.map(function(it, i) {
    var rowExtra = '';
    if (reviewMode) {
      rowExtra = (placements[i] === it.category) ? ' dd-row-correct' : ' dd-row-incorrect';
    }
    var options = ['<option value="">— Choose category —</option>']
      .concat(slide.categories.map(function(cat) {
        var sel = (placements[i] === cat) ? ' selected' : '';
        return '<option value="' + escapeHtmlAttr(cat) + '"' + sel + '>' + escapeHtmlAttr(cat) + '</option>';
      })).join('');
    return '<div class="dd-dropdown-row' + rowExtra + '" data-item="' + i + '">' +
             '<div class="dd-dropdown-item-text">' + escapeHtmlAttr(it.text) + '</div>' +
             '<select class="dd-dropdown-select" data-item="' + i + '"' + (reviewMode ? ' disabled' : '') + '>' + options + '</select>' +
           '</div>';
  }).join('');

  c.innerHTML =
    '<div class="glass-strong w-full max-w-5xl rounded-3xl p-6 md:p-8">' +
      '<div class="slide-eyebrow">' +
        '<i class="fa-solid fa-arrows-up-down-left-right"></i>' +
        'Sort &amp; Match' + (reviewMode ? ' · Review' : '') +
      '</div>' +
      '<h2 class="text-2xl md:text-3xl font-bold mb-2">' + escapeHtmlAttr(slide.title || '') + '</h2>' +
      '<p class="text-white/70 mb-5 text-sm" style="display:flex; align-items:center; gap:0.5rem;">' +
        '<i class="fa-solid fa-hand-pointer" style="color:var(--accent);"></i>' +
        escapeHtmlAttr(slide.instruction || 'For each item, pick its category from the dropdown.') +
      '</p>' +
      '<div class="dd-dropdown-list">' + itemsHTML + '</div>' +
      (reviewMode ? reviewBanner('You sorted these correctly. Good recall.') :
        '<div class="mt-5" style="display:flex; gap:0.75rem; flex-wrap:wrap;">' +
          '<button class="btn-primary" id="dd-check">' +
            '<i class="fa-solid fa-circle-check" style="margin-right:0.4rem;"></i>Check answers' +
          '</button>' +
        '</div>') +
    '</div>';

  if (reviewMode) { setNextEnabled(true); return; }

  c.querySelectorAll('.dd-dropdown-select').forEach(function(sel) {
    sel.addEventListener('change', function() {
      var itemIdx = sel.dataset.item;
      placements[itemIdx] = sel.value;
    });
  });

  var checkBtn = document.getElementById('dd-check');
  if (checkBtn) checkBtn.onclick = function() { __ddHandleAttempt(slide, c, placements, 'dropdown'); };
  setNextEnabled(false);
}

function renderDragDrop(slide, c) {
  // Layout dispatcher (added 2026-05-19 round 6). Authors can pick a
  // mobile-friendlier alternative to drag-and-drop in the editor.
  var __ddLayout = slide.layout || 'drag';
  if (__ddLayout === 'chips')    return renderDragDropChips(slide, c);
  if (__ddLayout === 'dropdown') return renderDragDropDropdown(slide, c);
  // Default: original drag-and-drop implementation continues below.
  // Review mode kicks in once the user has correctly placed all items.
  // Drag-drop only completes on a fully-correct check, so review = show
  // the final correct arrangement with no interaction.
  const reviewMode = STATE.completed.has(slide.id);

  // In review mode, items are pre-placed in their correct zones.
  // In normal mode, all items start in the pool.
  const itemsHTML = slide.items.map((it, i) =>
    `<div class="draggable" ${reviewMode ? '' : 'draggable="true"'} data-cat="${it.category}" data-i="${i}"><i class="fa-solid fa-grip-vertical" style="color:var(--text-faint); margin-right:0.5rem; font-size:0.8rem;"></i>${it.text}</div>`
  ).join('');
  const zonesHTML = slide.categories.map(cat =>
    `<div style="background:var(--surface-2); border:1px solid var(--border); border-radius:12px; padding:0.75rem;">
       <div style="font-weight:600; font-size:0.9rem; margin-bottom:0.5rem; text-align:center; color:var(--accent-strong);">${cat}</div>
       <div class="drop-zone${reviewMode ? ' correct' : ''}" data-cat="${cat}"></div>
     </div>`
  ).join('');
  c.innerHTML = `
    <div class="glass-strong w-full max-w-5xl rounded-3xl p-6 md:p-8">
      <div class="slide-eyebrow">
        <i class="fa-solid fa-arrows-up-down-left-right"></i>
        Sort &amp; Match${reviewMode ? ' · Review' : ''}
      </div>
      <h2 class="text-2xl md:text-3xl font-bold mb-2">${slide.title}</h2>
      <p class="text-white/70 mb-5 text-sm" style="display:flex; align-items:center; gap:0.5rem;">
        <i class="fa-solid fa-hand-pointer" style="color:var(--accent);"></i>
        ${slide.instruction || 'Drag each item into the correct category.'}
      </p>
      <div class="dd-grid" style="display:grid; grid-template-columns: ${reviewMode ? '1fr' : '1fr 1fr'}; gap:1.25rem;">
        ${reviewMode ? '' : `
        <div class="dd-pool-col">
          <div class="text-sm mb-2" style="color:var(--text-muted); font-weight:600;">
            <i class="fa-solid fa-list-ul" style="margin-right:0.4rem; color:var(--accent);"></i>Items
          </div>
          <div id="dd-pool" style="display:flex; flex-direction:column; gap:0.5rem; background:var(--surface-2); border:1px solid var(--border); border-radius:12px; padding:0.75rem; min-height:160px;">${itemsHTML}</div>
        </div>`}
        <div class="dd-zones-col">
          <div class="text-sm mb-2" style="color:var(--text-muted); font-weight:600;">
            <i class="fa-solid fa-folder-open" style="margin-right:0.4rem; color:var(--accent);"></i>${reviewMode ? 'Your correct placements' : 'Categories'}
          </div>
          <div style="display:grid; gap:0.75rem;">${zonesHTML}</div>
        </div>
      </div>
      ${reviewMode ? reviewBanner('You sorted these correctly. Good recall.') : `
      <div class="mt-5" style="display:flex; gap:0.75rem; flex-wrap:wrap;">
        <button class="btn-primary" id="dd-check">
          <i class="fa-solid fa-circle-check" style="margin-right:0.4rem;"></i>Check answers
        </button>
      </div>`}
    </div>`;

  if (reviewMode) {
    // Place each item directly into its correct zone (read-only).
    const zones = {};
    c.querySelectorAll('.drop-zone').forEach(z => { zones[z.dataset.cat] = z; });
    slide.items.forEach((it, i) => {
      const drag = c.querySelector(`.draggable[data-i="${i}"]`);
      if (drag && zones[it.category]) {
        drag.classList.add('disabled');
        drag.style.cursor = 'default';
        zones[it.category].appendChild(drag);
      }
    });
    setNextEnabled(true);
    return;
  }

  // Drag handlers (active mode only). Auto-scroll fires on dragstart and
  // unhooks on dragend so the page scrolls when the dragged item gets
  // close to the viewport edge — important on phones where the drop zones
  // can be below the fold while the items list is being scrolled.
  let dragged = null;
  let stopAutoScroll = null;
  c.querySelectorAll('.draggable').forEach(el => {
    el.addEventListener('dragstart', e => {
      dragged = el; el.classList.add('dragging');
      stopAutoScroll = startEdgeAutoScroll();
    });
    el.addEventListener('dragend', () => {
      el.classList.remove('dragging'); dragged = null;
      if (stopAutoScroll) { stopAutoScroll(); stopAutoScroll = null; }
    });
  });
  c.querySelectorAll('.drop-zone').forEach(zone => {
    zone.addEventListener('dragover', e => { e.preventDefault(); zone.classList.add('drag-over'); });
    zone.addEventListener('dragleave', () => zone.classList.remove('drag-over'));
    zone.addEventListener('drop', e => {
      e.preventDefault(); zone.classList.remove('drag-over');
      if (dragged) zone.appendChild(dragged);
    });
  });
  // Touch fallback (basic): tap an item to highlight, tap a zone to drop
  let tapped = null;
  c.querySelectorAll('.draggable').forEach(el => {
    el.addEventListener('click', (e) => {
      // PATCH 2026-05-19 round 5: tapped-item drop into already-occupied
      // zone. On mobile, when the learner has tapped an item from the pool
      // and tries to drop it into a zone that already contains another
      // item, their finger lands on the existing item — not on the empty
      // space of the zone. Without this branch, the item-click handler
      // resets `tapped` to the item already in the zone, the pending item
      // gets silently dropped, and the learner can't place more than one
      // item per category (bug: many-to-one drag-drop appears broken).
      var parentZone = (el.parentElement && el.parentElement.classList &&
                        el.parentElement.classList.contains('drop-zone'))
                       ? el.parentElement : null;
      if (tapped && tapped !== el && parentZone) {
        // Treat this click as 'drop the pending item into THIS zone'.
        parentZone.appendChild(tapped);
        tapped.style.outline = '';
        tapped = null;
        e.stopPropagation();   // don't let the zone's click handler fire again
        return;
      }
      c.querySelectorAll('.draggable').forEach(x => x.style.outline = '');
      tapped = el; el.style.outline = '2px solid var(--accent)';
      // On narrow viewports the drop zones may be off-screen above the
      // tap target. Scroll the first drop zone into view so the learner
      // immediately sees where they can drop. Only do this on phones —
      // on desktop the layout fits both columns side-by-side.
      if (window.innerWidth <= 768) {
        const firstZone = c.querySelector('.drop-zone');
        if (firstZone && typeof firstZone.scrollIntoView === 'function') {
          firstZone.scrollIntoView({ behavior: 'smooth', block: 'start' });
        }
      }
    });
  });
  c.querySelectorAll('.drop-zone').forEach(zone => {
    zone.addEventListener('click', () => {
      if (tapped) { zone.appendChild(tapped); tapped.style.outline = ''; tapped = null; }
    });
  });
  // Check
  document.getElementById('dd-check').onclick = () => {
    let allCorrect = true;
    let totalPlaced = 0;
    let totalItems = slide.items.length;
    c.querySelectorAll('.drop-zone').forEach(zone => {
      zone.classList.remove('correct', 'incorrect');
      const cat = zone.dataset.cat;
      const kids = zone.querySelectorAll('.draggable');
      totalPlaced += kids.length;
      let zoneCorrect = kids.length > 0;
      kids.forEach(k => { if (k.dataset.cat !== cat) zoneCorrect = false; });
      if (zoneCorrect && kids.length > 0) zone.classList.add('correct');
      else if (kids.length > 0) { zone.classList.add('incorrect'); allCorrect = false; }
    });
    if (totalPlaced < totalItems) allCorrect = false;

    // Capture current placements for tracking export.
    const placements = {};
    c.querySelectorAll('.drop-zone').forEach(zone => {
      zone.querySelectorAll('.draggable').forEach(k => {
        placements[k.dataset.i] = zone.dataset.cat;
      });
    });
    // Increment attempts on this slide
    const prev = STATE.responses[slide.id] || { attempts: 0 };
    const attemptCount = prev.attempts + 1;

    if (allCorrect) {
      STATE.completed.add(slide.id);
      trackResponse(slide, {
        response: { placements },
        correct: true,
        attempts: attemptCount,
        score: attemptCount === 1 ? 1 : 0.5,  // half credit on 2nd attempt
        completed: true
      });
      setNextEnabled(true);
      confetti({ particleCount: 80, spread: 80, origin: { y: 0.7 } });
      refreshSidebarState();
      showFeedbackModal({
        type: 'success',
        title: 'All correct!',
        body: 'Every item is in the right category. Great work.',
        primary: 'Continue'
      });
    } else if (totalPlaced < totalItems) {
      // Not a real attempt — don't increment.
      showFeedbackModal({
        type: 'info',
        title: 'Not finished yet',
        body: `Place all ${totalItems} items into a category before checking.`,
        primary: 'OK'
      });
    } else if (attemptCount >= 2) {
      // Second attempt wrong — lock with whatever they have. Compute partial score
      // based on items in correct zones.
      let correctItems = 0;
      c.querySelectorAll('.drop-zone').forEach(zone => {
        zone.querySelectorAll('.draggable').forEach(k => {
          if (k.dataset.cat === zone.dataset.cat) correctItems++;
        });
      });
      const partialScore = correctItems / totalItems;
      STATE.completed.add(slide.id);
      trackResponse(slide, {
        response: { placements },
        correct: false,
        attempts: attemptCount,
        score: partialScore,
        completed: true
      });
      // Disable further drag/drop
      c.querySelectorAll('.draggable').forEach(d => { d.draggable = false; d.style.cursor = 'default'; });
      const checkBtn = document.getElementById('dd-check');
      if (checkBtn) checkBtn.disabled = true;
      setNextEnabled(true);
      refreshSidebarState();
      showFeedbackModal({
        type: 'info',
        title: `${correctItems} of ${totalItems} placed correctly`,
        body: 'You used both your attempts. The slide is locked. Items in red are in the wrong category.',
        primary: 'Continue'
      });
    } else {
      // First wrong attempt — track but don't mark complete; let user retry.
      trackResponse(slide, {
        response: { placements },
        correct: false,
        attempts: attemptCount,
        completed: false
      });
      showFeedbackModal({
        type: 'error',
        title: 'Some are off — try once more',
        body: 'Items in red categories need to be moved. The items in green are correct. You have one more attempt.',
        primary: 'Try Again'
      });
    }
  };
  setNextEnabled(false);
}

/* ---- SCENARIO ---- */
function renderScenario(slide, c) {
  // Review mode kicks in once the user has picked a choice.
  const reviewMode = STATE.completed.has(slide.id);
  const opts = slide.choices.map((ch, i) =>
    `<div class="quiz-option" data-i="${i}">${ch.text}</div>`
  ).join('');
  // Build a small "your pick / best choice" recap line for review mode
  let recap = '';
  if (reviewMode) {
    const pickIdx = STATE.scenarioPicks[slide.id];
    const bestIdx = slide.choices.findIndex(ch => ch.isBest);
    const pickedChoice = slide.choices[pickIdx];
    if (pickedChoice) {
      recap = pickedChoice.isBest
        ? `You picked the best response. ${pickedChoice.outcome}`
        : `Your earlier choice is shown in red; the best response is shown in green. ${slide.choices[bestIdx].outcome}`;
    }
  }
  c.innerHTML = `
    <div class="glass-strong w-full max-w-3xl rounded-3xl p-6 md:p-8">
      <div class="slide-eyebrow">
        <i class="fa-solid fa-comments"></i>
        Scenario${reviewMode ? ' · Review' : ''}
      </div>
      <h2 class="text-2xl md:text-3xl font-bold mb-4">${slide.title}</h2>
      <div class="text-white/85 mb-5 leading-relaxed rt-rendered">${renderRichTextOrPlain(slide.situation || '')}</div>
      <div id="scenario-opts">${opts}</div>
      ${reviewMode ? reviewBanner(recap) : ''}
    </div>`;

  if (reviewMode) {
    // Replay previous pick — disable all options, mark them.
    const pickIdx = STATE.scenarioPicks[slide.id];
    const bestIdx = slide.choices.findIndex(ch => ch.isBest);
    c.querySelectorAll('.quiz-option').forEach((opt, i) => {
      opt.classList.add('disabled');
      if (i === bestIdx) opt.classList.add('correct');
      if (i === pickIdx && i !== bestIdx) opt.classList.add('incorrect');
    });
    setNextEnabled(true);
    return;
  }

  c.querySelectorAll('.quiz-option').forEach(opt => {
    opt.onclick = () => {
      const i = +opt.dataset.i;
      const ch = slide.choices[i];
      c.querySelectorAll('.quiz-option').forEach(o => o.classList.add('disabled'));
      opt.classList.add(ch.isBest ? 'correct' : 'incorrect');
      trackResponse(slide, {
        response: { selected: i, isBest: ch.isBest },
        correct: ch.isBest,
        attempts: 1,
        score: ch.isBest ? 1 : 0,
        completed: true
      });
      if (ch.isBest) confetti({ particleCount: 50, spread: 60, origin: { y: 0.7 } });
      STATE.completed.add(slide.id);
      setNextEnabled(true);
      refreshSidebarState();
      showFeedbackModal({
        type: ch.isBest ? 'success' : 'info',
        title: ch.isBest ? 'Best choice' : 'Not the best choice',
        body: ch.outcome,
        primary: 'Continue'
      });
    };
  });
  setNextEnabled(false);
}
