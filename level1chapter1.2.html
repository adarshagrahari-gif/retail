      title: slidesById[r.slideId]?.title || slidesById[r.slideId]?.question || `Slide ${r.slideId}`,
      topic: slidesById[r.slideId]?.topic || 'General'
    }))
    .filter(s => s.idx >= 0);

  // Badge tier resolved from the learner's score. Author-defined tiers
  // live in COURSE_CONFIG.settings.badgeTiers; getBadgeTier() reads
  // that array first and falls back to the engine's hardcoded defaults
  // when missing. Returns null on a failed attempt so the badge UI
  // shows the encouragement message instead.
  const tier = passed ? getBadgeTier(score) : null;
  const alreadyIssued = isBadgeAlreadyIssued();
  const issuedRecord  = getIssuedBadgeRecord();

  // Build the section HTML
  let topicHTML = '';
  if (topicBreakdown.length > 0) {
    topicHTML = `
      <div class="results-section">
        <div class="results-section-heading">
          <i class="fa-solid fa-chart-simple"></i>
          <span>${escapeHtmlAttr(t.topicHeading)}</span>
        </div>
        ${topicBreakdown.map(td => {
          const cls = td.scorePct >= 80 ? 't-strong' : (td.scorePct >= 60 ? 't-mid' : 't-weak');
          const status = td.scorePct >= 80
            ? `<span style="color: var(--success);">Solid grasp.</span> ${td.slidesWrong.length === 0 ? 'No items missed in this topic.' : td.slidesWrong.length + ' item' + (td.slidesWrong.length === 1 ? '' : 's') + ' to brush up on.'}`
            : td.scorePct >= 60
              ? `Adequate, but room to grow. ${td.slidesWrong.length} item${td.slidesWrong.length === 1 ? '' : 's'} missed — worth revisiting.`
              : `<span class="weak">Needs more practice.</span> Focus your review here first.`;
          return `
            <div class="topic-row">
              <span class="topic-row-label">${escapeHtml(td.topic)}</span>
              <span class="topic-row-pct">${td.scorePct}%</span>
              <div class="topic-bar"><div class="topic-bar-fill ${cls}" style="width: ${td.scorePct}%"></div></div>
              <span class="topic-row-status ${td.scorePct < 60 ? 'weak' : ''}">${status}</span>
            </div>`;
        }).join('')}
      </div>`;
  }

  let reviewListHTML = '';
  if (wrongSlides.length > 0) {
    reviewListHTML = `
      <div class="results-section">
        <div class="results-section-heading">
          <i class="fa-solid fa-rotate-left"></i>
          <span>${escapeHtmlAttr(t.reviewHeading)} (${wrongSlides.length})</span>
        </div>
        <div class="review-list">
          ${wrongSlides.map(w => `
            <button class="review-list-item" data-jump-to="${w.idx}">
              <span class="review-list-item-icon"><i class="fa-solid fa-circle-xmark"></i></span>
              <span class="review-list-item-title">${escapeHtml(w.title)}</span>
              <span class="review-list-item-jump">Jump <i class="fa-solid fa-arrow-right"></i></span>
            </button>
          `).join('')}
        </div>
      </div>`;
  }

  let badgeHTML = '';
  if (passed && tier) {
    badgeHTML = `
      <div class="badge-tier-card">
        <div class="badge-tier-eyebrow">
          <i class="fa-solid fa-medal"></i>
          <span>${escapeHtmlAttr(t.badgeEyebrow)}</span>
        </div>
        <div class="badge-tier-name">${escapeHtml(tier.name)}</div>
        <div class="badge-tier-subtitle">${escapeHtml(tier.subtitle)}</div>

        ${alreadyIssued ? `
          <p style="color:var(--text-muted); font-size:0.95rem; margin-bottom:1rem;">
            ${escapeHtmlAttr(t.badgeIssuedNote)}${issuedRecord?.name ? ` for <strong>${escapeHtml(issuedRecord.name)}</strong>` : ''}.
          </p>
          <button class="btn-secondary" id="badge-redownload-btn">
            <i class="fa-solid fa-download" style="margin-right:0.4rem;"></i>${escapeHtmlAttr(t.badgeRedownload)}
          </button>
          <p class="badge-locked-note">Badges can only be created once per learner. To create a new one, ask your administrator to reset.</p>
        ` : `
          <div class="badge-name-row">
            <input type="text" class="badge-name-input" id="badge-name-input"
                   placeholder="${escapeHtmlAttr(t.badgeNamePrompt)}" maxlength="50" autocomplete="name">
            <button class="btn-primary" id="badge-create-btn">
              <i class="fa-solid fa-sparkles" style="margin-right:0.4rem;"></i>${escapeHtmlAttr(t.badgeCreateBtn)}
            </button>
          </div>
          <p class="badge-locked-note">${escapeHtmlAttr(t.badgeNameHint)}</p>
        `}

        <div class="badge-preview-wrap" id="badge-preview"></div>
      </div>`;
  } else if (passed) {
    badgeHTML = `<p style="color:var(--text-muted); margin-top:1.25rem; text-align:center;">Great work — you passed the module.</p>`;
  } else {
    badgeHTML = `
      <div style="margin-top:1.5rem; padding:1.1rem 1.25rem; background:var(--error-bg); border:1px solid var(--error); border-radius:12px; color:var(--error); font-weight:500;">
        <i class="fa-solid fa-circle-exclamation" style="margin-right:0.4rem;"></i>
        ${escapeHtmlAttr(t.failMessage)}
      </div>`;
  }

  // Certificate card (Phase B) — only when passed AND author enabled it
  // AND author actually uploaded a background image
  let certificateHTML = '';
  if (passed && t.showCertificate && slide.certificateImage && slide.certificateImage.imageData) {
    certificateHTML = `
      <div class="badge-tier-card" style="margin-top:1.5rem;">
        <div class="badge-tier-eyebrow">
          <i class="fa-solid fa-certificate"></i>
          <span>${escapeHtmlAttr(t.certificateEyebrow)}</span>
        </div>
        <div id="certificate-preview" style="margin-top:1rem;">
          <div style="text-align:center; padding:2rem; color:var(--text-muted); font-size:0.85rem;">
            ${alreadyIssued ? 'Loading certificate...' : escapeHtmlAttr(t.certificateLockedNote)}
          </div>
        </div>
        ${alreadyIssued ? `
          <div style="margin-top:1rem; text-align:center;">
            <button class="btn-primary" id="certificate-download-btn">
              <i class="fa-solid fa-download" style="margin-right:0.4rem;"></i>${escapeHtmlAttr(t.certificateBtnLabel)}
            </button>
          </div>
        ` : ''}
      </div>`;
  }

  // Action buttons (Review + Exit)
  const actionButtons = (t.showReviewBtn || t.showExitBtn) ? `
    <div style="margin-top:1.75rem; display:flex; gap:0.7rem; justify-content:center; flex-wrap:wrap;">
      ${t.showReviewBtn ? `
        <button class="btn-secondary" id="results-review-btn">
          <i class="fa-solid fa-rotate-left" style="margin-right:0.4rem;"></i>${escapeHtmlAttr(t.reviewBtnLabel)}
        </button>` : ''}
      ${t.showExitBtn ? `
        <button class="btn-secondary" id="results-exit-btn" style="border-color: var(--accent); color: var(--accent);">
          <i class="fa-solid fa-right-from-bracket" style="margin-right:0.4rem;"></i>${escapeHtmlAttr(t.exitBtnLabel)}
        </button>` : ''}
    </div>` : '';

  c.innerHTML = `
    <div class="glass-strong w-full max-w-3xl rounded-3xl p-6 md:p-10">
      <div class="slide-eyebrow" style="margin-left:auto; margin-right:auto;">
        <i class="fa-solid fa-trophy"></i>
        ${escapeHtmlAttr(t.eyebrow)}
      </div>
      <h2 class="text-3xl md:text-4xl font-bold mb-2 text-center">${escapeHtmlAttr(t.title)}</h2>
      <div class="text-sm mb-6 text-center" style="color:var(--text-muted);">
        <i class="fa-solid fa-bullseye" style="margin-right:0.4rem; color:var(--accent);"></i>
        ${escapeHtmlAttr(t.passMarkLabel)}: ${COURSE_CONFIG.settings.passingScore}%
      </div>
      <div class="results-grid" style="display:grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap:0.85rem; margin-bottom:1.25rem;">
        <div class="glass rounded-xl p-4" style="text-align:center;">
          <div class="stat-icon"><i class="fa-solid fa-percent"></i></div>
          <div class="text-3xl md:text-4xl font-bold" style="color:var(--accent)">${score}%</div>
          <div class="text-xs mt-1" style="color:var(--text-muted);">${escapeHtmlAttr(t.scoreLabel)}</div>
        </div>
        <div class="glass rounded-xl p-4" style="text-align:center;">
          <div class="stat-icon"><i class="fa-solid fa-check-double"></i></div>
          <div class="text-3xl md:text-4xl font-bold">${correctCount}/${total}</div>
          <div class="text-xs mt-1" style="color:var(--text-muted);">${escapeHtmlAttr(t.correctLabel)}</div>
        </div>
        <div class="glass rounded-xl p-4" style="text-align:center;">
          <div class="stat-icon"><i class="fa-regular fa-clock"></i></div>
          <div class="text-3xl md:text-4xl font-bold">${elapsedMin}m</div>
          <div class="text-xs mt-1" style="color:var(--text-muted);">${escapeHtmlAttr(t.timeLabel)}</div>
        </div>
      </div>
      <div class="text-2xl font-bold ${passed ? 'feedback-correct' : 'feedback-incorrect'} mb-4 text-center" style="display:flex; align-items:center; gap:0.6rem; justify-content:center;">
        <i class="fa-solid ${passed ? 'fa-trophy' : 'fa-circle-exclamation'}"></i>
        ${escapeHtmlAttr(passed ? t.passedHeading : t.failedHeading)}
      </div>

      ${topicHTML}
      ${reviewListHTML}
      ${badgeHTML}
      ${certificateHTML}
      ${actionButtons}
    </div>`;

  // Wire up review-list jump-to-slide buttons
  c.querySelectorAll('.review-list-item').forEach(btn => {
    btn.onclick = () => {
      const idx = +btn.dataset.jumpTo;
      if (!isNaN(idx)) { STATE.current = idx; renderSlide(); }
    };
  });

  // Wire Review Module button
  const reviewBtn = document.getElementById('results-review-btn');
  if (reviewBtn) {
    reviewBtn.onclick = () => { STATE.current = 0; renderSlide(); };
  }

  // Wire Exit Module button
  const exitBtn = document.getElementById('results-exit-btn');
  if (exitBtn) {
    exitBtn.onclick = () => exitModule(t);
  }

  // Wire up badge creation
  if (passed && tier) {
    const courseTitle = COURSE_CONFIG.settings.courseTitle;
    const fileName = `${tier.name.replace(/\s+/g, '_')}_Badge.png`;

    if (alreadyIssued) {
      const issuedName = issuedRecord?.name || 'Learner';
      const previewHTML = buildBadgePreviewHTML(slide, tier, issuedName, courseTitle, score);
      document.getElementById('badge-preview').innerHTML = previewHTML;
      // For custom badges, also show the learner's name in clean HTML beneath
      // (since the image itself doesn't have the name).
      const customBadge = getCustomBadgeForTier(slide, tier);
      if (customBadge) {
        document.getElementById('badge-preview').insertAdjacentHTML('beforeend', `
          <div style="text-align:center; margin-top:1rem;">
            <div style="font-size:1.1rem; font-weight:600; color:var(--accent-strong);">${escapeHtml(issuedName)}</div>
            <div style="font-size:0.85rem; color:var(--text-muted); margin-top:0.2rem;">${escapeHtml(courseTitle)} — ${score}%</div>
          </div>`);
      }
      const reBtn = document.getElementById('badge-redownload-btn');
      if (reBtn) reBtn.onclick = () => downloadBadge(slide, tier, issuedName, courseTitle, score, fileName);
    } else {
      const input = document.getElementById('badge-name-input');
      const btn   = document.getElementById('badge-create-btn');
      btn.onclick = () => {
        const name = (input.value || '').trim();
        if (!name) {
          showFeedbackModal({
            type: 'info',
            title: 'Enter your name',
            body: 'Type the name you\'d like printed on the badge before creating it.',
            primary: 'OK'
          });
          input.focus();
          return;
        }
        if (name.length < 2) {
          showFeedbackModal({
            type: 'info',
            title: 'Name looks too short',
            body: 'Please enter your full name as you\'d like it on the certificate.',
            primary: 'OK'
          });
          input.focus();
          return;
        }
        showFeedbackModal({
          type: 'info',
          title: 'Confirm your name',
          body: `<p>The badge will be created for:</p><p style="font-size:1.2rem; font-weight:700; color:var(--accent-strong); margin:0.5rem 0;">${escapeHtml(name)}</p><p style="color:var(--text-muted); font-size:0.9rem;">Badges can only be created once. After this, the create button will be disabled.</p>`,
          primary: 'Create Badge',
          secondary: 'Edit Name',
          onPrimary: () => {
            const previewHTML = buildBadgePreviewHTML(slide, tier, name, courseTitle, score);
            document.getElementById('badge-preview').innerHTML = previewHTML;
            // Show name beneath custom-image badges
            const customBadge = getCustomBadgeForTier(slide, tier);
            if (customBadge) {
              document.getElementById('badge-preview').insertAdjacentHTML('beforeend', `
                <div style="text-align:center; margin-top:1rem;">
                  <div style="font-size:1.1rem; font-weight:600; color:var(--accent-strong);">${escapeHtml(name)}</div>
                  <div style="font-size:0.85rem; color:var(--text-muted); margin-top:0.2rem;">${escapeHtml(courseTitle)} — ${score}%</div>
                </div>`);
            }
            markBadgeIssued(name);
            downloadBadge(slide, tier, name, courseTitle, score, fileName);
            confetti({ particleCount: 120, spread: 100, origin: { y: 0.6 } });
            setTimeout(() => renderSlide(), 800);
          }
        });
      };
      input.addEventListener('keydown', e => {
        if (e.key === 'Enter') btn.click();
      });
    }
  }

  // Wire up certificate (Phase B). Shown only when passed AND author
  // enabled it AND a background image is uploaded. The certificate uses
  // the SAME name the learner entered for the badge (single input,
  // two artifacts).
  if (passed && t.showCertificate && slide.certificateImage && slide.certificateImage.imageData) {
    const courseTitle = COURSE_CONFIG.settings.courseTitle;
    const certFileName = `Certificate_${(courseTitle || 'Course').replace(/\s+/g, '_')}.png`;
    if (alreadyIssued && issuedRecord?.name) {
      // Render the actual certificate with the learner's name
      injectCertificatePreview('certificate-preview', slide, issuedRecord.name, courseTitle, score);
      const certBtn = document.getElementById('certificate-download-btn');
      if (certBtn) {
        certBtn.onclick = () => {
          downloadCertificate(slide, issuedRecord.name, courseTitle, score, certFileName);
        };
      }
    }
    // When the badge hasn't been issued yet, the placeholder text from
    // the HTML (t.certificateLockedNote) stays visible; once they create
    // the badge, renderSlide() runs again and we land in the alreadyIssued
    // branch above.
  }

  STATE.completed.add(slide.id);
  STATE.freeRoam = true;
  setNextEnabled(false); // last slide
  document.getElementById('next-btn').style.visibility = 'hidden';
  xapiSend(passed ? 'passed' : 'failed', slide, { score });
  refreshSidebarState();

  // ============================================================
  // RESULTS CELEBRATION
  // ============================================================
  // For passing learners, run a layered confetti show + animate the
  // headline elements so the moment of completion feels rewarding.
  // The whole sequence is < 2 seconds; finalizeCourseSession() runs
  // 50ms in (in parallel) so LMS data is locked while the show plays.
  if (passed && !alreadyIssued) {
    runResultsCelebration(score);
  } else if (passed && alreadyIssued) {
    // Smaller welcome-back burst for learners who revisit Results
    confetti({ particleCount: 50, spread: 70, origin: { y: 0.6 } });
  }

  // CRITICAL: Finalize the LMS session as soon as Results renders, regardless
  // of whether the learner clicks Exit. Without this, learners who close the
  // browser tab from the Results screen may not have their score persisted —
  // SCORM Cloud (and many other LMSs) require Terminate() to finalize the
  // registration. By calling it here, the data is locked in the moment the
  // learner sees their score; clicking Exit afterward is just navigation.
  // Using setTimeout pushes this past the synchronous render so the score
  // and confetti animations run before any LMS round-trip latency.
  setTimeout(() => finalizeCourseSession(), 50);
}

/* ============================================================
   RESULTS CELEBRATION
   ============================================================
   A short, layered animation sequence that fires when a learner
   passes the course. Uses canvas-confetti (already loaded) for
   the particles + Animate.css (already loaded) for headline
   movement. Runs entirely off the main thread once kicked off,
   so it doesn't block LMS round-trips.

   Sequence:
     t=0ms     Big center burst (the same one we always had)
     t=200ms   Score-number pulse + headline bounce-in
     t=400ms   Left cannon (red/purple particles from the left edge)
     t=600ms   Right cannon (purple/gold particles from the right)
     t=900ms   Topic-row stagger fade-in
     t=1400ms  Final star-shower from top
   ============================================================ */
function runResultsCelebration(score) {
  // 1) Big center burst
  confetti({ particleCount: 150, spread: 100, origin: { y: 0.6 } });

  // 2) Score number pulse + headline bounce. We use Animate.css classes
  //    that are already part of the engine — no new CSS needed. The
  //    timeouts are gentle so reduced-motion users can still read.
  setTimeout(() => {
    const scoreEl = document.querySelector('.glass-strong [style*="color:var(--accent)"]');
    if (scoreEl && scoreEl.textContent && scoreEl.textContent.includes('%')) {
      scoreEl.classList.add('animate__animated', 'animate__pulse');
    }
    const headingEl = document.querySelector('.feedback-correct, .feedback-incorrect');
    if (headingEl) {
      headingEl.classList.add('animate__animated', 'animate__bounceIn');
    }
  }, 200);

  // 3 + 4) Side cannons — angled bursts from the bottom corners.
  //   Brand-palette colors so the effect feels on-theme rather than
  //   generic. Brand: #473391 / #6E55B8 / #9578E0 / #E6C4FF + gold accent.
  setTimeout(() => {
    confetti({
      particleCount: 80,
      angle: 60,
      spread: 55,
      origin: { x: 0, y: 0.8 },
      colors: ['#473391', '#6E55B8', '#9578E0', '#E6C4FF', '#FFD700']
    });
  }, 400);
  setTimeout(() => {
    confetti({
      particleCount: 80,
      angle: 120,
      spread: 55,
      origin: { x: 1, y: 0.8 },
      colors: ['#473391', '#6E55B8', '#9578E0', '#E6C4FF', '#FFD700']
    });
  }, 600);

  // 5) Stagger the topic-breakdown rows in. Each row gets a tiny
  //    fade-up so the whole "where you're strong / where you're lagging"
  //    list animates into existence rather than appearing all at once.
  setTimeout(() => {
    const rows = document.querySelectorAll('.topic-row');
    rows.forEach((row, i) => {
      row.style.opacity = '0';
      row.style.transform = 'translateY(8px)';
      row.style.transition = 'opacity 0.4s ease, transform 0.4s ease';
      setTimeout(() => {
        row.style.opacity = '1';
        row.style.transform = 'translateY(0)';
      }, i * 90);
    });
  }, 900);

  // 6) Final star-shower from the top — only for high scores (90%+) so
  //    learners who barely pass get a regular celebration but top
  //    performers get extra spectacle.
  if (score >= 90) {
    setTimeout(() => {
      confetti({
        particleCount: 100,
        spread: 160,
        origin: { y: 0 },
        startVelocity: 35,
        gravity: 0.7,
        ticks: 200,
        shapes: ['star', 'circle'],
        colors: ['#FFD700', '#E6C4FF', '#9578E0']
      });
    }, 1400);
  }
}

/* ============================================================
   FINALIZE COURSE SESSION
   ============================================================
   Called the moment we have the learner's final score — i.e. on
   Results-slide render, or at end of a no-Results course via
   autoFireCourseCompletion. Locks in the LMS session so the data
   persists even if the learner closes the tab without explicitly
   clicking Exit.

   What this does:
     1. SCORM:  set cmi.exit='normal', Commit, Terminate
     2. xAPI:   flush the in-memory queue (already non-blocking)
     3. Mark   STATE._sessionFinalized so we don't double-call

   Once called, further SCORM SetValue calls become no-ops (the
   API is terminated), so any "Review Module" navigation after
   this point won't write more data — which is correct: the
   official record is now locked.
   ============================================================ */
function finalizeCourseSession() {
  if (STATE._sessionFinalized) return;   // idempotent — safe to call repeatedly
  STATE._sessionFinalized = true;

  // cmi5: emit the required `terminated` statement. Must be done BEFORE
  // SCORM Terminate so the LMS sees both signals (cmi5 terminated via
  // xAPI, SCORM Terminate via the API). The statement gets queued and
  // sent via sendBeacon if document is unloading.
  if (typeof cmi5SendTerminated === 'function' && cmi5LaunchActive) {
    try {
      const startedAt = (STATE && STATE.startedAt) || Date.now();
      const durationSec = Math.max(0, (Date.now() - startedAt) / 1000);
      cmi5SendTerminated(durationSec);
    } catch (e) {
      console.warn('[cmi5] terminated statement failed:', e);
    }
  }

  // SCORM: tell the LMS the session ended normally and finalize.
  // Field names differ: 2004 uses cmi.exit, 1.2 uses cmi.core.exit.
  // This is what triggers the LMS to mark the registration as complete
  // and persist all the cmi.* values that were SetValue'd earlier.
  if (typeof scormApi !== 'undefined' && scormApi) {
    try {
      if (scormIsVersion12()) {
        scormSetValue('cmi.core.exit', '');     // 1.2: blank or "logout"/"time-out"/"suspend"
      } else {
        scormSetValue('cmi.exit', 'normal');
      }
      scormCommit();
      if (typeof scormApi.Terminate === 'function') {
        scormApi.Terminate('');
      } else if (typeof scormApi.LMSFinish === 'function') {
        scormApi.LMSFinish('');   // SCORM 1.2 fallback
      }
      console.info('[SCORM] Session finalized.');
      // Defensive: null out the API so any later SetValue calls become no-ops
      // (the LMS would reject them post-Terminate anyway, but this avoids
      // console noise from the rejection).
      scormApi = null;
    } catch (e) {
      console.warn('[SCORM] Terminate failed:', e);
    }
  }

  // xAPI: flush the queue. Each statement is already a fire-and-forget
  // POST with retry; the queue drains in the background. We just nudge it
  // to make sure no statements are sitting idle when this runs.
  if (typeof flushXapiLmsQueue === 'function') {
    try { flushXapiLmsQueue(); } catch (e) {}
  }
  if (typeof flushLrsQueue === 'function') {
    try { flushLrsQueue(); } catch (e) {}
  }
}

/* ============================================================
   EXIT MODULE
   ============================================================
   Called from the Exit button on the Results slide. Tries to:
     1. Commit final SCORM/xAPI completion signals
     2. If exitUrl is configured, navigate to it
     3. Otherwise, try window.close() — works for windows opened
        via JavaScript (typical for LMS launches in popup mode)
     4. If close() fails (the window wasn't script-opened), show
        a friendly "you may now close this tab" overlay
   ============================================================ */
function exitModule(t) {
  // Finalize the LMS session if it hasn't been already. In practice
  // renderResults already called this, so this is just a safety net.
  finalizeCourseSession();

  // If author configured an exit URL, redirect there
  if (t.exitUrl) {
    window.location.href = t.exitUrl;
    return;
  }

  // Try to close the window. Browsers only allow this for windows opened
  // via window.open() with no opener (typical LMS launch pattern).
  try {
    window.close();
    // window.close() returns synchronously but the window may stay open
    // if the browser blocked it. We can't reliably detect this — wait
    // a tick and check if the document is still rendering.
    setTimeout(() => {
      if (!document.hidden) showExitOverlay(t);
    }, 250);
  } catch (e) {
    showExitOverlay(t);
  }
}

function showExitOverlay(t) {
  // Soft exit — show a friendly modal-style overlay confirming the learner
  // has finished and instructing them to close the tab themselves.
  const overlay = document.createElement('div');
  overlay.id = 'exit-overlay';
  overlay.style.cssText = `
    position:fixed; inset:0; z-index:10000;
    background:rgba(20, 18, 38, 0.92);
    backdrop-filter:blur(6px);
    display:flex; align-items:center; justify-content:center;
    padding:1rem; color:white;
    font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
  `;
  overlay.innerHTML = `
    <div style="max-width:480px; text-align:center; padding:2.5rem 2rem; background:rgba(255,255,255,0.06); border:1px solid rgba(255,255,255,0.12); border-radius:1rem;">
      <div style="width:64px; height:64px; margin:0 auto 1rem; background:rgba(31,155,94,0.2); border-radius:50%; display:flex; align-items:center; justify-content:center;">
        <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#1f9b5e" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="20 6 9 17 4 12"/>
        </svg>
      </div>
      <h2 style="margin:0 0 0.6rem; font-size:1.4rem; font-weight:700;">${escapeHtmlAttr(t.exitConfirmTitle)}</h2>
      <p style="margin:0 0 1.5rem; opacity:0.85; line-height:1.5;">${escapeHtmlAttr(t.exitConfirmBody)}</p>
      <button id="exit-overlay-back" style="background:transparent; border:1px solid rgba(255,255,255,0.3); color:white; padding:0.6rem 1.4rem; border-radius:8px; cursor:pointer; font-weight:600;">
        Back to module
      </button>
    </div>
  `;
  document.body.appendChild(overlay);
  document.getElementById('exit-overlay-back').onclick = () => overlay.remove();
}

/* ============================================================ */
/* ============================================================ */
/*                       xAPI WRAPPER                            */
/* ============================================================
   Standard xAPI launch parameters from the LMS are parsed from
   the URL: endpoint, auth, actor, activity_id, registration.
   When a user launches an xAPI package from an LMS, the LMS
   appends these to the launch URL. We honor the LMS's
   activity_id (so the same course tracked across launches
   aggregates correctly in the LRS) and the registration UUID
   (so attempts are distinguishable).

   POSTING: We POST statements directly to {endpoint}/statements
   via fetch(). We used to wrap this in TinCan-js but its
   constructor was too brittle (silent errors during init that
   left tracking permanently disabled). Direct fetch is simpler,
   fully transparent, and removes a 119 KB dependency.
   ============================================================ */
let actor = { name: 'Learner', mbox: 'mailto:learner@example.com' };
let xapiActivityId = null;     // The course-level activity ID (set by LMS or fallback)
let xapiRegistration = null;   // Unique UUID for this learner-attempt
let xapiLmsEndpoint = null;    // POST target for LMS-provided LRS
let xapiLmsAuth = null;        // Authorization header for LMS-provided LRS
let xapiLmsQueue = [];         // outbound queue + retry on transient failure
let xapiLmsBusy = false;

function initXAPI() {
  // Parse launch params (these are sent by xAPI-aware LMSes — SCORM Cloud,
  // LearnUpon, Watershed, etc — when they launch content via tincan.xml).
  const params = new URLSearchParams(window.location.search);
  const endpointParam = params.get('endpoint') || COURSE_CONFIG.settings.xapiEndpoint;
  let auth = params.get('auth') || COURSE_CONFIG.settings.xapiAuth || '';
  // The LMS sometimes URL-encodes auth twice; decode once if it looks encoded
  if (auth && auth.indexOf('%') >= 0) {
    try { auth = decodeURIComponent(auth); } catch(e) {}
  }
  // Some LMSs pass username:password without the 'Basic ' prefix; auto-add it
  if (auth && !/^Basic\s|^Bearer\s/i.test(auth) && auth.indexOf(':') > 0) {
    auth = 'Basic ' + (typeof btoa === 'function' ? btoa(auth) : auth);
  }
  const actorParam = params.get('actor');
  if (actorParam) {
    try {
      const parsed = JSON.parse(decodeURIComponent(actorParam));
      // Some LMSs (SCORM Cloud included) wrap "name" and "account" in arrays
      // even though xAPI 1.0.3 expects a string for name and a single object
      // for account. Normalize so our outbound statements are spec-clean.
      if (Array.isArray(parsed.name)) parsed.name = parsed.name[0];
      if (Array.isArray(parsed.account) && parsed.account.length) parsed.account = parsed.account[0];
      actor = parsed;
    } catch(e) {
      console.warn('[xAPI] Could not parse actor param:', e.message);
    }
  }
  // The LMS sets activity_id; this is what tincan.xml's <activity id> declared.
  xapiActivityId = params.get('activity_id') ||
                   COURSE_CONFIG.settings.xapiActivityId ||
                   `urn:elearning-engine:${(COURSE_CONFIG.settings.courseTitle || 'course').toLowerCase().replace(/[^a-z0-9]+/g, '-')}`;
  xapiRegistration = params.get('registration') || null;

  if (!endpointParam) {
    console.info('[xAPI] No LMS endpoint provided — xAPI to LMS disabled.');
    return;
  }
  // Normalize endpoint to end with a single slash
  xapiLmsEndpoint = endpointParam.replace(/\/?$/, '/');
  xapiLmsAuth = auth;

  // cmi5 launch detection. If the launch URL has a `fetch` param, this is
  // a cmi5 launch — we POST (no body) to the fetch URL to retrieve a one-
  // time auth token, then use that token for all subsequent xAPI traffic.
  // The cmi5 spec requires this handshake before any statement is sent.
  const fetchUrl = params.get('fetch');
  if (fetchUrl) {
    cmi5LaunchActive = true;
    cmi5FetchUrl     = fetchUrl;
    // The handshake is async; we set xapiReady=false until it completes so
    // the engine queues statements rather than dropping them. cmi5LaunchInit
    // does the fetch, sets xapiLmsAuth from the response, then flushes the
    // queue and emits the required `initialized` statement.
    cmi5LaunchInit();
  }

  console.info('[xAPI] LMS tracking ready. Endpoint:', xapiLmsEndpoint,
               'Activity:', xapiActivityId, 'Registration:', xapiRegistration,
               cmi5LaunchActive ? '(cmi5 mode)' : '(xAPI mode)');
}

/* cmi5 launch state. cmi5LaunchActive flips true when the URL has a
   `fetch` param, telling the engine to use the cmi5 statement vocabulary
   (launched/initialized/passed/failed/completed/terminated) and to do
   the auth handshake before sending anything. */
let cmi5LaunchActive  = false;
let cmi5FetchUrl      = null;
let cmi5HandshakeDone = false;
let cmi5SessionId     = null;
let cmi5InitialState  = null;

/* Do the cmi5 auth handshake. Per spec: POST to the fetch URL with no
   body. Response is JSON: {"auth-token": "...", "expires": ...}. We
   extract the token, build a Bearer header from it, and use that as
   xapiLmsAuth for all future LMS xAPI traffic.

   On failure (network error, malformed response, expired token), we
   fall back to whatever auth was on the URL (if any). The runtime
   logs the error but doesn't block course startup — a learner with
   a broken handshake can still complete the course; tracking just
   doesn't reach the LRS. This is consistent with how the existing
   SCORM/xAPI paths handle a misconfigured LMS. */
async function cmi5LaunchInit() {
  if (!cmi5FetchUrl) return;
  try {
    const resp = await fetch(cmi5FetchUrl, { method: 'POST' });
    if (!resp.ok) {
      console.warn('[cmi5] fetch handshake returned', resp.status, resp.statusText);
      return;
    }
    const data = await resp.json();
    const token = data['auth-token'] || data.authToken || data.token;
    if (!token) {
      console.warn('[cmi5] handshake response missing auth-token');
      return;
    }
    xapiLmsAuth = 'Basic ' + token;     // cmi5 uses "Basic <token>" per spec
    cmi5HandshakeDone = true;
    cmi5SessionId = generateUuid();
    console.info('[cmi5] handshake OK. Session:', cmi5SessionId);

    // Try to load any saved state for this learner+activity (resume support).
    // The xAPI State API is the cmi5 equivalent of SCORM's suspend_data.
    cmi5InitialState = await cmi5GetState();
    if (cmi5InitialState) {
      console.info('[cmi5] restored state for resume');
    }

    // Send the required cmi5 `initialized` statement. This MUST be the
    // first statement emitted in a cmi5 session; the LMS rejects any
    // other statement before it.
    cmi5SendInitialized();
  } catch (e) {
    console.warn('[cmi5] handshake failed:', e.message);
  }
}

/* Build a cmi5-compliant statement. cmi5 requires every statement to
   include a context.contextActivities.category entry pointing to the
   cmi5 profile (or cmi5/moveon for outcome statements), plus a
   context.registration matching the launch param.

   `verbId` is the full verb IRI; for cmi5-specific verbs we use the
   ones the spec defines. For interaction-level statements (answered,
   experienced) we keep the existing xAPI verbs the engine already uses. */
function cmi5BuildContext(category) {
  const ctx = {};
  if (xapiRegistration) ctx.registration = xapiRegistration;
  ctx.contextActivities = {
    category: [
      { id: category || 'https://w3id.org/xapi/cmi5/context/categories/cmi5' }
    ]
  };
  if (cmi5SessionId) {
    ctx.extensions = ctx.extensions || {};
    ctx.extensions['https://w3id.org/xapi/cmi5/context/extensions/sessionid'] = cmi5SessionId;
  }
  return ctx;
}

/* Required cmi5 statement: initialized. Emitted once at launch after
   the handshake completes. Verb IRI: http://adlnet.gov/expapi/verbs/initialized. */
function cmi5SendInitialized() {
  if (!cmi5LaunchActive) return;
  xapiPostToLms({
    actor,
    verb: { id: 'http://adlnet.gov/expapi/verbs/initialized', display: { 'en-US': 'initialized' } },
    object: { id: xapiActivityId, definition: { type: 'http://adlnet.gov/expapi/activities/lesson' } },
    context: cmi5BuildContext()
  });
}

/* Required cmi5 statement: terminated. Emitted when the session ends
   (browser unload, exit button, etc). MUST be the last statement.
   The xapiLmsQueue's existing flush logic handles unload-time delivery
   via sendBeacon when document.visibilityState is hidden. */
function cmi5SendTerminated(durationSeconds) {
  if (!cmi5LaunchActive) return;
  xapiPostToLms({
    actor,
    verb: { id: 'http://adlnet.gov/expapi/verbs/terminated', display: { 'en-US': 'terminated' } },
    object: { id: xapiActivityId, definition: { type: 'http://adlnet.gov/expapi/activities/lesson' } },
    result: { duration: cmi5FormatDuration(durationSeconds || 0) },
    context: cmi5BuildContext()
  });
}

/* Enrich a regular xAPI statement with cmi5 context. Called from
   xapiPostToLms() right before the POST when cmi5 is active.
   - Adds the cmi5 category contextActivity (the "this is a cmi5
     statement" marker the LMS uses to filter)
   - For passed/failed/completed (the cmi5 outcome verbs), upgrades
     the category to cmi5/moveon so the LMS knows it's the final
     outcome statement
   - Adds registration if missing (some LMSs require it on every
     statement, not just the lifecycle ones)
   - Adds the cmi5 sessionid extension
   - Ensures result.duration is in ISO 8601 format (not a number)

   The function MUTATES the passed statement in place — caller is
   expected to clone if it cares about not mutating. We do mutate
   in place because xapiPostToLms always queues a freshly-built
   statement that has no other consumer. */
function cmi5DecorateStatement(stmt) {
  if (!cmi5LaunchActive) return stmt;
  if (!stmt) return stmt;
  if (!stmt.context) stmt.context = {};
  // Registration (cmi5 requires this on every statement when launched
  // with one)
  if (xapiRegistration && !stmt.context.registration) {
    stmt.context.registration = xapiRegistration;
  }
  // Category contextActivity. Pick the moveon category for outcome verbs;
  // otherwise the regular cmi5 category.
  const verbId = (stmt.verb && stmt.verb.id) || '';
  const isMoveon = /\/(passed|failed|completed)$/i.test(verbId);
  const categoryId = isMoveon
    ? 'https://w3id.org/xapi/cmi5/context/categories/moveon'
    : 'https://w3id.org/xapi/cmi5/context/categories/cmi5';
  if (!stmt.context.contextActivities) stmt.context.contextActivities = {};
  if (!Array.isArray(stmt.context.contextActivities.category)) {
    stmt.context.contextActivities.category = [];
  }
  // Only add if not already present (idempotent — defensive against
  // double-decoration)
  const has = stmt.context.contextActivities.category.some(c => c && c.id === categoryId);
  if (!has) stmt.context.contextActivities.category.push({ id: categoryId });
  // Session id extension
  if (cmi5SessionId) {
    if (!stmt.context.extensions) stmt.context.extensions = {};
    if (!stmt.context.extensions['https://w3id.org/xapi/cmi5/context/extensions/sessionid']) {
      stmt.context.extensions['https://w3id.org/xapi/cmi5/context/extensions/sessionid'] = cmi5SessionId;
    }
  }
  // Duration: cmi5 requires ISO 8601 (PT...). If a numeric duration
  // somehow slipped in, format it. Most existing engine paths don't
  // set duration at all, so this is mostly a safety net.
  if (stmt.result && typeof stmt.result.duration === 'number') {
    stmt.result.duration = cmi5FormatDuration(stmt.result.duration);
  }
  return stmt;
}

/* Format a duration in seconds as ISO 8601 (PT1H23M45S). cmi5 spec
   requires this format — plain seconds-as-number is not accepted. */
function cmi5FormatDuration(seconds) {
  seconds = Math.max(0, Math.round(+seconds || 0));
  const h = Math.floor(seconds / 3600);
  const m = Math.floor((seconds % 3600) / 60);
  const s = seconds % 60;
  let out = 'PT';
  if (h) out += h + 'H';
  if (m) out += m + 'M';
  if (s || (!h && !m)) out += s + 'S';
  return out;
}

/* xAPI State API: the cmi5 equivalent of SCORM suspend_data + cmi.location.
   We persist a small JSON blob (currentSlideIndex, completed slide IDs,
   responses) keyed by activityId+agent. The LRS holds it; on next
   launch we GET it and rehydrate the engine state.

   Storage key follows the same convention as the SCORM bookmark:
   "elearning_state_v1". cmi5 mode uses the LRS instead of localStorage. */
async function cmi5PutState(stateObj) {
  if (!cmi5LaunchActive || !xapiLmsEndpoint || !xapiLmsAuth) return;
  try {
    const url = xapiLmsEndpoint + 'activities/state' +
                '?activityId=' + encodeURIComponent(xapiActivityId) +
                '&agent=' + encodeURIComponent(JSON.stringify(actor)) +
                (xapiRegistration ? '&registration=' + encodeURIComponent(xapiRegistration) : '') +
                '&stateId=elearning_state_v1';
    await fetch(url, {
      method: 'PUT',
      headers: {
        'Content-Type':       'application/json',
        'Authorization':      xapiLmsAuth,
        'X-Experience-API-Version': '1.0.3'
      },
      body: JSON.stringify(stateObj)
    });
  } catch (e) {
    console.warn('[cmi5] state PUT failed:', e.message);
  }
}

async function cmi5GetState() {
  if (!cmi5LaunchActive || !xapiLmsEndpoint || !xapiLmsAuth) return null;
  try {
    const url = xapiLmsEndpoint + 'activities/state' +
                '?activityId=' + encodeURIComponent(xapiActivityId) +
                '&agent=' + encodeURIComponent(JSON.stringify(actor)) +
                (xapiRegistration ? '&registration=' + encodeURIComponent(xapiRegistration) : '') +
                '&stateId=elearning_state_v1';
    const resp = await fetch(url, {
      method: 'GET',
      headers: {
        'Authorization':      xapiLmsAuth,
        'X-Experience-API-Version': '1.0.3'
      }
    });
    if (resp.status === 404) return null;   // no state stored yet (first launch)
    if (!resp.ok) {
      console.warn('[cmi5] state GET returned', resp.status);
      return null;
    }
    return await resp.json();
  } catch (e) {
    console.warn('[cmi5] state GET failed:', e.message);
    return null;
  }
}

/* UUID v4 generator for cmi5 session IDs. Crypto.randomUUID where
   available, fallback to a Math.random version. Both produce valid
   v4 UUIDs (version=4, variant=10). */
function generateUuid() {
  if (typeof crypto !== 'undefined' && crypto.randomUUID) return crypto.randomUUID();
  return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, ch => {
    const r = Math.random() * 16 | 0;
    const v = ch === 'x' ? r : (r & 0x3 | 0x8);
    return v.toString(16);
  });
}

/* POST a statement to the LMS-provided LRS. Queued + retried on transient
   network errors so an offline blip doesn't drop a "passed" event. */
function xapiPostToLms(statement) {
  if (!xapiLmsEndpoint) return;
  if (!statement.actor) statement.actor = actor;
  if (!statement.timestamp) statement.timestamp = new Date().toISOString();
  // If we're in cmi5 mode, decorate the statement with the cmi5 context
  // (category contextActivities, registration, sessionid extension).
  // Non-cmi5 launches leave the statement untouched.
  if (cmi5LaunchActive) cmi5DecorateStatement(statement);
  xapiLmsQueue.push(statement);
  flushXapiLmsQueue();
}

function flushXapiLmsQueue() {
  if (xapiLmsBusy) return;
  if (!xapiLmsQueue.length) return;
  xapiLmsBusy = true;
  const stmt = xapiLmsQueue.shift();
  const url = xapiLmsEndpoint + 'statements';
  fetch(url, {
    method: 'POST',
    headers: {
      'Content-Type': 'application/json',
      'Authorization': xapiLmsAuth,
      'X-Experience-API-Version': '1.0.3'
    },
    body: JSON.stringify(stmt),
    // keepalive lets the request complete even after the page is unloaded.
    // This is essential for the final 'passed'/'failed' statement when the
    // learner closes the tab right after seeing their Results.
    keepalive: true
  }).then(r => {
    if (!r.ok) {
      // 4xx errors are usually a malformed statement — log and drop, don't retry
      // 5xx and network errors get re-queued
      if (r.status >= 500) {
        console.warn('[xAPI] LRS', r.status, '- re-queueing');
        xapiLmsQueue.unshift(stmt);
        setTimeout(() => { xapiLmsBusy = false; flushXapiLmsQueue(); }, 5000);
        return;
      } else {
        // Try to get the error body for diagnosis
        return r.text().then(body => {
          console.warn('[xAPI] LRS rejected statement:', r.status, body.substring(0, 300));
        }).catch(() => console.warn('[xAPI] LRS rejected:', r.status));
      }
    }
  }).catch(e => {
    console.warn('[xAPI] Network error - re-queueing:', e.message);
    xapiLmsQueue.unshift(stmt);
    setTimeout(() => { xapiLmsBusy = false; flushXapiLmsQueue(); }, 5000);
    return;
  }).finally(() => {
    xapiLmsBusy = false;
    if (xapiLmsQueue.length) setTimeout(flushXapiLmsQueue, 100);
  });
}

function xapiSend(verbId, slide, extra) {
  // Build the statement; we always need it for at least one backend.
  const verbs = {
    experienced: { id: "http://adlnet.gov/expapi/verbs/experienced", display: { "en-US": "experienced" } },
    completed:   { id: "http://adlnet.gov/expapi/verbs/completed",   display: { "en-US": "completed" } },
    answered:    { id: "http://adlnet.gov/expapi/verbs/answered",    display: { "en-US": "answered" } },
    passed:      { id: "http://adlnet.gov/expapi/verbs/passed",      display: { "en-US": "passed" } },
    failed:      { id: "http://adlnet.gov/expapi/verbs/failed",      display: { "en-US": "failed" } }
  };
  // For course-level statements (passed/failed of the whole course),
  // use the LMS-provided activity_id directly. For per-slide statements, append
  // the slide ID to make a sub-activity ID.
  const isCourseLevel = (verbId === 'passed' || verbId === 'failed') && (slide.type === 'results');
  const objectId = isCourseLevel ? xapiActivityId : `${xapiActivityId}/${slide.id}`;
  const stmt = {
    actor,
    verb: verbs[verbId],
    object: {
      id: objectId,
      definition: {
        name: { "en-US": slide.title || slide.question || slide.type },
        type: isCourseLevel
          ? "http://adlnet.gov/expapi/activities/course"
          : "http://adlnet.gov/expapi/activities/cmi.interaction"
      }
    },
    timestamp: new Date().toISOString()
  };
  if (xapiRegistration) {
    stmt.context = { registration: xapiRegistration };
  }
  if (extra && extra.score !== undefined) {
    stmt.result = {
      score: { scaled: extra.score / 100, raw: extra.score, min: 0, max: 100 },
      success: extra.score >= COURSE_CONFIG.settings.passingScore,
      completion: true
    };
  }
  // Fan out to all enabled tracking backends.
  // 1. LMS-provided LRS (xAPI launch — POST direct via fetch)
  xapiPostToLms(stmt);
  // 2. Third-party LRS
  sendToThirdPartyLRS(stmt);
  // 3. SCORM — only for course-level passed/failed and completion events
  if (isCourseLevel && extra && extra.score !== undefined) {
    scormReportFinalScore(extra.score, extra.score >= COURSE_CONFIG.settings.passingScore);
  } else if (verbId === 'completed' && slide.type === 'results') {
    // Completion without score (rare — but support it). Field name varies:
    //   2004: cmi.completion_status = 'completed'
    //   1.2:  cmi.core.lesson_status = 'completed'
    if (scormApi) {
      if (scormIsVersion12()) {
        scormSetValue('cmi.core.lesson_status', 'completed');
      } else {
        scormSetValue('cmi.completion_status', 'completed');
      }
      scormCommit();
    }
  }
}

function xapiAnswered(slide, response, correct) {
  // Public API. Fans out to all enabled tracking backends:
  //   1. xAPI to LMS-provided LRS (initXAPI captures endpoint+auth from launch URL)
  //   2. xAPI to third-party LRS (if lrsEndpoint is configured in settings)
  //   3. SCORM 2004 (if a SCORM LMS API was discovered at launch)
  const stmt = buildAnsweredStatement(slide, response, correct);
  // 1. LMS-provided LRS
  xapiPostToLms(stmt);
  // 2. Third-party LRS — always, when configured, regardless of LMS
  sendToThirdPartyLRS(stmt);
  // 3. SCORM interaction reporting
  scormReportInteraction(slide, response, correct);
}

/* ============================================================ */
/*    INTERACTION DATA ADAPTERS — xAPI/cmi5/SCORM 2004/1.2       */
/* ============================================================ */
/*
  buildInteractionData() is the single source of truth for translating
  the engine's native response shapes into the strings, arrays, and
  patterns required by xAPI, cmi5, SCORM 2004, and SCORM 1.2. All four
  output formats are derived from the same per-type adapter, so a change
  to one activity type's reporting only happens in one place.

  Returns null for slides whose interactions are not scoreable in the
  spec sense (Tabs, Accordion, etc. don't pass through here anyway).

  Returned shape:
    {
      interactionType:        "matching"|"choice"|"sequencing"|"fill-in"|
                              "true-false"|"numeric"|"performance"|"other"
      // xAPI / cmi5 / SCORM 2004 formats
      responsePattern:        the learner response as a spec-format string
      correctResponsePattern: the expected/correct answer in spec format
      // SCORM 1.2 — uses periods + commas instead of bracket pairs
      scorm12ResponsePattern: same data, SCORM 1.2 format
      scorm12CorrectPattern:  expected answer in SCORM 1.2 format
      // xAPI definition.* enrichment
      choices:                [{id, description: {"en-US": "..."}}, ...]   for choice/sequencing
      source:                 [...]   for matching: the "from" side
      target:                 [...]   for matching: the "to" side
      // Per-spec definition.* properties (xAPI)
      minMaxScale:            {min, max}   for numeric
      // Backup — always set so the JSON blob survives in xAPI extensions
      rawResponse:            the original response object (JSON-serializable)
    }

  For activity types we don't have spec mappings for, returns:
    { interactionType: "other", rawResponse: response, responsePattern: JSON.stringify(response) }
*/
function buildInteractionData(slide, response) {
  const native = { rawResponse: response };

  switch (slide.type) {
    // ---------- CHOICE FAMILY (xAPI "choice") ----------
    case 'quiz':
    case 'timed-quiz': {
      // response: { selected: i }   or   { selected: null, timedOut: true } for timed
      const opts = Array.isArray(slide.options) ? slide.options : [];
      const selectedIdx = (response && response.selected != null) ? response.selected : null;
      return Object.assign(native, {
        interactionType:        'choice',
        choices:                opts.map((o, i) => ({
          id: 'option_' + i,
          description: { 'en-US': xapiTruncate(typeof o === 'string' ? o : (o.text || o.label || String(i))) }
        })),
        responsePattern:        selectedIdx == null ? '' : ('option_' + selectedIdx),
        correctResponsePattern: 'option_' + (slide.correctAnswer != null ? slide.correctAnswer : 0),
        scorm12ResponsePattern: selectedIdx == null ? '' : ('option_' + selectedIdx),
        scorm12CorrectPattern:  'option_' + (slide.correctAnswer != null ? slide.correctAnswer : 0)
      });
    }

    case 'true-false': {
      // response: { picked: true|false }
      const picked = (response && response.picked != null) ? !!response.picked : null;
      return Object.assign(native, {
        interactionType:        'true-false',
        responsePattern:        picked == null ? '' : (picked ? 'true' : 'false'),
        correctResponsePattern: slide.correctAnswer ? 'true' : 'false',
        scorm12ResponsePattern: picked == null ? '' : (picked ? 't' : 'f'),
        scorm12CorrectPattern:  slide.correctAnswer ? 't' : 'f'
      });
    }

    case 'multi-response': {
      // response: { selected: [1, 3, 4] }  — array of selected indices
      const opts = Array.isArray(slide.options) ? slide.options : [];
      const selected = (response && Array.isArray(response.selected)) ? response.selected : [];
      const correct = Array.isArray(slide.correctAnswers) ? slide.correctAnswers : [];
      // xAPI "choice" with multiple selected uses "[,]" separator between picks
      return Object.assign(native, {
        interactionType:        'choice',
        choices:                opts.map((o, i) => ({
          id: 'option_' + i,
          description: { 'en-US': xapiTruncate(typeof o === 'string' ? o : (o.text || o.label || String(i))) }
        })),
        responsePattern:        selected.map(i => 'option_' + i).join('[,]'),
        correctResponsePattern: correct.map(i => 'option_' + i).join('[,]'),
        scorm12ResponsePattern: selected.map(i => 'option_' + i).join(','),
        scorm12CorrectPattern:  correct.map(i => 'option_' + i).join(',')
      });
    }

    case 'scenario': {
      // response: { selected: i, isBest: bool }   — branch chosen by learner
      const choices = Array.isArray(slide.choices) ? slide.choices : [];
      const selectedIdx = (response && response.selected != null) ? response.selected : null;
      const correctIdx = choices.findIndex(c => c && c.isBest);
      return Object.assign(native, {
        interactionType:        'choice',
        choices:                choices.map((c, i) => ({
          id: 'choice_' + i,
          description: { 'en-US': xapiTruncate((c && (c.text || c.label)) || String(i)) }
        })),
        responsePattern:        selectedIdx == null ? '' : ('choice_' + selectedIdx),
        correctResponsePattern: correctIdx < 0 ? '' : ('choice_' + correctIdx),
        scorm12ResponsePattern: selectedIdx == null ? '' : ('choice_' + selectedIdx),
        scorm12CorrectPattern:  correctIdx < 0 ? '' : ('choice_' + correctIdx)
      });
    }

    case 'confidence': {
      // response: { selected: pickedIdx, confidence: conf }
      const opts = Array.isArray(slide.options) ? slide.options : [];
      const selectedIdx = (response && response.selected != null) ? response.selected : null;
      const conf = response && response.confidence != null ? response.confidence : null;
      // Use the answer + confidence concatenated. Confidence is part of the
      // response data but xAPI's choice doesn't have a confidence dimension —
      // stash it as a separate field in result for visibility, and include
      // both in the response pattern so the LMS dashboard can show both.
      return Object.assign(native, {
        interactionType:        'choice',
        choices:                opts.map((o, i) => ({
          id: 'option_' + i,
          description: { 'en-US': xapiTruncate(typeof o === 'string' ? o : (o.text || String(i))) }
        })),
        responsePattern:        selectedIdx == null ? '' :
                                ('option_' + selectedIdx + (conf != null ? ' (confidence=' + conf + ')' : '')),
        correctResponsePattern: 'option_' + (slide.correctAnswer != null ? slide.correctAnswer : 0),
        scorm12ResponsePattern: selectedIdx == null ? '' : ('option_' + selectedIdx),
        scorm12CorrectPattern:  'option_' + (slide.correctAnswer != null ? slide.correctAnswer : 0)
      });
    }

    case 'swipe-decision': {
      // response: responsePayload from the multi-card renderer.
      // Single-card: { swiped: 'left'|'right' }
      // Multi-card:  { decisions: [{cardIdx, swiped}, ...] }
      if (response && Array.isArray(response.decisions)) {
        // Multi-card: emit each card's decision as a paired entry
        const cards = Array.isArray(slide.cards) ? slide.cards : [];
        return Object.assign(native, {
          interactionType:        'choice',
          choices:                cards.map((card, i) => ({
            id: 'card_' + i,
            description: { 'en-US': xapiTruncate((card && (card.text || card.label)) || ('Card ' + (i + 1))) }
          })),
          responsePattern:        response.decisions.map(d => 'card_' + d.cardIdx + '.' + d.swiped).join('[,]'),
          correctResponsePattern: cards.map((card, i) => 'card_' + i + '.' + (card && card.correctSide ? card.correctSide : 'right')).join('[,]'),
          scorm12ResponsePattern: response.decisions.map(d => 'card_' + d.cardIdx + '.' + d.swiped).join(','),
          scorm12CorrectPattern:  cards.map((card, i) => 'card_' + i + '.' + (card && card.correctSide ? card.correctSide : 'right')).join(',')
        });
      }
      // Single-card: true-false-style
      const swiped = response && response.swiped ? response.swiped : '';
      return Object.assign(native, {
        interactionType:        'true-false',
        responsePattern:        swiped === 'right' ? 'true' : (swiped === 'left' ? 'false' : ''),
        correctResponsePattern: slide.correctSide === 'right' ? 'true' : 'false',
        scorm12ResponsePattern: swiped === 'right' ? 't' : (swiped === 'left' ? 'f' : ''),
        scorm12CorrectPattern:  slide.correctSide === 'right' ? 't' : 'f'
      });
    }

    // ---------- MATCHING FAMILY (xAPI "matching") ----------
    case 'matching': {
      // response: { pairs: [{from: "apple", to: "fruit"}, ...] }
      const sourceList = Array.isArray(slide.left)  ? slide.left  : (slide.sources || []);
      const targetList = Array.isArray(slide.right) ? slide.right : (slide.targets || []);
      const pairs = (response && Array.isArray(response.pairs)) ? response.pairs : [];
      // Build id maps so "from"/"to" strings convert to canonical ids
      const sourceIds = sourceList.map((s, i) => ({
        id: 'src_' + i,
        text: typeof s === 'string' ? s : (s.text || s.label || String(i))
      }));
      const targetIds = targetList.map((t, i) => ({
        id: 'tgt_' + i,
        text: typeof t === 'string' ? t : (t.text || t.label || String(i))
      }));
      const idOf = (list, text) => {
        const found = list.find(x => x.text === text);
        return found ? found.id : text;
      };
      // Learner response — pair text → canonical id pairs
      const learnerPairs = pairs.map(p => idOf(sourceIds, p.from) + '[.]' + idOf(targetIds, p.to)).join('[,]');
      const learnerPairs12 = pairs.map(p => idOf(sourceIds, p.from) + '.' + idOf(targetIds, p.to)).join(',');
      // Correct pairs — the slide's expected pairing. For "matching" slides,
      // the correct mapping is typically that source[i] matches target[i].
      const correctPairs   = sourceIds.map((s, i) => s.id + '[.]' + (targetIds[i] ? targetIds[i].id : '')).join('[,]');
      const correctPairs12 = sourceIds.map((s, i) => s.id + '.'   + (targetIds[i] ? targetIds[i].id : '')).join(',');
      return Object.assign(native, {
        interactionType:        'matching',
        source:                 sourceIds.map(s => ({ id: s.id, description: { 'en-US': xapiTruncate(s.text) } })),
        target:                 targetIds.map(t => ({ id: t.id, description: { 'en-US': xapiTruncate(t.text) } })),
        responsePattern:        learnerPairs,
        correctResponsePattern: correctPairs,
        scorm12ResponsePattern: learnerPairs12,
        scorm12CorrectPattern:  correctPairs12
      });
    }

    case 'drag-match': {
      // response: { placement: { srcText: tgtText, ... } }
      const sourceList = Array.isArray(slide.left)  ? slide.left  : (slide.sources || slide.items || []);
      const targetList = Array.isArray(slide.right) ? slide.right : (slide.targets || []);
      const placement = (response && response.placement) || {};
      const sourceIds = sourceList.map((s, i) => ({
        id: 'src_' + i,
        text: typeof s === 'string' ? s : (s.text || s.label || String(i))
      }));
      const targetIds = targetList.map((t, i) => ({
        id: 'tgt_' + i,
        text: typeof t === 'string' ? t : (t.text || t.label || String(i))
      }));
      const idOf = (list, text) => {
        const found = list.find(x => x.text === text);
        return found ? found.id : text;
      };
      const learnerPairs   = Object.keys(placement).map(srcText =>
        idOf(sourceIds, srcText) + '[.]' + idOf(targetIds, placement[srcText])).join('[,]');
      const learnerPairs12 = Object.keys(placement).map(srcText =>
        idOf(sourceIds, srcText) + '.'   + idOf(targetIds, placement[srcText])).join(',');
      const correctPairs   = sourceIds.map((s, i) => s.id + '[.]' + (targetIds[i] ? targetIds[i].id : '')).join('[,]');
      const correctPairs12 = sourceIds.map((s, i) => s.id + '.'   + (targetIds[i] ? targetIds[i].id : '')).join(',');
      return Object.assign(native, {
        interactionType:        'matching',
        source:                 sourceIds.map(s => ({ id: s.id, description: { 'en-US': xapiTruncate(s.text) } })),
        target:                 targetIds.map(t => ({ id: t.id, description: { 'en-US': xapiTruncate(t.text) } })),
        responsePattern:        learnerPairs,
        correctResponsePattern: correctPairs,
        scorm12ResponsePattern: learnerPairs12,
        scorm12CorrectPattern:  correctPairs12
      });
    }

    case 'drag-drop': {
      // response: { placements: { itemIdx: categoryKey, ... } }
      // Modeled as xAPI "matching": items are source, categories are target.
      const items      = Array.isArray(slide.items)      ? slide.items      : [];
      const categories = Array.isArray(slide.categories) ? slide.categories : [];
      const placements = (response && response.placements) || {};
      const sourceIds = items.map((it, i) => ({
        id: 'item_' + i,
        text: typeof it === 'string' ? it : (it.text || it.label || String(i)),
        correctCat: typeof it === 'object' ? it.category : null
      }));
      const targetIds = categories.map((cat, i) => ({
        id: 'cat_' + i,
        text: typeof cat === 'string' ? cat : (cat.text || cat.label || cat.key || String(i)),
        key:  typeof cat === 'object' && cat.key ? cat.key : (typeof cat === 'string' ? cat : String(i))
      }));
      const catIdByKey = (key) => {
        const t = targetIds.find(t => t.key === key);
        return t ? t.id : key;
      };
      const learnerPairs   = Object.keys(placements).map(itemIdx =>
        ('item_' + itemIdx) + '[.]' + catIdByKey(placements[itemIdx])).join('[,]');
      const learnerPairs12 = Object.keys(placements).map(itemIdx =>
        ('item_' + itemIdx) + '.'   + catIdByKey(placements[itemIdx])).join(',');
      // Correct = each item with its declared correct category
      const correctPairs   = sourceIds.map((s, i) =>
        s.id + '[.]' + (s.correctCat ? catIdByKey(s.correctCat) : '')).join('[,]');
      const correctPairs12 = sourceIds.map((s, i) =>
        s.id + '.'   + (s.correctCat ? catIdByKey(s.correctCat) : '')).join(',');
      return Object.assign(native, {
        interactionType:        'matching',
        source:                 sourceIds.map(s => ({ id: s.id, description: { 'en-US': xapiTruncate(s.text) } })),
        target:                 targetIds.map(t => ({ id: t.id, description: { 'en-US': xapiTruncate(t.text) } })),
        responsePattern:        learnerPairs,
        correctResponsePattern: correctPairs,
        scorm12ResponsePattern: learnerPairs12,
        scorm12CorrectPattern:  correctPairs12
      });
    }

    // ---------- SEQUENCING ----------
    case 'sequencing': {
      // response: { order: [origIdx0, origIdx1, ...] }  — the learner's final order
      const steps = Array.isArray(slide.steps) ? slide.steps : (slide.items || []);
      const order = (response && Array.isArray(response.order)) ? response.order : [];
      const choices = steps.map((s, i) => ({
        id: 'step_' + i,
        description: { 'en-US': xapiTruncate(typeof s === 'string' ? s : (s.text || s.label || String(i))) }
      }));
      // The "correct" order is the canonical order of slide.steps (0,1,2,...)
      const learnerOrder   = order.map(o => 'step_' + o).join('[,]');
      const correctOrder   = steps.map((_, i) => 'step_' + i).join('[,]');
      const learnerOrder12 = order.map(o => 'step_' + o).join(',');
      const correctOrder12 = steps.map((_, i) => 'step_' + i).join(',');
      return Object.assign(native, {
        interactionType:        'sequencing',
        choices,
        responsePattern:        learnerOrder,
        correctResponsePattern: correctOrder,
        scorm12ResponsePattern: learnerOrder12,
        scorm12CorrectPattern:  correctOrder12
      });
    }

    // ---------- FILL-IN ----------
    case 'fill-blanks': {
      // response: { values: ["paris", "rome", ...] }   — entries per blank
      const values = (response && Array.isArray(response.values)) ? response.values : [];
      // Correct answers from slide.blanks. Each blank can be a string or
      // { answers: ["paris", "Paris"] } for accepted variants.
      const blanks = Array.isArray(slide.blanks) ? slide.blanks : [];
      const learnerStr   = values.map(v => String(v == null ? '' : v)).join('[,]');
      const learnerStr12 = values.map(v => String(v == null ? '' : v)).join(',');
      // Per spec, fill-in correctResponsesPattern is "answer1[,]answer2"
      // (one variant per blank). For multiple accepted variants per blank,
      // emit multiple patterns separated by line/use first variant in spec24.
      // SCORM 2004 also supports "{case_matters=false}" prefix — but we
      // default to case-insensitive in the engine; LMS dashboards generally
      // do their own case-insensitive compare anyway.
      const correctParts   = blanks.map(b => {
        if (typeof b === 'string') return b;
        if (b && Array.isArray(b.answers) && b.answers.length) return b.answers[0];
        return '';
      });
      return Object.assign(native, {
        interactionType:        'fill-in',
        responsePattern:        learnerStr,
        correctResponsePattern: correctParts.join('[,]'),
        scorm12ResponsePattern: learnerStr12,
        scorm12CorrectPattern:  correctParts.join(',')
      });
    }

    // ---------- NUMERIC (slider, dial) ----------
    case 'slider':
    case 'dial': {
      // response: { value: N }
      const value = (response && response.value != null) ? Number(response.value) : null;
      const min = slide.min != null ? Number(slide.min) : 0;
      const max = slide.max != null ? Number(slide.max) : 100;
      // Correct answer can be a single value or a range (correctMin/correctMax)
      const correct = slide.correctValue != null ? Number(slide.correctValue) : null;
      const cMin = slide.correctMin != null ? Number(slide.correctMin) : correct;
      const cMax = slide.correctMax != null ? Number(slide.correctMax) : correct;
      const correctPattern = (cMin != null && cMax != null)
        ? (cMin === cMax ? String(cMin) : (cMin + ':' + cMax))   // xAPI numeric range: "min:max"
        : '';
      return Object.assign(native, {
        interactionType:        'numeric',
        minMaxScale:            { min, max },
        responsePattern:        value == null ? '' : String(value),
        correctResponsePattern: correctPattern,
        scorm12ResponsePattern: value == null ? '' : String(value),
        // SCORM 1.2 numeric format is "N" (no range support)
        scorm12CorrectPattern:  correct != null ? String(correct) : ''
      });
    }

    // ---------- PERFORMANCE (image-id, dialogue, hotspot) ----------
    case 'image-id':
    case 'hotspot': {
      // response: { found: [...], misses: [...] }
      const found = (response && Array.isArray(response.found)) ? response.found : [];
      // For image-id/hotspot we use the "performance" type. The response is
      // a list of identified targets; correct is the full list of targets.
      const targets = Array.isArray(slide.targets) ? slide.targets : (slide.hotspots || []);
      const correctIds = targets.map((t, i) =>
        (typeof t === 'object' && t.id) ? t.id : ('target_' + i));
      const learnerIds = found.map(f =>
        typeof f === 'object' ? (f.id || JSON.stringify(f)) : String(f));
      return Object.assign(native, {
        interactionType:        'performance',
        responsePattern:        learnerIds.join('[,]'),
        correctResponsePattern: correctIds.join('[,]'),
        scorm12ResponsePattern: learnerIds.join(','),
        scorm12CorrectPattern:  correctIds.join(',')
      });
    }

    case 'dialogue': {
      // response: { path, finalMood, transcript }
      const path = (response && response.path) || '';
      return Object.assign(native, {
        interactionType:        'performance',
        responsePattern:        String(path || JSON.stringify(response)),
        correctResponsePattern: '',
        scorm12ResponsePattern: String(path),
        scorm12CorrectPattern:  ''
      });
    }

    case 'interactive-timeline': {
      // response: { completed: [stopIndices] }
      // Modeled as a multi-select choice: each stop on the timeline is one
      // choice; completion requires the learner to have visited all of them.
      // The "correct" pattern is therefore the full list of stop ids.
      const stops = Array.isArray(slide.stops) ? slide.stops : [];
      const completed = (response && Array.isArray(response.completed)) ? response.completed : [];
      const allIds = stops.map((_, i) => 'stop_' + i);
      const visitedIds = completed.map(i => 'stop_' + i).filter(id => allIds.indexOf(id) >= 0);
      // Sort both sides so the pattern comparison is order-independent
      // (the LMS dashboard should treat "visited all 3" the same regardless
      // of the order the learner clicked).
      visitedIds.sort();
      const correctIds = allIds.slice().sort();
      return Object.assign(native, {
        interactionType:        'choice',
        choices: stops.map((s, i) => ({
          id: 'stop_' + i,
          description: { 'en-US': xapiTruncate(typeof s === 'string' ? s : (s.label || s.title || 'Stop ' + (i + 1))) }
        })),
        responsePattern:        visitedIds.join('[,]'),
        correctResponsePattern: correctIds.join('[,]'),
        scorm12ResponsePattern: visitedIds.join(','),
        scorm12CorrectPattern:  correctIds.join(',')
      });
    }

    // ---------- OTHER — fall through to JSON blob ----------
    default: {
      const blob = (typeof response === 'string') ? response : JSON.stringify(response);
      return Object.assign(native, {
        interactionType:        'other',
        responsePattern:        blob,
        correctResponsePattern: '',
        scorm12ResponsePattern: blob.slice(0, 250),    // SCORM 1.2 has stricter length limits
        scorm12CorrectPattern:  ''
      });
    }
  }
}

/* Truncate text for xAPI description fields. Some LMSs reject statements
   with descriptions longer than 255 chars. Kept fairly aggressive. */
function xapiTruncate(s) {
  s = String(s == null ? '' : s);
  return s.length > 200 ? (s.slice(0, 197) + '...') : s;
}

function buildAnsweredStatement(slide, response, correct) {
  const ix = buildInteractionData(slide, response);
  const stmt = {
    actor,
    verb: { id: "http://adlnet.gov/expapi/verbs/answered", display: { "en-US": "answered" } },
    object: {
      id: `${xapiActivityId}/${slide.id}`,
      definition: {
        name:        { "en-US": xapiTruncate(slide.question || slide.title || slide.type) },
        description: { "en-US": xapiTruncate(slide.instruction || slide.question || slide.title || '') },
        type:            "http://adlnet.gov/expapi/activities/cmi.interaction",
        interactionType: ix.interactionType
      }
    },
    result: {
      success:  !!correct,
      response: ix.responsePattern == null ? '' : String(ix.responsePattern)
    },
    timestamp: new Date().toISOString()
  };

  // Add interaction-type-specific definition fields per xAPI 1.0.3 spec.
  // The LRS uses these to render meaningful per-question reports
  // (e.g. a matching chart shows the source items and target columns).
  if (ix.choices && ix.choices.length) stmt.object.definition.choices = ix.choices;
  if (ix.source  && ix.source.length)  stmt.object.definition.source  = ix.source;
  if (ix.target  && ix.target.length)  stmt.object.definition.target  = ix.target;
  if (ix.minMaxScale) {
    stmt.object.definition.scale = [
      { id: 'min', description: { 'en-US': String(ix.minMaxScale.min) } },
      { id: 'max', description: { 'en-US': String(ix.minMaxScale.max) } }
    ];
  }
  if (ix.correctResponsePattern) {
    // xAPI spec: an array, supports multiple acceptable answers.
    stmt.object.definition.correctResponsesPattern = [ ix.correctResponsePattern ];
  }

  // Preserve the original JSON blob in a custom extension so downstream
  // tooling that depends on the legacy shape still works. The extension
  // IRI is namespaced under the engine so it never collides with anything
  // standard.
  if (ix.rawResponse !== undefined) {
    stmt.result.extensions = stmt.result.extensions || {};
    stmt.result.extensions['https://e-learning-engine/extensions/raw-response'] =
      ix.rawResponse;
  }

  if (xapiRegistration) stmt.context = { registration: xapiRegistration };
  return stmt;
}

/* ============================================================ */
/*           THIRD-PARTY LRS (independent of any LMS)            */
/* ============================================================ */
/*
  Pushes xAPI statements directly to a configured external LRS,
  authenticated with API_Key + API_Secret over Basic auth. This
  works whether the host LMS supports xAPI or not (it bypasses
  the LMS entirely). Configured via:
    settings.lrsEndpoint      — full URL of the LRS endpoint
    settings.lrsApiKey        — username component
    settings.lrsApiSecret     — password component
  Statements are queued with a small in-memory queue with retry
  to survive brief network blips during a learning session.
*/
const __lrsQueue = [];
let __lrsBusy = false;
let __lrsAuthHeader = null;

function initThirdPartyLRS() {
  const ep  = COURSE_CONFIG.settings.lrsEndpoint;
  const key = COURSE_CONFIG.settings.lrsApiKey;
  const sec = COURSE_CONFIG.settings.lrsApiSecret;
  if (!ep || !key || !sec) return;   // no external LRS configured
  // Basic auth header — base64(key:secret)
  __lrsAuthHeader = 'Basic ' + (typeof btoa === 'function' ? btoa(`${key}:${sec}`) : '');
  console.info('[LRS] Third-party LRS configured:', ep);
}

function sendToThirdPartyLRS(statement) {
  if (!__lrsAuthHeader) return;
  // Make sure the statement has an actor — use the launch-provided one if missing
  if (!statement.actor) statement.actor = actor;
  if (!statement.timestamp) statement.timestamp = new Date().toISOString();
  __lrsQueue.push(statement);
  flushLrsQueue();
}

function flushLrsQueue() {
  if (__lrsBusy) return;
  if (!__lrsQueue.length) return;
  __lrsBusy = true;
  const stmt = __lrsQueue.shift();
  const endpoint = COURSE_CONFIG.settings.lrsEndpoint;
  // Endpoint must end with /; append "statements" for the POST target
  const url = endpoint.replace(/\/$/, '') + '/statements';
  // xAPI 1.0.3 requires the X-Experience-API-Version header
  fetch(url, {
    method: 'POST',
    headers: {
      'Content-Type': 'application/json',
      'Authorization': __lrsAuthHeader,
      'X-Experience-API-Version': '1.0.3'
    },
    body: JSON.stringify(stmt),
    // keepalive: complete the request even if the page is unloading
    keepalive: true
  }).then(r => {
    if (!r.ok) console.warn('[LRS] POST failed:', r.status);
  }).catch(e => {
    console.warn('[LRS] Network error — re-queueing:', e.message);
    // Put it back at the front, retry after backoff
    __lrsQueue.unshift(stmt);
    setTimeout(() => { __lrsBusy = false; flushLrsQueue(); }, 5000);
    return;
  }).finally(() => {
    __lrsBusy = false;
    if (__lrsQueue.length) setTimeout(flushLrsQueue, 100);
  });
}

/* ============================================================ */
/*              SCORM 2004 4TH EDITION WRAPPER                   */
/* ============================================================ */
/*
  Detects a SCORM 2004 API in the parent window hierarchy and
  bridges engine events to it via cmi.* data model values.

  When the LMS launches our content as a SCORM SCO, it injects an
  API_1484_11 object onto window.parent (or one of its ancestors).
  We discover it once at startup; if found, scormApi is non-null
  and we report progress/score/interactions there in addition to
  any xAPI tracking.

  This is fully independent of xAPI — same package can be uploaded
  to a SCORM-only LMS or an xAPI-only LMS or a dual LMS. The
  imsmanifest.xml in the zip determines which protocol the LMS
  uses to launch us.
*/
let scormApi = null;
let __scormInteractionIdx = 0;
const __scormSlideToIdx = {};

function findScormAPI() {
  // SCORM 2004 spec: walk up window.parent chain (and window.opener),
  // looking for API_1484_11.  SCORM 1.2 spec: same chain, but the API
  // object is named just "API" (no version suffix).
  //
  // We prefer 2004 when both are present (it's a strict superset of 1.2
  // for our purposes). If only 1.2 is found we return it with a marker
  // so the wrappers know to use the LMSGetValue/LMSSetValue method names.
  function search(win, depth) {
    if (!win || depth > 7) return null;
    try {
      if (win.API_1484_11) return { api: win.API_1484_11, version: '2004' };
      if (win.API)          return { api: win.API,          version: '1.2'  };
    } catch (e) { /* cross-origin — give up on this branch */ }
    if (win.parent && win.parent !== win) {
      const found = search(win.parent, depth + 1);
      if (found) return found;
    }
    return null;
  }
  let found = search(window, 0);
  if (!found && window.opener) {
    try { found = search(window.opener, 0); } catch (e) {}
  }
  if (!found) return null;
  // Stash the version on the api object itself for downstream wrappers.
  // (We return the api directly so existing code that does `scormApi.SetValue`
  // still works — for 1.2 we'll alias the method names below.)
  if (found.version === '1.2') {
    const a = found.api;
    a.__scormVersion = '1.2';
    // Alias LMS* methods to 2004 names so the rest of the engine can call
    // scormApi.SetValue / GetValue / Commit / Initialize / Terminate
    // without knowing which version it's talking to.
    if (typeof a.Initialize !== 'function' && typeof a.LMSInitialize === 'function') {
      a.Initialize = function(s) { return a.LMSInitialize(s); };
    }
    if (typeof a.Terminate !== 'function' && typeof a.LMSFinish === 'function') {
      a.Terminate  = function(s) { return a.LMSFinish(s); };
    }
    if (typeof a.GetValue !== 'function' && typeof a.LMSGetValue === 'function') {
      a.GetValue   = function(k) { return a.LMSGetValue(k); };
    }
    if (typeof a.SetValue !== 'function' && typeof a.LMSSetValue === 'function') {
      a.SetValue   = function(k, v) { return a.LMSSetValue(k, v); };
    }
    if (typeof a.Commit !== 'function' && typeof a.LMSCommit === 'function') {
      a.Commit     = function(s) { return a.LMSCommit(s); };
    }
  } else {
    found.api.__scormVersion = '2004';
  }
  return found.api;
}

function initSCORM() {
  scormApi = findScormAPI();
  if (!scormApi) return;
  try {
    const r = scormApi.Initialize('');
    if (r === 'true') {
      const v = scormIsVersion12() ? '1.2' : '2004';
      console.info('[SCORM] ' + v + ' API connected.');
      // Mark course as in progress. Field name differs by version:
      //   2004: cmi.completion_status ('incomplete')
      //   1.2:  cmi.core.lesson_status ('incomplete')
      // PATCH 2026-05-19: Only initialize the status to 'incomplete' if the
      // LMS does NOT already have a terminal value from a prior attempt.
      // Never downgrade completed/passed/failed back to incomplete.
      if (scormIsVersion12()) {
        var __cur12 = String(scormApi.GetValue('cmi.core.lesson_status') || '').toLowerCase();
        if (__cur12 === '' || __cur12 === 'not attempted') {
          scormApi.SetValue('cmi.core.lesson_status', 'incomplete');
          scormApi.Commit('');
        }
      } else {
        var __cur2004 = String(scormApi.GetValue('cmi.completion_status') || '').toLowerCase();
        if (__cur2004 === '' || __cur2004 === 'unknown' || __cur2004 === 'not attempted') {
          scormApi.SetValue('cmi.completion_status', 'incomplete');
          scormApi.Commit('');
        }
      }
      // PATCH 2026-05-19 round 4: rebuild the interaction-index map from
      // the LMS. Module-scope __scormSlideToIdx and __scormInteractionIdx
      // are JS globals that reset to {} / 0 on every page load. Without
      // this restore, a resumed session re-assigns cmi.interactions.0 to
      // the next answered slide, overwriting an earlier session's record.
      // Symptom: cmi.interactions only contains the last N answers from
      // the most recent session, not the cumulative list. SCORM 2004
      // exposes cmi.interactions._count and cmi.interactions.N.id; we
      // wrote ids as `slide-{slide.id}` so we parse them back.
      try {
        var __existingCount = parseInt(scormApi.GetValue('cmi.interactions._count') || '0', 10);
        if (!isNaN(__existingCount) && __existingCount > 0) {
          for (var __ii = 0; __ii < __existingCount; __ii++) {
            var __idField = String(scormApi.GetValue('cmi.interactions.' + __ii + '.id') || '');
            var __idMatch = __idField.match(/^slide-(.+)$/);
            if (__idMatch) {
