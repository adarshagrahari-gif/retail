              // Slide ids are usually numeric in COURSE_CONFIG; coerce so
              // the object-key lookup later matches the same shape the
              // renderer code uses (`__scormSlideToIdx[slide.id]`).
              var __sidNum = Number(__idMatch[1]);
              __scormSlideToIdx[Number.isNaN(__sidNum) ? __idMatch[1] : __sidNum] = __ii;
            }
          }
          __scormInteractionIdx = __existingCount;
          console.info('[SCORM] Restored ' + __existingCount + ' existing interaction(s) from LMS.');
        }
      } catch (e) {
        console.warn('[SCORM] Could not rebuild interaction-index map:', e);
      }
      // Register handlers to make sure we Terminate cleanly on tab close.
      // We listen to multiple events because no single event fires reliably
      // on every platform:
      //   - 'beforeunload': desktop browsers, mostly reliable
      //   - 'pagehide':     iOS Safari, sometimes the only one that fires
      //   - 'visibilitychange' (state=hidden): mobile Chrome/Safari, fires
      //                     when user switches apps or closes tab
      // The finalizeCourseSession() guard makes these idempotent — calling
      // them multiple times is safe.
      const unloadHandler = () => {
        try {
          if (scormApi) {
            // If the learner left mid-course (no Results reached), use
            // 'suspend' so the LMS keeps the registration open for resume.
            // If the session was already finalized via Results, this is a
            // no-op (scormApi has been nulled out).
            if (!STATE._sessionFinalized) {
              // Write the latest bookmark FIRST so the LMS persists the
              // resume point along with the suspend exit. saveBookmark
              // also sets cmi.exit='suspend' and Commits, but we re-set
              // and re-commit below to be belt-and-suspenders defensive
              // against LMSs that drop in-flight values on Terminate.
              try { saveBookmark(); } catch (e) {}
              // Field name varies by version: 2004 → cmi.exit, 1.2 → cmi.core.exit
              // PATCH 2026-05-19: Don't write exit='suspend' if the learner
              // has already completed the course.
              var __statusField = scormIsVersion12() ? 'cmi.core.lesson_status' : 'cmi.completion_status';
              var __curStatus = String(scormApi.GetValue(__statusField) || '').toLowerCase();
              var __alreadyDone = (__curStatus === 'completed' || __curStatus === 'passed' || __curStatus === 'failed');
              scormApi.SetValue(scormIsVersion12() ? 'cmi.core.exit' : 'cmi.exit', __alreadyDone ? '' : 'suspend');
              scormApi.Commit('');
              if (typeof scormApi.Terminate === 'function') {
                scormApi.Terminate('');
              } else if (typeof scormApi.LMSFinish === 'function') {
                scormApi.LMSFinish('');
              }
              STATE._sessionFinalized = true;
            }
          }
        } catch(e) {}
      };
      // PATCH 2026-05-19 (round 2): visibilitychange fires on EVERY tab
      // switch, window minimise, fullscreen video, mobile notification-
      // panel pull, and app switch — not just when the page is closing.
      // Treating each one as a real close calls Terminate() and trips
      // the STATE._sessionFinalized gate inside saveBookmark, so every
      // subsequent navigation save silently no-ops. The learner can
      // keep clicking Next, but nothing more reaches the LMS — symptom:
      // resume always lands at the slide just before the first tab
      // switch, even if the learner reached slide 25 afterwards.
      //
      // Fix: a separate flushHandler that ONLY persists the latest
      // bookmark (no Terminate). It's safe to call repeatedly. The
      // full unloadHandler (which Terminates) stays on the two events
      // that really do indicate the page is going away.
      var flushHandler = function() {
        try { if (!STATE._sessionFinalized) saveBookmark(); } catch(e) {}
      };
      window.addEventListener('beforeunload', unloadHandler);
      window.addEventListener('pagehide', function(e) {
        // pagehide with event.persisted === true means the page is being
        // moved into the back/forward cache (e.g. iOS Safari tab switch),
        // NOT destroyed. Flush state but don't Terminate — the page may
        // come back alive and need the SCORM API again.
        if (e && e.persisted) { flushHandler(); } else { unloadHandler(); }
      });
      document.addEventListener('visibilitychange', function() {
        if (document.visibilityState === 'hidden') flushHandler();
      });
    } else {
      console.warn('[SCORM] Initialize returned', r, '— disabling.');
      scormApi = null;
    }
  } catch (e) {
    console.warn('[SCORM] Initialize failed:', e);
    scormApi = null;
  }
}

function scormSetValue(key, value) {
  if (!scormApi) return;
  try { scormApi.SetValue(key, String(value)); }
  catch (e) { console.warn('[SCORM] SetValue', key, e); }
}

function scormCommit() {
  if (!scormApi) return;
  try { scormApi.Commit(''); } catch (e) {}
}

/* Return true if the connected LMS API is SCORM 1.2 rather than 2004.
   Used by interaction reporting to choose the right field names and
   response patterns (1.2 has stricter formats and some fields don't
   exist). Defaults to 2004 if unknown. */
function scormIsVersion12() {
  return !!(scormApi && scormApi.__scormVersion === '1.2');
}

/* ============================================================
   SCORM BOOKMARK / RESUME
   ============================================================
   Persists the learner's progress so they can close the course
   mid-way and resume on the same slide with all their previous
   answers, scores, and completed slides intact.

   Two SCORM 2004 fields are used together:
     cmi.location       — the resume slide index (≤1000 chars)
     cmi.suspend_data   — full STATE blob as JSON (≤64KB)

   We also set cmi.exit='suspend' on every save so the LMS knows
   the registration is paused, not abandoned. Upside LMS in
   particular wipes progress if cmi.exit is empty when the
   session terminates — see the bug report that motivated this.

   Save triggers (every meaningful state change):
     - nextSlide()   after advancing
     - prevSlide()   after going back
     - tryJumpToSlide() after sidebar nav
     - All unload events (via the existing handlers in initSCORM)

   We DO NOT save once finalizeCourseSession() has run (post-
   Results); the SCORM session is terminated and SetValue would
   be rejected. STATE._sessionFinalized acts as the gate.
   ============================================================ */

/* Convert STATE into a JSON-safe object. JSON.stringify silently turns
   Sets into '{}' so we have to convert them to arrays explicitly. We
   omit transient fields (startTime — will be recomputed) and editor-only
   fields (_previewStartIdx is in CONFIG, not STATE). */
function serializeStateForBookmark() {
  return {
    v: 1,                         // schema version — bump if shape changes
    current:    STATE.current,
    completed:  Array.from(STATE.completed),
    responses:  STATE.responses,  // already a plain object of plain objects
    freeRoam:   !!STATE.freeRoam,
    attempts:   STATE.attempts,
    answers:    STATE.answers,
    scenarioPicks: STATE.scenarioPicks,
    hotspotsFound: serializeHotspotsFound(STATE.hotspotsFound),
    videoWatched:  STATE.videoWatched,
    elapsedSec: Math.round((Date.now() - STATE.startTime) / 1000)
  };
}

/* hotspotsFound is { slideId: Set<idx> } — convert each Set to an array. */
function serializeHotspotsFound(hf) {
  const out = {};
  Object.keys(hf || {}).forEach(k => {
    const v = hf[k];
    out[k] = (v instanceof Set) ? Array.from(v) : (Array.isArray(v) ? v : []);
  });
  return out;
}
function deserializeHotspotsFound(serialized) {
  const out = {};
  Object.keys(serialized || {}).forEach(k => {
    out[k] = new Set(Array.isArray(serialized[k]) ? serialized[k] : []);
  });
  return out;
}

/* Restore STATE from a bookmark blob. Only mutates fields that exist in
   the blob — so a future schema change that adds new fields stays
   backward-compatible (old bookmarks just don't restore the new fields).
   Validates `current` against the current course's slide count so a
   bookmark from an outdated course version doesn't crash the engine. */
function applyBookmarkToState(blob) {
  if (!blob || typeof blob !== 'object') return false;
  const totalSlides = COURSE_CONFIG.slides.length;
  // Bounds-check the slide index. If the course has been edited since
  // the bookmark was written and the slide no longer exists, fall back
  // to slide 0 rather than crashing.
  if (typeof blob.current === 'number' && blob.current >= 0 && blob.current < totalSlides) {
    STATE.current = blob.current;
  } else {
    STATE.current = 0;
  }
  if (Array.isArray(blob.completed)) {
    STATE.completed = new Set(blob.completed.filter(id =>
      COURSE_CONFIG.slides.some(s => s.id === id)
    ));
  }
  if (blob.responses && typeof blob.responses === 'object') STATE.responses = blob.responses;
  if (typeof blob.freeRoam === 'boolean') STATE.freeRoam = blob.freeRoam;
  if (blob.attempts && typeof blob.attempts === 'object') STATE.attempts = blob.attempts;
  if (blob.answers  && typeof blob.answers  === 'object') STATE.answers  = blob.answers;
  if (blob.scenarioPicks && typeof blob.scenarioPicks === 'object') STATE.scenarioPicks = blob.scenarioPicks;
  if (blob.hotspotsFound && typeof blob.hotspotsFound === 'object') STATE.hotspotsFound = deserializeHotspotsFound(blob.hotspotsFound);
  if (blob.videoWatched  && typeof blob.videoWatched  === 'object') STATE.videoWatched  = blob.videoWatched;
  // elapsedSec is restored by rewinding startTime so the Results slide
  // shows the cumulative time, not just this-session time.
  if (typeof blob.elapsedSec === 'number') {
    STATE.startTime = Date.now() - (blob.elapsedSec * 1000);
  }
  return true;
}

/* Write the current state to SCORM. Cheap when scormApi is null (i.e.
   not in an LMS) — just returns. Idempotent and safe to call frequently.
   We try/catch because some LMSs reject SetValue if the session has
   already been Terminate'd or if suspend_data exceeds their internal
   cap (rare in 2004 4th Ed but happens in older implementations). */
function saveBookmark() {
  if (STATE._sessionFinalized) return;   // post-Results — session closed
  // cmi5 path: persist the same state blob to the xAPI State API on the
  // LMS-provided LRS. The PUT is async and best-effort — a network blip
  // doesn't block the learner. The next-launch handshake reads it back.
  if (cmi5LaunchActive) {
    try {
      const blob = serializeStateForBookmark();
      // Fire-and-forget; PUT promise is intentionally not awaited so the
      // navigation it usually accompanies isn't blocked.
      cmi5PutState(blob);
    } catch (e) {
      console.warn('[cmi5] saveBookmark serialize failed:', e);
    }
    // cmi5 has no SCORM API; return early instead of also trying SCORM.
    return;
  }
  if (!scormApi) return;
  try {
    if (scormIsVersion12()) {
      // SCORM 1.2 field names:
      //   cmi.core.lesson_location  ≤255 chars  (vs 2004's cmi.location ≤1000)
      //   cmi.suspend_data          ≤4096 chars (vs 2004's ≤64000)
      //   cmi.core.exit             same idea
      scormApi.SetValue('cmi.core.lesson_location', String(STATE.current));
      const serialized12 = JSON.stringify(serializeStateForBookmark());
      // 1.2 has a much smaller suspend_data limit (4KB). Truncate if needed
      // and warn — the resume will fall back to location-only.
      if (serialized12.length > 4000) {
        console.warn('[SCORM 1.2] suspend_data exceeds 4KB; truncating. Resume may be partial.');
        scormApi.SetValue('cmi.suspend_data', serialized12.slice(0, 4000));
      } else {
        scormApi.SetValue('cmi.suspend_data', serialized12);
      }
      scormApi.SetValue('cmi.core.exit', 'suspend');
      scormApi.Commit('');
      return;
    }
    // SCORM 2004 path (the original implementation).
    // cmi.location: a small string for "where to jump to". We use the slide
    // INDEX (0..N-1), not the slide id, because indexes are stable across
    // a course edit only if the author hasn't reordered slides — but they
    // are smaller and more uniform than UUID-style ids. Bound-checked on
    // restore so an out-of-range value just lands on slide 0.
    scormApi.SetValue('cmi.location', String(STATE.current));
    // cmi.suspend_data: the full state blob. JSON-serialized, no compression
    // (typical state for a 30-slide course is well under 4KB; SCORM 2004
    // 4th Ed allows 64KB). If a course author somehow exceeds that, the LMS
    // will reject the SetValue and we'll log + drop — bookmark falls back
    // to location-only.
    const serialized = JSON.stringify(serializeStateForBookmark());
    scormApi.SetValue('cmi.suspend_data', serialized);
    // cmi.exit='suspend' tells the LMS the registration is paused. Critical
    // for Upside LMS specifically — it wipes progress if exit is blank when
    // the session terminates.
    scormApi.SetValue('cmi.exit', 'suspend');
    scormApi.Commit('');
  } catch (e) {
    console.warn('[SCORM] saveBookmark failed:', e);
  }
}

/* Read the bookmark on init. Two phases:
     1. cmi.location  — quick check, just the slide index
     2. cmi.suspend_data — the full state blob, if present
   If only location is present (older bookmark, or LMS that strips
   suspend_data), we still resume the slide but lose answers — better
   than nothing. Returns the slide index to resume on, or -1 if no
   bookmark was found.

   Honors COURSE_CONFIG.settings.resumePrompt (default 'ask'):
     'ask'    — show a modal "Resume where you left off?"
     'auto'   — silently resume
     'never'  — ignore bookmark, always start at slide 0
*/
function loadBookmark() {
  // cmi5 path: state was loaded asynchronously during the handshake
  // and stored in cmi5InitialState. If present, apply it. Honor the
  // resumePrompt setting just like the SCORM path.
  if (cmi5LaunchActive && cmi5InitialState) {
    const mode = (COURSE_CONFIG.settings && COURSE_CONFIG.settings.resumePrompt) || 'ask';
    if (mode === 'never') {
      console.info('[cmi5] resumePrompt="never" — state ignored, starting fresh.');
      return -1;
    }
    try {
      applyBookmarkToState(cmi5InitialState);
      console.info('[cmi5] resumed from saved state, slide', STATE.current);
      return STATE.current;
    } catch (e) {
      console.warn('[cmi5] applyBookmarkToState failed:', e);
      return -1;
    }
  }
  // Standalone (no LMS): no bookmark source available.
  if (!scormApi) return -1;
  // Honor resumePrompt='never' at the load level — if the author wants every
  // launch to start fresh, we don't even apply the bookmark to STATE. The
  // bookmark stays in the LMS so a later course revision can switch back to
  // 'ask' or 'auto' without learners losing their place forever.
  const mode = (COURSE_CONFIG.settings && COURSE_CONFIG.settings.resumePrompt) || 'ask';
  if (mode === 'never') {
    console.info('[SCORM] resumePrompt="never" — bookmark ignored, starting fresh.');
    return -1;
  }
  let savedLocation = '';
  let savedSuspend = '';
  try {
    if (scormIsVersion12()) {
      savedLocation = scormApi.GetValue('cmi.core.lesson_location') || '';
      savedSuspend  = scormApi.GetValue('cmi.suspend_data') || '';
    } else {
      savedLocation = scormApi.GetValue('cmi.location') || '';
      savedSuspend  = scormApi.GetValue('cmi.suspend_data') || '';
    }
  } catch (e) {
    console.warn('[SCORM] loadBookmark read failed:', e);
    return -1;
  }
  // Empty bookmark = first launch. Nothing to do.
  if (!savedLocation && !savedSuspend) return -1;

  // Try suspend_data first (richer). Fall back to location-only if it's
  // missing or unparseable (in which case we resume the slide but with
  // empty STATE — same as starting fresh from that slide).
  let blob = null;
  if (savedSuspend) {
    try { blob = JSON.parse(savedSuspend); }
    catch (e) { console.warn('[SCORM] suspend_data not parseable; resuming with location only'); }
  }
  if (blob) {
    applyBookmarkToState(blob);
  } else if (savedLocation) {
    const idx = parseInt(savedLocation, 10);
    if (!isNaN(idx) && idx >= 0 && idx < COURSE_CONFIG.slides.length) {
      STATE.current = idx;
    }
  }
  return STATE.current;
}

/* If the engine resumed from a bookmark, optionally show a confirmation
   modal so the learner can choose to start over. Default behavior is
   to ask (matches Articulate Storyline). Authors who want the engine
   to silently resume can set settings.resumePrompt = 'auto'. */
function offerResumeChoice(resumedIdx) {
  const mode = (COURSE_CONFIG.settings && COURSE_CONFIG.settings.resumePrompt) || 'ask';
  if (mode === 'auto' || resumedIdx <= 0) return;   // silent or fresh start

  const slideTitle = COURSE_CONFIG.slides[resumedIdx]?.title
                  || COURSE_CONFIG.slides[resumedIdx]?.question
                  || `Slide ${resumedIdx + 1}`;
  showFeedbackModal({
    type: 'info',
    title: 'Welcome back',
    body: `<p>Pick up where you left off — <strong>${escapeHtmlAttr(slideTitle)}</strong> (slide ${resumedIdx + 1} of ${COURSE_CONFIG.slides.length})?</p><p style="color:var(--text-muted); font-size:0.9rem; margin-top:0.5rem;">Choose <em>Start Over</em> if you'd rather begin from the beginning. Your previous answers will be cleared.</p>`,
    primary: 'Resume',
    secondary: 'Start Over',
    onPrimary: () => { /* nothing — STATE is already restored, render proceeds */ },
    onSecondary: () => {
      // Wipe state and re-render slide 0
      STATE.current = 0;
      STATE.completed = new Set();
      STATE.responses = {};
      STATE.freeRoam = false;
      STATE.attempts = {};
      STATE.answers = {};
      STATE.scenarioPicks = {};
      STATE.hotspotsFound = {};
      STATE.videoWatched = {};
      STATE.startTime = Date.now();
      saveBookmark();   // overwrite the LMS bookmark so they don't get prompted again
      renderSlide();
      refreshSidebarState();
    }
  });
}

/* Map our slide types to the SCORM 2004 cmi.interactions.N.type vocabulary.
   The optional `slide` argument lets us inspect the slide's shape for types
   that have multiple sub-flavors (e.g. swipe-decision: single card =
   true-false, multi-card = choice). */
function scormInteractionType(slideType, slide) {
  if (slideType === 'swipe-decision') {
    // Multi-card decks are modeled as a "choice" interaction (one choice
    // per card); single-card stays as "true-false" for back-compat.
    if (slide && Array.isArray(slide.cards) && slide.cards.length > 1) return 'choice';
    return 'true-false';
  }
  const map = {
    'quiz':           'choice',
    'true-false':     'true-false',
    'timed-quiz':     'choice',
    'drag-match':     'matching',
    'confidence':     'choice',
    'multi-response': 'choice',
    'fill-blanks':    'fill-in',
    'matching':       'matching',
    'sequencing':     'sequencing',
    'drag-drop':      'matching',
    'scenario':       'choice',
    'image-id':       'performance',
    'hotspot':        'performance',
    'dialogue':       'performance',
    'interactive-timeline': 'choice'
  };
  let resolved = map[slideType] || 'other';
  // SCORM 1.2 vocabulary lacks 'other' — that token is SCORM 2004 only.
  // On 1.2, fall back to 'choice' (a safe, universally-supported type).
  // The detailed response data is preserved in learner_response anyway;
  // this just makes sure the LMS doesn't reject the type field outright.
  if (resolved === 'other' && scormIsVersion12()) {
    resolved = 'choice';
  }
  return resolved;
}

/* Report an interaction to SCORM. Call after the learner submits an answer. */
function scormReportInteraction(slide, response, correct) {
  if (!scormApi) return;
  const ix = buildInteractionData(slide, response);
  // Reuse the same index for retries on the same slide so we don't bloat
  // cmi.interactions with duplicate entries.
  let idx;
  if (__scormSlideToIdx[slide.id] != null) {
    idx = __scormSlideToIdx[slide.id];
  } else {
    idx = __scormInteractionIdx++;
    __scormSlideToIdx[slide.id] = idx;
  }
  const base = `cmi.interactions.${idx}.`;
  const is12 = scormIsVersion12();

  // ---- Identification + classification ----
  scormSetValue(base + 'id', `slide-${slide.id}`);
  scormSetValue(base + 'type', scormInteractionType(slide.type, slide));

  // Timestamp field name differs between versions:
  //   1.2:   cmi.interactions.N.time          (HH:MM:SS local time)
  //   2004:  cmi.interactions.N.timestamp     (full ISO 8601)
  if (is12) {
    const d = new Date();
    const hh = String(d.getHours()).padStart(2, '0');
    const mm = String(d.getMinutes()).padStart(2, '0');
    const ss = String(d.getSeconds()).padStart(2, '0');
    scormSetValue(base + 'time', `${hh}:${mm}:${ss}`);
  } else {
    scormSetValue(base + 'timestamp', new Date().toISOString());
  }

  // ---- Learner response (the key field for "what did they pick") ----
  //   1.2:   cmi.interactions.N.student_response   (≤255 chars, plain format)
  //   2004:  cmi.interactions.N.learner_response   (≤4000 chars, bracket format)
  const respKey = is12 ? 'student_response' : 'learner_response';
  const respVal = is12 ? (ix.scorm12ResponsePattern || '').slice(0, 250)
                       :  ix.responsePattern;
  scormSetValue(base + respKey, respVal);

  // ---- Correct response pattern (so the LMS dashboard can show
  //      "expected: X, got: Y") ----
  // Both versions use cmi.interactions.N.correct_responses.0.pattern
  // but the contents are formatted differently. Only set if we have one.
  const correctPattern = is12 ? ix.scorm12CorrectPattern : ix.correctResponsePattern;
  if (correctPattern) {
    scormSetValue(base + 'correct_responses.0.pattern', correctPattern);
  }

  // ---- Result + per-slide weight ----
  scormSetValue(base + 'result', correct ? 'correct' : 'wrong');   // "wrong" is the SCORM 1.2 spec word
  if (!is12) {
    // 2004 also accepts "correct"/"incorrect"; "wrong" is 1.2-only.
    // Override the value for 2004 with the spec word it expects.
    scormSetValue(base + 'result', correct ? 'correct' : 'incorrect');
  }
  if (slide.weight != null) {
    scormSetValue(base + 'weighting', String(slide.weight));
  }

  // ---- Description (human-readable, both versions; truncated) ----
  scormSetValue(base + 'description',
    (slide.question || slide.title || `Slide ${slide.id}`).slice(0, 250));

  scormCommit();
}

/* Report final course score + completion. Called from renderResults.
   Handles both SCORM 2004 (separate success_status + completion_status)
   and SCORM 1.2 (single cmi.core.lesson_status field). */
function scormReportFinalScore(scorePct, passed) {
  if (!scormApi) return;
  if (scormIsVersion12()) {
    // SCORM 1.2: cmi.core.score.* fields; lesson_status is the single
    // outcome field. Valid values: passed, failed, completed, incomplete,
    // browsed, not attempted.
    scormSetValue('cmi.core.score.raw', String(scorePct));
    scormSetValue('cmi.core.score.min', '0');
    scormSetValue('cmi.core.score.max', '100');
    scormSetValue('cmi.core.lesson_status', passed ? 'passed' : 'failed');
  } else {
    // SCORM 2004: scaled is 0..1, raw is the actual number; success and
    // completion are separate fields.
    scormSetValue('cmi.score.scaled', (scorePct / 100).toFixed(4));
    scormSetValue('cmi.score.raw', scorePct);
    scormSetValue('cmi.score.min', 0);
    scormSetValue('cmi.score.max', 100);
    scormSetValue('cmi.success_status', passed ? 'passed' : 'failed');
    scormSetValue('cmi.completion_status', 'completed');
  }
  scormCommit();
}

/* ============================================================ */
/*               FEEDBACK MODAL (popup)                          */
/* ============================================================ */
/*
  Generic feedback modal used by quiz, drag-drop, scenario, and
  any other slide that needs to show an outcome.

  Usage:
    showFeedbackModal({
      type: 'success' | 'error' | 'info',
      title: 'Correct!',
      body: 'Explanation...',          // string or HTML
      primary: 'Continue',             // primary button label (closes modal)
      secondary: 'Try Again',          // OPTIONAL second button
      onPrimary: () => {},             // OPTIONAL callback when primary clicked
      onSecondary: () => {}            // OPTIONAL callback when secondary clicked
    });
*/
function showFeedbackModal(opts) {
  hideFeedbackModal();
  const icons = {
    success: 'fa-circle-check',
    error: 'fa-circle-xmark',
    info: 'fa-circle-info'
  };
  const iconClass = icons[opts.type] || icons.info;
  const backdrop = document.createElement('div');
  backdrop.className = 'modal-backdrop';
  backdrop.id = 'feedback-modal';
  backdrop.innerHTML = `
    <div class="modal-card" role="dialog" aria-modal="true">
      <div class="modal-icon ${opts.type || 'info'}">
        <i class="fa-solid ${iconClass}"></i>
      </div>
      <h3 class="modal-title">${escapeHtmlAttr(opts.title || '')}</h3>
      <div class="modal-body rt-rendered">${renderRichTextOrPlain(opts.body || '')}</div>
      <div class="modal-actions">
        ${opts.secondary ? `<button class="btn-secondary" id="modal-secondary-btn">${opts.secondary}</button>` : ''}
        <button class="btn-primary" id="modal-primary-btn">${opts.primary || 'Continue'}</button>
      </div>
    </div>`;
  document.body.appendChild(backdrop);
  paintIcons(backdrop);
  // Trigger transition
  requestAnimationFrame(() => backdrop.classList.add('open'));

  const close = (cb) => {
    hideFeedbackModal();
    if (typeof cb === 'function') cb();
  };
  document.getElementById('modal-primary-btn').onclick = () => close(opts.onPrimary);
  if (opts.secondary) {
    document.getElementById('modal-secondary-btn').onclick = () => close(opts.onSecondary);
  }
  // Click outside the card dismisses (acts like primary)
  backdrop.addEventListener('click', e => {
    if (e.target === backdrop) close(opts.onPrimary);
  });
  // Escape key dismisses
  const escHandler = (e) => {
    if (e.key === 'Escape') {
      document.removeEventListener('keydown', escHandler);
      close(opts.onPrimary);
    }
  };
  document.addEventListener('keydown', escHandler);
}
function hideFeedbackModal() {
  const m = document.getElementById('feedback-modal');
  if (m) m.remove();
}

/* ============================================================ */
/*               MOBILE SIDEBAR BACKDROP                         */
/* ============================================================ */
/* On mobile, an open sidebar should dim the rest of the page and
   close when the dim is tapped. We toggle this via the existing
   toggleSidebar() function. */
function ensureSidebarBackdrop() {
  let b = document.getElementById('sidebar-backdrop');
  if (!b) {
    b = document.createElement('div');
    b.className = 'sidebar-backdrop';
    b.id = 'sidebar-backdrop';
    b.onclick = toggleSidebar;
    document.body.appendChild(b);
  }
  return b;
}
// Wrap toggleSidebar so it also drives the backdrop on mobile.
const _origToggleSidebar = toggleSidebar;
toggleSidebar = function() {
  _origToggleSidebar();
  const sb = document.getElementById('sidebar');
  const back = ensureSidebarBackdrop();
  // Open state when sidebar is NOT closed AND we're on mobile
  if (!sb.classList.contains('closed') && window.matchMedia('(max-width: 768px)').matches) {
    back.classList.add('open');
  } else {
    back.classList.remove('open');
  }
};

/* ============================================================ */
/*                     KEYBOARD NAV                              */
/* ============================================================ */
document.addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
  if (e.key === 'ArrowRight' && !document.getElementById('next-btn').disabled) nextSlide();
  if (e.key === 'ArrowLeft' && !document.getElementById('prev-btn').disabled) prevSlide();
});

/* ============================================================ */
/*                           BOOT                                */
/* ============================================================ */
window.addEventListener('DOMContentLoaded', init);
</script>
