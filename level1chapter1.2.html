/* ---- 1. MULTIPLE RESPONSE (select all that apply) ---- */
function renderMultiResponse(slide, c) {
  const reviewMode = STATE.completed.has(slide.id);
  const correctSet = new Set(slide.correctAnswers || []);
  const optsHTML = slide.options.map((o, i) =>
    `<div class="mr-option" data-i="${i}">
       <span class="mr-check">${svgIcon('circle-check', { size: 14 })}</span>
       <span style="flex:1; min-width:0;">${o}</span>
     </div>`
  ).join('');
  c.innerHTML = `
    <div class="glass-strong w-full max-w-3xl rounded-3xl p-6 md:p-8">
      <div class="slide-eyebrow">
        <i class="fa-solid fa-list-check"></i>
        Select All That Apply${reviewMode ? ' · Review' : ''}
      </div>
      <h2 class="text-xl md:text-2xl font-bold mb-2">${slide.question}</h2>
      <p style="color:var(--text-muted); font-size:0.85rem; margin-bottom:1rem;">
        Choose every option that applies. There may be more than one correct answer.
      </p>
      <div id="mr-opts">${optsHTML}</div>
      <div style="margin-top:1.1rem; ${reviewMode ? 'display:none;' : ''}">
        <button class="btn-primary" id="mr-submit">
          <i class="fa-solid fa-circle-check" style="margin-right:0.4rem;"></i>Submit
        </button>
      </div>
      ${reviewMode ? reviewBanner(slide.explanation) : ''}
    </div>`;

  const selected = new Set(reviewMode && STATE.responses[slide.id]?.response?.selected || []);

  if (reviewMode) {
    c.querySelectorAll('.mr-option').forEach((opt, i) => {
      opt.classList.add('disabled');
      const isCorrect = correctSet.has(i);
      const wasSelected = selected.has(i);
      if (isCorrect) opt.classList.add('correct');
      else if (wasSelected) opt.classList.add('incorrect');
    });
    setNextEnabled(true);
    return;
  }

  c.querySelectorAll('.mr-option').forEach(opt => {
    opt.onclick = () => {
      const i = +opt.dataset.i;
      if (selected.has(i)) { selected.delete(i); opt.classList.remove('selected'); }
      else                 { selected.add(i);    opt.classList.add('selected'); }
    };
  });

  document.getElementById('mr-submit').onclick = () => {
    if (selected.size === 0) {
      showFeedbackModal({ type: 'info', title: 'Pick at least one', body: 'Select all options you think apply, then submit.', primary: 'OK' });
      return;
    }
    // Score: full credit only if exact match. Partial credit otherwise.
    const userArr = Array.from(selected).sort();
    const correctArr = Array.from(correctSet).sort();
    const exactMatch = userArr.length === correctArr.length && userArr.every((v, i) => v === correctArr[i]);
    const correctPicks = userArr.filter(i => correctSet.has(i)).length;
    const wrongPicks   = userArr.filter(i => !correctSet.has(i)).length;
    const partialScore = Math.max(0, (correctPicks - wrongPicks) / correctArr.length);
    const score = exactMatch ? 1 : partialScore;

    // Track attempt count
    const prev = STATE.responses[slide.id] || { attempts: 0 };
    const attemptCount = prev.attempts + 1;
    const isFinal = exactMatch || attemptCount >= 2;

    trackResponse(slide, {
      response: { selected: userArr },
      correct: exactMatch,
      attempts: attemptCount,
      // First-attempt success = full credit; second-attempt success = half credit
      score: exactMatch ? (attemptCount === 1 ? 1 : 0.5) : score,
      completed: isFinal
    });

    if (!isFinal) {
      // First attempt wrong → show what they got and let them retry.
      c.querySelectorAll('.mr-option').forEach((opt, i) => {
        const isCorrect = correctSet.has(i);
        const wasSelected = selected.has(i);
        // Mark only the wrong picks as incorrect; keep options enabled for retry.
        opt.classList.remove('selected', 'correct', 'incorrect');
        if (wasSelected && !isCorrect) opt.classList.add('incorrect');
      });
      showFeedbackModal({
        type: 'error',
        title: 'Not quite — try once more',
        body: `You earned ${Math.round(score * 100)}% on this attempt. Wrong picks are flagged in red. You have one more attempt before the answer is revealed.`,
        primary: 'Try Again',
        onPrimary: () => {
          // Clear ALL selection state — start fresh.
          selected.clear();
          c.querySelectorAll('.mr-option').forEach(opt => {
            opt.classList.remove('selected', 'incorrect', 'correct');
          });
        }
      });
      return;
    }

    // Final state — lock and reveal correct answers.
    c.querySelectorAll('.mr-option').forEach((opt, i) => {
      opt.classList.add('disabled');
      const isCorrect = correctSet.has(i);
      const wasSelected = selected.has(i);
      opt.classList.remove('selected');
      if (isCorrect) opt.classList.add('correct');
      else if (wasSelected) opt.classList.add('incorrect');
    });
    STATE.completed.add(slide.id);
    setNextEnabled(true);
    refreshSidebarState();
    if (exactMatch) confetti({ particleCount: 60, spread: 70, origin: { y: 0.7 } });
    showFeedbackModal({
      type: exactMatch ? 'success' : (score > 0 ? 'info' : 'error'),
      title: exactMatch ? 'All correct' : (score > 0 ? 'Partially correct' : 'Not quite'),
      body: (exactMatch
        ? 'You picked every correct option without any extras.'
        : `You earned ${Math.round(score * 100)}% on this question. Correct answers are highlighted in green.`)
        + (slide.explanation ? `<p style="margin-top:0.6rem;">${slide.explanation}</p>` : ''),
      primary: 'Continue'
    });
  };
  setNextEnabled(false);
}

/* ---- 2. FILL-IN-THE-BLANKS ---- */
/* slide.template = "The 48-Hour Rule says no customer should wait more than [[48 hours]] without an update."
   Brackets enclose the correct answer for each blank, in order.
   slide.acceptedAnswers (optional) = [[ "48hrs","two days" ], ...]  for fuzzy matching. */
function renderFillBlanks(slide, c) {
  const reviewMode = STATE.completed.has(slide.id);
  // Parse template into segments. The template's static text segments may
  // contain newlines (e.g. when authors put each blank on its own numbered
  // line). HTML collapses whitespace including newlines into a single space,
  // so we explicitly convert \n to <br> after escaping each static segment.
  const escapeWithBreaks = (s) => escapeHtml(s).replace(/\n/g, '<br>');
  const blanks = [];
  let html = '';
  const re = /\[\[(.+?)\]\]/g;
  let lastIdx = 0;
  let m;
  while ((m = re.exec(slide.template)) !== null) {
    html += escapeWithBreaks(slide.template.slice(lastIdx, m.index));
    const blankIdx = blanks.length;
    blanks.push(m[1]);
    html += `<input type="text" class="fb-input" data-i="${blankIdx}" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="…">`;
    lastIdx = m.index + m[0].length;
  }
  html += escapeWithBreaks(slide.template.slice(lastIdx));

  c.innerHTML = `
    <div class="glass-strong w-full max-w-3xl rounded-3xl p-6 md:p-8">
      <div class="slide-eyebrow">
        <i class="fa-solid fa-pen-to-square"></i>
        Fill in the Blanks${reviewMode ? ' · Review' : ''}
      </div>
      <h2 class="text-2xl md:text-3xl font-bold mb-3">${slide.title || 'Complete the sentence'}</h2>
      ${slide.instruction ? `<p style="color:var(--text-muted); margin-bottom:1.1rem;">${slide.instruction}</p>` : ''}
      <div class="fb-paragraph">${html}</div>
      <div style="margin-top:1.25rem; ${reviewMode ? 'display:none;' : ''}">
        <button class="btn-primary" id="fb-submit">
          <i class="fa-solid fa-circle-check" style="margin-right:0.4rem;"></i>Check
        </button>
      </div>
      ${reviewMode ? reviewBanner(slide.explanation) : ''}
    </div>`;

  const inputs = c.querySelectorAll('.fb-input');

  if (reviewMode) {
    const prev = STATE.responses[slide.id]?.response?.values || [];
    inputs.forEach((inp, i) => {
      inp.value = prev[i] || '';
      inp.classList.add('disabled');
      inp.disabled = true;
      const correct = matchesBlank(prev[i] || '', blanks[i], slide.acceptedAnswers && slide.acceptedAnswers[i]);
      inp.classList.add(correct ? 'correct' : 'incorrect');
      if (!correct) inp.title = `Correct: ${blanks[i]}`;
    });
    setNextEnabled(true);
    return;
  }

  document.getElementById('fb-submit').onclick = () => {
    const values = Array.from(inputs).map(i => i.value.trim());
    if (values.some(v => !v)) {
      showFeedbackModal({ type: 'info', title: 'Fill every blank', body: 'Type something in each blank before checking.', primary: 'OK' });
      return;
    }
    let correctCount = 0;
    const wrongIndices = [];
    inputs.forEach((inp, i) => {
      const ok = matchesBlank(values[i], blanks[i], slide.acceptedAnswers && slide.acceptedAnswers[i]);
      if (ok) correctCount++;
      else wrongIndices.push(i);
    });
    const allCorrect = correctCount === blanks.length;
    const score = correctCount / blanks.length;
    const prev = STATE.responses[slide.id] || { attempts: 0 };
    const attemptCount = prev.attempts + 1;
    const isFinal = allCorrect || attemptCount >= 2;

    trackResponse(slide, {
      response: { values },
      correct: allCorrect,
      attempts: attemptCount,
      score: allCorrect ? (attemptCount === 1 ? 1 : 0.5) : score,
      completed: isFinal
    });

    if (!isFinal) {
      // First attempt wrong → flash incorrect blanks red, re-enable for retry.
      inputs.forEach((inp, i) => {
        inp.classList.remove('correct', 'incorrect');
        if (wrongIndices.includes(i)) {
          inp.classList.add('incorrect');
          // Clear the wrong value so they have to type something different
          inp.value = '';
        } else {
          inp.classList.add('correct');
          inp.disabled = true;     // lock the right ones
          inp.classList.add('disabled');
        }
      });
      showFeedbackModal({
        type: 'error',
        title: 'Some blanks are off — try once more',
        body: `${correctCount} of ${blanks.length} correct. The wrong ones have been cleared. You have one more attempt before answers are revealed.`,
        primary: 'Try Again'
      });
      return;
    }

    // Final state — lock everything and reveal correct answers.
    inputs.forEach((inp, i) => {
      inp.disabled = true;
      inp.classList.add('disabled');
      inp.classList.remove('correct', 'incorrect');
      const ok = matchesBlank(inp.value.trim(), blanks[i], slide.acceptedAnswers && slide.acceptedAnswers[i]);
      if (ok) inp.classList.add('correct');
      else { inp.classList.add('incorrect'); inp.title = `Correct: ${blanks[i]}`; }
    });
    STATE.completed.add(slide.id);
    setNextEnabled(true);
    refreshSidebarState();
    if (allCorrect) confetti({ particleCount: 60, spread: 70, origin: { y: 0.7 } });
    showFeedbackModal({
      type: allCorrect ? 'success' : (correctCount > 0 ? 'info' : 'error'),
      title: allCorrect ? 'Perfect!' : (correctCount > 0 ? `${correctCount} of ${blanks.length} correct` : 'Not quite'),
      body: (allCorrect
        ? 'Every blank filled correctly.'
        : 'Hover an incorrect blank to see the expected answer.')
        + (slide.explanation ? `<p style="margin-top:0.6rem;">${slide.explanation}</p>` : ''),
      primary: 'Continue'
    });
  };
  setNextEnabled(false);
}
function matchesBlank(input, expected, accepted) {
  const norm = s => (s || '').toLowerCase().replace(/\s+/g, ' ').trim();
  if (norm(input) === norm(expected)) return true;
  if (Array.isArray(accepted) && accepted.some(a => norm(a) === norm(input))) return true;
  return false;
}
function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, ch => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[ch]));
}

/* ---- 3. MATCHING PAIRS ---- */
/* slide.pairs = [{ left: "Term", right: "Definition" }, ...]
   Engine shuffles the right column and asks user to click-pair items. */
function renderMatching(slide, c) {
  const reviewMode = STATE.completed.has(slide.id);
  const pairs = slide.pairs || [];
  // Shuffle right column for display, but remember the original index
  const rightOrder = pairs.map((_, i) => i);
  if (!reviewMode) shuffleArray(rightOrder, slide.id);

  const leftHTML = pairs.map((p, i) =>
    `<div class="match-item left" data-side="left" data-i="${i}">${p.left}<span class="match-pair-num"></span></div>`
  ).join('');
  const rightHTML = rightOrder.map((origIdx, displayIdx) =>
    `<div class="match-item right" data-side="right" data-i="${origIdx}"><span class="match-pair-num"></span>${pairs[origIdx].right}</div>`
  ).join('');

  c.innerHTML = `
    <div class="glass-strong w-full max-w-4xl rounded-3xl p-6 md:p-8">
      <div class="slide-eyebrow">
        <i class="fa-solid fa-link"></i>
        Match the Pairs${reviewMode ? ' · Review' : ''}
      </div>
      <h2 class="text-2xl md:text-3xl font-bold mb-2">${slide.title}</h2>
      <p style="color:var(--text-muted); font-size:0.9rem; margin-bottom:1.25rem;">
        ${slide.instruction || 'Click an item on the left, then its match on the right. Pairs are numbered as you create them.'}
      </p>
      <div class="match-grid">
        <div class="match-column">
          <div class="match-column-header">
            <i class="fa-solid fa-tag" style="margin-right:0.4rem;"></i>${escapeHtmlAttr(slide.leftLabel || 'Terms')}
          </div>
          <div class="match-column-items">${leftHTML}</div>
        </div>
        <div class="match-column">
          <div class="match-column-header">
            <i class="fa-solid fa-book" style="margin-right:0.4rem;"></i>${escapeHtmlAttr(slide.rightLabel || 'Definitions')}
          </div>
          <div class="match-column-items">${rightHTML}</div>
        </div>
      </div>
      <div style="margin-top:1.25rem; ${reviewMode ? 'display:none;' : ''}">
        <button class="btn-primary" id="match-submit">
          <i class="fa-solid fa-circle-check" style="margin-right:0.4rem;"></i>Check Matches
        </button>
      </div>
      ${reviewMode ? reviewBanner(slide.explanation) : ''}
    </div>`;

  // pairings[leftIdx] = rightIdx
  const pairings = reviewMode ? (STATE.responses[slide.id]?.response?.pairs || {}) : {};

  const updateNumbers = () => {
    c.querySelectorAll('.match-item').forEach(el => el.querySelector('.match-pair-num').textContent = '');
    let n = 1;
    Object.keys(pairings).forEach(leftIdx => {
      const r = pairings[leftIdx];
      const lEl = c.querySelector(`.match-item.left[data-i="${leftIdx}"]`);
      const rEl = c.querySelector(`.match-item.right[data-i="${r}"]`);
      if (lEl && rEl) {
        lEl.querySelector('.match-pair-num').textContent = n;
        rEl.querySelector('.match-pair-num').textContent = n;
        n++;
      }
    });
  };

  if (reviewMode) {
    Object.keys(pairings).forEach(leftIdx => {
      const r = pairings[leftIdx];
      const correct = parseInt(leftIdx) === parseInt(r);
      const lEl = c.querySelector(`.match-item.left[data-i="${leftIdx}"]`);
      const rEl = c.querySelector(`.match-item.right[data-i="${r}"]`);
      [lEl, rEl].forEach(el => {
        if (!el) return;
        el.classList.add('disabled');
        el.classList.add(correct ? 'matched-correct' : 'matched-incorrect');
      });
    });
    updateNumbers();
    setNextEnabled(true);
    return;
  }

  let pendingLeft = null;
  c.querySelectorAll('.match-item').forEach(el => {
    el.onclick = () => {
      const side = el.dataset.side;
      const idx = +el.dataset.i;
      if (side === 'left') {
        // Select / deselect
        c.querySelectorAll('.match-item.left').forEach(x => x.classList.remove('selected'));
        if (pendingLeft === idx) { pendingLeft = null; return; }
        pendingLeft = idx;
        el.classList.add('selected');
        // If already paired, unpair
        if (pairings[idx] !== undefined) delete pairings[idx];
        updateNumbers();
      } else if (side === 'right') {
        if (pendingLeft === null) return;
        // Unpair any other left that points to this right
        Object.keys(pairings).forEach(k => {
          if (pairings[k] === idx) delete pairings[k];
        });
        pairings[pendingLeft] = idx;
        c.querySelectorAll('.match-item.left').forEach(x => x.classList.remove('selected'));
        pendingLeft = null;
        updateNumbers();
      }
    };
  });

  document.getElementById('match-submit').onclick = () => {
    if (Object.keys(pairings).length < pairs.length) {
      showFeedbackModal({ type: 'info', title: 'Finish your matches', body: `Match all ${pairs.length} items before checking.`, primary: 'OK' });
      return;
    }
    let correctCount = 0;
    const correctLeftIndices = new Set();
    Object.keys(pairings).forEach(leftIdx => {
      const r = pairings[leftIdx];
      const correct = parseInt(leftIdx) === parseInt(r);
      if (correct) { correctCount++; correctLeftIndices.add(parseInt(leftIdx)); }
    });
    const allCorrect = correctCount === pairs.length;
    const score = correctCount / pairs.length;
    const prev = STATE.responses[slide.id] || { attempts: 0 };
    const attemptCount = prev.attempts + 1;
    const isFinal = allCorrect || attemptCount >= 2;

    trackResponse(slide, {
      response: { pairs: pairings },
      correct: allCorrect,
      attempts: attemptCount,
      score: allCorrect ? (attemptCount === 1 ? 1 : 0.5) : score,
      completed: isFinal
    });

    if (!isFinal) {
      // First attempt wrong → lock the correct ones, clear the wrong ones for retry.
      const wrongPairings = {};
      Object.keys(pairings).forEach(leftIdx => {
        const r = pairings[leftIdx];
        const correct = parseInt(leftIdx) === parseInt(r);
        const lEl = c.querySelector(`.match-item.left[data-i="${leftIdx}"]`);
        const rEl = c.querySelector(`.match-item.right[data-i="${r}"]`);
        if (correct) {
          [lEl, rEl].forEach(el => { if (el) { el.classList.add('disabled', 'matched-correct'); } });
        } else {
          [lEl, rEl].forEach(el => {
            if (el) { el.classList.remove('matched-incorrect', 'selected'); }
          });
          wrongPairings[leftIdx] = r;
        }
      });
      // Remove wrong pairings so user can re-try them
      Object.keys(wrongPairings).forEach(k => delete pairings[k]);
      updateNumbers();
      pendingLeft = null;
      showFeedbackModal({
        type: 'error',
        title: 'Some pairs are off — try once more',
        body: `${correctCount} of ${pairs.length} correct. The right ones are locked in green. Re-pair the rest. You have one more attempt.`,
        primary: 'Try Again'
      });
      return;
    }

    // Final state — lock everything
    Object.keys(pairings).forEach(leftIdx => {
      const r = pairings[leftIdx];
      const correct = parseInt(leftIdx) === parseInt(r);
      const lEl = c.querySelector(`.match-item.left[data-i="${leftIdx}"]`);
      const rEl = c.querySelector(`.match-item.right[data-i="${r}"]`);
      [lEl, rEl].forEach(el => {
        if (!el) return;
        el.classList.add('disabled');
        el.classList.remove('matched-correct', 'matched-incorrect', 'selected');
        el.classList.add(correct ? 'matched-correct' : 'matched-incorrect');
      });
    });
    STATE.completed.add(slide.id);
    setNextEnabled(true);
    refreshSidebarState();
    if (allCorrect) confetti({ particleCount: 70, spread: 80, origin: { y: 0.7 } });
    showFeedbackModal({
      type: allCorrect ? 'success' : (correctCount > 0 ? 'info' : 'error'),
      title: allCorrect ? 'All matched!' : `${correctCount} of ${pairs.length} correct`,
      body: (allCorrect ? 'Every pair correctly matched.' : 'Mismatched pairs are highlighted in red.')
        + (slide.explanation ? `<p style="margin-top:0.6rem;">${slide.explanation}</p>` : ''),
      primary: 'Continue'
    });
  };
  setNextEnabled(false);
}

/* ---- 4. PROCESS SEQUENCING ---- */
/* slide.steps = ["Step 1...", "Step 2...", "Step 3..."] in correct order.
   Engine shuffles for display; user reorders by drag-or-button. */
function renderSequencing(slide, c) {
  const reviewMode = STATE.completed.has(slide.id);
  const steps = slide.steps || [];
  // Each item carries its CORRECT index; the rendered order may be shuffled.
  let order;
  if (reviewMode) {
    order = STATE.responses[slide.id]?.response?.order || steps.map((_, i) => i);
  } else {
    order = steps.map((_, i) => i);
    shuffleArray(order, slide.id);
  }

  const renderList = () => {
    const html = order.map((origIdx, pos) => `
      <div class="seq-item" data-orig="${origIdx}" data-pos="${pos}" ${reviewMode ? '' : 'draggable="true"'}>
        <span class="seq-num">${pos + 1}</span>
        <span class="seq-handle" aria-hidden="true">${svgIcon('grip-vertical', { size: 16 })}</span>
        <span class="seq-text">${steps[origIdx]}</span>
        ${reviewMode ? '' : `
          <span class="seq-controls">
            <button class="seq-btn" data-act="up" ${pos === 0 ? 'disabled' : ''} aria-label="Move up">${svgIcon('arrow-up', { size: 14 })}</button>
            <button class="seq-btn" data-act="down" ${pos === order.length - 1 ? 'disabled' : ''} aria-label="Move down">${svgIcon('arrow-down', { size: 14 })}</button>
          </span>`}
      </div>`).join('');
    document.getElementById('seq-list').innerHTML = html;
    if (!reviewMode) wireSequencing();
  };

  c.innerHTML = `
    <div class="glass-strong w-full max-w-3xl rounded-3xl p-6 md:p-8">
      <div class="slide-eyebrow">
        <i class="fa-solid fa-arrow-down-1-9"></i>
        Put in Order${reviewMode ? ' · Review' : ''}
      </div>
      <h2 class="text-2xl md:text-3xl font-bold mb-2">${slide.title}</h2>
      <p style="color:var(--text-muted); font-size:0.9rem; margin-bottom:1.1rem;">
        ${slide.instruction || 'Drag the steps into the correct order, or use the up/down buttons.'}
      </p>
      <div class="seq-list" id="seq-list"></div>
      <div style="margin-top:1.25rem; ${reviewMode ? 'display:none;' : ''}">
        <button class="btn-primary" id="seq-submit">
          <i class="fa-solid fa-circle-check" style="margin-right:0.4rem;"></i>Check Order
        </button>
      </div>
      ${reviewMode ? reviewBanner(slide.explanation) : ''}
    </div>`;

  function wireSequencing() {
    const items = c.querySelectorAll('.seq-item');
    let dragged = null;
    let seqStopAutoScroll = null;
    items.forEach(el => {
      el.addEventListener('dragstart', () => {
        dragged = el; el.classList.add('dragging');
        seqStopAutoScroll = startEdgeAutoScroll();
      });
      el.addEventListener('dragend', () => {
        el.classList.remove('dragging'); dragged = null;
        c.querySelectorAll('.seq-item').forEach(x => x.classList.remove('drop-above', 'drop-below'));
        if (seqStopAutoScroll) { seqStopAutoScroll(); seqStopAutoScroll = null; }
      });
      el.addEventListener('dragover', e => {
        e.preventDefault();
        if (!dragged || dragged === el) return;
        const rect = el.getBoundingClientRect();
        const above = e.clientY < rect.top + rect.height / 2;
        c.querySelectorAll('.seq-item').forEach(x => x.classList.remove('drop-above', 'drop-below'));
        el.classList.add(above ? 'drop-above' : 'drop-below');
      });
      el.addEventListener('drop', e => {
        e.preventDefault();
        if (!dragged || dragged === el) return;
        const fromOrig = +dragged.dataset.orig;
        const targetOrig = +el.dataset.orig;
        const rect = el.getBoundingClientRect();
        const above = e.clientY < rect.top + rect.height / 2;
        const fromIdx = order.indexOf(fromOrig);
        order.splice(fromIdx, 1);
        const targetIdx = order.indexOf(targetOrig);
        order.splice(above ? targetIdx : targetIdx + 1, 0, fromOrig);
        renderList();
      });
      const upBtn   = el.querySelector('[data-act="up"]');
      const downBtn = el.querySelector('[data-act="down"]');
      if (upBtn) upBtn.onclick = () => {
        const pos = +el.dataset.pos;
        if (pos > 0) { [order[pos - 1], order[pos]] = [order[pos], order[pos - 1]]; renderList(); }
      };
      if (downBtn) downBtn.onclick = () => {
        const pos = +el.dataset.pos;
        if (pos < order.length - 1) { [order[pos], order[pos + 1]] = [order[pos + 1], order[pos]]; renderList(); }
      };
    });
  }

  renderList();

  if (reviewMode) {
    // Mark items correct/incorrect based on stored order
    c.querySelectorAll('.seq-item').forEach((el, pos) => {
      const origIdx = +el.dataset.orig;
      el.classList.add('disabled');
      el.classList.add(origIdx === pos ? 'correct' : 'incorrect');
    });
    setNextEnabled(true);
    return;
  }

  document.getElementById('seq-submit').onclick = () => {
    let correctCount = 0;
    c.querySelectorAll('.seq-item').forEach((el, pos) => {
      const origIdx = +el.dataset.orig;
      if (origIdx === pos) correctCount++;
    });
    const allCorrect = correctCount === steps.length;
    const score = correctCount / steps.length;
    const prev = STATE.responses[slide.id] || { attempts: 0 };
    const attemptCount = prev.attempts + 1;
    const isFinal = allCorrect || attemptCount >= 2;

    trackResponse(slide, {
      response: { order: order.slice() },
      correct: allCorrect,
      attempts: attemptCount,
      score: allCorrect ? (attemptCount === 1 ? 1 : 0.5) : score,
      completed: isFinal
    });

    if (!isFinal) {
      // First attempt → flash colour for 1.5s, then re-enable for retry.
      c.querySelectorAll('.seq-item').forEach((el, pos) => {
        const origIdx = +el.dataset.orig;
        el.classList.remove('correct', 'incorrect');
        el.classList.add(origIdx === pos ? 'correct' : 'incorrect');
      });
      showFeedbackModal({
        type: 'error',
        title: 'Some steps out of place — try once more',
        body: `${correctCount} of ${steps.length} in the right position. You have one more attempt before answers are revealed.`,
        primary: 'Try Again',
        onPrimary: () => {
          // Clear feedback colors so user can re-arrange
          c.querySelectorAll('.seq-item').forEach(el => el.classList.remove('correct', 'incorrect'));
        }
      });
      return;
    }

    // Final state — lock everything
    c.querySelectorAll('.seq-item').forEach((el, pos) => {
      const origIdx = +el.dataset.orig;
      el.classList.add('disabled');
      el.querySelectorAll('.seq-btn').forEach(b => b.disabled = true);
      el.classList.remove('correct', 'incorrect');
      el.classList.add(origIdx === pos ? 'correct' : 'incorrect');
    });
    STATE.completed.add(slide.id);
    setNextEnabled(true);
    refreshSidebarState();
    if (allCorrect) confetti({ particleCount: 70, spread: 80, origin: { y: 0.7 } });
    showFeedbackModal({
      type: allCorrect ? 'success' : (correctCount > 0 ? 'info' : 'error'),
      title: allCorrect ? 'Perfect order!' : `${correctCount} of ${steps.length} in place`,
      body: (allCorrect ? 'You arranged every step correctly.' : 'Steps in red are out of place.')
        + (slide.explanation ? `<p style="margin-top:0.6rem;">${slide.explanation}</p>` : ''),
      primary: 'Continue'
    });
  };
  setNextEnabled(false);
}

/* Deterministic shuffle using slide.id as seed so the order is stable
   across re-renders within the same session (otherwise drag-drop
   feedback gets weird if items keep moving). */
function shuffleArray(arr, seed) {
  let s = (typeof seed === 'number' ? seed : 1) * 9301 + 49297;
  for (let i = arr.length - 1; i > 0; i--) {
    s = (s * 9301 + 49297) % 233280;
    const j = Math.floor((s / 233280) * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

/* ---- 5. IMAGE IDENTIFICATION (find-the-X on an image) ---- */
/* slide.targets = [{ x, y, radius, label, info }, ...]  (x,y as %; radius in % too)
   User clicks anywhere on the image. Hits within radius of any target = found.
   slide.maxMisses (optional) = limit on wrong clicks before auto-fail. */
function renderImageId(slide, c) {
  const reviewMode = STATE.completed.has(slide.id);
  c.innerHTML = `
    <div class="glass-strong w-full max-w-4xl rounded-3xl p-6 md:p-8">
      <div class="slide-eyebrow">
        <i class="fa-solid fa-bullseye"></i>
        Find on Image${reviewMode ? ' · Review' : ''}
      </div>
      <h2 class="text-2xl md:text-3xl font-bold mb-2">${slide.title}</h2>
      <p style="color:var(--text-muted); font-size:0.9rem; margin-bottom:1.1rem;">
        ${slide.instruction || `Click on the image to find ${slide.targets.length} items.`}
      </p>
      <div class="imgid-stage" id="imgid-stage">
        <img src="${slide.imageUrl}" alt="${slide.title}">
      </div>
      <div class="imgid-progress" id="imgid-progress"></div>
      <div id="imgid-info" style="margin-top:0.85rem; padding:0.85rem 1rem; background:var(--surface); border:1px solid var(--border); border-radius:10px; min-height:48px;">
        <i class="fa-regular fa-circle-question" style="color:var(--accent); margin-right:0.5rem;"></i>
        Click on the image to find each target.
      </div>
      ${reviewMode ? reviewBanner(slide.explanation) : ''}
    </div>`;

  const stage = document.getElementById('imgid-stage');
  const targets = slide.targets || [];
  const found = new Set(reviewMode ? (STATE.responses[slide.id]?.response?.found || []) : []);

  const renderProgress = () => {
    const pips = targets.map((_, i) => `<span class="imgid-pip ${found.has(i) ? 'found' : ''}"></span>`).join('');
    document.getElementById('imgid-progress').innerHTML =
      `<span style="font-size:0.85rem; color:var(--text-muted); margin-right:0.5rem;">${found.size} / ${targets.length} found</span>${pips}`;
  };
  const renderFoundMarkers = () => {
    found.forEach(idx => {
      if (stage.querySelector(`[data-found="${idx}"]`)) return;
      const t = targets[idx];
      const m = document.createElement('div');
      m.className = 'imgid-marker found';
      m.dataset.found = idx;
      m.style.left = t.x + '%';
      m.style.top = t.y + '%';
      m.innerHTML = svgIcon('circle-check', { size: 18 });
      stage.appendChild(m);
    });
  };

  renderProgress();
  renderFoundMarkers();

  if (reviewMode) {
    stage.style.cursor = 'default';
    setNextEnabled(true);
    return;
  }

  let misses = 0;
  stage.onclick = (e) => {
    const rect = stage.querySelector('img').getBoundingClientRect();
    const px = ((e.clientX - rect.left) / rect.width) * 100;
    const py = ((e.clientY - rect.top) / rect.height) * 100;
    // Find any target within its radius
    let hitIdx = -1;
    for (let i = 0; i < targets.length; i++) {
      if (found.has(i)) continue;
      const t = targets[i];
      const r = t.radius || 8;
      const dx = px - t.x, dy = py - t.y;
      if (Math.sqrt(dx*dx + dy*dy) <= r) { hitIdx = i; break; }
    }
    if (hitIdx >= 0) {
      found.add(hitIdx);
      renderFoundMarkers();
      renderProgress();
      document.getElementById('imgid-info').innerHTML =
        `<strong style="color:var(--accent-strong);">${targets[hitIdx].label || ('#' + (hitIdx+1))}.</strong> <span class="rt-rendered">${renderRichTextOrPlain(targets[hitIdx].info || 'Found!')}</span>`;
      if (found.size === targets.length) {
        STATE.completed.add(slide.id);
        trackResponse(slide, {
          response: { found: Array.from(found), misses },
          correct: misses === 0,
          attempts: 1,
          score: Math.max(0, 1 - misses * 0.1),
          completed: true
        });
        setNextEnabled(true);
        refreshSidebarState();
        confetti({ particleCount: 80, spread: 80, origin: { y: 0.7 } });
        showFeedbackModal({
          type: 'success',
          title: misses === 0 ? 'Perfect spotting!' : 'All found',
          body: misses === 0 ? 'You found every target without a single miss.' : `You found all ${targets.length} targets with ${misses} miss${misses === 1 ? '' : 'es'}.`,
          primary: 'Continue'
        });
      }
    } else {
      misses++;
      // Drop a quick miss marker
      const miss = document.createElement('div');
      miss.className = 'imgid-marker miss';
      miss.style.left = px + '%';
      miss.style.top = py + '%';
      miss.innerHTML = svgIcon('circle-xmark', { size: 18 });
      stage.appendChild(miss);
      setTimeout(() => miss.remove(), 1000);
    }
  };
  setNextEnabled(false);
}

/* ---- 6. INTERACTIVE SLIDER ---- */
/* slide.min, slide.max, slide.step, slide.unit, slide.startValue
   slide.outputs (optional) = array of { ifMin, ifMax, message }
     to render different output text based on the value. If absent,
     shows a simple "You chose X" message. */
function renderSlider(slide, c) {
  const reviewMode = STATE.completed.has(slide.id);
  const min = slide.min ?? 0;
  const max = slide.max ?? 100;
  const step = slide.step ?? 1;
  const initial = reviewMode ? (STATE.responses[slide.id]?.response?.value ?? slide.startValue ?? min) : (slide.startValue ?? Math.round((min + max) / 2));

  c.innerHTML = `
    <div class="glass-strong w-full max-w-3xl rounded-3xl p-6 md:p-8">
      <div class="slide-eyebrow">
        <i class="fa-solid fa-sliders"></i>
        Slider${reviewMode ? ' · Review' : ''}
      </div>
      <h2 class="text-2xl md:text-3xl font-bold mb-2">${slide.title}</h2>
      ${slide.body ? `<div class="rt-rendered" style="color:var(--text-muted); margin-bottom:1.25rem; line-height:1.55;">${renderRichTextOrPlain(slide.body)}</div>` : ''}
      <div class="slider-stage">
        <div class="slider-readout">
          <span class="slider-value" id="slider-value">${initial}</span>
          <span class="slider-suffix">${slide.unit || ''}</span>
        </div>
        <input type="range" class="activity-slider" id="slider-input" min="${min}" max="${max}" step="${step}" value="${initial}" ${reviewMode ? 'disabled' : ''}>
        <div class="slider-ends">
          <span>${slide.minLabel || min + (slide.unit || '')}</span>
          <span>${slide.maxLabel || max + (slide.unit || '')}</span>
        </div>
        <div class="slider-output" id="slider-output"></div>
      </div>
      ${reviewMode ? reviewBanner('Your value was recorded — slider activities are exploratory, not graded.') : ''}
      <div style="margin-top:1.25rem; ${reviewMode ? 'display:none;' : ''}">
        <button class="btn-primary" id="slider-confirm">
          <i class="fa-solid fa-circle-check" style="margin-right:0.4rem;"></i>Confirm
        </button>
      </div>
    </div>`;

  const valEl = document.getElementById('slider-value');
  const out   = document.getElementById('slider-output');
  const inp   = document.getElementById('slider-input');

  const update = (v) => {
    valEl.textContent = v;
    // Pick output message. Default is a plain string (sanitized via renderRichTextOrPlain
    // since it's already valid HTML); per-range messages may be rich.
    let msg = `You selected <strong>${v}${escapeHtmlAttr(slide.unit || '')}</strong>.`;
    if (slide.outputs && slide.outputs.length) {
      for (const o of slide.outputs) {
        if (v >= (o.ifMin ?? -Infinity) && v <= (o.ifMax ?? Infinity)) {
          msg = renderRichTextOrPlain(o.message || '');
          break;
        }
      }
    }
    out.innerHTML = msg;
  };
  update(initial);

  if (reviewMode) {
    setNextEnabled(true);
    return;
  }

  inp.oninput = () => update(+inp.value);

  document.getElementById('slider-confirm').onclick = () => {
    trackResponse(slide, {
      response: { value: +inp.value },
      correct: null,    // exploratory
      attempts: 1,
      score: null,
      completed: true
    });
    STATE.completed.add(slide.id);
    setNextEnabled(true);
    refreshSidebarState();
    showFeedbackModal({
      type: 'info',
      title: 'Got it',
      body: `You set the value to <strong>${inp.value}${slide.unit || ''}</strong>. ${slide.confirmMessage || 'Continue when ready.'}`,
      primary: 'Continue'
    });
  };
  setNextEnabled(false);
}

/* ---- 7. DIAL ---- */
/* slide.min, slide.max, slide.step, slide.unit
   Rotating dial — user drags around the perimeter to set a value. */
function renderDial(slide, c) {
  const reviewMode = STATE.completed.has(slide.id);
  const min = slide.min ?? 0, max = slide.max ?? 100, step = slide.step ?? 1;
  const initial = reviewMode ? (STATE.responses[slide.id]?.response?.value ?? min) : (slide.startValue ?? min);

  c.innerHTML = `
    <div class="glass-strong w-full max-w-3xl rounded-3xl p-6 md:p-8">
      <div class="slide-eyebrow">
        <i class="fa-solid fa-gauge"></i>
        Dial${reviewMode ? ' · Review' : ''}
      </div>
      <h2 class="text-2xl md:text-3xl font-bold mb-2">${slide.title}</h2>
      ${slide.body ? `<div class="rt-rendered" style="color:var(--text-muted); margin-bottom:0.5rem; line-height:1.55;">${renderRichTextOrPlain(slide.body)}</div>` : ''}
      <p style="color:var(--text-faint); font-size:0.85rem; margin-bottom:1rem;">
        ${reviewMode ? 'Locked at your previous value.' : 'Drag the dial pointer around to set a value.'}
      </p>
      <div class="dial-wrap">
        <div class="dial" id="dial">
          <div class="dial-pointer" id="dial-pointer"></div>
          <div class="dial-center">
            <div class="dial-value" id="dial-value">${initial}</div>
            <div class="dial-label">${slide.unit || ''}</div>
          </div>
        </div>
      </div>
      ${reviewMode ? reviewBanner('Dial activities are exploratory.') : `
      <div style="margin-top:1.25rem; text-align:center;">
        <button class="btn-primary" id="dial-confirm">
          <i class="fa-solid fa-circle-check" style="margin-right:0.4rem;"></i>Confirm
        </button>
      </div>`}
    </div>`;

  const dial = document.getElementById('dial');
  const pointer = document.getElementById('dial-pointer');
  const valEl = document.getElementById('dial-value');

  const setVal = (v) => {
    v = Math.max(min, Math.min(max, Math.round(v / step) * step));
    valEl.textContent = v;
    // 0..max maps to -135deg..+135deg (270deg sweep)
    const t = (v - min) / (max - min);
    const deg = -135 + (t * 270);
    pointer.style.transform = `translateX(-50%) rotate(${deg}deg)`;
    return v;
  };
  let current = setVal(initial);

  if (reviewMode) {
    setNextEnabled(true);
    return;
  }

  let dragging = false;
  const angleToValue = (e) => {
    const rect = dial.getBoundingClientRect();
    const cx = rect.left + rect.width / 2;
    const cy = rect.top + rect.height / 2;
    const x = (e.touches ? e.touches[0].clientX : e.clientX) - cx;
    const y = (e.touches ? e.touches[0].clientY : e.clientY) - cy;
    let deg = Math.atan2(x, -y) * (180 / Math.PI);  // -180..180, 0=top
    // Clamp into -135..135 sweep
    deg = Math.max(-135, Math.min(135, deg));
    const t = (deg + 135) / 270;
    return min + t * (max - min);
  };
  const start = (e) => { dragging = true; dial.classList.add('grabbing'); current = setVal(angleToValue(e)); e.preventDefault(); };
  const move  = (e) => { if (!dragging) return; current = setVal(angleToValue(e)); e.preventDefault(); };
  const end   = () => { dragging = false; dial.classList.remove('grabbing'); };
  dial.addEventListener('mousedown', start);
  document.addEventListener('mousemove', move);
  document.addEventListener('mouseup', end);
  dial.addEventListener('touchstart', start, { passive: false });
  document.addEventListener('touchmove', move, { passive: false });
  document.addEventListener('touchend', end);

  document.getElementById('dial-confirm').onclick = () => {
    trackResponse(slide, {
      response: { value: current },
      correct: null,
      attempts: 1,
      score: null,
      completed: true
    });
    STATE.completed.add(slide.id);
    setNextEnabled(true);
    refreshSidebarState();
    showFeedbackModal({
      type: 'info',
      title: 'Recorded',
      body: `You set the dial to <strong>${current}${slide.unit || ''}</strong>.`,
      primary: 'Continue'
    });
  };
  setNextEnabled(false);
}

/* ---- 8. DIALOGUE SIMULATION ---- */
/* slide.character = { name, role, initial }  (initial = single letter for avatar)
   slide.startMood (0-100, default 50)
   slide.nodes = {
     "start": { says: "...", choices: [{ text, moodDelta, next: "node2" }, ...] },
     "node2": { says: "...", choices: [...] },
     "end":   { says: "...", end: true, summary: "..." }
   } */
function renderDialogue(slide, c) {
  const reviewMode = STATE.completed.has(slide.id);
  const startMood = slide.startMood ?? 50;
  let mood = startMood;
  let path = [];   // { from, choiceIdx, to, moodAfter }
  const transcript = []; // { who: 'them'|'you', text }

  c.innerHTML = `
    <div class="w-full max-w-3xl">
      <div class="slide-eyebrow">
        <i class="fa-solid fa-message"></i>
        Dialogue${reviewMode ? ' · Review' : ''}
      </div>
      <h2 class="text-2xl md:text-3xl font-bold mb-3">${slide.title}</h2>
      <div class="dialogue-stage">
        <div class="dialogue-character">
          <div class="dialogue-avatar">${(slide.character.initial || slide.character.name || '?').charAt(0)}</div>
          <div class="dialogue-character-info">
            <div class="dialogue-name">${slide.character.name}</div>
            <div class="dialogue-role">${slide.character.role || ''}</div>
          </div>
          <div class="dialogue-mood" title="Character mood">
            ${svgIcon('comments', { size: 14 })}
            <div class="dialogue-mood-bar"><div class="dialogue-mood-fill" id="mood-fill"></div></div>
          </div>
        </div>
        <div class="dialogue-transcript" id="dlg-transcript"></div>
        <div class="dialogue-choices" id="dlg-choices"></div>
      </div>
      ${reviewMode ? reviewBanner('Dialogue path locked. Your full conversation is shown above.') : ''}
    </div>`;

  const moodFill = document.getElementById('mood-fill');
  const transcriptEl = document.getElementById('dlg-transcript');
  const choicesEl = document.getElementById('dlg-choices');

  const updateMood = () => {
    moodFill.style.width = mood + '%';
    moodFill.style.background = mood >= 66 ? 'var(--success)' : (mood >= 33 ? 'var(--accent)' : 'var(--error)');
  };
  const addBubble = (who, text) => {
    transcript.push({ who, text });
    const b = document.createElement('div');
    b.className = `dialogue-bubble ${who} rt-rendered`;
    b.innerHTML = renderRichTextOrPlain(text || '');
    transcriptEl.appendChild(b);
    transcriptEl.scrollTop = transcriptEl.scrollHeight;
  };
  const showNode = (key) => {
    const node = slide.nodes[key];
    if (!node) return;
    addBubble('them', node.says);
    if (node.end) {
      choicesEl.innerHTML = `<div class="rt-rendered" style="text-align:center; color:var(--text-muted); font-size:0.9rem;">${renderRichTextOrPlain(node.summary || 'Conversation ended.')}</div>`;
      // Auto-complete at end node
      const finalCorrect = mood >= (slide.passingMood ?? 60);
      trackResponse(slide, {
        response: { path, finalMood: mood, transcript: transcript.slice() },
        correct: finalCorrect,
        attempts: 1,
        score: Math.max(0, Math.min(1, mood / 100)),
        completed: true
      });
      STATE.completed.add(slide.id);
      setNextEnabled(true);
      refreshSidebarState();
      if (finalCorrect) confetti({ particleCount: 60, spread: 70, origin: { y: 0.7 } });
      setTimeout(() => {
        showFeedbackModal({
          type: finalCorrect ? 'success' : 'info',
          title: finalCorrect ? 'Conversation handled well' : 'Conversation complete',
          body: (node.summary || `Final mood: ${mood}/100.`),
          primary: 'Continue'
        });
      }, 400);
      return;
    }
    const choices = node.choices || [];
    choicesEl.innerHTML = choices.map((ch, i) =>
      `<button class="dialogue-choice" data-i="${i}">${ch.text}</button>`
    ).join('');
    choicesEl.querySelectorAll('.dialogue-choice').forEach(btn => {
      btn.onclick = () => {
        const i = +btn.dataset.i;
        const ch = choices[i];
        addBubble('you', ch.text);
        mood = Math.max(0, Math.min(100, mood + (ch.moodDelta || 0)));
        updateMood();
        path.push({ from: key, choiceIdx: i, to: ch.next, moodAfter: mood });
        choicesEl.innerHTML = '';
        setTimeout(() => showNode(ch.next), 300);
      };
    });
  };

  if (reviewMode) {
    const stored = STATE.responses[slide.id]?.response;
    if (stored?.transcript) {
      stored.transcript.forEach(t => addBubble(t.who, t.text));
    }
    mood = stored?.finalMood ?? startMood;
    updateMood();
    choicesEl.innerHTML = `<div style="text-align:center; color:var(--text-muted); font-size:0.9rem;">Conversation locked. Final mood: ${mood}/100.</div>`;
    setNextEnabled(true);
    return;
  }

  updateMood();
  showNode(slide.startNode || 'start');
  setNextEnabled(false);
}

/* ---- 9. INTERACTIVE TIMELINE (chronological journey) ---- */
/* slide.stops = [{ label, date, content }, ...]
   User clicks each stop to read its content. Must visit all to continue. */
function renderInteractiveTimeline(slide, c) {
  const reviewMode = STATE.completed.has(slide.id);
  const stops = slide.stops || [];
  const visited = new Set(reviewMode ? stops.map((_, i) => i) : []);

  c.innerHTML = `
    <div class="glass-strong w-full max-w-5xl rounded-3xl p-6 md:p-8">
      <div class="slide-eyebrow">
        <i class="fa-solid fa-route"></i>
        Journey${reviewMode ? ' · Review' : ''}
      </div>
      <h2 class="text-2xl md:text-3xl font-bold mb-2">${slide.title}</h2>
      <p style="color:var(--text-muted); font-size:0.9rem; margin-bottom:1rem;">
        ${slide.instruction || `Click each stop on the journey to learn more (${stops.length} in total).`}
      </p>
      <div class="itimeline-wrap">
        <div class="itimeline-track" id="itl-track"></div>
      </div>
      <div class="itimeline-detail" id="itl-detail">
        <i class="fa-regular fa-circle-question" style="color:var(--accent); margin-right:0.5rem;"></i>
        Tap a stop above to begin the journey.
      </div>
      ${reviewMode ? reviewBanner('Journey complete — you can revisit any stop.') : ''}
    </div>`;

  const track = document.getElementById('itl-track');
  const detail = document.getElementById('itl-detail');

  const renderStops = (activeIdx) => {
    track.innerHTML = stops.map((s, i) => `
      <div class="itimeline-stop ${visited.has(i) ? 'completed' : ''} ${activeIdx === i ? 'active' : ''}" data-i="${i}">
        <div class="itimeline-dot">${visited.has(i) ? svgIcon('circle-check', { size: 18 }) : (i + 1)}</div>
        <div class="itimeline-label">${s.label}</div>
        ${s.date ? `<div class="itimeline-date">${s.date}</div>` : ''}
      </div>`).join('');
    track.querySelectorAll('.itimeline-stop').forEach(el => {
      el.onclick = () => {
        const i = +el.dataset.i;
        visited.add(i);
        renderStops(i);
        detail.innerHTML = `<strong style="color:var(--accent-strong);">${escapeHtmlAttr(stops[i].label || '')}</strong><div class="rt-rendered" style="margin-top:0.4rem; line-height:1.55;">${renderRichTextOrPlain(stops[i].content || '')}</div>`;
        if (visited.size === stops.length && !STATE.completed.has(slide.id)) {
          STATE.completed.add(slide.id);
          trackResponse(slide, {
            response: { completed: Array.from(visited) },
            correct: true,
            attempts: 1,
            score: 1,
            completed: true
          });
          setNextEnabled(true);
          refreshSidebarState();
          confetti({ particleCount: 60, spread: 70, origin: { y: 0.7 } });
        }
      };
    });
  };
  renderStops(reviewMode ? 0 : -1);
  if (reviewMode) {
    detail.innerHTML = `<strong style="color:var(--accent-strong);">${escapeHtmlAttr(stops[0]?.label || '')}</strong><div class="rt-rendered" style="margin-top:0.4rem; line-height:1.55;">${renderRichTextOrPlain(stops[0]?.content || '')}</div>`;
    setNextEnabled(true);
    return;
  }
  setNextEnabled(false);
}

/* ---- 10. CONFIDENCE-BASED ASSESSMENT ---- */
/* Same shape as quiz, plus a confidence rating after the answer.
   Score weighted: correct + high confidence > correct + low confidence > wrong + low > wrong + high. */
function renderConfidence(slide, c) {
  const reviewMode = STATE.completed.has(slide.id);
  const optsHTML = slide.options.map((o, i) =>
    `<div class="quiz-option" data-i="${i}">${o}</div>`
  ).join('');
  c.innerHTML = `
    <div class="glass-strong w-full max-w-3xl rounded-3xl p-6 md:p-8">
      <div class="slide-eyebrow">
        <i class="fa-solid fa-chart-simple"></i>
        Confidence Check${reviewMode ? ' · Review' : ''}
      </div>
      <h2 class="text-xl md:text-2xl font-bold mb-3">${slide.question}</h2>
      <p style="color:var(--text-muted); font-size:0.85rem; margin-bottom:1rem;">
        Pick your answer first, then rate how confident you are. Confidence affects your score: confident-and-right pays more, confident-and-wrong costs more.
      </p>
      <div id="conf-opts">${optsHTML}</div>
      <div class="conf-stage" id="conf-stage" style="display:none;">
        <div class="conf-stage-title">${svgIcon('chart-simple', { size: 14 })}<span>How confident are you?</span></div>
        <div class="conf-buttons">
          <button class="conf-btn" data-c="1">Guessing<br>20%</button>
          <button class="conf-btn" data-c="2">Unsure<br>40%</button>
          <button class="conf-btn" data-c="3">Probably<br>60%</button>
          <button class="conf-btn" data-c="4">Likely<br>80%</button>
          <button class="conf-btn" data-c="5">Certain<br>100%</button>
        </div>
      </div>
      ${reviewMode ? reviewBanner(slide.explanation) : ''}
    </div>`;

  if (reviewMode) {
    const prev = STATE.responses[slide.id]?.response;
    c.querySelectorAll('.quiz-option').forEach((opt, i) => {
      opt.classList.add('disabled');
      if (i === slide.correctAnswer) opt.classList.add('correct');
      if (prev?.selected === i && i !== slide.correctAnswer) opt.classList.add('incorrect');
    });
    setNextEnabled(true);
    return;
  }

  let pickedIdx = null;
  c.querySelectorAll('.quiz-option').forEach(opt => {
    opt.onclick = () => {
      pickedIdx = +opt.dataset.i;
      c.querySelectorAll('.quiz-option').forEach(o => { o.classList.remove('selected'); o.classList.add('disabled'); });
      opt.classList.remove('disabled');
      opt.classList.add('selected');
      // Reveal confidence buttons
      document.getElementById('conf-stage').style.display = 'block';
    };
  });

  c.querySelectorAll('.conf-btn').forEach(btn => {
    btn.onclick = () => {
      if (pickedIdx === null) return;
      const conf = +btn.dataset.c; // 1..5
      c.querySelectorAll('.conf-btn').forEach(b => b.classList.remove('selected'));
      btn.classList.add('selected');
      // Lock everything down
      const correct = pickedIdx === slide.correctAnswer;
      // Weighted score:
      //   correct & confident=5 → 1.0
      //   correct & confident=1 → 0.4
      //   wrong   & confident=1 → 0.1 (small forgiveness for honesty)
      //   wrong   & confident=5 → 0 (penalize overconfidence)
      const score = correct ? (0.2 + conf * 0.16) : Math.max(0, 0.2 - conf * 0.05);

      c.querySelectorAll('.quiz-option').forEach((opt, i) => {
        opt.classList.add('disabled');
        if (i === slide.correctAnswer) opt.classList.add('correct');
        if (i === pickedIdx && i !== slide.correctAnswer) opt.classList.add('incorrect');
      });
      c.querySelectorAll('.conf-btn').forEach(b => b.disabled = true);

      trackResponse(slide, {
        response: { selected: pickedIdx, confidence: conf },
        correct,
        attempts: 1,
        score,
        completed: true
      });
      STATE.completed.add(slide.id);
      setNextEnabled(true);
      refreshSidebarState();
      if (correct && conf >= 4) confetti({ particleCount: 60, spread: 70, origin: { y: 0.7 } });
      const labels = ['', 'guessing', 'unsure', 'probably right', 'likely right', 'certain'];
      let msg;
      if (correct && conf >= 4)      msg = 'Confident and correct — full credit.';
      else if (correct && conf <= 2) msg = 'You were right but unsure. Partial credit awarded.';
      else if (!correct && conf >= 4) msg = 'Confident but wrong — overconfidence costs the most.';
      else                            msg = 'Wrong answer, but your honest low confidence keeps the penalty small.';
      showFeedbackModal({
        type: correct ? 'success' : 'info',
        title: correct ? 'Correct' : 'Incorrect',
        body: `${msg}<br><strong>Score: ${Math.round(score * 100)}%</strong>${slide.explanation ? `<p style="margin-top:0.6rem;">${slide.explanation}</p>` : ''}`,
        primary: 'Continue'
      });
    };
  });
  setNextEnabled(false);
}
