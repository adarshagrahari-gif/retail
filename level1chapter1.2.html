      try {
        // Reset the in-flight animation if the API supports it
        if (typeof origConfetti.reset === 'function') origConfetti.reset();
        // Remove any canvas-confetti canvases from the DOM
        document.querySelectorAll('canvas').forEach(c => {
          // canvas-confetti's canvas is full-screen, position:fixed, no id
          // We identify it by its inline style fingerprint
          const s = c.style;
          if (s.position === 'fixed' && s.pointerEvents === 'none' &&
              (s.top === '0px' || s.top === '0') &&
              (s.left === '0px' || s.left === '0') &&
              c.parentNode === document.body) {
            c.remove();
          }
        });
      } catch (e) { /* swallow */ }
    }, 6000);
  };
  window.confetti = function(...args) {
    const ret = origConfetti.apply(this, args);
    scheduleCleanup();
    return ret;
  };
  // Preserve any sub-API on the original
  Object.keys(origConfetti).forEach(k => { window.confetti[k] = origConfetti[k]; });
})();

/* ============================================================ */
/*                  RESPONSE TRACKING                            */
/* ============================================================ */
/*
  Single entry point for all activity tracking. Renderers call this
  whenever the user submits or mutates an answer. Updates STATE.responses,
  keeps legacy fields in sync, and emits an xAPI 'answered' statement.
*/
function trackResponse(slide, partial) {
  const slideId = slide.id;
  const existing = STATE.responses[slideId] || {
    slideId,
    type: slide.type,
    response: null,
    correct: null,
    attempts: 0,
    score: null,
    startedAt: Date.now(),
    completedAt: null
  };
  const merged = Object.assign(existing, partial, {
    slideId,
    type: slide.type,
    completedAt: partial.completed ? Date.now() : existing.completedAt
  });
  STATE.responses[slideId] = merged;

  // Mirror to legacy fields so older code paths (e.g. results dashboard)
  // continue to work without a full sweep.
  if (slide.type === 'quiz' && merged.response) {
    STATE.answers[slideId] = {
      selected: merged.response.selected,
      correct: merged.correct,
      attempts: merged.attempts
    };
    STATE.attempts[slideId] = merged.attempts;
  }
  if (slide.type === 'scenario' && merged.response) {
    STATE.scenarioPicks[slideId] = merged.response.selected;
  }
  if (slide.type === 'video' && merged.response) {
    STATE.videoWatched[slideId] = !!merged.response.watchedToEnd;
  }

  // xAPI for any auto-scoreable activity
  if (typeof xapiAnswered === 'function' && merged.correct !== null) {
    try { xapiAnswered(slide, merged.response, merged.correct); } catch(e) {}
  }

  // Persist progress to SCORM after every answer. This is more granular
  // than the per-nav save, but it means a learner who answers a question
  // and immediately closes the tab still has that answer preserved on
  // resume — not just the slide they were sitting on.
  if (typeof saveBookmark === 'function') {
    try { saveBookmark(); } catch(e) {}
  }
}

/*
  Returns a JSON-serializable snapshot of all tracked responses plus
  module-level metadata. Useful for LMS exports, debugging, and the
  Results dashboard. Exposed on window so external code can grab it.
*/
function getTrackingExport() {
  const slides = COURSE_CONFIG.slides;
  const responses = Object.values(STATE.responses);
  const scoreable = responses.filter(r => r.correct !== null);
  const correctCount = scoreable.filter(r => r.correct).length;
  return {
    courseTitle: COURSE_CONFIG.settings.courseTitle,
    startedAt: STATE.startTime,
    elapsedSeconds: Math.round((Date.now() - STATE.startTime) / 1000),
    totalSlides: slides.length,
    completedSlides: STATE.completed.size,
    scoreablePoints: scoreable.length,
    correctPoints: correctCount,
    scorePct: scoreable.length ? Math.round((correctCount / scoreable.length) * 100) : null,
    passingScore: COURSE_CONFIG.settings.passingScore,
    responses
  };
}
if (typeof window !== 'undefined') window.getTrackingExport = getTrackingExport;

/*
  Aggregate scores by topic. Authors tag each scoreable slide with
  `topic: "Communication"` (or any string). Slides without a topic
  fall into "Other". Returns: [{ topic, total, earned, scorePct, slidesWrong }, ...]
  sorted by scorePct ASC so the weakest area surfaces first.
*/
function getTopicBreakdown() {
  const slidesById = {};
  COURSE_CONFIG.slides.forEach(s => slidesById[s.id] = s);
  const buckets = {};
  Object.values(STATE.responses).forEach(r => {
    if (r.correct === null || r.score === null) return;
    const slide = slidesById[r.slideId];
    if (!slide) return;
    const topic = slide.topic || 'General';
    // Each slide can have a weight; defaults to 1.0. Weights scale a slide's
    // contribution to its topic's score (and to the overall score).
    const weight = (typeof slide.weight === 'number' && slide.weight > 0) ? slide.weight : 1;
    if (!buckets[topic]) buckets[topic] = { topic, total: 0, earned: 0, weightSum: 0, slidesWrong: [] };
    buckets[topic].total += 1;
    buckets[topic].earned += (r.score || 0) * weight;
    buckets[topic].weightSum += weight;
    if (!r.correct) {
      buckets[topic].slidesWrong.push({
        slideId: r.slideId,
        title: slide.title || slide.question || `Slide ${slide.id}`
      });
    }
  });
  return Object.values(buckets)
    .map(b => ({ ...b, scorePct: b.weightSum ? Math.round((b.earned / b.weightSum) * 100) : 0 }))
    .sort((a, b) => a.scorePct - b.scorePct);
}
if (typeof window !== 'undefined') window.getTopicBreakdown = getTopicBreakdown;

/* ============================================================ */
/*                  INIT / THEMING                               */
/* ============================================================ */
function applyTheme() {
  // Default brand palette: #473391 / #6E55B8 / #9578E0 / #E6C4FF
  // If COURSE_CONFIG.settings.accentColor is set, derive a matching palette from it.
  // If COURSE_CONFIG.settings.brandPalette is set (array of 4 hex colors), use that exactly.
  const cfg = COURSE_CONFIG.settings;
  if (Array.isArray(cfg.brandPalette) && cfg.brandPalette.length === 4) {
    const [primary, mid, light, highlight] = cfg.brandPalette;
    document.documentElement.style.setProperty('--accent', primary);
    document.documentElement.style.setProperty('--accent-mid', mid);
    document.documentElement.style.setProperty('--accent-light', light);
    document.documentElement.style.setProperty('--accent-highlight', highlight);
    document.documentElement.style.setProperty('--accent-soft', primary + '33');
    document.documentElement.style.setProperty('--accent-strong', shade(primary, -20));
  } else if (cfg.accentColor) {
    // Single color override — derive light/highlight by shading
    const c = cfg.accentColor;
    document.documentElement.style.setProperty('--accent', c);
    document.documentElement.style.setProperty('--accent-mid', shade(c, 25));
    document.documentElement.style.setProperty('--accent-light', shade(c, 50));
    document.documentElement.style.setProperty('--accent-highlight', shade(c, 90));
    document.documentElement.style.setProperty('--accent-soft', c + '33');
    document.documentElement.style.setProperty('--accent-strong', shade(c, -20));
  }
  // else: leave the brand defaults from CSS :root in place
}
function shade(hex, percent) {
  const n = parseInt(hex.slice(1), 16);
  const r = Math.max(0, Math.min(255, ((n >> 16) & 255) + percent));
  const g = Math.max(0, Math.min(255, ((n >> 8) & 255) + percent));
  const b = Math.max(0, Math.min(255, (n & 255) + percent));
  return '#' + ((r << 16) | (g << 8) | b).toString(16).padStart(6, '0');
}

function init() {
  applyTheme();
  document.getElementById('course-title').textContent = COURSE_CONFIG.settings.courseTitle;
  document.getElementById('sidebar-title').textContent = COURSE_CONFIG.settings.courseTitle;
  buildSidebar();
  // Initialize tracking backends. All three are independent and stack:
  //   - SCORM 2004:    detected from window.parent.API_1484_11
  //   - LMS-provided xAPI:   parsed from URL launch params
  //   - Third-party LRS:     hardcoded into config (lrsEndpoint/lrsApiKey/lrsApiSecret)
  initSCORM();
  initXAPI();
  initThirdPartyLRS();

  // BOOKMARK / RESUME — must run AFTER initSCORM (so scormApi is connected)
  // but BEFORE renderSlide (so we render the resumed slide, not slide 0).
  // Editor-preview ignores bookmarks entirely (next branch overrides this).
  let resumedFromBookmark = -1;
  if (scormApi) {
    resumedFromBookmark = loadBookmark();
    if (resumedFromBookmark > 0) {
      console.info('[SCORM] Resumed from bookmark — slide', resumedFromBookmark + 1);
    }
  }

  // Editor-preview hook: when the engine is launched inside the editor's
  // iframe, settings._previewStartIdx tells us which slide to boot on.
  // We also unlock free-roam so the author can navigate freely between
  // every slide via the menu while authoring. Preview always wins over
  // any bookmark — authors don't want their preview hijacked.
  const previewStartIdx = COURSE_CONFIG.settings && COURSE_CONFIG.settings._previewStartIdx;
  if (typeof previewStartIdx === 'number'
      && previewStartIdx >= 0
      && previewStartIdx < COURSE_CONFIG.slides.length) {
    STATE.current = previewStartIdx;
    STATE.freeRoam = true;
    resumedFromBookmark = -1;   // suppress the resume modal in preview
  }

  renderSlide();
  paintIcons(document); // Paint header/footer/sidebar chrome icons

  // Ask the learner whether they want to resume — but only after the
  // resumed slide has rendered, so the modal appears OVER real content
  // rather than a blank screen. A small delay also gives confetti/score
  // animations on the resumed slide a moment to settle.
  if (resumedFromBookmark > 0) {
    setTimeout(() => offerResumeChoice(resumedFromBookmark), 400);
  }
}

/* ============================================================ */
/*                       SIDEBAR                                 */
/* ============================================================ */
function buildSidebar() {
  const nav = document.getElementById('nav-list');
  nav.innerHTML = '';
  // Diagnostic mode: append ?debugnav=1 to the launch URL to enable a
  // toggleable on-screen log + visible tap-point markers. Designed to
  // diagnose "tap doesn't register" reports without needing chrome://inspect.
  const debugNav = (typeof location !== 'undefined' && location.search.indexOf('debugnav=1') !== -1);
  if (debugNav && !document.getElementById('debugnav-toggle')) {
    // Tiny floating toggle button — top-right corner, doesn't overlap drawer.
    const btn = document.createElement('button');
    btn.id = 'debugnav-toggle';
    btn.textContent = '🐛';
    btn.style.cssText = 'position:fixed; top:8px; right:8px; width:36px; height:36px; border-radius:50%; background:#0a8; color:#fff; border:0; font-size:18px; z-index:999999; box-shadow:0 2px 8px rgba(0,0,0,0.4); padding:0; line-height:1; cursor:pointer;';
    document.body.appendChild(btn);

    // The expandable log panel — pinned to the TOP of the screen (not bottom)
    // so it can't overlap the sidebar drawer or its nav items.
    const panel = document.createElement('div');
    panel.id = 'debugnav-log';
    panel.style.cssText = 'position:fixed; top:50px; left:8px; right:8px; max-height:40vh; background:rgba(0,0,0,0.94); color:#0f0; padding:6px 10px; border-radius:8px; font:11px/1.35 ui-monospace,monospace; z-index:999998; overflow-y:auto; -webkit-user-select:text; user-select:text; pointer-events:auto; white-space:pre-wrap; word-break:break-all; display:none;';
    panel.innerHTML = '<div style="color:#fff; font-weight:bold; margin-bottom:4px; display:flex; gap:6px; align-items:center;"><span style="flex:1;">NAV DEBUG</span><button id="debugnav-clear" style="font-size:10px; padding:3px 8px; border:0; background:#333; color:#fff; border-radius:3px;">clear</button><button id="debugnav-copy" style="font-size:10px; padding:3px 8px; border:0; background:#06c; color:#fff; border-radius:3px;">select all</button></div><div id="debugnav-log-body"></div>';
    document.body.appendChild(panel);

    btn.onclick = () => {
      panel.style.display = panel.style.display === 'none' ? 'block' : 'none';
    };
    document.getElementById('debugnav-clear').onclick = (e) => {
      e.stopPropagation();
      document.getElementById('debugnav-log-body').innerHTML = '';
    };
    document.getElementById('debugnav-copy').onclick = (e) => {
      e.stopPropagation();
      // Select-all so user can long-press > copy. This is the most
      // reliable approach across mobile browsers — Web Share API
      // and clipboard.writeText both have issues in iframes.
      const body = document.getElementById('debugnav-log-body');
      const sel = window.getSelection();
      const r = document.createRange();
      r.selectNodeContents(body);
      sel.removeAllRanges();
      sel.addRange(r);
      // Tell the user what to do next
      const tip = document.createElement('div');
      tip.textContent = '✓ Selected — long-press → Copy, then paste into chat';
      tip.style.cssText = 'color:#ff0; font-weight:bold; padding:4px 0;';
      body.appendChild(tip);
    };
  }
  function flashDebug(msg) {
    if (!debugNav) return;
    const body = document.getElementById('debugnav-log-body');
    if (!body) return;
    const ts = new Date().toISOString().slice(11, 23);
    const line = document.createElement('div');
    line.textContent = `[${ts}] ${msg}`;
    body.appendChild(line);
    body.parentElement.scrollTop = body.parentElement.scrollHeight;
    while (body.children.length > 200) body.removeChild(body.firstChild);
  }
  // Top-level event capture: log every relevant event, AND drop a visible
  // purple dot at the tap coordinates so the user can see exactly where
  // their finger landed. The dot fades out after 1 second.
  if (debugNav && !window.__navDebugInstalled) {
    window.__navDebugInstalled = true;
    function dropTapMarker(x, y, color) {
      const dot = document.createElement('div');
      dot.style.cssText = `position:fixed; left:${x - 12}px; top:${y - 12}px; width:24px; height:24px; border-radius:50%; background:${color || '#9578E0'}; border:2px solid #fff; box-shadow:0 0 0 2px ${color || '#9578E0'}; z-index:999997; pointer-events:none; opacity:0.85; transition:opacity 1s, transform 1s;`;
      document.body.appendChild(dot);
      requestAnimationFrame(() => {
        dot.style.opacity = '0';
        dot.style.transform = 'scale(2)';
      });
      setTimeout(() => dot.remove(), 1100);
    }
    const events = ['pointerdown', 'pointerup', 'pointercancel',
                    'touchstart', 'touchend', 'touchcancel',
                    'click'];
    events.forEach(evt => {
      document.addEventListener(evt, (e) => {
        const t = e.target;
        const item = t && t.closest ? t.closest('.nav-item') : null;
        const idx = item ? item.dataset.idx : '—';
        const inSidebar = t && t.closest ? !!t.closest('#sidebar') : false;
        const tag = t && t.tagName ? t.tagName.toLowerCase() : '?';
        const cls = t && t.className && typeof t.className === 'string' ? t.className.slice(0, 40) : '';
        flashDebug(`doc.${evt} target=${tag}${cls ? '.' + cls : ''} sidebar=${inSidebar ? 'Y' : 'N'} item-idx=${idx}`);
        // Drop a visible marker at the tap location, but only on the
        // first event of a tap sequence (touchstart or pointerdown)
        if (evt === 'touchstart' && e.touches && e.touches[0]) {
          const color = inSidebar ? (item ? '#1f9b5e' : '#e8b900') : '#c0392b';
          dropTapMarker(e.touches[0].clientX, e.touches[0].clientY, color);
        } else if (evt === 'pointerdown' && e.clientX != null) {
          // already handled by touchstart on touch devices; only fire here for mouse
          if (e.pointerType === 'mouse') {
            const color = inSidebar ? (item ? '#1f9b5e' : '#e8b900') : '#c0392b';
            dropTapMarker(e.clientX, e.clientY, color);
          }
        }
      }, /* useCapture */ true);
    });
    document.addEventListener('click', (e) => {
      if (e.defaultPrevented) flashDebug(`! click defaultPrevented`);
    }, false);
  }

  // Tap-vs-scroll detection. The bounding-box check below correctly
  // verifies the finger lifted INSIDE a nav-item, but it can't tell
  // apart "tap on item" from "scroll the sidebar and happen to release
  // over an item." On mobile, scrolling the sidebar would otherwise
  // trigger a navigation + auto-close because touchend fired on a
  // nav-item rect. We track the touch start position and abort the
  // touchend handler if the finger moved more than 10 px in either
  // axis — that distance is comfortably below a real tap's wobble
  // and well below any meaningful scroll.
  // buildSidebar() is invoked exactly once (from init()), so a
  // closure-scoped variable is safe — no listener pile-up risk.
  let touchStartX = 0;
  let touchStartY = 0;
  nav.addEventListener('touchstart', (e) => {
    if (e.touches && e.touches.length > 0) {
      touchStartX = e.touches[0].clientX;
      touchStartY = e.touches[0].clientY;
    }
  }, { passive: true });

  COURSE_CONFIG.slides.forEach((slide, idx) => {
    const item = document.createElement('div');
    item.className = 'nav-item';
    item.dataset.idx = idx;
    const meta = slideTypeMeta(slide.type);
    const fullTitle = slide.title || meta.label;
    // Native title= as a fallback for screen readers / touch devices.
    item.title = `${idx + 1}. ${fullTitle}`;
    item.dataset.tooltip = fullTitle;
    item.innerHTML = `
      <span class="nav-item-icon"><i class="fa-solid ${meta.icon}"></i></span>
      <span class="nav-item-text">
        <span class="nav-item-num">${idx + 1}.</span>${fullTitle}
      </span>`;
    // Belt-and-suspenders nav handlers. We attach BOTH click and touchend
    // because some mobile browsers (or some webview wrappers like SCORM
    // Cloud's player iframe) suppress synthetic click events from touch.
    // The _navHandledAt timestamp prevents double-fire when both events
    // arrive — typical interval click-after-touchend is ~50ms, so 400ms
    // is comfortably wide.
    const handleNavTap = (source) => {
      const now = Date.now();
      if (item._navHandledAt && (now - item._navHandledAt) < 400) {
        flashDebug(`${source} idx=${idx} — DEBOUNCED`);
        return;
      }
      item._navHandledAt = now;
      const allow = STATE.freeRoam ||
                    STATE.completed.has(COURSE_CONFIG.slides[idx].id) ||
                    idx < STATE.current;
      flashDebug(`${source} idx=${idx} cur=${STATE.current} allow=${allow ? 'Y' : 'N'} fr=${STATE.freeRoam ? 'Y' : 'N'}`);
      tryJumpToSlide(idx);
    };
    item.onclick = () => handleNavTap('click');
    // Geometric bounding-box check on touchend — replaces the previous
    // position-tracking + elementFromPoint approaches, which both suffered
    // from the same root cause: the canvas-confetti library fires on the
    // Results slide and creates a full-screen <canvas> overlay. Even with
    // pointer-events:none on the canvas, mobile WebKit's hit-testing has
    // a notorious bug where elementFromPoint still returns the canvas, and
    // micro-movements during a normal tap trip the "moved" detector.
    //
    // Bounding-box check is mathematically precise, immune to z-index
    // overlays, and bypasses the hit-testing bug entirely. It still
    // correctly rejects scroll-and-release gestures because if the finger
    // lifted outside the item's physical bounds, it wasn't a tap.
    item.addEventListener('touchend', (e) => {
      if (e.changedTouches && e.changedTouches.length > 0) {
        const t = e.changedTouches[0];
        // Tap-vs-scroll: if the finger moved >10px in either axis
        // between touchstart and touchend, treat it as a scroll and
        // abort. Without this, scrolling-and-releasing over an item
        // would fire a phantom navigation. See the touchstart handler
        // above for the rationale.
        if (Math.abs(t.clientX - touchStartX) > 10 ||
            Math.abs(t.clientY - touchStartY) > 10) {
          flashDebug(`touchend idx=${idx} — MOVED, treating as scroll`);
          return;
        }
        const rect = item.getBoundingClientRect();
        if (t.clientX < rect.left || t.clientX > rect.right ||
            t.clientY < rect.top  || t.clientY > rect.bottom) {
          flashDebug(`touchend idx=${idx} — OUTSIDE BOUNDS (scroll?)`);
          return;
        }
      }
      handleNavTap('touchend');
    }, { passive: true });
    nav.appendChild(item);
  });
  // Belt-and-suspenders: also attach a delegated handler on the parent
  // <nav> element. If for any reason the per-item handlers are suppressed
  // (e.g. an iframe sandbox interaction or a webkit quirk on a child
  // element), the delegated parent handler still works because the click
  // bubbles up to the nav element. Together with pointer-events:none
  // on the nav-item children, the tap target is unambiguous.
  if (!nav._delegated) {
    nav._delegated = true;
    const delegateTap = (e) => {
      const target = e.target;
      const item = target && target.closest ? target.closest('.nav-item') : null;
      if (!item || !nav.contains(item)) return;
      const idxAttr = item.dataset.idx;
      if (idxAttr == null) return;
      const idx = +idxAttr;
      const now = Date.now();
      // Per-item debounce shared with the direct handlers above
      if (item._navHandledAt && (now - item._navHandledAt) < 400) {
        flashDebug(`delegated idx=${idx} — DEBOUNCED`);
        return;
      }
      item._navHandledAt = now;
      const allow = STATE.freeRoam ||
                    STATE.completed.has(COURSE_CONFIG.slides[idx].id) ||
                    idx < STATE.current;
      flashDebug(`delegated:${e.type} idx=${idx} cur=${STATE.current} allow=${allow ? 'Y' : 'N'} fr=${STATE.freeRoam ? 'Y' : 'N'}`);
      tryJumpToSlide(idx);
    };
    nav.addEventListener('click', delegateTap);
    // Delegated touchend uses the same geometric bounding-box approach as
    // the per-item handler — find the nav-item the touch ended on, then
    // verify the finger lifted within its bounds. Immune to the canvas-
    // confetti hit-testing bug.
    nav.addEventListener('touchend', (e) => {
      if (!(e.changedTouches && e.changedTouches.length > 0)) {
        delegateTap(e);
        return;
      }
      const t = e.changedTouches[0];
      // Tap-vs-scroll: same guard as the per-item handler above.
      // Without it, a scroll-and-release would synthesize a tap on
      // whichever nav-item happened to be under the finger at lift.
      if (Math.abs(t.clientX - touchStartX) > 10 ||
          Math.abs(t.clientY - touchStartY) > 10) {
        flashDebug(`nav.touchend — MOVED, treating as scroll`);
        return;
      }
      // Find which nav-item (if any) the finger ended over by checking
      // each item's bounding rect against the touch coordinates. This
      // bypasses elementFromPoint and is immune to overlay z-index bugs.
      const items = nav.querySelectorAll('.nav-item');
      let hit = null;
      for (let i = 0; i < items.length; i++) {
        const r = items[i].getBoundingClientRect();
        if (t.clientX >= r.left && t.clientX <= r.right &&
            t.clientY >= r.top  && t.clientY <= r.bottom) {
          hit = items[i];
          break;
        }
      }
      if (!hit) {
        flashDebug(`nav.touchend — NO ITEM AT (${Math.round(t.clientX)}, ${Math.round(t.clientY)})`);
        return;
      }
      // Synthesize a delegate-tap as if the click bubbled up
      const synth = { type: 'touchend', target: hit };
      delegateTap(synth);
    }, { passive: true });
  }
  refreshSidebarState();
  paintIcons(nav);
  attachNavTooltips(nav);
}

/* Hover tooltip system — renders into document.body so it escapes the
   sidebar's overflow:auto clipping, and positions itself next to the
   hovered .nav-item. Hidden on mobile via CSS. */
function attachNavTooltips(navRoot) {
  // Single shared tooltip element, reused on every hover.
  let tip = document.getElementById('nav-tooltip');
  if (!tip) {
    tip = document.createElement('div');
    tip.className = 'nav-tooltip';
    tip.id = 'nav-tooltip';
    document.body.appendChild(tip);
  }
  navRoot.querySelectorAll('.nav-item').forEach(item => {
    item.addEventListener('mouseenter', () => {
      // Don't show tooltip on mobile — the @media rule already hides it,
      // but bail early to avoid unnecessary positioning math.
      if (window.matchMedia('(max-width: 768px)').matches) return;
      tip.textContent = item.dataset.tooltip || '';
      // Position to the right of the item, vertically centered.
      const rect = item.getBoundingClientRect();
      tip.style.left = (rect.right + 8) + 'px';
      tip.style.top  = (rect.top + rect.height / 2) + 'px';
      tip.style.transform = 'translateY(-50%)';
      tip.classList.add('visible');
    });
    item.addEventListener('mouseleave', () => {
      tip.classList.remove('visible');
    });
  });
}
function slideTypeMeta(t) {
  const meta = {
    intro:           { label: "Introduction",     icon: "fa-flag" },
    video:           { label: "Video",            icon: "fa-play" },
    text:            { label: "Reading",          icon: "fa-book-open" },
    "image-callouts":{ label: "Explore",          icon: "fa-magnifying-glass-location" },

  return meta[t] || { label: t, icon: "fa-circle" };

/* Backwards-compat alias for any legacy callers */
function slideTypeLabel(t) { return slideTypeMeta(t).label; }
function refreshSidebarState() {
  const items = document.querySelectorAll('.nav-item');
  items.forEach((el, idx) => {
    el.classList.remove('active', 'completed', 'locked');
    if (STATE.completed.has(COURSE_CONFIG.slides[idx].id)) el.classList.add('completed');
    if (idx === STATE.current) el.classList.add('active');
    if (!STATE.freeRoam && idx > STATE.current && !STATE.completed.has(COURSE_CONFIG.slides[idx].id)) {
      el.classList.add('locked');
    }
  });
  // progress
  const pct = Math.round((STATE.completed.size / COURSE_CONFIG.slides.length) * 100);
  document.getElementById('progress-fill').style.width = pct + '%';
  document.getElementById('progress-text').textContent = pct + '% complete' + (STATE.freeRoam ? ' • Free Roam ✓' : '');
}
function toggleSidebar() {
  document.getElementById('sidebar').classList.toggle('closed');
}
function tryJumpToSlide(idx) {
  if (idx === STATE.current) {
    // Same slide tapped — on mobile, just close the drawer so the learner
    // can see what they were already on.
    if (window.matchMedia && window.matchMedia('(max-width: 768px)').matches) {
      const sb = document.getElementById('sidebar');
      if (sb && !sb.classList.contains('closed')) toggleSidebar();
    }
    return;
  }
  // free roam OR already completed OR previous slides all completed
  const allow = STATE.freeRoam ||
                STATE.completed.has(COURSE_CONFIG.slides[idx].id) ||
                idx < STATE.current;
  if (allow) {
    STATE.current = idx;
    renderSlide();
    saveBookmark();
    // On mobile the sidebar is an overlay drawer that covers the slide —
    // close it after navigation so the learner can actually see the slide
    // they just jumped to. Without this, taps appear to do nothing because
    // the sidebar stays covering the new slide content.
    if (window.matchMedia && window.matchMedia('(max-width: 768px)').matches) {
      const sb = document.getElementById('sidebar');
      if (sb && !sb.classList.contains('closed')) toggleSidebar();
    }
  }
}

/* ============================================================ */
/*                     NAVIGATION                                */
/* ============================================================ */
function nextSlide() {
  const slide = COURSE_CONFIG.slides[STATE.current];
  // [TEST MODE] Completion guard removed.
  STATE.completed.add(slide.id);
  xapiSend('completed', slide);
  if (STATE.current < COURSE_CONFIG.slides.length - 1) {
    STATE.current++;
    renderSlide();
    saveBookmark();   // persist resume point on every nav
  } else {
    // Finished module → unlock free roam
    STATE.freeRoam = true;
    refreshSidebarState();
    // If the LAST slide is NOT a Results slide, fire course-level completion
    // ourselves. With a Results slide, renderResults() does this. Without
    // one, we'd never fire xAPI 'passed'/'failed' or SCORM completion —
    // so the LMS would never know the learner finished.
    if (slide.type !== 'results' && !STATE._autoCompleted) {
      STATE._autoCompleted = true;
      autoFireCourseCompletion(slide);
    }
  }
}

/* Compute the course-level score and fire completion signals. Called when
   the learner reaches the end of a module that has NO Results slide. */
function autoFireCourseCompletion(lastSlide) {
  const scoreable = Object.values(STATE.responses).filter(r => r.correct !== null && r.score !== null);
  if (scoreable.length === 0) {
    // Pure informational module — just signal completion, no pass/fail
    xapiSend('completed', lastSlide);
    setTimeout(() => finalizeCourseSession(), 50);
    return;
  }
  const slidesById = {};
  COURSE_CONFIG.slides.forEach(s => slidesById[s.id] = s);
  let earnedPoints = 0, weightSum = 0;
  scoreable.forEach(r => {
    const s = slidesById[r.slideId];
    const w = (s && typeof s.weight === 'number' && s.weight > 0) ? s.weight : 1;
    earnedPoints += (r.score || 0) * w;
    weightSum += w;
  });
  const score = weightSum ? Math.round((earnedPoints / weightSum) * 100) : 100;
  const passed = score >= COURSE_CONFIG.settings.passingScore;
  xapiSend(passed ? 'passed' : 'failed', lastSlide, { score });
  // Same finalization as renderResults — lock the LMS session in so the
  // data persists even if the learner closes the tab right after the
  // last slide.
  setTimeout(() => finalizeCourseSession(), 50);
}
function prevSlide() {
  if (STATE.current > 0) {
    STATE.current--;
    renderSlide();
    saveBookmark();
  }
}
function canAdvance(slide) {
  // Slides that auto-complete on view: intro, text (after read time), summary
  // Slides that require interaction: video (must finish), quiz (must answer),
  //                                  hotspot (find all), drag-drop (place all),
  //                                  scenario (pick a choice), tabs/accordion/
  //                                  flip-cards/timeline/image-callouts (allow after view)
  return STATE.completed.has(slide.id);
}
function setNextEnabled(enabled) {
  // [TEST MODE] Restriction removed.
  document.getElementById('next-btn').disabled = false;
}

/* ============================================================
   EDGE AUTO-SCROLL during drag interactions
   ============================================================
   When a learner drags an item on a phone, the drop targets can be
   below the visible viewport. Without auto-scroll, the learner has
   no way to scroll the page (their finger is busy dragging) and
   can't see where to drop.

   Usage: call startEdgeAutoScroll() from dragstart / touchstart /
   pointerdown handlers. It returns a function — call THAT from
   dragend / touchend / pointerup / pointercancel to stop.

   Implementation: registers global listeners for dragover (HTML5
   drag) and pointermove (touch drag). On each event it inspects
   the pointer Y coordinate; if within EDGE_PX of either viewport
   edge it starts scrolling that direction. Scroll runs via rAF so
   the page moves smoothly even though we don't get continuous
   events when the finger holds still near an edge.

   The scrolling target is the slide's scroll container (.engine-
   wrapper or window — whichever actually scrolls). We try the
   closest scrollable ancestor of the dragged element first; fall
   back to the document.scrollingElement. ============================================================ */
function startEdgeAutoScroll() {
  const EDGE_PX = 80;          // distance from viewport edge that triggers scroll
  const MAX_SPEED = 18;        // pixels per frame at the very edge
  let lastY = -1;              // last known pointer Y; -1 = inactive
  let rafId = null;
  let scrollEl = null;

  // Find the nearest scrollable ancestor for an element. Falls back to
  // the document scrolling element. We need the actual element that
  // scrolls because window.scrollBy doesn't always work inside an
  // iframe (and the engine sometimes runs in one).
  const findScrollable = (el) => {
    let node = el;
    while (node && node !== document.body) {
      const style = getComputedStyle(node);
      const oy = style.overflowY;
      if ((oy === 'auto' || oy === 'scroll') && node.scrollHeight > node.clientHeight) {
        return node;
      }
      node = node.parentElement;
    }
    return document.scrollingElement || document.documentElement || document.body;
  };

  const tick = () => {
    if (lastY < 0 || !scrollEl) { rafId = null; return; }
    const vh = window.innerHeight || document.documentElement.clientHeight;
    let dy = 0;
    if (lastY < EDGE_PX) {
      // Distance from top: 0 → MAX_SPEED, EDGE_PX → 0
      dy = -Math.round(MAX_SPEED * (1 - lastY / EDGE_PX));
    } else if (lastY > vh - EDGE_PX) {
      const distance = vh - lastY;
      dy = Math.round(MAX_SPEED * (1 - distance / EDGE_PX));
    }
    if (dy !== 0) {
      // Use scrollTop on the scroll container; fall back to scrollBy on window
      if (scrollEl.scrollTop !== undefined) scrollEl.scrollTop += dy;
      else window.scrollBy(0, dy);
    }
    rafId = requestAnimationFrame(tick);
  };

  const onMove = (e) => {
    // Both DragEvent and PointerEvent expose clientY
    const y = (e.clientY != null) ? e.clientY :
              (e.touches && e.touches[0] ? e.touches[0].clientY : -1);
    if (y < 0) return;
    lastY = y;
    if (!scrollEl) {
      // Pick the scrollable element under the pointer the first time we move
      const target = e.target || document.elementFromPoint(e.clientX || 0, y);
      scrollEl = findScrollable(target);
    }
    if (rafId == null) rafId = requestAnimationFrame(tick);
  };

  // Listen for both kinds of drag events. dragover is what HTML5 drag
  // actually fires during a drag; pointermove covers touch drags that
  // the slide implements manually.
  document.addEventListener('dragover',    onMove, { passive: true });
  document.addEventListener('pointermove', onMove, { passive: true });

  // Return a stop function the caller invokes on dragend/pointerup.
  return () => {
    document.removeEventListener('dragover',    onMove);
    document.removeEventListener('pointermove', onMove);
    lastY = -1; scrollEl = null;
    if (rafId != null) cancelAnimationFrame(rafId);
    rafId = null;
  };
}

/* ============================================================ */
/*                      RENDER SLIDE                             */
/* ============================================================ */
function renderSlide() {
  const slide = COURSE_CONFIG.slides[STATE.current];
  const c = document.getElementById('slide-container');
  c.innerHTML = '';
  c.className = 'animate__animated animate__fadeIn';

  document.getElementById('slide-counter').innerHTML = `<i class="fa-regular fa-circle-dot" style="font-size:0.8rem;"></i><span>${STATE.current + 1} / ${COURSE_CONFIG.slides.length}</span>`;
  document.getElementById('prev-btn').disabled = STATE.current === 0;
  document.getElementById('next-btn').style.visibility = 'visible'; // results hides it; restore on every render
  setNextEnabled(STATE.completed.has(slide.id));
  document.getElementById('slide-status').textContent = '';

  // Dismiss any lingering modal when navigating between slides
  hideFeedbackModal();

  xapiSend('experienced', slide);

  // Dispatch by type
  const renderers = {
    intro: renderIntro, video: renderVideo, text: renderText,
    "image-callouts": renderImageCallouts, tabs: renderTabs,
    accordion: renderAccordion, "flip-cards": renderFlipCards,
    timeline: renderTimeline, hotspot: renderHotspot,
    "drag-drop": renderDragDrop, scenario: renderScenario,
    quiz: renderQuiz, summary: renderSummary, results: renderResults,
    "file-viewer": renderFileViewer,

    // Phase 2 catalog
    "multi-response":     renderMultiResponse,
    "fill-blanks":        renderFillBlanks,
    "matching":           renderMatching,
    "sequencing":         renderSequencing,
    "image-id":           renderImageId,
    "slider":             renderSlider,
    "dial":               renderDial,
    "dialogue":           renderDialogue,
    "interactive-timeline": renderInteractiveTimeline,
    "confidence":         renderConfidence,

    // Phase 3 — engagement-focused activities
    "true-false":     renderTrueFalse,
    "swipe-decision": renderSwipeDecision,
    "timed-quiz":     renderTimedQuiz,
    "drag-match":     renderDragMatch,

    // Phase 4 — feedback collection (non-scoreable)
    "feedback":       renderFeedback
  };
  const fn = renderers[slide.type];
  if (fn) fn(slide, c);
  else c.innerHTML = `<div class="glass p-8 rounded-2xl">Unknown slide type: ${slide.type}</div>`;

  // Replace any <i class="fa-..."> placeholders in the freshly-rendered slide
  // AND in chrome that gets re-templated each slide (slide-counter, prev/next buttons).
  paintIcons(c);
  paintIcons(document.getElementById('slide-counter'));
  paintIcons(document.getElementById('slide-status'));

  // Slide-level audio: refresh the audio bar for whatever this slide carries.
  // The audio bar is a global fixture (one per module). Per-slide audio is
  // optional — slides without slide.audioData get the bar hidden.
  updateSlideAudio(slide);

  refreshSidebarState();
}

/* ============================================================ */
/*                  SLIDE AUDIO (PER-SLIDE NARRATION)            */
/* ============================================================
  An optional per-slide MP3 narration that plays automatically
  when the slide loads (subject to browser autoplay policy) and
  stops when the learner navigates away.

  Schema: each slide MAY have:
    slide.audioData     base64-encoded MP3 (no "data:" prefix)
    slide.audioLabel    optional title shown next to the player
    slide.audioMime     defaults to "audio/mpeg"

  The player is a fixed-position bar at the bottom-right with
  play/pause, time, scrubber, volume, and a mute toggle. The
  volume preference is persisted across slides via in-memory state
  AND sessionStorage (so it survives page reloads but not new
  sessions, which keeps it private to this learner-attempt).
  ============================================================ */

const SLIDE_AUDIO = {
  el:             null,   // <audio> element (single, reused across slides)
  bar:            null,   // the on-screen control bar
  currentSlideId: null,
  unlocked:       false,  // becomes true after first user interaction
  volume:         null,   // 0.0..1.0 — null until first init
  muted:          false
};

function ensureSlideAudioBar() {
  if (SLIDE_AUDIO.bar) return;

  // Pull persisted volume preference (if the learner adjusted it last time).
  // Use sessionStorage so it doesn't leak across users on shared devices.
  let savedVol = 0.8, savedMuted = false;
  try {
    const v = sessionStorage.getItem('elearning_audio_volume');
    if (v != null) savedVol = Math.max(0, Math.min(1, parseFloat(v)));
    const m = sessionStorage.getItem('elearning_audio_muted');
    if (m === '1') savedMuted = true;
  } catch (e) {}
  SLIDE_AUDIO.volume = savedVol;
  SLIDE_AUDIO.muted = savedMuted;

  // Build the bar
  const bar = document.createElement('div');
  bar.id = 'slide-audio-bar';
  // Inline-flow positioning: lives inside #audio-bar-slot which reserves
  // its own height in the flex column. No more fixed-position overlay.
  bar.style.cssText = `
    display: none;
    align-items: center;
    gap: 0.55rem;
    padding: 0.55rem 0.85rem;
    background: rgba(20, 18, 38, 0.92);
    border: 1px solid rgba(255, 255, 255, 0.12);
    color: white;
    border-radius: 999px;
    box-shadow: 0 6px 20px rgba(0, 0, 0, 0.35);
    backdrop-filter: blur(10px);
    font: 600 0.78rem/1 -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
    user-select: none;
    -webkit-user-select: none;
  `;
  bar.innerHTML = `
    <button type="button" id="sa-playpause" aria-label="Play/Pause" style="background:rgba(255,255,255,0.14); border:0; color:white; width:32px; height:32px; border-radius:999px; cursor:pointer; display:flex; align-items:center; justify-content:center; padding:0; flex-shrink:0;">
      <svg id="sa-icon-play"  width="14" height="14" viewBox="0 0 24 24" fill="currentColor" style="display:block;"><path d="M8 5v14l11-7z"/></svg>
      <svg id="sa-icon-pause" width="14" height="14" viewBox="0 0 24 24" fill="currentColor" style="display:none;"><path d="M6 5h4v14H6zM14 5h4v14h-4z"/></svg>
    </button>
    <div id="sa-label" style="white-space:nowrap; max-width:140px; overflow:hidden; text-overflow:ellipsis; opacity:0.85;">Audio</div>
    <div style="display:flex; align-items:center; gap:0.4rem;">
      <span id="sa-time" style="font-variant-numeric:tabular-nums; opacity:0.7; font-size:0.72rem;">0:00 / 0:00</span>
      <input id="sa-scrub" type="range" min="0" max="1000" value="0" aria-label="Seek" style="width:90px; accent-color:#9578E0; cursor:pointer;">
    </div>
    <div style="display:flex; align-items:center; gap:0.3rem; border-left:1px solid rgba(255,255,255,0.12); padding-left:0.55rem;">
      <button type="button" id="sa-mute" aria-label="Mute" style="background:transparent; border:0; color:white; width:24px; height:24px; cursor:pointer; padding:0; display:flex; align-items:center; justify-content:center;">
        <svg id="sa-icon-vol"  width="14" height="14" viewBox="0 0 24 24" fill="currentColor" style="display:block;"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3a4.5 4.5 0 0 0-2.5-4.03v8.05A4.5 4.5 0 0 0 16.5 12z"/></svg>
        <svg id="sa-icon-mute" width="14" height="14" viewBox="0 0 24 24" fill="currentColor" style="display:none;"><path d="M16.5 12c0-1.77-1.02-3.29-2.5-4.03v2.21l2.45 2.45c.03-.2.05-.41.05-.63zM3.27 3 2 4.27 6.73 9H3v6h4l5 5v-6.73l4.25 4.25c-.67.52-1.42.93-2.25 1.18v2.06a8.99 8.99 0 0 0 3.69-1.81L19.73 21 21 19.73l-9-9L3.27 3zM12 4 9.91 6.09 12 8.18V4z"/></svg>
      </button>
      <input id="sa-volume" type="range" min="0" max="100" value="${Math.round(savedVol * 100)}" aria-label="Volume" style="width:70px; accent-color:#9578E0; cursor:pointer;">
    </div>
    <button type="button" id="sa-unlock-prompt" style="display:none; background:#9578E0; border:0; color:white; padding:0.35rem 0.7rem; border-radius:999px; cursor:pointer; font:inherit; flex-shrink:0;">▶ Tap to enable audio</button>
  `;
  // Append into the dedicated layout slot. Falls back to body for environments
  // that don't have the slot (defensive — shipping engine always has it).
  const slot = document.getElementById('audio-bar-slot');
  if (slot) {
    slot.appendChild(bar);
  } else {
    document.body.appendChild(bar);
  }
  SLIDE_AUDIO.bar = bar;

  // Build the <audio> element (kept off-DOM so it doesn't render natively)
  const audio = document.createElement('audio');
  audio.preload = 'auto';
  audio.volume = savedVol;
  audio.muted = savedMuted;
  SLIDE_AUDIO.el = audio;
  // Don't append to DOM — we drive it programmatically.

  // Wire controls
  const pp = document.getElementById('sa-playpause');
  const iconPlay = document.getElementById('sa-icon-play');
  const iconPause = document.getElementById('sa-icon-pause');
  const time = document.getElementById('sa-time');
  const scrub = document.getElementById('sa-scrub');
  const mute = document.getElementById('sa-mute');
  const iconVol = document.getElementById('sa-icon-vol');
  const iconMute = document.getElementById('sa-icon-mute');
  const volume = document.getElementById('sa-volume');
  const unlockBtn = document.getElementById('sa-unlock-prompt');

  pp.onclick = () => {
    if (audio.paused) {
      const p = audio.play();
      if (p && p.catch) p.catch(() => showAudioUnlockPrompt(true));
    } else {
      audio.pause();
    }
  };

  audio.onplay  = () => { iconPlay.style.display = 'none'; iconPause.style.display = 'block'; SLIDE_AUDIO.unlocked = true; showAudioUnlockPrompt(false); };
  audio.onpause = () => { iconPlay.style.display = 'block'; iconPause.style.display = 'none'; };
  audio.onended = () => { iconPlay.style.display = 'block'; iconPause.style.display = 'none'; };

  audio.ontimeupdate = () => {
    const cur = audio.currentTime || 0;
    const dur = audio.duration || 0;
    time.textContent = `${formatAudioTime(cur)} / ${formatAudioTime(dur)}`;
    if (dur > 0 && !scrub._dragging) {
      scrub.value = Math.round((cur / dur) * 1000);
    }
  };

  // Scrubber: drag tracking so we don't fight the timeupdate ticks
  scrub.oninput = () => { scrub._dragging = true; };
  scrub.onchange = () => {
    const dur = audio.duration || 0;
    if (dur > 0) audio.currentTime = (parseInt(scrub.value, 10) / 1000) * dur;
    scrub._dragging = false;
  };

  volume.oninput = () => {
    const v = parseInt(volume.value, 10) / 100;
    audio.volume = v;
    SLIDE_AUDIO.volume = v;
    // Adjusting volume implicitly unmutes
    if (audio.muted && v > 0) {
      audio.muted = false;
      SLIDE_AUDIO.muted = false;
      iconVol.style.display = 'block';
      iconMute.style.display = 'none';
    }
    try { sessionStorage.setItem('elearning_audio_volume', String(v)); } catch (e) {}
  };

  mute.onclick = () => {
    audio.muted = !audio.muted;
    SLIDE_AUDIO.muted = audio.muted;
    iconVol.style.display  = audio.muted ? 'none'  : 'block';
    iconMute.style.display = audio.muted ? 'block' : 'none';
    try { sessionStorage.setItem('elearning_audio_muted', audio.muted ? '1' : '0'); } catch (e) {}
  };

  unlockBtn.onclick = () => {
    showAudioUnlockPrompt(false);
    const p = audio.play();
    if (p && p.catch) p.catch(() => showAudioUnlockPrompt(true));
  };

  // Restore mute icon state on first build
  iconVol.style.display  = savedMuted ? 'none'  : 'block';
  iconMute.style.display = savedMuted ? 'block' : 'none';
}

function showAudioUnlockPrompt(show) {
  const btn = document.getElementById('sa-unlock-prompt');
  if (btn) btn.style.display = show ? 'inline-block' : 'none';
}

function formatAudioTime(seconds) {
  if (!isFinite(seconds) || seconds < 0) seconds = 0;
  const m = Math.floor(seconds / 60);
  const s = Math.floor(seconds % 60);
  return `${m}:${s < 10 ? '0' : ''}${s}`;
}

function updateSlideAudio(slide) {
  // Tear down: stop any currently playing audio when navigating away.
  if (SLIDE_AUDIO.el) {
    try { SLIDE_AUDIO.el.pause(); } catch (e) {}
  }

  if (!slide || !slide.audioData) {
    // No audio for this slide — hide the bar AND the slot (which would
    // otherwise reserve empty space in the layout).
    if (SLIDE_AUDIO.bar) SLIDE_AUDIO.bar.style.display = 'none';
    const slot = document.getElementById('audio-bar-slot');
    if (slot) slot.classList.remove('is-visible');
    return;
  }

  // Make sure the bar exists, then show + load this slide's audio
  ensureSlideAudioBar();
  const audio = SLIDE_AUDIO.el;
  const bar = SLIDE_AUDIO.bar;
  const mime = slide.audioMime || 'audio/mpeg';
  const dataUrl = `data:${mime};base64,${slide.audioData}`;

  // Update label
  const labelEl = document.getElementById('sa-label');
  if (labelEl) labelEl.textContent = slide.audioLabel || 'Audio narration';

  // Reset scrubber
  const scrub = document.getElementById('sa-scrub');
  if (scrub) { scrub.value = 0; scrub._dragging = false; }
  const time = document.getElementById('sa-time');
  if (time) time.textContent = '0:00 / 0:00';

  // Set source and show. The bar itself uses inline-flex, AND the parent
  // slot needs is-visible so it contributes height to the flex column.
  audio.src = dataUrl;
  audio.currentTime = 0;
  bar.style.display = 'inline-flex';
  const slot = document.getElementById('audio-bar-slot');
  if (slot) slot.classList.add('is-visible');
  SLIDE_AUDIO.currentSlideId = slide.id;

  // Detect if we're inside the editor's preview iframe — in that case, don't
  // autoplay (it's annoying while authoring) and just show the play button.
  // We sniff by checking for the editor's preview marker on window.parent.
  let isInEditorPreview = false;
  try {
    isInEditorPreview = window.parent !== window &&
      window.parent.document &&
      !!window.parent.document.getElementById('preview-frame');
  } catch (e) { /* cross-origin, treat as not-preview */ }

  if (isInEditorPreview) {
    showAudioUnlockPrompt(false);
    return;
  }

  // Try to autoplay. Browsers will reject this on the very first slide
  // before any user interaction; in that case we show the unlock prompt.
  const p = audio.play();
  if (p && p.catch) {
    p.catch(() => {
      showAudioUnlockPrompt(true);
    });
  }
}

}

/* ---- VIDEO ---- */
/* ============================================================
   VIDEO SLIDE
   ============================================================
   Supports three sources (selected via slide.videoSource):
     'youtube' — YouTube embed via IFrame API
     'vimeo'   — Vimeo embed via Player.js
     'upload'  — uploaded file stored as base64 in slide.videoData

   Per-slide controls:
     slide.noSkip          — block forward seeking (default true)
     slide.allowFullscreen — show explicit fullscreen button (default true)

   Backward compatibility: slides without slide.videoSource have it
   inferred from slide.videoUrl on first render.
   ============================================================ */
function renderVideo(slide, c) {
  // Backward compatibility: if videoSource is missing, infer it.
  if (!slide.videoSource) {
    if (isYouTube(slide.videoUrl))    slide.videoSource = 'youtube';
    else if (isVimeo(slide.videoUrl)) slide.videoSource = 'vimeo';
    else                              slide.videoSource = 'upload';
  }
  // Defaults for new fields
  // PATCH 2026-05-19 round 7: if author enabled `allowScrubAfterWatched`,
  // the no-skip restriction lifts AFTER the learner has watched the
  // video end-to-end at least once (tracked in STATE.videoWatched).
  const allowScrubAfterWatched = !!slide.allowScrubAfterWatched;
  const alreadyWatched = !!(STATE.videoWatched && STATE.videoWatched[slide.id]);
  const noSkip = (slide.noSkip !== false) && !(allowScrubAfterWatched && alreadyWatched);
  const allowFullscreen = slide.allowFullscreen !== false;

  // Build the source-specific player markup. We always render the
  // wrapper + hint + fullscreen button shell, then plug the player in.
  const fullscreenBtnHtml = allowFullscreen ? `
    <button type="button" id="video-fs-btn" title="Watch fullscreen — rotate your device for landscape"
            style="position:absolute; top:0.6rem; right:0.6rem; z-index:10; background:rgba(0,0,0,0.75); color:white; border:0; padding:0.5rem 0.7rem; border-radius:0.5rem; cursor:pointer; display:flex; align-items:center; gap:0.4rem; font-size:0.78rem; font-weight:600;">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
        <path d="M3 7V3h4M21 7V3h-4M3 17v4h4M21 17v4h-4"/>
      </svg>
      Fullscreen
    </button>` : '';

  c.innerHTML = `
    <div class="glass-strong w-full max-w-4xl rounded-3xl p-6 md:p-8">
      <div class="slide-eyebrow">
        <i class="fa-solid fa-play"></i>
        Video
      </div>
      <h2 class="text-2xl md:text-3xl font-bold mb-2">${slide.title || ''}</h2>
      <div class="text-white/70 mb-5 rt-rendered">${renderRichTextOrPlain(slide.description || '')}</div>
      <div class="aspect-video rounded-xl overflow-hidden bg-black" id="video-wrap" style="border:1px solid var(--border); position:relative;">
        ${fullscreenBtnHtml}
      </div>
      <p class="text-xs mt-3" id="video-hint" style="color:var(--text-faint); display:flex; align-items:center; gap:0.4rem;">
        <i class="fa-regular fa-circle-play" style="color:var(--accent);"></i>
        ${noSkip ? 'Watch the entire video to continue. Skipping ahead is disabled.' : (alreadyWatched && allowScrubAfterWatched ? 'You have watched this video. Feel free to scrub or replay any part.' : 'Watch the video to the end to continue.')}
      </p>
    </div>`;
  const wrap = document.getElementById('video-wrap');

  // Track max-reached playback time for the no-skip enforcement.
  // Updated on `timeupdate` (HTML5) or onProgress polling (YouTube/Vimeo).
  // When the user tries to seek past this value, we snap back.
  const skipState = { maxReached: 0, suppressSeek: false };

  // Wire fullscreen button: requestFullscreen on the wrapper. The user's
  // device orientation determines whether the resulting view is portrait
  // or landscape — most learners on phones rotate to landscape naturally.
  if (allowFullscreen) {
    const fsBtn = document.getElementById('video-fs-btn');
    if (fsBtn) {
      fsBtn.onclick = (e) => {
        e.stopPropagation();
        const target = wrap;
        if (document.fullscreenElement) {
          document.exitFullscreen && document.exitFullscreen();
        } else if (target.requestFullscreen) {
          target.requestFullscreen().catch(() => {});
        } else if (target.webkitRequestFullscreen) {
          target.webkitRequestFullscreen();   // Safari
        } else if (target.webkitEnterFullscreen) {
          // iOS doesn't allow fullscreen on arbitrary elements — only on <video>
          // tags directly. Try fullscreening the video child if present.
          const v = target.querySelector('video');
          if (v && v.webkitEnterFullscreen) v.webkitEnterFullscreen();
        }
      };
    }
  }

  // Dispatch by source
  if (slide.videoSource === 'youtube') {
    renderYouTubeVideo(slide, wrap, skipState, noSkip);
  } else if (slide.videoSource === 'vimeo') {
    renderVimeoVideo(slide, wrap, skipState, noSkip);
  } else {
    renderUploadVideo(slide, wrap, skipState, noSkip);
  }

  if (STATE.completed.has(slide.id)) markVideoDone(slide);
}

/* ---- YouTube branch ---- */
function renderYouTubeVideo(slide, wrap, skipState, noSkip) {
  const ytId = extractYouTubeId(slide.videoUrl);
  if (!ytId) {
    showVideoError(slide, 2);
    return;
  }
  const origin = (window.location.protocol === 'file:' || !window.location.origin || window.location.origin === 'null')
    ? 'https://www.youtube.com'
    : window.location.origin;

  // controls=0 hides YouTube's progress bar when noSkip is on, removing the
  // ability to scrub. We still get play/pause via API + clicking the player.
  // disablekb=1 blocks keyboard arrow scrubbing too.
  const controlsParam = noSkip ? '0' : '1';
  const iframe = document.createElement('iframe');
  iframe.id = 'yt-player';
  iframe.src = `https://www.youtube.com/embed/${ytId}?enablejsapi=1&origin=${encodeURIComponent(origin)}&rel=0&controls=${controlsParam}&disablekb=${noSkip ? '1' : '0'}&modestbranding=1`;
  iframe.allow = 'accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share';
  iframe.allowFullscreen = true;
  iframe.referrerPolicy = 'strict-origin-when-cross-origin';
  iframe.style.width = '100%'; iframe.style.height = '100%';
  iframe.style.border = '0';
  wrap.appendChild(iframe);

  // When noSkip is on, we add a custom control bar overlay at the bottom of
  // the wrapper since YouTube's controls are hidden.
  if (noSkip) attachCustomControlsOverlay(wrap, slide, 'yt');

  loadYouTubeAPI(() => {
    try {
      const player = new YT.Player('yt-player', {
        events: {
          'onReady': (e) => {
            // Hook custom controls if present
            const overlay = wrap.querySelector('.video-custom-controls');
            if (overlay) wireCustomControlsForPlayer(overlay, {
              play:  () => e.target.playVideo(),
              pause: () => e.target.pauseVideo(),
              isPlaying: () => e.target.getPlayerState() === YT.PlayerState.PLAYING,
              currentTime: () => e.target.getCurrentTime(),
              duration: () => e.target.getDuration(),
              onProgress: (cb) => { setInterval(() => cb(e.target.getCurrentTime(), e.target.getDuration()), 250); },
              // PATCH 2026-05-19 round 7: YouTube adapter additions.
              setVolume: (v) => { try { e.target.setVolume(Math.round(v * 100)); } catch(_) {} },
              getVolume: () => { try { return (e.target.getVolume() || 0) / 100; } catch(_) { return 1; } },
              setMuted:  (m) => { try { if (m) e.target.mute(); else e.target.unMute(); } catch(_) {} },
              getMuted:  () => { try { return !!e.target.isMuted(); } catch(_) { return false; } },
              hasCaptions: () => new Promise(function(resolve){
                // YouTube's caption tracklist is populated after the video has started.
                // Probe a few times before declaring 'no captions'.
                var tries = 0;
                var poll = setInterval(function(){
                  tries++;
                  try {
                    var list = e.target.getOption('captions', 'tracklist');
                    if (Array.isArray(list) && list.length > 0) { clearInterval(poll); resolve(true); return; }
                  } catch (_) {}
                  if (tries >= 12) { clearInterval(poll); resolve(false); }
                }, 500);
              }),
              setCaptions: (on) => {
                try {
                  if (on) {
                    e.target.loadModule('captions');
                    // Pick the first available track as the default.
                    var list = e.target.getOption('captions', 'tracklist');
                    if (Array.isArray(list) && list.length > 0) {
                      e.target.setOption('captions', 'track', list[0]);
                    }
                  } else {
                    e.target.unloadModule('captions');
                  }
                } catch (_) {}
              }
            });
            // Polling for max-reached / seek-restoration on YouTube
            if (noSkip) {
              setInterval(() => {
                if (skipState.suppressSeek) return;
                const t = e.target.getCurrentTime();
                if (t > skipState.maxReached + 1.0) {
                  // Forward seek detected — snap back
                  skipState.suppressSeek = true;
                  e.target.seekTo(skipState.maxReached, true);
                  setTimeout(() => { skipState.suppressSeek = false; }, 200);
                  showSkipBlockedToast();
                } else if (t > skipState.maxReached) {
                  skipState.maxReached = t;
                }
              }, 500);
            }
          },
          'onStateChange': (e) => {
            if (e.data === YT.PlayerState.ENDED) markVideoDone(slide);
          },
          'onError': (e) => {
            console.warn('[YouTube]', 'Error code:', e.data);
            showVideoError(slide, e.data);
          }
        }
      });
    } catch (err) {
      console.warn('[YouTube IFrame API] Could not attach player events:', err);
      document.getElementById('video-hint').innerHTML =
        '<i class="fa-regular fa-circle-play" style="color:var(--accent);"></i>Watch the video, then continue. (auto-completion unavailable in this view)';
      setTimeout(() => { setNextEnabled(true); }, 3000);
    }
  });
}

/* ---- Vimeo branch ---- */
function renderVimeoVideo(slide, wrap, skipState, noSkip) {
  const vimeoId = extractVimeoId(slide.videoUrl);
  if (!vimeoId) {
    wrap.innerHTML = `
      <div style="display:flex; flex-direction:column; align-items:center; justify-content:center; height:100%; padding:2rem; text-align:center; color:rgba(255,255,255,0.85);">
        <p style="font-weight:600;">Couldn't read the Vimeo URL</p>
        <p style="font-size:0.85rem; opacity:0.7;">Expected something like https://vimeo.com/123456789</p>
      </div>`;
    STATE.completed.add(slide.id);
    setNextEnabled(true);
    return;
  }
  // Vimeo player URL parameters:
  //   controls=0    — hide Vimeo's chrome (we provide our own when noSkip)
  //   keyboard=0    — disable keyboard shortcuts (no arrow-skipping)
  //   pip=1         — picture-in-picture allowed
  //   playsinline=1 — don't auto-fullscreen on iOS (we have our own button)
  const controlsParam = noSkip ? '0' : '1';
  const iframe = document.createElement('iframe');
  iframe.id = 'vimeo-player';
  iframe.src = `https://player.vimeo.com/video/${vimeoId}?controls=${controlsParam}&keyboard=${noSkip ? '0' : '1'}&playsinline=1`;
  iframe.allow = 'autoplay; fullscreen; picture-in-picture; clipboard-write; encrypted-media';
  iframe.allowFullscreen = true;
  iframe.referrerPolicy = 'strict-origin-when-cross-origin';
  iframe.style.width = '100%'; iframe.style.height = '100%';
  iframe.style.border = '0';
  wrap.appendChild(iframe);

  if (noSkip) attachCustomControlsOverlay(wrap, slide, 'vimeo');

  loadVimeoAPI(() => {
    try {
      // eslint-disable-next-line no-undef
      const player = new Vimeo.Player(iframe);
      player.ready().then(() => {
        const overlay = wrap.querySelector('.video-custom-controls');
        if (overlay) wireCustomControlsForPlayer(overlay, {
          play:  () => player.play(),
          pause: () => player.pause(),
          isPlaying: async () => !(await player.getPaused()),
          currentTime: async () => await player.getCurrentTime(),
          duration: async () => await player.getDuration(),
          onProgress: (cb) => {
            player.on('timeupdate', (e) => cb(e.seconds, e.duration));
          },
          // PATCH 2026-05-19 round 7: Vimeo adapter additions.
          setVolume: function(v) { return player.setVolume(Math.max(0, Math.min(1, v))).catch(function(){}); },
          getVolume: function() { return player.getVolume().catch(function(){ return 1; }); },
          setMuted:  function(m) { return player.setMuted(!!m).catch(function(){}); },
          getMuted:  function() { return player.getMuted().catch(function(){ return false; }); },
          hasCaptions: function() {
            return player.getTextTracks().then(function(tracks){
              return Array.isArray(tracks) && tracks.length > 0;
            }).catch(function(){ return false; });
          },
          setCaptions: function(on) {
            if (!on) return player.disableTextTrack().catch(function(){});
            return player.getTextTracks().then(function(tracks){
              if (Array.isArray(tracks) && tracks.length > 0) {
                var t = tracks[0];
                return player.enableTextTrack(t.language || 'en', t.kind || 'subtitles').catch(function(){});
              }
            }).catch(function(){});
          }
        });
      });
      player.on('ended', () => markVideoDone(slide));
      player.on('error', (e) => {
        console.warn('[Vimeo]', e);
        wrap.innerHTML = `
          <div style="display:flex; flex-direction:column; align-items:center; justify-content:center; height:100%; padding:2rem; text-align:center; color:rgba(255,255,255,0.85);">
            <p style="font-weight:600;">Vimeo video unavailable</p>
            <p style="font-size:0.85rem; opacity:0.7;">${e && e.message ? escapeHtmlAttr(e.message) : 'The video could not be loaded.'}</p>
          </div>`;
        STATE.completed.add(slide.id);
        setNextEnabled(true);
      });
      if (noSkip) {
        // Vimeo emits 'seeked' AFTER the seek completes. We listen for it,
        // and if the new position is beyond maxReached, we snap back.
        player.on('seeked', async (e) => {
          if (skipState.suppressSeek) return;
          if (e.seconds > skipState.maxReached + 1.0) {
            skipState.suppressSeek = true;
            await player.setCurrentTime(skipState.maxReached);
            setTimeout(() => { skipState.suppressSeek = false; }, 300);
            showSkipBlockedToast();
          }
        });
        player.on('timeupdate', (e) => {
          if (skipState.suppressSeek) return;
          if (e.seconds > skipState.maxReached) skipState.maxReached = e.seconds;
        });
      }
    } catch (err) {
      console.warn('[Vimeo Player] Could not attach events:', err);
    }
  });
}

/* ---- Upload (HTML5 video) branch ---- */
function renderUploadVideo(slide, wrap, skipState, noSkip) {
  const v = document.createElement('video');
  // Source: prefer base64 data, fall back to URL string for legacy slides
  if (slide.videoData) {
    const mime = slide.videoMime || 'video/mp4';
    v.src = `data:${mime};base64,${slide.videoData}`;
  } else if (slide.videoUrl) {
    v.src = slide.videoUrl;
  } else {
    wrap.innerHTML = `
      <div style="display:flex; flex-direction:column; align-items:center; justify-content:center; height:100%; padding:2rem; text-align:center; color:rgba(255,255,255,0.85);">
        <p style="font-weight:600;">No video uploaded</p>
        <p style="font-size:0.85rem; opacity:0.7;">The author needs to add a video file in the editor.</p>
      </div>`;
    STATE.completed.add(slide.id);
    setNextEnabled(true);
    return;
  }
  v.style.width = '100%'; v.style.height = '100%';
  v.playsInline = true;
  v.preload = 'metadata';
  // PATCH 2026-05-19 round 7: optional captions track. If the author
  // provided slide.captionsUrl (a .vtt URL), attach it as a <track>.
  if (slide.captionsUrl) {
    var track = document.createElement('track');
    track.kind = 'captions';
    track.src  = slide.captionsUrl;
    track.srclang = slide.captionsLang || 'en';
    track.label   = slide.captionsLabel || 'Captions';
    track.default = false;   // start with captions OFF; learner can toggle
    v.appendChild(track);
  }

  if (noSkip) {
    // Hide native controls; we provide our own without scrubbing.
    v.controls = false;
    attachCustomControlsOverlay(wrap, slide, 'html5');

    // Listen for any seek attempts. The browser fires 'seeking' BEFORE the
    // seek completes — we can clamp the target then.
    v.addEventListener('seeking', () => {
      if (skipState.suppressSeek) return;
      if (v.currentTime > skipState.maxReached + 1.0) {
        skipState.suppressSeek = true;
        v.currentTime = skipState.maxReached;
        setTimeout(() => { skipState.suppressSeek = false; }, 100);
        showSkipBlockedToast();
      }
    });
    v.addEventListener('timeupdate', () => {
      if (skipState.suppressSeek) return;
      if (v.currentTime > skipState.maxReached) skipState.maxReached = v.currentTime;
    });
  } else {
    v.controls = true;
  }
  v.addEventListener('ended', () => markVideoDone(slide));
  wrap.appendChild(v);

  // Wire custom controls if we made them
  if (noSkip) {
    const overlay = wrap.querySelector('.video-custom-controls');
    if (overlay) wireCustomControlsForPlayer(overlay, {
      play:  () => v.play(),
      pause: () => v.pause(),
      isPlaying: () => !v.paused,
      currentTime: () => v.currentTime,
      duration: () => v.duration,
      onProgress: (cb) => { v.addEventListener('timeupdate', () => cb(v.currentTime, v.duration)); },
      // PATCH 2026-05-19 round 7: HTML5 adapter additions.
      setVolume: function(val) { v.volume = Math.max(0, Math.min(1, val)); },
      getVolume: function() { return v.volume; },
      setMuted:  function(m) { v.muted = !!m; },
      getMuted:  function() { return !!v.muted; },
      hasCaptions: function() {
        // textTracks is populated once <track> elements have loaded their cues.
        // Author must supply VTT via slide.captionsUrl for this to work.
        return new Promise(function(resolve){
          var tries = 0;
          var poll = setInterval(function(){
            tries++;
            if (v.textTracks && v.textTracks.length > 0) { clearInterval(poll); resolve(true); return; }
            if (tries >= 6) { clearInterval(poll); resolve(false); }
          }, 300);
        });
      },
      setCaptions: function(on) {
        if (!v.textTracks) return;
        for (var i = 0; i < v.textTracks.length; i++) {
          v.textTracks[i].mode = on ? 'showing' : 'hidden';
        }
      }
    });
  }
}

/* ---- Shared: custom control bar for noSkip mode ---- */
/* Renders a non-scrubbable progress bar, play/pause, and a time display
   over the bottom of the video wrapper. Used for all three video sources
   when noSkip is enabled (since each source's native controls allow
   scrubbing that we want to suppress). */
function attachCustomControlsOverlay(wrap, slide, /* sourceType */ _type) {
  const overlay = document.createElement('div');
  overlay.className = 'video-custom-controls';
  overlay.style.cssText = `
    position:absolute; left:0; right:0; bottom:0;
    padding:0.5rem 0.8rem;
    background:linear-gradient(to top, rgba(0,0,0,0.85), rgba(0,0,0,0));
    display:flex; align-items:center; gap:0.7rem;
    color:white;
    pointer-events:auto;
    z-index:5;
  `;
  // PATCH 2026-05-19 round 7: added Volume button + inline slider and CC
  // toggle button. Each is wired via wireCustomControlsForPlayer using the
  // player-adapter methods setVolume/setMuted/setCaptions etc. Buttons are
  // hidden via CSS class if the adapter reports the feature is unavailable.
  overlay.innerHTML = `
    <button type="button" class="vcc-playpause" aria-label="Play/Pause" style="background:rgba(255,255,255,0.18); border:0; color:white; width:34px; height:34px; border-radius:999px; cursor:pointer; display:flex; align-items:center; justify-content:center; padding:0; flex-shrink:0;">
      <svg class="vcc-icon-play" width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
      <svg class="vcc-icon-pause" width="14" height="14" viewBox="0 0 24 24" fill="currentColor" style="display:none;"><path d="M6 5h4v14H6zM14 5h4v14h-4z"/></svg>
    </button>
    <div style="flex:1; min-width:0; height:6px; background:rgba(255,255,255,0.2); border-radius:999px; overflow:hidden; position:relative;">
      <div class="vcc-progress" style="height:100%; width:0%; background:linear-gradient(90deg, #6E55B8, #E6C4FF); transition:width 0.1s linear;"></div>
    </div>
    <span class="vcc-time" style="font-variant-numeric:tabular-nums; font-size:0.78rem; opacity:0.9; min-width:78px; text-align:right; flex-shrink:0;">0:00 / 0:00</span>
    <div class="vcc-volume-wrap" style="display:flex; align-items:center; gap:0.35rem; flex-shrink:0;">
      <button type="button" class="vcc-volume-btn" aria-label="Mute/Unmute" style="background:rgba(255,255,255,0.18); border:0; color:white; width:30px; height:30px; border-radius:999px; cursor:pointer; display:flex; align-items:center; justify-content:center; padding:0;">
        <svg class="vcc-icon-vol-on" width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3a4.5 4.5 0 00-2.5-4.03v8.06A4.5 4.5 0 0016.5 12zM14 3.23v2.06A7.001 7.001 0 0119 12a7 7 0 01-5 6.71v2.06A9 9 0 0014 3.23z"/></svg>
        <svg class="vcc-icon-vol-mute" width="14" height="14" viewBox="0 0 24 24" fill="currentColor" style="display:none;"><path d="M16.5 12A4.5 4.5 0 0014 7.97v2.21l2.45 2.45c.03-.2.05-.41.05-.63zm2.5 0c0 .94-.2 1.82-.54 2.64l1.51 1.51A8.96 8.96 0 0021 12c0-4.28-2.99-7.86-7-8.77v2.06c2.89.86 5 3.54 5 6.71zM4.27 3L3 4.27 7.73 9H3v6h4l5 5v-6.73l4.25 4.25c-.67.52-1.42.93-2.25 1.17v2.06a8.99 8.99 0 003.69-1.81L19.73 21 21 19.73l-9-9L4.27 3zM12 4L9.91 6.09 12 8.18V4z"/></svg>

  `;
  wrap.appendChild(overlay);
}

/* Wire a control overlay to a player adapter. The adapter abstracts over
   HTML5 video, YouTube IFrame, and Vimeo Player.js APIs. */
function wireCustomControlsForPlayer(overlay, adapter) {
  const playPause = overlay.querySelector('.vcc-playpause');
  const iconPlay  = overlay.querySelector('.vcc-icon-play');
  const iconPause = overlay.querySelector('.vcc-icon-pause');
  const progress  = overlay.querySelector('.vcc-progress');
  const timeEl    = overlay.querySelector('.vcc-time');
  // PATCH 2026-05-19 round 7: volume + captions wiring.
  const volBtn       = overlay.querySelector('.vcc-volume-btn');
  const volSlider    = overlay.querySelector('.vcc-volume-slider');
  const iconVolOn    = overlay.querySelector('.vcc-icon-vol-on');
  const iconVolMute  = overlay.querySelector('.vcc-icon-vol-mute');
  const ccBtn        = overlay.querySelector('.vcc-cc-btn');

  playPause.onclick = async () => {
    const playing = await Promise.resolve(adapter.isPlaying());
    if (playing) adapter.pause();
    else adapter.play();
  };

  // ---- VOLUME ----
  function paintVolumeIcon(level, muted) {
    var showMute = muted || level <= 0;
    if (iconVolOn)   iconVolOn.style.display   = showMute ? 'none'  : 'block';
    if (iconVolMute) iconVolMute.style.display = showMute ? 'block' : 'none';
    if (volSlider) volSlider.value = String(muted ? 0 : Math.round(level * 100));
  }
  if (volBtn && volSlider && typeof adapter.setVolume === 'function') {
    var lastVolume = 1;
    volSlider.addEventListener('input', function() {
      var v = parseInt(volSlider.value, 10) / 100;
      lastVolume = v > 0 ? v : lastVolume;
      Promise.resolve(adapter.setVolume(v)).catch(function(){});
      if (typeof adapter.setMuted === 'function') {
        Promise.resolve(adapter.setMuted(v <= 0)).catch(function(){});
      }
      paintVolumeIcon(v, v <= 0);
    });
    volBtn.addEventListener('click', function() {
      // Toggle mute: if currently audible, mute. If muted, restore.
      Promise.resolve(typeof adapter.getMuted === 'function' ? adapter.getMuted() : false)
        .then(function(muted) {
          if (muted) {
            if (typeof adapter.setMuted === 'function') adapter.setMuted(false);
            adapter.setVolume(lastVolume > 0 ? lastVolume : 0.5);
            paintVolumeIcon(lastVolume > 0 ? lastVolume : 0.5, false);
          } else {
            Promise.resolve(typeof adapter.getVolume === 'function' ? adapter.getVolume() : lastVolume).then(function(v){
              lastVolume = (v && v > 0) ? v : lastVolume;
              if (typeof adapter.setMuted === 'function') adapter.setMuted(true);
              else adapter.setVolume(0);
              paintVolumeIcon(0, true);
            });
          }
        });
    });
    // Initial paint from current adapter state.
    Promise.resolve(typeof adapter.getVolume === 'function' ? adapter.getVolume() : 1).then(function(v){
      if (typeof v === 'number') { lastVolume = v > 0 ? v : 1; paintVolumeIcon(v, false); }
    });
  } else if (volBtn) {
    // Adapter doesn't support volume — hide the controls.
    var wrap = overlay.querySelector('.vcc-volume-wrap');
    if (wrap) wrap.style.display = 'none';
  }

  // ---- CAPTIONS ----
  if (ccBtn && typeof adapter.hasCaptions === 'function' && typeof adapter.setCaptions === 'function') {
    var ccOn = false;
    Promise.resolve(adapter.hasCaptions()).then(function(has){
      if (has) {
        ccBtn.style.display = 'inline-flex';
        ccBtn.style.alignItems = 'center';
        ccBtn.style.justifyContent = 'center';
      } else {
        ccBtn.style.display = 'none';
      }
    }).catch(function(){ ccBtn.style.display = 'none'; });
    ccBtn.addEventListener('click', function(){
      ccOn = !ccOn;
      Promise.resolve(adapter.setCaptions(ccOn)).catch(function(){});
      ccBtn.style.background = ccOn ? 'var(--accent)' : 'rgba(255,255,255,0.18)';
      ccBtn.setAttribute('aria-pressed', ccOn ? 'true' : 'false');
    });
  } else if (ccBtn) {
    ccBtn.style.display = 'none';
  }

  // Update icons + progress on every tick
  adapter.onProgress((cur, dur) => {
    if (!isFinite(dur) || dur <= 0) return;
    const pct = Math.max(0, Math.min(100, (cur / dur) * 100));
    if (progress) progress.style.width = pct + '%';
    if (timeEl) timeEl.textContent = `${formatVideoTime(cur)} / ${formatVideoTime(dur)}`;
    // Toggle play/pause icons based on whether we're past 0
    Promise.resolve(adapter.isPlaying()).then(p => {
      if (iconPlay)  iconPlay.style.display  = p ? 'none'  : 'block';
      if (iconPause) iconPause.style.display = p ? 'block' : 'none';
    });
  });
}

function formatVideoTime(seconds) {
  if (!isFinite(seconds) || seconds < 0) seconds = 0;
  const m = Math.floor(seconds / 60);
  const s = Math.floor(seconds % 60);
  return `${m}:${s < 10 ? '0' : ''}${s}`;
}

/* Briefly notify the learner that they can't skip ahead. Stays visible
   for ~2s. Spam-safe: subsequent calls reset the timer rather than
   stacking toasts. */
let __skipToastTimer = null;
function showSkipBlockedToast() {
  let toast = document.getElementById('video-skip-toast');
  if (!toast) {
    toast = document.createElement('div');
    toast.id = 'video-skip-toast';

      z-index:9999; box-shadow:0 4px 14px rgba(0,0,0,0.3);
      display:flex; align-items:center; gap:0.5rem;
    `;
    toast.innerHTML = `
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="10"/><line x1="4.93" y1="4.93" x2="19.07" y2="19.07"/>
      </svg>

    `;

  if (__skipToastTimer) clearTimeout(__skipToastTimer);
  __skipToastTimer = setTimeout(() => {
    if (toast) toast.style.opacity = '0';
  }, 2000);
}

/* Render a friendly error in place of the broken YouTube player. */
function showVideoError(slide, ytErrorCode) {
  const wrap = document.getElementById('video-wrap');
  const hint = document.getElementById('video-hint');
  if (!wrap) return;
  const messages = {
    2:   { title: 'Invalid video link', body: 'The video URL on this slide is malformed. Check the editor.' },
    5:   { title: 'Video format issue', body: 'Your browser couldn\'t play this video. Try a different browser.' },
    100: { title: 'Video unavailable', body: 'This video may have been removed or set to private.' },

    150: { title: 'Embedding not allowed', body: 'The video owner has disabled embedding. The author needs to use a different video.' }
  };
  const msg = messages[ytErrorCode] || { title: 'Video player error', body: 'YouTube reported error ' + ytErrorCode + '. Try refreshing the page or using a different video.' };
  const ytId = extractYouTubeId(slide.videoUrl);
