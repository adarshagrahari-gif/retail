/* ---- QUIZ ---- */
function renderQuiz(slide, c) {
  // Review mode kicks in the moment the slide is marked complete.
  // Once an answer is locked in, returning shows the previous answer
  // alongside the correct answer with all input disabled.
  const reviewMode = STATE.completed.has(slide.id);
  const optsHTML = slide.options.map((o, i) =>
    `<div class="quiz-option" data-i="${i}">${o}</div>`
  ).join('');
  c.innerHTML = `
    <div class="glass-strong w-full max-w-3xl rounded-3xl p-6 md:p-8">
      <div class="slide-eyebrow">
        <i class="fa-solid fa-circle-question"></i>
        Knowledge Check${reviewMode ? ' · Review' : ''}
      </div>
      <h2 class="text-xl md:text-2xl font-bold mb-5">${slide.question}</h2>
      <div id="quiz-opts">${optsHTML}</div>
      ${reviewMode ? reviewBanner(slide.explanation) : ''}
    </div>`;
  if (reviewMode) {
    // Replay previous answer state
    const prev = STATE.answers[slide.id];
    c.querySelectorAll('.quiz-option').forEach((opt, i) => {
      opt.classList.add('disabled');
      if (i === slide.correctAnswer) opt.classList.add('correct');
      if (prev && prev.selected === i && i !== slide.correctAnswer) opt.classList.add('incorrect');
    });
    setNextEnabled(true);
    return;
  }

  STATE.attempts[slide.id] = STATE.attempts[slide.id] || 0;
  // Single-attempt mode: 2-option quizzes (true/false style) or explicit opt-in.
  // No "try again" — guess wrong and the correct answer is revealed immediately.
  const singleAttempt = slide.singleAttempt || slide.options.length === 2;

  c.querySelectorAll('.quiz-option').forEach(opt => {
    opt.onclick = () => {
      if (opt.classList.contains('disabled')) return;
      const i = +opt.dataset.i;
      const correct = (i === slide.correctAnswer);
      STATE.attempts[slide.id]++;
      const attemptN = STATE.attempts[slide.id];
      // Force isFinal=true on single-attempt slides
      const isFinal = correct || singleAttempt || attemptN >= 2;
      trackResponse(slide, {
        response: { selected: i },
        correct,
        attempts: attemptN,
        score: correct && attemptN === 1 ? 1 : (correct ? 0.5 : 0),
        completed: isFinal
      });

      if (correct) {
        // Lock in correct answer state
        c.querySelectorAll('.quiz-option').forEach(o => o.classList.add('disabled'));
        opt.classList.add('correct');
        confetti({ particleCount: 60, spread: 70, origin: { y: 0.7 } });
        STATE.completed.add(slide.id);
        setNextEnabled(true);
        refreshSidebarState();
        showFeedbackModal({
          type: 'success',
          title: 'Correct!',
          body: slide.explanation || 'Great work — you got it on the first try.',
          primary: 'Continue'
        });
      } else if (!isFinal) {
        // First attempt wrong — show "try again" modal, then re-enable options on close
        opt.classList.add('incorrect');
        showFeedbackModal({
          type: 'error',
          title: 'Not quite — try again',
          body: 'Take another look at the options. You have one more attempt before the answer is revealed.',
          primary: 'Try Again',
          onPrimary: () => {
            // Disable only the wrong option just clicked; keep others tappable
            opt.classList.add('disabled');
          }
        });
      } else {
        // Final wrong — reveal correct answer, allow progression
        c.querySelectorAll('.quiz-option').forEach(o => o.classList.add('disabled'));
        opt.classList.add('incorrect');
        c.querySelectorAll('.quiz-option')[slide.correctAnswer].classList.add('correct');
        STATE.completed.add(slide.id);
        setNextEnabled(true);
        refreshSidebarState();
        showFeedbackModal({
          type: 'info',
          title: singleAttempt ? 'Incorrect' : 'The correct answer is shown',
          body: slide.explanation
            ? `<p>The correct answer is highlighted on the slide.</p><p>${slide.explanation}</p>`
            : 'The correct answer is highlighted on the slide.',
          primary: 'Continue'
        });
      }
    };
  });
}

/* ============================================================
   TRUE / FALSE
   ============================================================
   A statement card with two big buttons: True and False. Same
   single-attempt scoring as a 2-option quiz, but with a much
   tighter UI focused on binary judgement.
   Schema:
     slide.statement   — the claim being evaluated
     slide.correct     — true or false (the right answer)
     slide.feedbackRight, slide.feedbackWrong  — optional explanations
   ============================================================ */
function renderTrueFalse(slide, c) {
  const reviewMode = STATE.completed.has(slide.id);
  const correctIsTrue = !!slide.correct;
  c.innerHTML = `
    <div class="glass-strong w-full max-w-3xl rounded-3xl p-6 md:p-8">
      <div class="slide-eyebrow">
        <i class="fa-solid fa-circle-question"></i>
        True / False${reviewMode ? ' · Review' : ''}
      </div>
      <h2 class="text-xl md:text-2xl font-bold mb-6 leading-snug">${escapeHtmlAttr(slide.statement || slide.question || '')}</h2>
      <div class="tf-row" style="display:flex; gap:1rem; flex-wrap:wrap; margin-top:1.5rem;">
        <button type="button" class="tf-btn" data-tf="true" style="flex:1; min-width:140px; padding:1.4rem 1rem; border-radius:1rem; border:2px solid var(--success, #1f9b5e); background:transparent; color:var(--text); font-weight:700; font-size:1.05rem; cursor:pointer; display:flex; flex-direction:column; align-items:center; gap:0.4rem; transition:all 0.15s;">
          <i class="fa-solid fa-circle-check" style="font-size:1.7rem; color:var(--success, #1f9b5e);"></i>
          True
        </button>
        <button type="button" class="tf-btn" data-tf="false" style="flex:1; min-width:140px; padding:1.4rem 1rem; border-radius:1rem; border:2px solid var(--error, #c0392b); background:transparent; color:var(--text); font-weight:700; font-size:1.05rem; cursor:pointer; display:flex; flex-direction:column; align-items:center; gap:0.4rem; transition:all 0.15s;">
          <i class="fa-solid fa-circle-xmark" style="font-size:1.7rem; color:var(--error, #c0392b);"></i>
          False
        </button>
      </div>
      ${reviewMode ? reviewBanner(slide.explanation) : ''}
    </div>`;

  if (reviewMode) {
    const prev = STATE.responses[slide.id];
    c.querySelectorAll('.tf-btn').forEach(btn => {
      btn.disabled = true;
      btn.style.cursor = 'default';
      const isTrue = btn.dataset.tf === 'true';
      const isCorrect = isTrue === correctIsTrue;
      if (isCorrect) btn.style.background = 'rgba(31, 155, 94, 0.15)';
      if (prev && prev.response && prev.response.picked === isTrue && !isCorrect) {
        btn.style.background = 'rgba(192, 57, 43, 0.15)';
      }
    });
    setNextEnabled(true);
    return;
  }

  // True/False is always single-attempt — no second chance on a binary choice.
  c.querySelectorAll('.tf-btn').forEach(btn => {
    btn.onclick = () => {
      const picked = (btn.dataset.tf === 'true');
      const correct = (picked === correctIsTrue);
      trackResponse(slide, {
        response: { picked },
        correct,
        attempts: 1,
        score: correct ? 1 : 0,
        completed: true
      });
      // Lock UI
      c.querySelectorAll('.tf-btn').forEach(b => { b.disabled = true; b.style.cursor = 'default'; });
      btn.style.background = correct ? 'rgba(31, 155, 94, 0.15)' : 'rgba(192, 57, 43, 0.15)';
      if (!correct) {
        // Highlight the actual correct one
        const correctBtn = c.querySelector(`.tf-btn[data-tf="${correctIsTrue}"]`);
        if (correctBtn) correctBtn.style.background = 'rgba(31, 155, 94, 0.15)';
      }

      if (correct) {
        confetti({ particleCount: 50, spread: 60, origin: { y: 0.7 } });
        showFeedbackModal({
          type: 'success',
          title: 'Correct!',
          body: slide.feedbackRight || slide.explanation || 'Nice — you nailed it.',
          primary: 'Continue'
        });
      } else {
        showFeedbackModal({
          type: 'info',
          title: 'Incorrect',
          body: slide.feedbackWrong || slide.explanation || `The correct answer is ${correctIsTrue ? 'True' : 'False'}.`,
          primary: 'Continue'
        });
      }
      STATE.completed.add(slide.id);
      setNextEnabled(true);
      refreshSidebarState();
    };
  });
}

/* ============================================================
   FEEDBACK
   ============================================================
   A non-scoreable interaction for collecting learner feedback.
   Four response modes — author picks one per slide:
     - "likert-na" : Not Applicable | Strongly Disagree | Disagree
                     | Agree | Strongly Agree (default)
     - "yes-no"    : Yes / No
     - "free-text" : multi-line text input
     - "stars"     : 1-5 (configurable) star rating
   Always non-scoreable: trackResponse stores the value with
   correct=null and score=null. The Results slide skips these
   when computing the percentage. xAPI gets a "likert" or "other"
   interaction statement so the LRS can still aggregate feedback.
   ============================================================ */
const FEEDBACK_LIKERT_NA_LABELS = [
  'Not Applicable',
  'Strongly Disagree',
  'Disagree',
  'Agree',
  'Strongly Agree'
];

function renderFeedback(slide, c) {
  const reviewMode = STATE.completed.has(slide.id);
  const prev = STATE.responses[slide.id];
  const responseType = slide.responseType || 'likert-na';
  const required = slide.required !== false; // default true
  const promptHtml = renderRichTextOrPlain(slide.prompt || '');

  let inputHtml = '';
  if (responseType === 'likert-na') {
    const labels = (Array.isArray(slide.likertLabels) && slide.likertLabels.length === 5)
      ? slide.likertLabels : FEEDBACK_LIKERT_NA_LABELS;
    inputHtml = `
      <div class="fb-likert" style="display:grid; grid-template-columns:repeat(5, 1fr); gap:0.5rem; margin-top:1rem;">
        ${labels.map((label, i) => `
          <button type="button" class="fb-likert-btn" data-value="${i}"
                  style="padding:1rem 0.6rem; border-radius:0.75rem; border:2px solid var(--border, rgba(0,0,0,0.12));
                         background:var(--surface, white); color:var(--text); cursor:pointer;
                         font-weight:600; font-size:0.92rem; line-height:1.25; transition:all 0.15s;
                         min-height:88px; display:flex; align-items:center; justify-content:center; text-align:center;">
            ${escapeHtmlAttr(label)}
          </button>
        `).join('')}
      </div>
      <p class="text-white/60 text-sm" style="margin-top:0.6rem; opacity:0.7; font-size:0.85rem;">
        Pick the option that best reflects your view.
      </p>`;
  } else if (responseType === 'yes-no') {
    const yesLabel = slide.yesLabel || 'Yes';
    const noLabel  = slide.noLabel  || 'No';
    inputHtml = `
      <div class="fb-yesno" style="display:flex; gap:1rem; flex-wrap:wrap; margin-top:1.2rem; justify-content:center;">
        <button type="button" class="fb-yn-btn" data-value="yes"
                style="flex:1; max-width:200px; min-width:140px; padding:1.4rem 1rem; border-radius:1rem;
                       border:2px solid var(--accent); background:transparent; color:var(--text);
                       font-weight:700; font-size:1.05rem; cursor:pointer;
                       display:flex; flex-direction:column; align-items:center; gap:0.4rem; transition:all 0.15s;">
          <i class="fa-solid fa-circle-check" style="font-size:1.7rem; color:var(--accent);"></i>
          ${escapeHtmlAttr(yesLabel)}
        </button>
        <button type="button" class="fb-yn-btn" data-value="no"
                style="flex:1; max-width:200px; min-width:140px; padding:1.4rem 1rem; border-radius:1rem;
                       border:2px solid var(--border, rgba(0,0,0,0.25)); background:transparent; color:var(--text);
                       font-weight:700; font-size:1.05rem; cursor:pointer;
                       display:flex; flex-direction:column; align-items:center; gap:0.4rem; transition:all 0.15s;">
          <i class="fa-solid fa-circle-xmark" style="font-size:1.7rem; color:var(--text); opacity:0.6;"></i>
          ${escapeHtmlAttr(noLabel)}
        </button>
      </div>`;
  } else if (responseType === 'free-text') {
    const placeholder = slide.freeTextPlaceholder || 'Type your response here…';
    const maxLength   = slide.freeTextMaxLength   || 1000;
    inputHtml = `
      <div class="fb-freetext" style="margin-top:1rem;">
        <textarea class="fb-text" maxlength="${maxLength}"
                  style="width:100%; min-height:140px; padding:0.9rem 1rem; border-radius:0.75rem;
                         border:2px solid var(--border, rgba(0,0,0,0.12)); background:var(--surface, white);
                         color:var(--text); font-family:inherit; font-size:1rem; line-height:1.5; resize:vertical;"
                  placeholder="${escapeHtmlAttr(placeholder)}"></textarea>
        <div class="fb-text-meta" style="display:flex; justify-content:space-between; margin-top:0.4rem;
                                          font-size:0.85rem; opacity:0.7;">
          <span class="fb-text-count">0 / ${maxLength}</span>
          <span>Press Submit when done.</span>
        </div>
        <div style="margin-top:0.8rem; text-align:right;">
          <button type="button" class="fb-text-submit btn btn-primary"
                  style="padding:0.7rem 1.4rem; border-radius:0.5rem; background:var(--accent); color:white;
                         border:none; font-weight:600; cursor:pointer;">Submit feedback</button>
        </div>
      </div>`;
  } else if (responseType === 'stars') {
    const starCount = +slide.starCount || 5;
    const stars = [];
    for (let i = 1; i <= starCount; i++) {
      stars.push(`
        <button type="button" class="fb-star" data-value="${i}" aria-label="${i} star${i === 1 ? '' : 's'}"
                style="background:transparent; border:none; cursor:pointer; padding:0.3rem; font-size:2.4rem;
                       line-height:1; color:var(--border, rgba(0,0,0,0.2)); transition:color 0.12s;">★</button>`);
    }
    inputHtml = `
      <div class="fb-stars" style="display:flex; gap:0.2rem; margin-top:1rem; justify-content:center; flex-wrap:wrap;">
        ${stars.join('')}
      </div>
      <p class="fb-stars-feedback text-white/60 text-sm" style="margin-top:0.6rem; opacity:0.7; text-align:center; font-size:0.9rem; min-height:1.3em;">
        Tap a star to rate.
      </p>`;
  }

  const submittedBanner = reviewMode ? `
    <div class="glass" style="margin-top:1.5rem; padding:1rem 1.2rem; border-radius:0.75rem;
                              border:1px solid var(--accent); background:rgba(110, 85, 184, 0.08);">
      <i class="fa-solid fa-circle-check" style="color:var(--accent); margin-right:0.5rem;"></i>
      <strong>Thanks for your feedback.</strong>
      ${prev && prev.response ? `<div style="margin-top:0.4rem; font-size:0.92rem; opacity:0.85;">Your response: ${escapeHtmlAttr(formatFeedbackResponse(prev.response, responseType, slide))}</div>` : ''}
    </div>` : '';

  c.innerHTML = `
    <div class="glass-strong w-full max-w-3xl rounded-3xl p-6 md:p-8">
      <div class="slide-eyebrow">
        <i class="fa-solid fa-comment-dots"></i>
        Feedback${reviewMode ? ' · Review' : ''}
      </div>
      <h2 class="text-xl md:text-2xl font-bold mb-3 leading-snug">${escapeHtmlAttr(slide.title || 'Your feedback')}</h2>
      <div class="fb-prompt" style="font-size:1.05rem; line-height:1.55; opacity:0.92;">${promptHtml}</div>
      ${reviewMode ? '' : inputHtml}
      ${submittedBanner}
    </div>`;

  if (reviewMode) {
    setNextEnabled(true);
    return;
  }

  // Not required → user can advance without responding.
  setNextEnabled(!required);

  const recordFeedback = (response, displayValue) => {
    trackResponse(slide, {
      response,
      correct: null,           // never scoreable
      score: null,
      attempts: 1,
      completed: true
    });
    STATE.completed.add(slide.id);
    setNextEnabled(true);
    refreshSidebarState();
    showFeedbackModal({
      type: 'success',
      title: 'Thanks!',
      body: 'Your feedback has been recorded.' + (displayValue ? `\n\nResponse: ${displayValue}` : ''),
      primary: 'Continue'
    });
  };

  // Wire up per-mode handlers
  if (responseType === 'likert-na') {
    c.querySelectorAll('.fb-likert-btn').forEach(btn => {
      btn.onclick = () => {
        const value = +btn.dataset.value;
        const labels = (Array.isArray(slide.likertLabels) && slide.likertLabels.length === 5)
          ? slide.likertLabels : FEEDBACK_LIKERT_NA_LABELS;
        c.querySelectorAll('.fb-likert-btn').forEach(b => {
          b.disabled = true;
          b.style.cursor = 'default';
          if (+b.dataset.value === value) {
            b.style.background = 'var(--accent)';
            b.style.color = 'white';
            b.style.borderColor = 'var(--accent)';
          } else {
            b.style.opacity = '0.45';
          }
        });
        recordFeedback({ scale: 'likert-na', value, label: labels[value] }, labels[value]);
      };
    });
  } else if (responseType === 'yes-no') {
    c.querySelectorAll('.fb-yn-btn').forEach(btn => {
      btn.onclick = () => {
        const value = btn.dataset.value;
        c.querySelectorAll('.fb-yn-btn').forEach(b => {
          b.disabled = true;
          b.style.cursor = 'default';
          if (b.dataset.value === value) {
            b.style.background = 'var(--accent)';
            b.style.color = 'white';
            b.style.borderColor = 'var(--accent)';
            const ic = b.querySelector('i');
            if (ic) ic.style.color = 'white';
          } else {
            b.style.opacity = '0.45';
          }
        });
        const display = value === 'yes' ? (slide.yesLabel || 'Yes') : (slide.noLabel || 'No');
        recordFeedback({ scale: 'yes-no', value, label: display }, display);
      };
    });
  } else if (responseType === 'free-text') {
    const ta = c.querySelector('.fb-text');
    const counter = c.querySelector('.fb-text-count');
    const submit = c.querySelector('.fb-text-submit');
    const maxLength = slide.freeTextMaxLength || 1000;
    if (ta && counter) {
      ta.addEventListener('input', () => {
        counter.textContent = `${ta.value.length} / ${maxLength}`;
      });
    }
    if (submit) {
      submit.onclick = () => {
        const text = (ta && ta.value || '').trim();
        if (!text) {
          showFeedbackModal({
            type: 'info',
            title: 'Add some feedback',
            body: 'Please type a response before submitting.',
            primary: 'OK'
          });
          return;
        }
        if (ta) ta.disabled = true;
        submit.disabled = true; submit.style.opacity = '0.6'; submit.style.cursor = 'default';
        recordFeedback({ scale: 'free-text', text }, text.length > 80 ? text.slice(0, 77) + '…' : text);
      };
    }
  } else if (responseType === 'stars') {
    const buttons = Array.from(c.querySelectorAll('.fb-star'));
    const fb = c.querySelector('.fb-stars-feedback');
    const starLabels = ['', 'Poor', 'Fair', 'Good', 'Very good', 'Excellent'];
    const paint = (n, lock) => {
      buttons.forEach(b => {
        const i = +b.dataset.value;
        b.style.color = i <= n ? 'var(--accent)' : 'var(--border, rgba(0,0,0,0.2))';
        if (lock) { b.disabled = true; b.style.cursor = 'default'; }
      });
      if (fb) fb.textContent = (starLabels[n] || `${n} star${n === 1 ? '' : 's'}`);
    };
    buttons.forEach(b => {
      b.addEventListener('mouseenter', () => paint(+b.dataset.value, false));
      b.addEventListener('mouseleave', () => paint(0, false));
      b.onclick = () => {
        const value = +b.dataset.value;
        paint(value, true);
        recordFeedback({ scale: 'stars', value, max: buttons.length }, `${value}/${buttons.length} stars`);
      };
    });
  }
}

/* Format a feedback response object back into a human-readable string
   for display in the review banner. */
function formatFeedbackResponse(resp, responseType, slide) {
  if (!resp) return '';
  if (responseType === 'likert-na' || responseType === 'yes-no') return resp.label || '';
  if (responseType === 'free-text') {
    const t = resp.text || '';
    return t.length > 200 ? t.slice(0, 197) + '…' : t;
  }
  if (responseType === 'stars') return `${resp.value}/${resp.max || 5} stars`;
  return '';
}

/* renderRichTextOrPlain: if the input contains HTML tags, render them
   directly (after a small sanitization pass); otherwise treat as plain
   text and HTML-escape it. Used by slide types whose prose fields may
   carry rich-text formatting from the editor's WYSIWYG component.
   Sanitization is intentionally conservative — we strip script/style/
   iframe and any on* event handlers, and allow only formatting tags
   plus span/div/p/ul/ol/li with style attributes (used for color/
   font-size/highlight). */
function renderRichTextOrPlain(value) {
  if (!value) return '';
  const looksLikeHtml = /<[a-z][^>]*>/i.test(value);
  if (!looksLikeHtml) return escapeHtmlAttr(value).replace(/\n/g, '<br>');
  return sanitizeRichHtml(value);
}

function sanitizeRichHtml(html) {
  // Server-side parse via DOMParser so we never trip script execution
  // during sanitization itself. In environments without DOMParser
  // (notably the Node test harness's minimal synthetic DOM), fall back
  // to the regex-based whitelist sanitizer.
  if (typeof DOMParser === 'undefined') {
    return sanitizeRichHtmlFallback(html);
  }
  let doc;
  try {
    doc = new DOMParser().parseFromString('<div>' + html + '</div>', 'text/html');
  } catch (e) {
    return sanitizeRichHtmlFallback(html);
  }
  const root = doc.body && doc.body.firstChild;
  if (!root) return '';
  const ALLOWED_TAGS = new Set([
    'B','I','U','EM','STRONG','S','STRIKE','SPAN','DIV','P','BR',
    'UL','OL','LI','A','H1','H2','H3','H4','H5','H6','BLOCKQUOTE',
    'FONT','MARK'
  ]);
  const ALLOWED_ATTRS = new Set(['style','href','target','rel','class','color','face','size']);
  const walk = (node) => {
    const kids = Array.from(node.childNodes);
    kids.forEach(child => {
      if (child.nodeType === 1) {
        if (!ALLOWED_TAGS.has(child.tagName)) {
          // Replace forbidden tag with its children
          while (child.firstChild) node.insertBefore(child.firstChild, child);
          node.removeChild(child);
          return;
        }
        // Strip dangerous attributes
        Array.from(child.attributes).forEach(a => {
          const n = a.name.toLowerCase();
          if (n.startsWith('on')) child.removeAttribute(a.name);
          else if (!ALLOWED_ATTRS.has(n)) child.removeAttribute(a.name);
          else if (n === 'href' && /^\s*javascript:/i.test(a.value)) child.removeAttribute(a.name);
          else if (n === 'style' && /expression\s*\(|javascript:/i.test(a.value)) child.removeAttribute(a.name);
        });
        // Add safe target rel for links
        if (child.tagName === 'A' && child.getAttribute('target') === '_blank') {
          child.setAttribute('rel', 'noopener noreferrer');
        }
        walk(child);
      } else if (child.nodeType === 8) {
        node.removeChild(child); // strip comments
      }
    });
  };
  walk(root);
  return root.innerHTML;
}

/* Tag-stripping fallback for environments where DOMParser isn't
   available (the Node test harness uses a minimal synthetic DOM).
   Also serves as a safety net if DOMParser throws. Whitelist-based:
   keeps only the tags listed in ALLOWED_TAGS_RE, drops every attribute
   except a minimal set, and strips javascript: URLs and on* handlers.
   Less strict than the DOM walk, but safe enough for our authored
   content (the editor's own paste handler has already filtered the
   worst cases before save). */
function sanitizeRichHtmlFallback(html) {
  let s = String(html);
  // Strip <script>, <style>, <iframe> entire blocks (with content)
  s = s.replace(/<\s*(script|style|iframe|object|embed|link|meta)\b[^>]*>[\s\S]*?<\s*\/\s*\1\s*>/gi, '');
  s = s.replace(/<\s*(script|style|iframe|object|embed|link|meta)\b[^>]*\/?\s*>/gi, '');
  // Strip HTML comments (could hide CDATA-style payloads)
  s = s.replace(/<!--[\s\S]*?-->/g, '');
  // Drop on* event handler attributes anywhere
  s = s.replace(/\son[a-z]+\s*=\s*"[^"]*"/gi, '');
  s = s.replace(/\son[a-z]+\s*=\s*'[^']*'/gi, '');
  s = s.replace(/\son[a-z]+\s*=\s*[^\s>]+/gi, '');
  // Neutralize javascript: URLs in href/src
  s = s.replace(/(href|src)\s*=\s*"\s*javascript:[^"]*"/gi, '$1="#"');
  s = s.replace(/(href|src)\s*=\s*'\s*javascript:[^']*'/gi, "$1='#'");
  // Whitelist of allowed tags. Anything else gets stripped (just the tags;
  // their text content survives).
  const ALLOWED_TAGS_RE = /^(b|i|u|em|strong|s|strike|span|div|p|br|ul|ol|li|a|h[1-6]|blockquote|font|mark)$/i;
  s = s.replace(/<\/?\s*([a-z][a-z0-9]*)\b[^>]*>/gi, (m, tag) => {
    return ALLOWED_TAGS_RE.test(tag) ? m : '';
  });
  return s;
}

/* ============================================================
   SWIPE DECISION
   ============================================================
   A card-swipe interaction: drag a card right for one choice,
   left for the other. Falls back to two arrow buttons for
   keyboard / accessibility users.

   Schema (multi-card, current):
     slide.cards[]           — array of { prompt, correctDirection,
                               feedbackRight, feedbackWrong }
     slide.leftLabel         — slide-wide label (e.g. "NO")
     slide.rightLabel        — slide-wide label (e.g. "YES")
     slide.explanation       — fallback feedback if a card has none

   Schema (legacy single-card, still supported):
     slide.prompt            — the question/situation text
     slide.correctDirection  — "left" or "right"
     slide.feedbackRight, slide.feedbackWrong

   When `slide.cards` is missing or empty, the engine synthesizes a
   single-card array from the legacy fields, so old courses keep
   working without any migration step.

   Scoring: slide.score = correctCount / totalCards (0..1). The
   existing weighted-aggregate scoring in getResultsScore() picks
   that up automatically.
   ============================================================ */
function renderSwipeDecision(slide, c) {
  const reviewMode = STATE.completed.has(slide.id);
  const leftLabel = slide.leftLabel || 'No';
  const rightLabel = slide.rightLabel || 'Yes';

  // Normalize to a cards[] array. If author used the new multi-card
  // schema, take it directly; otherwise fall back to a one-card array
  // built from the legacy fields. Either way the rest of the function
  // works on `cards`.
  const cards = (Array.isArray(slide.cards) && slide.cards.length > 0)
    ? slide.cards
    : [{
        prompt:           slide.prompt || slide.question || '',
        correctDirection: slide.correctDirection || 'right',
        feedbackRight:    slide.feedbackRight || '',
        feedbackWrong:    slide.feedbackWrong || ''
      }];
  const totalCards = cards.length;

  c.innerHTML = `
    <div class="glass-strong w-full max-w-3xl rounded-3xl p-6 md:p-8">
      <div class="slide-eyebrow">
        <i class="fa-solid fa-arrows-left-right"></i>
        Swipe Decision${reviewMode ? ' · Review' : ''}
      </div>
      ${slide.title ? `<h2 class="text-xl md:text-2xl font-bold mb-2">${escapeHtmlAttr(slide.title)}</h2>` : ''}
      <p class="text-sm" style="opacity:0.7; margin-bottom:0.7rem;">Drag the card left or right — or use the buttons below.</p>

      ${totalCards > 1 ? `
        <div class="swipe-progress" style="display:flex; justify-content:center; align-items:center; gap:0.5rem; margin-bottom:1rem; font-size:0.85rem; color:var(--text-muted);">
          <span id="swipe-counter-${slide.id}">Card 1 of ${totalCards}</span>
          <div style="flex:1; max-width:140px; height:4px; background:var(--border); border-radius:2px; overflow:hidden;">
            <div id="swipe-progress-bar-${slide.id}" style="width:${100 / totalCards}%; height:100%; background:var(--accent); transition:width 0.4s;"></div>
          </div>
        </div>
      ` : ''}

      <div class="swipe-stage" style="position:relative; height:280px; display:flex; align-items:center; justify-content:center; margin-bottom:1.2rem;">
        <div class="swipe-hint swipe-hint-left"  style="position:absolute; left:0.5rem; top:50%; transform:translateY(-50%); padding:0.6rem 1rem; border-radius:999px; background:rgba(192,57,43,0.18); color:var(--error, #c0392b); font-weight:700; font-size:1.05rem; opacity:0.5; pointer-events:none;">← ${escapeHtmlAttr(leftLabel)}</div>
        <div class="swipe-hint swipe-hint-right" style="position:absolute; right:0.5rem; top:50%; transform:translateY(-50%); padding:0.6rem 1rem; border-radius:999px; background:rgba(31,155,94,0.18); color:var(--success, #1f9b5e); font-weight:700; font-size:1.05rem; opacity:0.5; pointer-events:none;">${escapeHtmlAttr(rightLabel)} →</div>
        <div class="swipe-card" id="swipe-card-${slide.id}" style="position:relative; max-width:420px; width:80%; min-height:200px; padding:2rem 1.5rem; background:white; color:#1a1a1a; border-radius:1.4rem; box-shadow:0 14px 40px rgba(0,0,0,0.25); user-select:none; touch-action:pan-y; cursor:grab; display:flex; align-items:center; justify-content:center; text-align:center; font-weight:600; font-size:1.15rem; line-height:1.5; transition:none;">
          <div class="rt-rendered" style="width:100%;">${renderRichTextOrPlain(cards[0].prompt || '')}</div>
        </div>
      </div>

      <div style="display:flex; gap:0.8rem; justify-content:center;">
        <button type="button" class="swipe-btn" data-dir="left"  style="padding:0.8rem 1.5rem; border-radius:999px; border:2px solid var(--error, #c0392b); background:transparent; color:var(--error, #c0392b); font-weight:700; cursor:pointer; display:inline-flex; align-items:center; gap:0.4rem;">
          <i class="fa-solid fa-arrow-left"></i> ${escapeHtmlAttr(leftLabel)}
        </button>
        <button type="button" class="swipe-btn" data-dir="right" style="padding:0.8rem 1.5rem; border-radius:999px; border:2px solid var(--success, #1f9b5e); background:transparent; color:var(--success, #1f9b5e); font-weight:700; cursor:pointer; display:inline-flex; align-items:center; gap:0.4rem;">
          ${escapeHtmlAttr(rightLabel)} <i class="fa-solid fa-arrow-right"></i>
        </button>
      </div>
      ${reviewMode ? buildSwipeReviewSummary(slide, cards) : ''}
    </div>`;

  const card = document.getElementById(`swipe-card-${slide.id}`);
  const counterEl = document.getElementById(`swipe-counter-${slide.id}`);
  const progressEl = document.getElementById(`swipe-progress-bar-${slide.id}`);

  // ---- Review mode: disable interactions, show what they did ----
  if (reviewMode) {
    c.querySelectorAll('.swipe-btn').forEach(b => {
      b.disabled = true; b.style.cursor = 'default';
    });
    if (card) {
      card.style.cursor = 'default';
      // For multi-card, hide the live card area since we're showing the
      // summary list instead. For single-card, keep the original card
      // visible with answer revealed via the summary banner.
      if (totalCards > 1) {
        const stage = c.querySelector('.swipe-stage');
        if (stage) stage.style.display = 'none';
      }
    }
    setNextEnabled(true);
    return;
  }

  // ---- Live mode: walk through cards one at a time ----
  let cardIdx = 0;
  // Track per-card responses so we can save the full array at the end
  // and (later) replay them in review mode.
  const cardResponses = [];

  function showCardAtIndex(i) {
    if (!card || !cards[i]) return;
    // Reset the card visual to its starting position + content
    card.style.transition = 'opacity 0.25s ease';
    card.style.opacity = '0';
    setTimeout(() => {
      card.style.transition = 'none';
      card.style.transform = '';
      card.innerHTML = `<div class="rt-rendered" style="width:100%;">${renderRichTextOrPlain(cards[i].prompt || '')}</div>`;
      card.style.cursor = 'grab';
      card.style.opacity = '1';
      // Update counter + progress
      if (counterEl) counterEl.textContent = `Card ${i + 1} of ${totalCards}`;
      if (progressEl) progressEl.style.width = (((i + 1) / totalCards) * 100) + '%';
      // Reset side hints
      const lh = c.querySelector('.swipe-hint-left');
      const rh = c.querySelector('.swipe-hint-right');
      if (lh) lh.style.opacity = 0.5;
      if (rh) rh.style.opacity = 0.5;
    }, 240);
  }

  function commitDirection(dir) {
    if (cardIdx >= cards.length) return;        // already finished
    const currentCard = cards[cardIdx];
    const correct = (dir === currentCard.correctDirection);
    cardResponses.push({ direction: dir, correct, cardIdx });

    // Animate the card off-screen in the chosen direction
    if (card) {
      const offset = dir === 'right' ? 1500 : -1500;
      card.style.transition = 'transform 0.45s ease, opacity 0.45s ease';
      card.style.transform = `translateX(${offset}px) rotate(${dir === 'right' ? 25 : -25}deg)`;
      card.style.opacity = '0';
      card.style.cursor = 'default';
    }

    // For multi-card decks, show a brief inline feedback ONLY if the
    // author provided per-card feedback AND it's a wrong answer (so we
    // teach without nagging on every right swipe). For single-card the
    // legacy modal flow stays.
    const isLast = cardIdx === cards.length - 1;
    const showInlineFeedback = totalCards > 1 && !correct && (currentCard.feedbackWrong || slide.explanation);

    cardIdx++;

    if (isLast) {
      // Done: tally + commit
      finalizeDeck();
    } else if (showInlineFeedback) {
      // Pause briefly to show feedback before next card
      showFeedbackModal({
        type: 'info',
        title: 'Not quite',
        body: currentCard.feedbackWrong || slide.explanation || `The correct choice was ${cards[cardIdx - 1].correctDirection === 'right' ? rightLabel : leftLabel}.`,
        primary: 'Next card',
        onPrimary: () => showCardAtIndex(cardIdx)
      });
    } else {
      // Quick advance
      setTimeout(() => showCardAtIndex(cardIdx), 460);
    }
  }

  function finalizeDeck() {
    const correctCount = cardResponses.filter(r => r.correct).length;
    const score = correctCount / totalCards;

    // For single-card decks, also include the legacy `direction` field at
    // the top level of the response so existing reporting / xAPI consumers
    // that read STATE.responses[id].response.direction keep working.
    const responsePayload = { cardResponses, correctCount, totalCards };
    if (totalCards === 1 && cardResponses[0]) {
      responsePayload.direction = cardResponses[0].direction;
    }

    trackResponse(slide, {
      response: responsePayload,
      correct: correctCount === totalCards,
      attempts: 1,
      score,
      completed: true
    });
    STATE.completed.add(slide.id);
    setNextEnabled(true);
    refreshSidebarState();

    c.querySelectorAll('.swipe-btn').forEach(b => { b.disabled = true; b.style.cursor = 'default'; });

    // Single-card flow keeps its original modal behavior for backwards
    // visual parity with existing courses.
    if (totalCards === 1) {
      const r = cardResponses[0];
      const ourCard = cards[0];
      if (r.correct) {
        confetti({ particleCount: 50, spread: 60, origin: { y: 0.7 } });
        showFeedbackModal({
          type: 'success',
          title: 'Correct!',
          body: ourCard.feedbackRight || slide.explanation || 'Good call.',
          primary: 'Continue'
        });
      } else {
        showFeedbackModal({
          type: 'info',
          title: 'Incorrect',
          body: ourCard.feedbackWrong || slide.explanation || `The correct choice was ${ourCard.correctDirection === 'right' ? rightLabel : leftLabel}.`,
          primary: 'Continue'
        });
      }
      return;
    }

    // Multi-card flow: deck-wide summary modal
    const allCorrect = correctCount === totalCards;
    if (allCorrect) {
      confetti({ particleCount: 80, spread: 75, origin: { y: 0.7 } });
    }
    showFeedbackModal({
      type: allCorrect ? 'success' : 'info',
      title: allCorrect ? 'Perfect deck!' : `${correctCount} of ${totalCards} correct`,
      body: allCorrect
        ? (slide.explanation || 'You swiped every card the right way.')
        : (slide.explanation || `You'll see the full breakdown if you revisit this slide later.`),
      primary: 'Continue'
    });
  }

  // ---- Pointer-based drag (works for mouse + touch) ----
  if (card) {
    let isDragging = false, startX = 0, currentX = 0;
    const SWIPE_THRESHOLD = 100;  // px past which we commit the swipe

    const onDown = (e) => {
      if (STATE.completed.has(slide.id)) return;
      isDragging = true;
      startX = (e.touches ? e.touches[0].clientX : e.clientX);
      currentX = 0;
      card.style.transition = 'none';
      card.style.cursor = 'grabbing';
    };
    const onMove = (e) => {
      if (!isDragging) return;
      const x = (e.touches ? e.touches[0].clientX : e.clientX);
      currentX = x - startX;
      const rotate = currentX / 20;
      card.style.transform = `translateX(${currentX}px) rotate(${rotate}deg)`;
      const leftHint  = c.querySelector('.swipe-hint-left');
      const rightHint = c.querySelector('.swipe-hint-right');
      if (leftHint && rightHint) {
        if (currentX < -20) { leftHint.style.opacity = Math.min(1, Math.abs(currentX) / 100); rightHint.style.opacity = 0.5; }
        else if (currentX > 20) { rightHint.style.opacity = Math.min(1, currentX / 100); leftHint.style.opacity = 0.5; }
        else { leftHint.style.opacity = 0.5; rightHint.style.opacity = 0.5; }
      }
    };
    const onUp = () => {
      if (!isDragging) return;
      isDragging = false;
      card.style.cursor = 'grab';
      if (Math.abs(currentX) > SWIPE_THRESHOLD) {
        commitDirection(currentX > 0 ? 'right' : 'left');
      } else {
        // Snap back
        card.style.transition = 'transform 0.3s ease';
        card.style.transform = '';
        const leftHint  = c.querySelector('.swipe-hint-left');
        const rightHint = c.querySelector('.swipe-hint-right');
        if (leftHint)  leftHint.style.opacity = 0.5;
        if (rightHint) rightHint.style.opacity = 0.5;
      }
    };

    card.addEventListener('mousedown', onDown);
    card.addEventListener('touchstart', onDown, { passive: true });
    document.addEventListener('mousemove', onMove);
    document.addEventListener('touchmove', onMove, { passive: true });
    document.addEventListener('mouseup', onUp);
    document.addEventListener('touchend', onUp);
  }

  // Button fallback (also keyboard-accessible)
  c.querySelectorAll('.swipe-btn').forEach(btn => {
    btn.onclick = () => commitDirection(btn.dataset.dir);
  });
}

/* Build the review-mode summary for a swipe-decision slide. For a
   single-card slide this is just a banner with the explanation. For
   a multi-card deck, it's a per-card list showing the learner's
   choice and the correct answer. */
function buildSwipeReviewSummary(slide, cards) {
  const leftLabel = slide.leftLabel || 'No';
  const rightLabel = slide.rightLabel || 'Yes';
  if (cards.length === 1) {
    return reviewBanner(slide.explanation);
  }
  const prev = STATE.responses[slide.id]?.response;
  const responses = (prev && Array.isArray(prev.cardResponses)) ? prev.cardResponses : [];
  const correctCount = (prev && typeof prev.correctCount === 'number') ? prev.correctCount : 0;
  const totalCards = cards.length;

  const rows = cards.map((cd, i) => {
    const r = responses[i];
    const correctLabel = cd.correctDirection === 'right' ? rightLabel : leftLabel;
    const userPicked = r ? r.direction : null;
    const wasCorrect = r && r.correct;
    const status = !r
      ? `<span style="color:var(--text-muted);">(not answered)</span>`
      : wasCorrect
        ? `<span style="color:var(--success, #1f9b5e); font-weight:600;"><i class="fa-solid fa-check"></i> Correct (${escapeHtml(correctLabel)})</span>`
        : `<span style="color:var(--error, #c0392b); font-weight:600;"><i class="fa-solid fa-xmark"></i> You: ${escapeHtml(userPicked === 'right' ? rightLabel : leftLabel)} · Correct: ${escapeHtml(correctLabel)}</span>`;
    return `
      <div style="padding:0.85rem 1rem; border-radius:10px; background:var(--surface); border:1px solid var(--border); margin-bottom:0.5rem;">
        <div class="rt-rendered" style="font-weight:600; margin-bottom:0.3rem;">Card ${i + 1}: ${renderRichTextOrPlain(cd.prompt || '')}</div>
        <div style="font-size:0.9rem;">${status}</div>
      </div>`;
  }).join('');

  return `
    <div style="margin-top:1.2rem; padding:1rem 1.1rem; border-radius:12px; background:var(--accent-soft); border:1px solid var(--accent-light);">
      <div style="font-weight:700; color:var(--accent-strong); margin-bottom:0.6rem;">
        <i class="fa-solid fa-clipboard-list"></i> Your results: ${correctCount} of ${totalCards} correct
      </div>
      ${rows}
      ${slide.explanation ? `<div class="rt-rendered" style="margin-top:0.6rem; font-size:0.9rem; color:var(--text-muted);">${renderRichTextOrPlain(slide.explanation)}</div>` : ''}
    </div>`;
}

/* ============================================================
   TIMED QUIZ
   ============================================================
   Multiple-choice with a countdown timer. If the timer expires
   before the learner picks, the slide auto-submits as incorrect.
   Single-attempt by design — no "try again" on a timed activity.
   Schema:
     slide.question
     slide.options[]
     slide.correctAnswer  — index into options
     slide.timeLimit      — seconds (default 15)
     slide.explanation, slide.feedbackRight, slide.feedbackWrong
   ============================================================ */
function renderTimedQuiz(slide, c) {
  const reviewMode = STATE.completed.has(slide.id);
  const limitSec = Math.max(3, Math.min(120, slide.timeLimit || 15));
  const optsHTML = (slide.options || []).map((o, i) =>
    `<div class="quiz-option" data-i="${i}">${escapeHtmlAttr(o)}</div>`
  ).join('');

  c.innerHTML = `
    <div class="glass-strong w-full max-w-3xl rounded-3xl p-6 md:p-8">
      <div class="slide-eyebrow">
        <i class="fa-solid fa-stopwatch"></i>
        Timed Question${reviewMode ? ' · Review' : ''}
      </div>
      ${reviewMode ? '' : `
        <div class="timed-bar" style="margin: 0 0 1rem; padding: 0.6rem 1rem; background:rgba(255,255,255,0.06); border:1px solid rgba(255,255,255,0.1); border-radius:999px; display:flex; align-items:center; gap:0.7rem;">
          <i class="fa-solid fa-stopwatch" style="color:var(--accent);"></i>
          <span style="font-weight:600;">Time remaining:</span>
          <span id="timed-quiz-counter-${slide.id}" style="font-variant-numeric: tabular-nums; font-weight:700; min-width:2.5rem;">${limitSec}s</span>
          <div style="flex:1; height:8px; background:rgba(255,255,255,0.1); border-radius:999px; overflow:hidden;">
            <div id="timed-quiz-fill-${slide.id}" style="height:100%; width:100%; background:linear-gradient(90deg, var(--success, #1f9b5e), var(--accent, #6E55B8)); transition:width 0.1s linear;"></div>
          </div>
        </div>
      `}
      <h2 class="text-xl md:text-2xl font-bold mb-5">${escapeHtmlAttr(slide.question || '')}</h2>
      <div id="timed-opts-${slide.id}">${optsHTML}</div>
      ${reviewMode ? reviewBanner(slide.explanation) : ''}
    </div>`;

  const optsRoot = document.getElementById(`timed-opts-${slide.id}`);

  if (reviewMode) {
    const prev = STATE.responses[slide.id];
    optsRoot.querySelectorAll('.quiz-option').forEach((opt, i) => {
      opt.classList.add('disabled');
      if (i === slide.correctAnswer) opt.classList.add('correct');
      if (prev && prev.response && prev.response.selected === i && i !== slide.correctAnswer) {
        opt.classList.add('incorrect');
      }
    });
    setNextEnabled(true);
    return;
  }

  let timeLeft = limitSec;
  let timerHandle = null;
  let committed = false;
  const counterEl = document.getElementById(`timed-quiz-counter-${slide.id}`);
  const fillEl    = document.getElementById(`timed-quiz-fill-${slide.id}`);

  function commit(selectedIdx, timedOut) {
    if (committed) return;
    committed = true;
    if (timerHandle) { clearInterval(timerHandle); timerHandle = null; }
    const correct = (!timedOut && selectedIdx === slide.correctAnswer);
    trackResponse(slide, {
      response: { selected: timedOut ? null : selectedIdx, timedOut: !!timedOut, secondsTaken: limitSec - timeLeft },
      correct,
      attempts: 1,
      score: correct ? 1 : 0,
      completed: true
    });

    optsRoot.querySelectorAll('.quiz-option').forEach((o, i) => {
      o.classList.add('disabled');
      if (i === slide.correctAnswer) o.classList.add('correct');
      if (!timedOut && i === selectedIdx && i !== slide.correctAnswer) {
        o.classList.add('incorrect');
      }
    });

    if (correct) {
      confetti({ particleCount: 50, spread: 60, origin: { y: 0.7 } });
      showFeedbackModal({
        type: 'success',
        title: 'Correct!',
        body: slide.feedbackRight || slide.explanation || 'Nice and quick.',
        primary: 'Continue'
      });
    } else if (timedOut) {
      showFeedbackModal({
        type: 'info',
        title: 'Time\'s up!',
        body: slide.feedbackWrong || slide.explanation || 'The correct answer is highlighted on the slide.',
        primary: 'Continue'
      });
    } else {
      showFeedbackModal({
        type: 'info',
        title: 'Incorrect',
        body: slide.feedbackWrong || slide.explanation || 'The correct answer is highlighted on the slide.',
        primary: 'Continue'
      });
    }
    STATE.completed.add(slide.id);
    setNextEnabled(true);
    refreshSidebarState();
  }

  // Wire option clicks
  optsRoot.querySelectorAll('.quiz-option').forEach(opt => {
    opt.onclick = () => {
      if (opt.classList.contains('disabled')) return;
      commit(+opt.dataset.i, false);
    };
  });

  // Start the timer ~250ms after render so the learner has a moment to read
  setTimeout(() => {
    timerHandle = setInterval(() => {
      timeLeft -= 0.1;
      if (timeLeft <= 0) {
        if (counterEl) counterEl.textContent = '0s';
        if (fillEl) fillEl.style.width = '0%';
        commit(null, true);
        return;
      }
      if (counterEl) counterEl.textContent = Math.max(0, Math.ceil(timeLeft)) + 's';
      if (fillEl) fillEl.style.width = ((timeLeft / limitSec) * 100) + '%';
      // Visual urgency cue when under 5 seconds
      if (timeLeft < 5 && counterEl) counterEl.style.color = 'var(--error, #c0392b)';
    }, 100);
  }, 250);
}

/* ============================================================
   DRAG MATCH
   ============================================================
   One-to-one drag-based matching. Each draggable item belongs
   in exactly one drop zone (and each zone holds exactly one
   item). Different from `drag-drop` (many-to-one categories)
   and `matching` (click-to-pair, no drag).
   Schema:
     slide.pairs[]  — { item: 'X', target: 'Y' }
     slide.instruction — top instruction text
     slide.explanation, slide.feedbackRight, slide.feedbackWrong
   ============================================================ */
function renderDragMatch(slide, c) {
  const reviewMode = STATE.completed.has(slide.id);
  const pairs = slide.pairs || [];

  // Stable indices: each pair has an id = its original position
  const itemsShuffled = pairs.map((p, i) => ({ id: i, text: p.item }));
  // Shuffle items but keep targets in original order so visual feels intentional
  for (let i = itemsShuffled.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [itemsShuffled[i], itemsShuffled[j]] = [itemsShuffled[j], itemsShuffled[i]];
  }

  c.innerHTML = `
    <div class="glass-strong w-full max-w-4xl rounded-3xl p-6 md:p-8">
      <div class="slide-eyebrow">
        <i class="fa-solid fa-arrows-up-down-left-right"></i>
        Drag &amp; Match${reviewMode ? ' · Review' : ''}
      </div>
      <h2 class="text-xl md:text-2xl font-bold mb-3">${escapeHtmlAttr(slide.instruction || 'Match each item with its correct pair')}</h2>
      <p class="text-sm" style="opacity:0.7; margin-bottom:1.2rem;">Drag the items on the left to the matching targets on the right.</p>
      <div class="dm-grid" style="display:grid; grid-template-columns: 1fr 1fr; gap:1.5rem; align-items:start;">
        <div class="dm-source" id="dm-source-${slide.id}" style="display:flex; flex-direction:column; gap:0.7rem;">
          ${itemsShuffled.map(it => `
            <div class="dm-item" draggable="true" data-id="${it.id}" tabindex="0" role="button" aria-label="${escapeHtmlAttr(it.text)}, drag to a target"
                 style="padding:0.9rem 1.1rem; background:white; color:#1a1a1a; border-radius:0.7rem; box-shadow:0 4px 14px rgba(0,0,0,0.15); cursor:grab; user-select:none; font-weight:600; transition:transform 0.1s;">
              ${escapeHtmlAttr(it.text)}
            </div>
          `).join('')}
        </div>
        <div class="dm-targets" id="dm-targets-${slide.id}" style="display:flex; flex-direction:column; gap:0.7rem;">
          ${pairs.map((p, i) => `
            <div class="dm-target" data-id="${i}"
                 style="min-height:54px; padding:0.7rem 1rem; background:rgba(255,255,255,0.06); border:2px dashed rgba(255,255,255,0.25); border-radius:0.7rem; display:flex; align-items:center; gap:0.8rem;">
              <div style="flex:1; opacity:0.85; font-weight:500;">${escapeHtmlAttr(p.target)}</div>
              <div class="dm-slot" data-target-id="${i}" style="min-width:140px; min-height:38px; padding:0.4rem; border-radius:0.5rem; background:rgba(255,255,255,0.04); display:flex; align-items:center; justify-content:center; font-size:0.85rem; opacity:0.5;">drop here</div>
            </div>
          `).join('')}
        </div>
      </div>
      <div style="display:flex; justify-content:flex-end; margin-top:1.2rem; gap:0.6rem;">
        <button type="button" id="dm-reset-${slide.id}" class="btn btn-secondary" style="padding:0.6rem 1.1rem; border-radius:0.6rem; border:1px solid rgba(255,255,255,0.2); background:transparent; color:var(--text); cursor:pointer;">Reset</button>
        <button type="button" id="dm-submit-${slide.id}" class="btn btn-primary" style="padding:0.6rem 1.4rem; border-radius:0.6rem; border:0; background:var(--accent, #6E55B8); color:white; font-weight:700; cursor:pointer; opacity:0.5;" disabled>Submit</button>
      </div>
      ${reviewMode ? reviewBanner(slide.explanation) : ''}
    </div>`;

  const sourceEl  = document.getElementById(`dm-source-${slide.id}`);
  const targetsEl = document.getElementById(`dm-targets-${slide.id}`);
  const submitBtn = document.getElementById(`dm-submit-${slide.id}`);
  const resetBtn  = document.getElementById(`dm-reset-${slide.id}`);

  // The current placement: targetId → itemId (or null if empty)
  const placement = {};
  pairs.forEach((_, i) => { placement[i] = null; });

  if (reviewMode) {
    // Replay the user's previous placement, then mark right/wrong
    const prev = STATE.responses[slide.id];
    if (prev && prev.response && prev.response.placement) {
      Object.entries(prev.response.placement).forEach(([targetId, itemId]) => {
        if (itemId == null) return;
        placeItem(parseInt(itemId, 10), parseInt(targetId, 10), /* readonly */ true);
      });
    }
    // Color each target by correctness
    targetsEl.querySelectorAll('.dm-slot').forEach(slot => {
      const targetId = +slot.dataset.targetId;
      const placedItemId = placement[targetId];
      const isCorrect = placedItemId === targetId;
      slot.parentElement.style.borderColor = isCorrect ? 'var(--success, #1f9b5e)' : 'var(--error, #c0392b)';
      slot.parentElement.style.background = isCorrect ? 'rgba(31,155,94,0.08)' : 'rgba(192,57,43,0.08)';
    });
    if (submitBtn) submitBtn.style.display = 'none';
    if (resetBtn)  resetBtn.style.display = 'none';
    setNextEnabled(true);
    return;
  }

  // Helper: place an item into a target slot (move the DOM element)
  function placeItem(itemId, targetId, readonly) {
    // Find the dragged element (might be in source or another slot)
    const itemEl = c.querySelector(`.dm-item[data-id="${itemId}"]`);
    const targetSlot = targetsEl.querySelector(`.dm-slot[data-target-id="${targetId}"]`);
    if (!itemEl || !targetSlot) return;
    // If the target slot already has an item, swap it back to the source list
    if (placement[targetId] != null) {
      const existingId = placement[targetId];
      const existingEl = c.querySelector(`.dm-item[data-id="${existingId}"]`);
      if (existingEl) sourceEl.appendChild(existingEl);
      placement[targetId] = null;
    }
    // If the moving item was previously in another slot, clear that slot
    Object.keys(placement).forEach(tid => {
      if (placement[tid] === itemId) placement[tid] = null;
    });
    targetSlot.innerHTML = '';
    targetSlot.appendChild(itemEl);
    targetSlot.style.opacity = '1';
    placement[targetId] = itemId;
    if (!readonly) updateSubmitState();
  }

  function updateSubmitState() {
    const allFilled = Object.values(placement).every(v => v != null);
    if (submitBtn) {
      submitBtn.disabled = !allFilled;
      submitBtn.style.opacity = allFilled ? '1' : '0.5';
    }
  }

  // Native HTML5 drag-and-drop. Touch devices: we add a pointer-based fallback below.
  // Edge auto-scroll on dragstart so the page scrolls when the dragged item
  // approaches the viewport edge — important on phones where the targets
  // can be below the source items list.
  let dmStopAutoScroll = null;
  c.querySelectorAll('.dm-item').forEach(item => {
    item.addEventListener('dragstart', (e) => {
      if (STATE.completed.has(slide.id)) return e.preventDefault();
      e.dataTransfer.setData('text/plain', item.dataset.id);
      e.dataTransfer.effectAllowed = 'move';
      item.style.opacity = '0.5';
      dmStopAutoScroll = startEdgeAutoScroll();
    });
    item.addEventListener('dragend', () => {
      item.style.opacity = '1';
      if (dmStopAutoScroll) { dmStopAutoScroll(); dmStopAutoScroll = null; }
    });
  });
  targetsEl.querySelectorAll('.dm-slot').forEach(slot => {
    slot.addEventListener('dragover', (e) => { e.preventDefault(); slot.parentElement.style.borderColor = 'var(--accent, #6E55B8)'; });
    slot.addEventListener('dragleave', () => { slot.parentElement.style.borderColor = 'rgba(255,255,255,0.25)'; });
    slot.addEventListener('drop', (e) => {
      e.preventDefault();
      slot.parentElement.style.borderColor = 'rgba(255,255,255,0.25)';
      const itemId = parseInt(e.dataTransfer.getData('text/plain'), 10);
      placeItem(itemId, +slot.dataset.targetId);
    });
  });
  // Also let the user drag back to the source list (to clear a slot)
  sourceEl.addEventListener('dragover', (e) => { e.preventDefault(); });
  sourceEl.addEventListener('drop', (e) => {
    e.preventDefault();
    const itemId = parseInt(e.dataTransfer.getData('text/plain'), 10);
    const itemEl = c.querySelector(`.dm-item[data-id="${itemId}"]`);
    if (itemEl) sourceEl.appendChild(itemEl);
    Object.keys(placement).forEach(tid => { if (placement[tid] === itemId) placement[tid] = null; });
    updateSubmitState();
  });

  // Touch-friendly pointer fallback: tap an item, then tap a target
  let pickedItemId = null;
  c.querySelectorAll('.dm-item').forEach(item => {
    item.addEventListener('click', (e) => {
      if (STATE.completed.has(slide.id)) return;
      // De-highlight everything
      c.querySelectorAll('.dm-item').forEach(it => it.style.outline = 'none');
      pickedItemId = parseInt(item.dataset.id, 10);
      item.style.outline = '3px solid var(--accent, #6E55B8)';
      // On phones, scroll the targets into view so the learner immediately
      // sees their drop options. Targets are above the source list on mobile
      // (see the .dm-grid order rules), so they're typically off-screen
      // when the learner has scrolled down to tap an item.
      if (window.innerWidth <= 700) {
        const firstTarget = targetsEl.querySelector('.dm-target');
        if (firstTarget && typeof firstTarget.scrollIntoView === 'function') {
          firstTarget.scrollIntoView({ behavior: 'smooth', block: 'start' });
        }
      }
    });
  });
  targetsEl.querySelectorAll('.dm-slot').forEach(slot => {
    slot.addEventListener('click', () => {
      if (pickedItemId == null) return;
      placeItem(pickedItemId, +slot.dataset.targetId);
      pickedItemId = null;
      c.querySelectorAll('.dm-item').forEach(it => it.style.outline = 'none');
    });
  });

  // Reset button
  if (resetBtn) {
    resetBtn.onclick = () => {
      // Move every placed item back to source list
      Object.entries(placement).forEach(([tid, itemId]) => {
        if (itemId == null) return;
        const itemEl = c.querySelector(`.dm-item[data-id="${itemId}"]`);
        if (itemEl) sourceEl.appendChild(itemEl);
        placement[tid] = null;
      });
      targetsEl.querySelectorAll('.dm-slot').forEach(s => {
        s.innerHTML = 'drop here'; s.style.opacity = '0.5';
      });
      pickedItemId = null;
      updateSubmitState();
    };
  }

  // Submit
  STATE.attempts[slide.id] = STATE.attempts[slide.id] || 0;
  if (submitBtn) {
    submitBtn.onclick = () => {
      if (submitBtn.disabled) return;
      const allCorrect = Object.entries(placement).every(([tid, itemId]) => +tid === itemId);
      STATE.attempts[slide.id]++;
      const attemptN = STATE.attempts[slide.id];
      const isFinal = allCorrect || attemptN >= 2;

      trackResponse(slide, {
        response: { placement: { ...placement } },
        correct: allCorrect,
        attempts: attemptN,
        score: allCorrect && attemptN === 1 ? 1 : (allCorrect ? 0.5 : 0),
        completed: isFinal
      });

      if (allCorrect) {
        targetsEl.querySelectorAll('.dm-target').forEach(t => {
          t.style.borderColor = 'var(--success, #1f9b5e)';
          t.style.background = 'rgba(31,155,94,0.08)';
        });
        confetti({ particleCount: 60, spread: 70, origin: { y: 0.7 } });
        STATE.completed.add(slide.id);
        setNextEnabled(true);
        refreshSidebarState();
        showFeedbackModal({
          type: 'success',
          title: 'Excellent!',
          body: slide.feedbackRight || slide.explanation || 'You matched all the pairs correctly.',
          primary: 'Continue'
        });
      } else if (!isFinal) {
        // First wrong attempt — show which are wrong but let them try again
        targetsEl.querySelectorAll('.dm-target').forEach((t, i) => {
          const isCorrect = placement[i] === i;
          t.style.borderColor = isCorrect ? 'var(--success, #1f9b5e)' : 'var(--error, #c0392b)';
          t.style.background = isCorrect ? 'rgba(31,155,94,0.08)' : 'rgba(192,57,43,0.08)';
        });
        showFeedbackModal({
          type: 'error',
          title: 'Some matches are wrong',
          body: 'The wrong matches are highlighted. You have one more attempt to fix them.',
          primary: 'Try Again',
          onPrimary: () => {
            // Move incorrect items back to source for retry
            targetsEl.querySelectorAll('.dm-target').forEach((t, i) => {
              const placedId = placement[i];
              if (placedId !== i && placedId != null) {
                const el = c.querySelector(`.dm-item[data-id="${placedId}"]`);
                if (el) sourceEl.appendChild(el);
                placement[i] = null;
                const slot = t.querySelector('.dm-slot');
                if (slot) { slot.innerHTML = 'drop here'; slot.style.opacity = '0.5'; }
                t.style.borderColor = 'rgba(255,255,255,0.25)';
                t.style.background = 'rgba(255,255,255,0.06)';
              }
            });
            updateSubmitState();
          }
        });
      } else {
        // Final wrong — show all correct answers
        targetsEl.querySelectorAll('.dm-target').forEach((t, i) => {
          const isCorrect = placement[i] === i;
          t.style.borderColor = isCorrect ? 'var(--success, #1f9b5e)' : 'var(--error, #c0392b)';
          t.style.background = isCorrect ? 'rgba(31,155,94,0.08)' : 'rgba(192,57,43,0.08)';
        });
        STATE.completed.add(slide.id);
        setNextEnabled(true);
        refreshSidebarState();
        showFeedbackModal({
          type: 'info',
          title: 'Incorrect',
          body: slide.feedbackWrong || slide.explanation || 'Review the correct answers above and continue.',
          primary: 'Continue'
        });
      }
    };
  }
}

/* ---- SUMMARY ---- */
function renderSummary(slide, c) {
  const points = (slide.points || []).map(p => `
    <li style="display:flex; align-items:flex-start; gap:0.7rem; margin-bottom:0.85rem;">
      <i class="fa-solid fa-circle-check" style="color:var(--accent); margin-top:0.3rem; flex-shrink:0;"></i>
      <span style="flex:1; min-width:0;" class="rt-rendered">${renderRichTextOrPlain(p || '')}</span>
    </li>`).join('');
  c.innerHTML = `
    <div class="glass-strong w-full max-w-3xl rounded-3xl p-8 md:p-10">
      <div class="slide-eyebrow">
        <i class="fa-solid fa-clipboard-list"></i>
        Summary
      </div>
      <h2 class="text-2xl md:text-3xl font-bold mb-5">${slide.title}</h2>
      <ul style="list-style:none; padding:0; margin:0;" class="text-white/85 leading-relaxed">${points}</ul>
    </div>`;
  STATE.completed.add(slide.id);
  setNextEnabled(true);
}

/* Returns the tier object for a given score, or null if below pass.
   Authors can override via COURSE_CONFIG.settings.badgeTiers.
   Default thresholds: 95+ Yoddha, 90-94 Strategist, 80-89 Specialist. */
function getBadgeTier(scorePct) {
  const tiers = COURSE_CONFIG.settings.badgeTiers || [
    { min: 95, name: 'E2E Yoddha',     subtitle: 'Master of the Entire Ecosystem',         color: '#473391' },
    { min: 90, name: 'E2E Strategist', subtitle: 'Makes Smart Decisions Across the Journey', color: '#6E55B8' },
    { min: 80, name: 'E2E Specialist', subtitle: 'Understands the Process End-to-End',     color: '#9578E0' }
  ];
  // Sort by min DESC so highest tier wins
  const sorted = tiers.slice().sort((a, b) => b.min - a.min);
  return sorted.find(t => scorePct >= t.min) || null;
}

/* ============================================================
   CUSTOM BADGE IMAGES
   ============================================================
   Authors can upload a custom image per badge tier. The author
   uploads via the editor's Results form; the image is stored as
   base64 in slide.customBadge[tierKey] = { imageData, fileName, mime }.
   When set, the engine displays the image as-is (no name overlay —
   the learner's name renders in clean HTML beneath). When absent,
   the default SVG badge (with name baked in) is used.
   ============================================================ */

/* Map a tier object to its slide.customBadge key. Tier names come
   from getBadgeTier() which uses settings.badgeTiers OR the defaults.
   We key by lowercased first-word of the tier name — covers the
   default tiers (Yoddha / Strategist / Specialist) cleanly. Authors
   who use custom tier names (e.g. "Gold / Silver / Bronze") would
   need editor support for keying — out of scope for now, but the
   tier-key-derivation is forgiving so it'll fall back to default
   badges for unrecognized tiers. */
function customBadgeKeyForTier(tier) {
  if (!tier || !tier.name) return null;
  // Take the last word of the tier name and lowercase it. So:
  //   "E2E Yoddha" → "yoddha"
  //   "Strategist" → "strategist"
  //   "Gold Tier"  → "tier" (won't match — falls back to default)
  const words = String(tier.name).trim().split(/\s+/);
  return words[words.length - 1].toLowerCase();
}

function getCustomBadgeForTier(slide, tier) {
  if (!tier) return null;
  // Score-tier badges (via settings.badgeTiers) carry their own image
  // directly on the tier object as `badgeImage`. The Results-slide tier
  // editor writes to this field. Check it first.
  if (tier.badgeImage) {
    return {
      imageData: tier.badgeImage,
      mime:      tier.badgeImageMime || 'image/png',
      fileName:  tier.badgeImageFileName || 'badge.png'
    };
  }
  // Legacy fallback: pre-tier-editor courses stored per-tier images on
  // slide.customBadge keyed by lowercased tier name word ("yoddha" etc.).
  // Still readable so old courses don't break.
  if (!slide || !slide.customBadge) return null;
  const key = customBadgeKeyForTier(tier);
  if (!key) return null;
  const entry = slide.customBadge[key];
  if (!entry || !entry.imageData) return null;
  return entry;
}

/* Build the HTML for the badge preview area. Returns either:
     - <img> with the custom badge data URL, OR
     - the default SVG (with learner name baked in)
   The "name overlay" for custom badges is rendered by the parent —
   we just return the visual artifact. */
function buildBadgePreviewHTML(slide, tier, learnerName, courseTitle, scorePct) {
  const custom = getCustomBadgeForTier(slide, tier);
  if (custom) {
    const dataUrl = `data:${custom.mime || 'image/png'};base64,${custom.imageData}`;
    return `<img src="${dataUrl}" alt="${escapeHtmlAttr(tier.name)} badge"
                 style="max-width: 100%; max-height: 300px; display:block; margin:0 auto; border-radius: 12px;">`;
  }
  return buildBadgeSVG(tier, learnerName, courseTitle, scorePct);
}

/* Download the badge as a PNG. Handles both cases:
     - Default SVG → rasterize via canvas (same as before)
     - Custom image → just trigger a download of the original
       (it's already an image; no canvas processing needed) */
function downloadBadge(slide, tier, learnerName, courseTitle, scorePct, fileName) {
  const custom = getCustomBadgeForTier(slide, tier);
  if (custom) {
    // Custom image — download as-is. Use the author's original filename
    // extension so the downloaded file matches what they uploaded.
    const ext = (custom.fileName || '').split('.').pop() || 'png';
    const a = document.createElement('a');
    a.href = `data:${custom.mime || 'image/png'};base64,${custom.imageData}`;
    a.download = fileName.replace(/\.png$/i, '.' + ext);
    document.body.appendChild(a);
    a.click();
    a.remove();
    return;
  }
  // Default path — build SVG and rasterize
  const svg = buildBadgeSVG(tier, learnerName, courseTitle, scorePct);
  downloadBadgeAsPng(svg, fileName);
}

/* Convert an SVG string to a PNG and trigger a browser download.
   Uses a Canvas to rasterize. SVG includes embedded font reference;
   the browser uses its installed Poppins (or falls back). */
function downloadBadgeAsPng(svgString, fileName) {
  // Create a Blob URL for the SVG
  const svgBlob = new Blob([svgString], { type: 'image/svg+xml;charset=utf-8' });
  const url = URL.createObjectURL(svgBlob);
  const img = new Image();
  img.onload = () => {
    const canvas = document.createElement('canvas');
    // 2x for retina-sharp PNG
    const scale = 2;
    canvas.width = 800 * scale;
    canvas.height = 800 * scale;
    const ctx = canvas.getContext('2d');
    ctx.scale(scale, scale);
    ctx.drawImage(img, 0, 0);
    URL.revokeObjectURL(url);
    canvas.toBlob(blob => {
      const dlUrl = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = dlUrl;
      a.download = fileName;
      document.body.appendChild(a);
      a.click();
      a.remove();
      setTimeout(() => URL.revokeObjectURL(dlUrl), 1000);
    }, 'image/png');
  };
  img.onerror = () => {
    URL.revokeObjectURL(url);
    // Fallback: download as SVG if PNG conversion fails
    const a = document.createElement('a');
    a.href = url;
    a.download = fileName.replace(/\.png$/, '.svg');
    document.body.appendChild(a);
    a.click();
    a.remove();
  };
  img.src = url;
}

/* ============================================================
   CERTIFICATE
   ============================================================
   When passed AND slide.showCertificate is true, render a canvas
   that composites the learner's name + date + course title + score
   onto the author-uploaded background image. The same canvas is
   also used for download (toBlob → PNG).

   Schema:
     slide.showCertificate          : boolean (default false)
     slide.certificateImage         : { imageData, fileName, mime }
     slide.certificateButtonLabel   : string (default 'Download my certificate')
     slide.certificateFields: {
       name:        { x, y, fontSize, color, fontFamily, enabled }
       date:        { x, y, fontSize, color, fontFamily, enabled }
       courseTitle: { x, y, fontSize, color, fontFamily, enabled }
       score:       { x, y, fontSize, color, fontFamily, enabled }
     }
     - x/y are 0-100 (% of image dimensions)
     - fontSize is in px at the image's NATIVE resolution
     - color is any CSS color string
     - fontFamily is 'serif' | 'sans-serif' | 'cursive' | 'monospace' | 'Poppins'
     - enabled is a boolean — if false, that field isn't drawn

   Defaults match a sensible layout for a 2000x1500 landscape certificate:
     - name centered (50, 50), large
     - date below name (50, 65)
     - course title above name (50, 30)
     - score in lower-right (80, 90), small
   ============================================================ */

const CERTIFICATE_DEFAULT_FIELDS = {
  name:        { x: 50, y: 50, fontSize: 56, color: '#1a1538', fontFamily: 'serif',      enabled: true },
  date:        { x: 50, y: 65, fontSize: 22, color: '#555555', fontFamily: 'sans-serif', enabled: true },
  courseTitle: { x: 50, y: 30, fontSize: 28, color: '#473391', fontFamily: 'serif',      enabled: true },
  score:       { x: 80, y: 90, fontSize: 18, color: '#888888', fontFamily: 'sans-serif', enabled: true }
};

function getCertificateField(slide, key) {
  const cfg = slide && slide.certificateFields && slide.certificateFields[key];
  const dflt = CERTIFICATE_DEFAULT_FIELDS[key];
  if (!cfg) return dflt;
  return {
    x:          (typeof cfg.x === 'number')          ? cfg.x          : dflt.x,
    y:          (typeof cfg.y === 'number')          ? cfg.y          : dflt.y,
    fontSize:   (typeof cfg.fontSize === 'number')   ? cfg.fontSize   : dflt.fontSize,
    color:      cfg.color      || dflt.color,
    fontFamily: cfg.fontFamily || dflt.fontFamily,
    enabled:    (cfg.enabled !== false)              // default to enabled when key exists
  };
}

/* Format the date for the certificate. Uses the locale's long format. */
function formatCertificateDate() {
  const d = new Date();
  const months = ['January','February','March','April','May','June','July','August','September','October','November','December'];
  return `${months[d.getMonth()]} ${d.getDate()}, ${d.getFullYear()}`;
}

/* Render the certificate to a canvas. Returns the canvas element
   (which the caller can append to the DOM for preview, and/or
   convert via toBlob for download). The canvas is sized to match
   the source image's NATIVE resolution so downloads are crisp.
   Caller is expected to scale via CSS for inline display. */
function renderCertificateToCanvas(slide, learnerName, courseTitle, scorePct, callback) {
  if (!slide.certificateImage || !slide.certificateImage.imageData) {
    callback(null);
    return;
  }
  const img = new Image();
  img.onload = () => {
    const canvas = document.createElement('canvas');
    canvas.width = img.naturalWidth;
    canvas.height = img.naturalHeight;
    const ctx = canvas.getContext('2d');
    ctx.drawImage(img, 0, 0);

    // Helper to draw a field at its config position
    const drawField = (key, text) => {
      const f = getCertificateField(slide, key);
      if (!f.enabled || !text) return;
      const px = (f.x / 100) * canvas.width;
      const py = (f.y / 100) * canvas.height;
      ctx.fillStyle = f.color;
      ctx.font = `${f.fontSize}px ${f.fontFamily}`;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(text, px, py);
    };

    drawField('courseTitle', courseTitle);
    drawField('name',        learnerName);
    drawField('date',        formatCertificateDate());
    drawField('score',       `Score: ${scorePct}%`);

    callback(canvas);
  };
  img.onerror = () => {
    console.warn('[Certificate] Failed to load background image');
    callback(null);
  };
  img.src = `data:${slide.certificateImage.mime || 'image/png'};base64,${slide.certificateImage.imageData}`;
}

/* Build the certificate preview wrap and asynchronously inject the
   rendered canvas. Returns the wrap element ID so caller can find it. */
function injectCertificatePreview(containerId, slide, learnerName, courseTitle, scorePct) {
  const container = document.getElementById(containerId);
  if (!container) return;
  // Show a loading placeholder while the image decodes
  container.innerHTML = `
    <div style="text-align:center; padding:2rem; color:var(--text-muted); font-size:0.85rem;">
      Rendering certificate...
    </div>`;
  renderCertificateToCanvas(slide, learnerName, courseTitle, scorePct, (canvas) => {
    if (!canvas) {
      container.innerHTML = `
        <div style="text-align:center; padding:2rem; color:var(--error); font-size:0.85rem;">
          Could not render certificate. The author's uploaded image may be corrupted.
        </div>`;
      return;
    }
    container.innerHTML = '';
    canvas.style.cssText = 'max-width: 100%; height: auto; display:block; margin:0 auto; border:1px solid var(--border); border-radius:8px;';
    container.appendChild(canvas);
  });
}

/* Download the certificate as a PNG. Re-renders to a fresh canvas
   to ensure we capture current state (in case anything has changed
   since the inline preview was rendered). */
function downloadCertificate(slide, learnerName, courseTitle, scorePct, fileName) {
  renderCertificateToCanvas(slide, learnerName, courseTitle, scorePct, (canvas) => {
    if (!canvas) {
      showFeedbackModal({
        type: 'info',
        title: 'Download failed',
        body: 'The certificate image could not be loaded. Try refreshing the page.',
        primary: 'OK'
      });
      return;
    }
    canvas.toBlob((blob) => {
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = fileName;
      document.body.appendChild(a);
      a.click();
      a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 1000);
    }, 'image/png');
  });
}

/* localStorage key used to enforce "one badge per learner per device".
   Combined with the course title so a learner who takes multiple modules
   can issue a badge for each one. */
function badgeStorageKey() {
  return 'elearning_badge_issued__' + (COURSE_CONFIG.settings.courseTitle || 'course');
}
function isBadgeAlreadyIssued() {
  try { return !!localStorage.getItem(badgeStorageKey()); }
  catch (e) { return false; }
}
function markBadgeIssued(name) {
  try { localStorage.setItem(badgeStorageKey(), JSON.stringify({ name, issuedAt: Date.now() })); }
  catch (e) {}
}
function getIssuedBadgeRecord() {
  try { return JSON.parse(localStorage.getItem(badgeStorageKey())); }
  catch (e) { return null; }
}

/* ============================================================ */
/*                       RESULTS PAGE                            */
/* ============================================================ */
function renderResults(slide, c) {
  // Unified weighted scoring: every activity with correct !== null contributes,
  // weighted by its slide.weight (default 1.0). A slide with weight 2.0 counts
  // double; weight 0.5 counts half.
  const slidesById = {};
  COURSE_CONFIG.slides.forEach(s => slidesById[s.id] = s);
  const scoreable = Object.values(STATE.responses).filter(r => r.correct !== null && r.score !== null);
  const total = scoreable.length;
  let earnedPoints = 0, weightSum = 0;
  scoreable.forEach(r => {
    const s = slidesById[r.slideId];
    const w = (s && typeof s.weight === 'number' && s.weight > 0) ? s.weight : 1;
    earnedPoints += (r.score || 0) * w;
    weightSum += w;
  });
  const correctCount = scoreable.filter(r => r.correct).length;
  const score = weightSum ? Math.round((earnedPoints / weightSum) * 100) : 100;
  const passed = score >= COURSE_CONFIG.settings.passingScore;
  const elapsedMin = Math.max(1, Math.round((Date.now() - STATE.startTime) / 60000));

  // ---------- Customizable text (with sensible defaults) ----------
  // Every visible string is overridable from slide.* fields. The defaults
  // match the original hardcoded strings so existing courses look the same.
  const t = {
    title:           slide.title           || 'Your Results',
    eyebrow:         slide.eyebrow         || 'Results',
    passMarkLabel:   slide.passMarkLabel   || 'Pass mark',
    scoreLabel:      slide.scoreLabel      || 'Score',
    correctLabel:    slide.correctLabel    || 'Correct',
    timeLabel:       slide.timeLabel       || 'Time',
    passedHeading:   slide.passedHeading   || 'Passed!',
    failedHeading:   slide.failedHeading   || 'Not passed yet',
    topicHeading:    slide.topicHeading    || "Where you're strong, where you're lagging",
    reviewHeading:   slide.reviewHeading   || 'Items to review',
    badgeEyebrow:    slide.badgeEyebrow    || 'You earned a badge',
    badgeNamePrompt: slide.badgeNamePrompt || 'Enter your full name',
    badgeCreateBtn:  slide.badgeCreateBtn  || 'Create my badge',
    badgeNameHint:   slide.badgeNameHint   || "Type your name as you'd like it to appear on the certificate. The badge can only be created once per learner — make sure your name is correct.",
    badgeIssuedNote: slide.badgeIssuedNote || 'Your badge has already been issued',
    badgeRedownload: slide.badgeRedownload || 'Re-download my badge',
    failMessage:     slide.failMessage     || `You need ${COURSE_CONFIG.settings.passingScore}% to pass and earn a badge. Use the items list above to focus your review.`,
    reviewBtnLabel:  slide.reviewBtnLabel  || 'Review Module',
    exitBtnLabel:    slide.exitBtnLabel    || 'Exit Module',
    exitConfirmTitle:slide.exitConfirmTitle|| 'Exit the module?',
    exitConfirmBody: slide.exitConfirmBody || 'Your progress and score have been saved. You can close this window to exit.',
    showReviewBtn:   slide.showReviewBtn   !== false,   // default on
    showExitBtn:     slide.showExitBtn     !== false,   // default on
    exitUrl:         slide.exitUrl         || '',       // optional redirect target
    // Certificate-related strings (Phase B)
    showCertificate:        slide.showCertificate === true,  // default OFF (must be explicitly enabled)
    certificateEyebrow:     slide.certificateEyebrow     || 'Certificate of completion',
    certificateBtnLabel:    slide.certificateBtnLabel    || 'Download my certificate',
    certificateLockedNote:  slide.certificateLockedNote  || 'The certificate uses the name you entered above. Create your badge first to generate the certificate.'
  };

  // Per-topic breakdown
  const topicBreakdown = getTopicBreakdown();
  // Slides the learner should review — every wrong response, sorted by topic weakness
  const wrongSlides = Object.values(STATE.responses)
    .filter(r => r.correct === false)
    .map(r => ({
      slideId: r.slideId,
      idx: COURSE_CONFIG.slides.findIndex(s => s.id === r.slideId),
